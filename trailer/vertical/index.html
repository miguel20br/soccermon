<!--
  Trailer do Soccermon, versão VERTICAL 9:16 (Reels, TikTok, Shorts). Mesmos tempos e mídia do index.html (16:9),
  com layout próprio: o jogo numa faixa no meio (enquadrado pro lado do gol, onde os lances acontecem), legenda
  grande em cima, menus ocupando a tela em pé, versus dividido em cima/embaixo.
  Fica numa pasta própria (dois arquivos-raiz no mesmo projeto fazem o HyperFrames achar os dois e dobrar o
  áudio); midia/ é um link pra ../montagem/midia. Render: ../.logs/render.sh com PROJ=vertical. Inglês: --variables '{"lang":"en"}'.
-->

@font-face { font-family: "Galmuri11"; src: url("midia/Galmuri11-Bold.woff2") format("woff2"); font-weight: 700; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Galmuri11", monospace;

.clip { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; }
img { image-rendering: pixelated; }
/* faixa do jogo: 1080x860 no meio da tela */
.jogo { position: absolute; left: 0; top: 520px; width: 1080px; height: 860px; object-fit: cover; object-position: 80% 50%;
  box-shadow: 0 0 0 6px #0e1430, 0 20px 60px rgb(0 0 0 / 60%); }
.jogo.meio { object-position: 50% 50%; }
.fundo-jogo { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, #2a3a7a, #070a18 75%); }
.fundo-jogo .raios { opacity: 0.6; }

.rosto { position: absolute; left: 50%; top: 50%; width: 1080px; height: 1080px; margin: -540px 0 0 -540px; }

.legenda { position: absolute; left: 0; right: 0; top: 200px; height: 290px; display: flex; align-items: center; justify-content: center;
  text-align: center; z-index: 40; font-size: 66px; line-height: 1.2; letter-spacing: 2px; padding: 0 60px; color: #fff;
  -webkit-text-stroke: 14px #0e1430; paint-order: stroke fill; text-shadow: 0 8px 0 #0e1430; }
.legenda b { color: #ffcb05; font-weight: 700; }
.legenda.baixo { top: auto; bottom: 150px; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 60; pointer-events: none; }
.vinheta { position: absolute; left: 0; top: 520px; width: 1080px; height: 860px; z-index: 20; pointer-events: none;
  background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgb(0 0 0 / 55%) 100%); }
.marca { position: absolute; left: 50%; top: 1440px; width: 520px; transform: translateX(-50%); opacity: 0.9; image-rendering: auto; }

.caixa { position: absolute; left: 40px; right: 40px; top: 1420px; z-index: 35; padding: 30px 40px;
  background: #f8f8f0; border-radius: 22px; box-shadow: 0 0 0 8px #2a3050, 0 14px 0 8px rgb(0 0 0 / 35%);
  color: #303030; font-size: 50px; line-height: 1.25; letter-spacing: 1px; }
.caixa::before { content: ""; position: absolute; inset: 10px; border: 4px solid #d06040; border-radius: 14px; }
.caixa b { color: #d06040; }

.palco { background: radial-gradient(circle at 50% 45%, #2a3a7a, #070a18 72%); }
.raios { position: absolute; left: 50%; top: 45%; width: 3400px; height: 3400px; margin: -1700px 0 0 -1700px;
  background: repeating-conic-gradient(rgb(255 255 255 / 7%) 0 6deg, transparent 6deg 13deg); }
.recorte { position: absolute; left: 50%; top: 1000px; transform: translate(-50%, -50%); opacity: 0;
  filter: drop-shadow(0 18px 40px rgb(0 0 0 / 55%)); }
.recorte.modal { mask-image: linear-gradient(#000 80%, transparent); -webkit-mask-image: linear-gradient(#000 80%, transparent); }
.leque { position: absolute; left: 50%; top: 1030px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; transform: translate(-50%, -50%); opacity: 0; }
.leque img { height: 600px; filter: drop-shadow(0 18px 40px rgb(0 0 0 / 55%)); }

.golpe { position: absolute; z-index: 30; display: flex; align-items: center; gap: 18px; white-space: nowrap;
  padding: 14px 64px 14px 18px; color: #fff; clip-path: polygon(0 0, 100% 0, calc(100% - 40px) 100%, 0 100%);
  background: linear-gradient(90deg, #c63a3a, #4a1830); box-shadow: 0 8px 0 rgb(0 0 0 / 35%); }
.golpe.dir { padding: 14px 18px 14px 64px; flex-direction: row-reverse; text-align: right; clip-path: polygon(0 0, 100% 0, 100% 100%, 40px 100%);

.golpe .face { width: 116px; height: 116px; border: 5px solid #fff; border-radius: 10px; background: #10162e; overflow: hidden; flex: none; }
.golpe .face img { width: 100%; height: 100%; display: block; }
.golpe .quem { font-size: 30px; letter-spacing: 2px; text-shadow: 0 4px 0 rgb(0 0 0 / 55%); }
.golpe .nome { font-size: 64px; line-height: 1; letter-spacing: 2px; -webkit-text-stroke: 10px #0e1430; paint-order: stroke fill; text-shadow: 0 6px 0 #0e1430; }

.credito { position: absolute; left: 60px; right: 60px; bottom: 60px; text-align: center; font-size: 22px; line-height: 1.5; color: rgb(255 255 255 / 60%); }
</style>

    const vars = window.__hyperframes?.getVariables?.() ?? {};
    const T = TEXTOS[vars.lang] ?? TEXTOS.pt;
    const LEG = { draft: "draft", versus: "versus", futsal: "futsal", golpes: "golpes", ditto: "ditto", tecnico: "tecnico", cartas: "cartas", estrelato: "estrelato", estrelato2: "estrelato" };
    // o texto vai num <span>: a legenda é flex (centraliza na vertical) e sem o span cada <b> virava uma coluna
    for (const [id, k] of Object.entries(LEG)) document.getElementById(`leg-${id}`).innerHTML = `<span>${T[k]}</span>`;
    for (const k of ["tag", "selo", "credito"]) document.getElementById(k).textContent = T[k];
    document.getElementById("caixa-evo").innerHTML = T.evo;
    GOLPES.forEach((g, i) => {
      const x = g.x * ESC - CORTE, y = TOPO + g.y * ESC;
      g.vx = x;
      const el = document.getElementById(`golpe${i + 1}`);
      el.querySelector(".quem").textContent = `${g.quem} ${T.usou}`;
      el.querySelector(".nome").textContent = `${g.golpe}!`;
      el.querySelector(".nome").style.color = g.cor;
      const mira = document.getElementById(`mira${i + 1}`);
      mira.style.left = `${x}px`;
      mira.style.top = `${y}px`;
      if (x > 540) {
        el.classList.add("dir");
        el.style.right = `${Math.max(20, 1080 - x - 110)}px`;
      } else {
        el.style.left = `${Math.max(20, x - 110)}px`;
      }
      el.style.top = `${y - 290}px`;
    });

    const B = 1.348, b = B / 4, H = 5.116;
    const tl = gsap.timeline({ paused: true });
    const flash = (t, o = 0.9, d = 0.3) => tl.fromTo("#flash", { opacity: o }, { opacity: 0, duration: d, ease: "power2.out", immediateRender: false }, t);
    const impacto = (sel, t) => {
      tl.set(sel, { filter: "invert(1) contrast(1.6)" }, t);
      tl.set(sel, { filter: "none" }, t + 0.067);
      flash(t + 0.067, 0.85, 0.3);
      tl.to(sel, { keyframes: { x: [22, -18, 13, -8, 4, 0], y: [-10, 9, -6, 4, -2, 0] }, duration: 0.3, ease: "none" }, t);
    };
    const corte = (sel, t, dur) => {
      tl.set(sel, { opacity: 1 }, t);
      tl.fromTo(sel, { scale: 1.06 }, { scale: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, t);
      tl.set(sel, { opacity: 0 }, t + dur);
    };

    // abertura: rostos, bola sozinha em tela cheia; no zoom out a quadra encolhe até a faixa e o fundo de marca aparece
    tl.fromTo("#rosto-pika img", { scale: 1 }, { scale: 1.06, duration: 1.1, ease: "none" }, 0);
    tl.fromTo("#rosto-mew img", { scale: 1 }, { scale: 1.06, duration: 1.1, ease: "none" }, 1.1);
    tl.set("#quadra-zoom", { scale: 9 }, 2.2);
    tl.to("#quadra-zoom", { scale: 1, duration: H - 2.8 - 0.1, ease: "power3.inOut" }, 2.8);
    tl.to("#com-times", { opacity: 1, duration: 0.7, ease: "power1.in" }, 3.6);
    tl.to("#fundo-bola", { opacity: 1, duration: 0.8 }, 3.9);

    tl.from("#caixa-evo", { y: 40, opacity: 0, duration: 0.2, ease: "power2.out" }, 5.3);
    flash(H);
    impacto("#v-gancho", H + 3.37);
    flash(22.64, 0.8, 0.3);

    ["#r1", "#r2", "#r3", "#r4"].forEach((s, i) => corte(s, 9.16 + i * 2 * b, i === 3 ? 2 * b + 0.01 : 2 * b));
    ["#t1", "#t2", "#t3", "#t4"].forEach((s, i) => corte(s, 25.336 + i * 2 * b, i === 3 ? 2 * b + 0.01 : 2 * b));
    ["#k1", "#k2", "#k3", "#k4"].forEach((s, i) => corte(s, 34.772 + i * 2 * b, i === 3 ? 2 * b + 0.01 : 2 * b));
    const C0 = 28.032;
    corte("#c1", C0, 2 * b);
    ["#c2", "#c3", "#c4", "#c5"].forEach((s, i) => { corte(s, C0 + (2 + i) * b, b); flash(C0 + (2 + i) * b, 0.35, 0.15); });
    corte("#c6", C0 + 6 * b, 2 * b + 0.01);

    tl.from("#vs-cima", { yPercent: -60, duration: 0.3, ease: "power3.out" }, 11.856);
    tl.from("#vs-baixo", { yPercent: 60, duration: 0.3, ease: "power3.out" }, 11.856);
    tl.from("#time-esq img", { y: -300, opacity: 0, duration: 0.25, stagger: b / 3, ease: "back.out(2)" }, 11.856 + b);
    tl.from("#time-dir img", { y: 300, opacity: 0, duration: 0.25, stagger: b / 3, ease: "back.out(2)" }, 11.856 + b);
    tl.from("#vs", { scale: 3, opacity: 0, duration: 0.2, ease: "power4.in" }, 11.856 + 4 * b);
    flash(11.856 + 4 * b + 0.2, 0.6, 0.25);

    GOLPES.forEach((g, i) => {
      const t = 17.248 + i * B, n = i + 1, dir = g.vx > 540 ? 1 : -1;
      flash(t, 0.6, 0.18);
      tl.fromTo(`#v-golpe${n}`, { scale: 1.1 }, { scale: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, t);
      tl.from(`#mira${n}`, { scale: 2.4, opacity: 0, duration: 0.2, ease: "power2.out" }, t);
      tl.to(`#mira${n}`, { scale: 0.9, duration: 0.15, yoyo: true, repeat: 3, ease: "sine.inOut" }, t + 0.2);
      tl.from(`#golpe${n}`, { x: 120 * -dir, scale: 0.3, opacity: 0, duration: 0.18, ease: "back.out(2)", transformOrigin: dir > 0 ? "100% 100%" : "0% 100%" }, t + 0.04);
      tl.from(`#golpe${n} .nome`, { scale: 1.8, opacity: 0, duration: 0.16, ease: "back.out(2.5)", transformOrigin: dir > 0 ? "100% 50%" : "0% 50%" }, t + 0.2);
      tl.to(`#golpe${n}`, { opacity: 0, duration: 0.1 }, t + 0.9);
      impacto(`#v-golpe${n}`, t + g.impacto);
    });

    tl.fromTo("#v-penaltis", { scale: 1 }, { scale: 1.12, duration: 3.0, ease: "power1.in", immediateRender: false }, 30.728);
    impacto("#v-penaltis", 30.728 + 3.033);

    for (const [id, t] of [["draft", 9.16], ["versus", 11.856], ["futsal", 14.552], ["golpes", 17.248], ["ditto", 22.64], ["tecnico", 25.336], ["cartas", 28.032], ["estrelato", 30.728]])
      tl.from(`#leg-${id}`, { y: 60, scale: 0.8, opacity: 0, duration: 0.22, ease: "back.out(2.5)" }, t + 0.05);

    // final
    const F = 37.468, V = 1.6;
    tl.to("#raios", { rotation: 40, duration: 6.532, ease: "none" }, F);
    const caminho = [
      { x: 440, y: -620, scale: 0.18, rotation: -18 },
      { x: 260, y: -420, scale: 0.35, rotation: -10 },
      { x: 40, y: -120, scale: 0.7, rotation: 6 },
      { x: -200, y: 120, scale: 1.2, rotation: 14 },
      { x: -50, y: 40, scale: 2.4, rotation: 4 },
      { x: 0, y: 60, scale: 9, rotation: 0 },
    ];
    tl.set("#voo", caminho[0], F);
    tl.to("#voo", { keyframes: caminho.slice(1), duration: V, ease: "none" }, F);
    tl.set("#zard", { xPercent: -50, yPercent: -50 }, 0);
    tl.to("#zard", { keyframes: { y: [0, -16, 0] }, duration: 0.4, repeat: 3, ease: "sine.inOut" }, F);
    for (let k = 0, t = F; t < F + V; k++, t += 0.075) {
      const linha = t < F + V * 0.62 ? 7 : 0;
      tl.set("#zard", { attr: { src: `midia/voo/r${linha}-${k % 4}.png` } }, t);
    }
    const rastro = document.getElementById("rastro");
    for (let k = 0; k < 14; k++) {
      const d = document.createElement("div");
      d.className = "brasa";
      d.id = `brasa${k}`;
      rastro.appendChild(d);
      const atraso = 0.05 + k * 0.035;
      tl.set(`#brasa${k}`, { ...caminho[0], opacity: 0 }, F);
      tl.to(`#brasa${k}`, { keyframes: caminho.slice(1, 5), duration: V * 0.8, ease: "none" }, F + atraso);
      tl.fromTo(`#brasa${k}`, { opacity: 0.9 - k * 0.05 }, { opacity: 0, duration: V * 0.8, ease: "power1.in", immediateRender: false }, F + atraso);
    }
    tl.set("#voo", { opacity: 0 }, F + V);
    const L = F + V, p = b * 0.6;
    flash(L);
    for (let i = 0; i < 4; i++) {
      tl.set("#logo-branco", { opacity: 1 }, L + i * 2 * p);
      tl.set("#logo-cor", { opacity: i ? 1 : 0 }, L + i * 2 * p);
      tl.set("#logo-branco", { opacity: 0 }, L + (i * 2 + 1) * p);
    }
    tl.fromTo(".logo", { scale: 0.85 }, { scale: 1, duration: 0.5, ease: "back.out(3)" }, L);
    tl.set("#logo-cor", { opacity: 1 }, L + 8 * p);
    flash(L + 8 * p, 0.8, 0.4);
    tl.to("#tag", { opacity: 1, duration: 0.01 }, L + 8 * p + b);
    tl.from("#tag", { scale: 1.6, duration: 0.25, ease: "back.out(2)" }, L + 8 * p + b);
    tl.to("#selo", { opacity: 1, duration: 0.2 }, L + 8 * p + 3 * b);
    tl.from("#selo", { y: 40, duration: 0.25, ease: "back.out(2)" }, L + 8 * p + 3 * b);
    tl.to(["#site", "#credito"], { opacity: 1, duration: 0.3 }, L + 8 * p + 4 * b);

    window.__timelines = window.__timelines || {};
    window.__timelines.root = tl;
  </script>
</div>
</body>
</html>
