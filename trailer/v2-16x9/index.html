  <script>
    const b = 60 / 178, G0 = 8.428, B = (n) => G0 + n * b;
    const LETRA = 0.08;
    const TEXTOS = {
      pt: {
        cx1: "Este mundo é habitado<br>por criaturas chamadas<br>POKÉMON!",
        cx2: "…e elas<br><b class=\"grande\">JOGAM FUTSAL.</b>",

        copa: "COPA <b>DO DIA</b>",
        usou: "CHARIZARD usou",

        selo: "grátis no navegador<br>fan game sem fins lucrativos",

        cx1: "This world is inhabited<br>by creatures called<br>POKéMON!",
        cx2: "…and they<br><b class=\"grande\">PLAY FUTSAL.</b>",
        escolha: "PICK <b>1</b> OF <b>3</b>",
        icones: "RARE <b>ICONS</b>",
        futsal: "<b>FUTSAL</b><br>5 VS 5",
        evo: "<b>EVOLUTIONS</b> MID-MATCH",
        multi: "ONLINE <b>MULTIPLAYER</b>",
        copa: "<b>DAILY</b> CUP",
        usou: "CHARIZARD used",
        tag: "Gotta kick 'em all!",
        selo: "free in your browser<br>non-profit fan game",
        credito: "Music: Trainer Battle Remix · Bliitzit",
      },
    };
    const vars = window.__hyperframes?.getVariables?.() ?? {};
    const T = TEXTOS[vars.lang] ?? TEXTOS.pt;
    // o texto vai num <span>: a legenda é flex e sem o span cada <b> virava uma coluna
    for (const id of ["escolha", "icones", "futsal", "evo", "multi", "copa"]) document.getElementById(`leg-${id}`).innerHTML = `<span>${T[id]}</span>`;
    document.getElementById("golpe-quem").textContent = T.usou;
    document.getElementById("tag").textContent = T.tag;
    document.getElementById("selo-txt").innerHTML = T.selo;
    document.getElementById("credito").textContent = T.credito;

    const tl = gsap.timeline({ paused: true });
    const flash = (t, o = 0.9, d = 0.3) => tl.fromTo("#flash", { opacity: o }, { opacity: 0, duration: d, ease: "power2.out", immediateRender: false }, t);
    const impacto = (sel, t, comFlash = true) => {
      tl.set(sel, { filter: "invert(1) contrast(1.6)" }, t);
      tl.set(sel, { filter: "none" }, t + 0.067);
      if (comFlash) flash(t + 0.067, 0.85, 0.3);
      tl.to(sel, { keyframes: { x: [22, -18, 13, -8, 4, 0], y: [-10, 9, -6, 4, -2, 0] }, duration: 0.3, ease: "none" }, t);
    };
    const corte = (sel, t, dur) => {
      tl.set(sel, { opacity: 1 }, t);
      tl.fromTo(sel, { scale: 1.06 }, { scale: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, t);
      if (dur) tl.set(sel, { opacity: 0 }, t + dur);
    };
    const legenda = (id, t) => tl.from(`#leg-${id}`, { y: 60, scale: 0.8, opacity: 0, duration: 0.22, ease: "back.out(2.5)" }, t + 0.03);

    // ===== abertura: a caixa digita letra por letra (0,08 s), como no Game Boy =====
    const digitar = (id, html, t0) => {
      const el = document.getElementById(id);
      const tmp = document.createElement("div");
      tmp.innerHTML = html;
      let n = 0;
      const out = [];
      const walk = (node) => {
        for (const no of node.childNodes) {
          if (no.nodeName === "BR") out.push("<br>");
          else if (no.nodeType === 3) for (const c of no.textContent) out.push(`<span id="${id}-${n++}" style="visibility:hidden">${c}</span>`);
          else { out.push(`<b class="${no.className}">`); walk(no); out.push("</b>"); }
        }
      };
      walk(tmp);
      el.innerHTML = out.join("");
      for (let i = 0; i < n; i++) tl.set(`#${id}-${i}`, { visibility: "visible" }, t0 + i * LETRA);
      return { fim: t0 + n * LETRA, texto: tmp.textContent };
    };
    tl.fromTo("#oak", { opacity: 0.25 }, { opacity: 1, duration: 0.3, ease: "steps(3)", immediateRender: false }, 0);
    const fim1 = digitar("cx1", T.cx1, 0).fim;
    tl.to("#seta1", { opacity: 1, duration: 0.01, repeat: 3, yoyo: true, repeatDelay: 0.18 }, fim1 + 0.05);
    tl.set("#caixa1", { opacity: 0 }, 5.04);
    tl.set("#caixa2", { opacity: 1 }, 5.04);
    tl.to("#oak", { x: -1500, duration: 0.25, ease: "power2.in" }, 5.04);
    tl.fromTo("#pika", { x: 700, opacity: 1 }, { x: 0, opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 5.04);
    for (let k = 0, t = 5.04; t < 7.52; k++, t += 0.1) tl.set("#pika", { attr: { src: `midia/pika/${String(k % 60).padStart(2, "0")}.png` } }, t);
    // a bola cai no pé do Pikachu quando a palavra FUTSAL começa a aparecer
    const cx2 = digitar("cx2", T.cx2, 5.04);
    const tBola = 5.04 + cx2.texto.indexOf("FUTSAL") * LETRA;
    tl.fromTo("#bola-gb", { y: -900, opacity: 1 }, { y: 0, opacity: 1, duration: 0.24, ease: "power2.in", immediateRender: false }, tBola);
    tl.to("#bola-gb", { keyframes: { y: [-60, 0, -18, 0] }, duration: 0.35, ease: "none" }, tBola + 0.24);

    // ===== bola parada → apito → a música entra e a câmera abre =====
    tl.set("#zoom-bola", { scale: 3.2 }, 7.52);
    tl.to("#zoom-bola", { scale: 3.35, duration: 0.44, ease: "none" }, 7.52);
    tl.to("#zoom-bola", { scale: 1, duration: G0 - 7.96, ease: "power3.in" }, 7.96);
    tl.to("#com-times", { opacity: 1, duration: 0.3 }, 8.1);
    tl.to("#fundo-bola", { opacity: 1, duration: 0.3 }, 8.1);

    // ===== draft: 2 batidas por corte =====
    tl.set(["#d1", "#d2", "#d3"], { opacity: 0 }, 0);
    corte("#d1", B(0)); corte("#d2", B(2)); corte("#d3", B(4));
    tl.to(["#d1", "#d3"], { opacity: 0.35, duration: 0.12 }, B(6));
    tl.fromTo("#d2", { scale: 1 }, { scale: 1.1, duration: 0.15, ease: "back.out(3)", immediateRender: false }, B(6));
    flash(B(6), 0.4, 0.2);
    tl.set("#d-cartas", { opacity: 0 }, B(8));
    legenda("escolha", B(0));
    corte("#pk1", B(8), 2 * b);
    corte("#pk2", B(10), 2 * b);
    flash(B(10), 0.6, 0.2);
    corte("#ic", B(12), 4 * b);
    flash(B(12), 0.7, 0.25);
    legenda("icones", B(12));
    ["#e1", "#e2", "#e3", "#e4"].forEach((s, i) => corte(s, B(16 + 2 * i), i === 3 ? 2 * b + 0.01 : 2 * b));

    // ===== partida =====
    tl.from("#placar", { y: -200, opacity: 0, duration: 0.25, ease: "back.out(2)" }, B(24));
    legenda("futsal", B(24));
    tl.from("#mira", { scale: 2.4, opacity: 0, duration: 0.2, ease: "power2.out" }, B(28));
    tl.to("#mira", { scale: 0.9, duration: 0.15, yoyo: true, repeat: 3, ease: "sine.inOut" }, B(28) + 0.2);
    tl.from("#golpe", { x: -120, scale: 0.3, opacity: 0, duration: 0.18, ease: "back.out(2)", transformOrigin: "0% 100%" }, B(28) + 0.04);
    tl.from("#golpe .nome", { scale: 1.8, opacity: 0, duration: 0.16, ease: "back.out(2.5)", transformOrigin: "0% 50%" }, B(28) + 0.2);
    tl.to("#golpe", { opacity: 0, duration: 0.1 }, B(28) + 1.0);
    // defesa: o goleiro espalma (0,7 s depois do corte); quadro invertido e tremida, sem o clarão de gol
    impacto("#v-defesa-h", B(32) + 0.7, false);
    legenda("evo", B(36));
    // o gol do Raichu: zoom seguindo a bola, câmera lenta no chute, inversão + clarão no gol
    impacto("#v-gol-h", B(48));

    // ===== extras =====
    tl.from("#em1", { scale: 0.2, opacity: 0, duration: 0.2, ease: "back.out(2.5)", transformOrigin: "50% 100%" }, B(50));
    tl.set("#em2", { opacity: 1 }, B(51));
    tl.from("#em2", { scale: 0.2, duration: 0.2, ease: "back.out(2.5)", transformOrigin: "50% 100%" }, B(51));
    tl.set(["#em1", "#em2"], { opacity: 0 }, B(54));
    legenda("multi", B(50));
    corte("#dia1", B(54), 4 * b);
    corte("#dia2", B(56), 2 * b);
    legenda("copa", B(54));
    corte("#camp", B(58), 4 * b);
    flash(B(58), 0.6, 0.25);
    corte("#vit", B(62), 6 * b + 0.01);
    tl.set("#mvp", { opacity: 1 }, B(64));
    tl.from("#mvp", { x: 300, rotation: 20, duration: 0.2, ease: "back.out(2)" }, B(64));

    // ===== final: o pacote do jogo cai, treme, rasga; a carta holo sobe e vira o logo =====
    tl.to("#raios-final", { rotation: 40, duration: 6.742, ease: "none" }, B(68));
    tl.from("#pacote", { y: -1500, rotation: -12, duration: 0.25, ease: "power2.in" }, B(68));
    tl.to("#pacote", { keyframes: { y: [0, 26, 0] }, duration: 0.18, ease: "none" }, B(68) + 0.25);
    for (const n of [70, 71]) tl.to("#pacote", { keyframes: { rotation: [-5, 5, -3, 3, 0] }, duration: 0.25, ease: "none" }, B(n));
    tl.fromTo("#pacote", { filter: "drop-shadow(0 0 0px rgba(255,220,90,0))" }, { filter: "drop-shadow(0 0 70px rgba(255,220,90,0.95))", duration: 4 * b, ease: "power2.in", immediateRender: false }, B(68));
    flash(B(72), 0.9, 0.3);
    tl.to("#pacote-tampa", { x: 180, y: -300, rotation: 30, opacity: 0, duration: 0.45, ease: "power2.out" }, B(72));
    tl.to("#leque", { opacity: 1, duration: 0.15 }, B(72));
    tl.to("#leque", { rotation: 25, duration: 8 * b, ease: "none" }, B(72));
    tl.set("#simbolo", { opacity: 1 }, B(72) + 0.1);
    tl.fromTo("#simbolo", { y: 0, scale: 0.6, rotationY: 0 }, { y: -60, scale: 1.25, rotationY: 720, duration: 3 * b + 0.1, ease: "power2.out", immediateRender: false }, B(72) + 0.1);
    tl.to("#pacote", { y: 900, opacity: 0, duration: 0.6, ease: "power2.in" }, B(74));
    flash(B(76), 1, 0.35);
    tl.set("#simbolo", { opacity: 0 }, B(76));
    tl.set("#logo", { opacity: 1 }, B(76));
    tl.fromTo("#logo", { scale: 0.7 }, { scale: 1, duration: 0.45, ease: "back.out(3)", immediateRender: false }, B(76));
    tl.to("#leque", { opacity: 0.45, y: -140, duration: 0.4 }, B(76));
    tl.set("#tag", { opacity: 1 }, B(80));
    tl.from("#tag", { scale: 1.6, duration: 0.25, ease: "back.out(2)" }, B(80));
    tl.to(["#site", "#selo"], { opacity: 1, duration: 0.2 }, B(84));
    tl.from("#selo", { y: 40, duration: 0.25, ease: "back.out(2)" }, B(84));
    tl.to("#credito", { opacity: 1, duration: 0.3 }, B(84));

    window.__timelines = window.__timelines || {};
    window.__timelines.root = tl;
  </script>
</div>
</body>
</html>
