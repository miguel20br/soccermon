<!doctype html>
<!--
  Curta "Acendam as luzes" (22/10/2026), 9:16, promo de amizade na faixa 1 do álbum (livre-abertura-album), inteira e
  sem edição. O ginásio escuro acorda: cada banco de luz (o zumbido é uma nota do acorde de Dó) acende em cima de um
  amigo (o sino é a estrela), a bola esquecida quica, o placar testa, o Psyduck chega atrasado rangendo o tênis, o
  zelador apita. SOC-CER-MON lento nos metais = a piscada do logo do trailer v3; um grau acima = os amigos piscam. v2:
  no funk cada amigo tem o seu compasso, em pergunta (lead) e resposta (metais): o drible de faísca do Pikachu, o
  carrinho d'água do Squirtle, o cipó do Bulbasaur, a cabeçada tonta do Psyduck que entra, o chute de fogo do
  Charmander; depois a tabelinha dos cinco e o chute do Pikachu no prato da mudança de tom. A tela final pisca o logo
  no SOC-CER-MON em Ré. A última bola sai quicando e o Psyduck vai atrás.
  Tempos da partitura (midia/som/abertura.js, ../eventos.mjs). midia/ e comum.js são links (../preparar.mjs).
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Soccermon · Acendam as luzes</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="midia/sprites.js"></script>
<script src="midia/som/abertura.js"></script>
<script src="comum.js"></script>
<style>
.apito { position: absolute; left: 0; top: 0; z-index: 61; opacity: 0; }
#marca { position: absolute; inset: 0; z-index: 85; pointer-events: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-start="0" data-duration="40.7">
  <div id="cena" class="clip" data-start="0" data-duration="32.7672">
    <div id="cam" class="camada"></div>
    <div class="legenda" id="falta"><span>FALTA <b>UM</b></span></div>
    <div class="legenda" id="chama"><span>CHAMA OS <b>AMIGOS</b></span></div>
  </div>
  <div id="final" class="clip" data-start="32.7672" data-duration="7.9328">
    <div id="final-cena" class="camada"></div>
  </div>
  <div id="marca"></div>
  <div class="flash" id="flash"></div>
  <audio id="a-musica" class="clip" src="midia/som/abertura.ogg" data-start="0" data-duration="40.7" data-media-start="0" data-fade-out="0.4"></audio>

  <script>
    const { T, notas, instantes, div, PISO, PORTA, GOL, ginasio, luz, ator, anim, quadro, bola, percurso, pintaBola, porQuadro, estouro, anelPiso, nota, rangido, poeira, treme, flash, telaFinal, piscada } = C;
    const tl = gsap.timeline({ paused: true });
    const cam = document.getElementById('cam');
    const BANCOS = [190, 420, 660, 890];
    const G = ginasio(cam, { bancos: BANCOS, cone: 520, larg: 200 });
    const JX = PORTA.x + PORTA.w / 2;
    const JY = PISO + 14;
    const FIM = 40.7;
    const tFunk = T(6, 0);
    const tFinal = T(14, 0); // o prato da mudança de tom: o gol
    const tCorte = T(14, 6); // o MON: corte pra tela final
    const dir8 = (dx, dy) => (((2 - Math.round(Math.atan2(dy, dx) / (Math.PI / 4))) % 8) + 8) % 8;

    // ===== os cinco amigos (o 5º, o Psyduck, chega atrasado) =====
    const IDS = [25, 4, 7, 1, 54];
    const CHEGA = [
      [190, 1480], [420, 1410], [660, 1410], [890, 1480], [540, 1600],
    ];
    const am = IDS.map((id, i) => ator(cam, id, { escala: 7, z: 20 + (CHEGA[i][1] > 1450 ? 2 : 0), x: CHEGA[i][0], y: CHEGA[i][1], opacity: 0 }));
    const psy = am[4];
    am[3].el.style.zIndex = 28; // o Bulbasaur fica na frente da trave de perto (está mais perto da câmera que ela)
    const zel = ator(cam, 67, { escala: 5, z: 12, x: JX, y: JY, opacity: 0 });
    const B = bola(cam, { d: 64, z: 24, x: 545, y: 1510 });
    const apito = div(cam, 'apito');
    apito.innerHTML = '<svg width="60" height="34" viewBox="0 0 60 34"><path d="M4 10 H34 A12 12 0 1 1 22 26 H4 Z" fill="#c9ced8" stroke="#0e1430" stroke-width="5"/><circle cx="34" cy="22" r="5" fill="#0e1430"/></svg>';
    gsap.set(apito, { x: JX + 18, y: JY - 175 });

    // ===== luzes: cada banco acende em cima de um amigo; o sino é a estrela =====
    const luzes = notas('luz');
    const NOITE = [0.72, 0.52, 0.34, 0.16];
    luzes.forEach((n, i) => {
      luz(tl, G, i, n.t, { noite: NOITE[i] });
      const a = am[i];
      tl.set(a.el, { opacity: 1 }, n.t);
      anim(tl, a, 'Pose', 0, n.t, T(2, 0), { loop: false });
      tl.fromTo(a.corpo, { y: -40 }, { y: 0, duration: 0.3, ease: 'bounce.out', immediateRender: false }, n.t);
      estouro(tl, cam, CHEGA[i][0], CHEGA[i][1] - 320, n.t, { tam: 110, dur: 0.4 });
    });
    treme(tl, '#cam', 0, 0.4, 0.2);

    // a bola esquecida no degrau de cima da arquibancada: o TUNK da primeira luz treme o ginásio, ela rola até a beira,
    // despenca e quica até parar no meio da quadra (cada quique numa nota da bola; a profundidade anda cada vez menos)
    const queda = notas('bola', 0, 8);
    const DEGRAU = { y: PISO + 4, h: PISO - 760 };
    const tBeira = queda[0].t - Math.sqrt((2 * DEGRAU.h) / 2600);
    const toques = [
      { t: 0, x: 545, y: DEGRAU.y, h: DEGRAU.h, g: 0, por: 'parada', semSombra: true },
      { t: 0.08, x: 545, y: DEGRAU.y, h: DEGRAU.h, g: 0, por: 'tranco', semSombra: true },
      { t: tBeira, x: 545, y: DEGRAU.y + 22, h: DEGRAU.h, por: 'beira' },
    ];
    {
      let y = DEGRAU.y + 22;
      let vy = 150;
      queda.forEach((n, i) => {
        y += vy * (n.t - (i ? queda[i - 1].t : tBeira));
        vy *= 0.72;
        toques.push({ t: n.t, x: 545 + i * 3, y, por: 'chao', n });
      });
      toques.at(-1).g = 0;
    }
    const REPOUSO = toques.at(-1);
    // o placar testa: os amigos olham pra cima; o Psyduck entra rangendo o tênis; o zelador apita
    const [p1] = notas('placar');
    G.digs.forEach((d) => tl.to(d, { opacity: 1, duration: 0.1 }, p1.t));
    tl.set(G.rel, { textContent: '5:00' }, 0);
    tl.to(G.rel, { opacity: 1, duration: 0.1 }, p1.t);
    for (const t of instantes(notas('placar'))) {
      tl.fromTo(G.lamps, { opacity: 1 }, { opacity: 0, duration: 0.5, ease: 'power1.in', immediateRender: false }, t);
      am.slice(0, 4).forEach((a, i) => {
        quadro(tl, a, 'Idle', 4, 0, t + i * 0.03);
        tl.to(a.corpo, { keyframes: { y: [-22, 0] }, duration: 0.22 }, t + i * 0.03);
      });
    }
    const tenis = notas('tenis');
    const tPorta = tenis[0].t - 0.25;
    tl.to(G.portaLuz, { opacity: 1, duration: 0.2 }, tPorta);
    tl.set('#porta-vao', { attr: { fill: '#ffd68c' } }, tPorta);
    tl.set(psy.el, { x: JX, y: JY + 20, opacity: 1 }, tPorta);
    quadro(tl, psy, 'Walk', 1, 0, tPorta);
    const PP = [[JX, JY + 20], [230, 1300], [330, 1420], [430, 1520], [500, 1580], [540, 1600]];
    tenis.forEach((n, i) => {
      const [x, y] = PP[i + 1];
      tl.to(psy.el, { x, y, duration: (tenis[i + 1]?.t ?? n.t + 0.3) - n.t, ease: 'none' }, n.t);
      quadro(tl, psy, 'Walk', 1, i % 4, n.t);
      rangido(tl, cam, PP[i][0], PP[i][1] - 6, n.t, { lado: -1, cor: n.m ? '#ffcb05' : '#fff' });
      am.slice(0, 4).forEach((a, k) => quadro(tl, a, 'Idle', k < 2 ? 6 : 7, 0, n.t));
    });
    const tChega = tenis.at(-1).t + 0.25;
    anim(tl, psy, 'Idle', 0, tChega, T(5, 0));
    tl.to(psy.corpo, { keyframes: { scaleY: [0.85, 1.05, 1] }, duration: 0.3 }, tChega);
    // o apito do zelador (o mesmo do Ginásio vazio)
    const [ap] = notas('apito');
    tl.to(zel.el, { opacity: 1, duration: 0.2 }, ap.t - 0.45);
    anim(tl, zel, 'Idle', 0, ap.t - 0.45, tFinal);
    tl.set(apito, { opacity: 1 }, ap.t - 0.03);
    tl.fromTo(apito, { scale: 1.3 }, { scale: 1, duration: 0.15, immediateRender: false }, ap.t);
    tl.set(apito, { opacity: 0 }, ap.t + 1.1);
    nota(tl, cam, JX + 60, JY - 190, ap.t, { cor: '#ffcb05', sobe: 220, dx: 120, dur: 1.4, tam: 1.2 });
    [0, 0.35, 0.7].forEach((d) => estouro(tl, cam, JX + 50, JY - 175, ap.t + d, { tam: 110, anel: true, estrela: false, borda: 7 }));
    am.forEach((a) => quadro(tl, a, 'Idle', 0, 0, ap.t + 0.15));

    // ===== SOC-CER-MON lento nos metais: o logo pisca (trailer v3); as palmas são os toca-aqui =====
    const marca = document.getElementById('marca');
    telaFinal(marca, { top: 470 });
    const tGancho = (bar) => [T(bar, 0), T(bar, 3), T(bar, 6)];
    tl.to(G.noite, { opacity: 0.4, duration: 0.3 }, T(4, 0) - 0.3);
    tl.set('#logo', { opacity: 1 }, T(4, 0));
    tl.fromTo('#logo', { scale: 0.7 }, { scale: 1, duration: 0.45, ease: 'back.out(3)', immediateRender: false }, T(4, 0));
    piscada(tl, tGancho(4), '#cam');
    tl.to('#logo', { opacity: 0, y: -60, duration: 0.25 }, tFunk - 0.25);
    tl.to(G.noite, { opacity: 0.16, duration: 0.3 }, T(5, 0));
    const toca = (t, a, b) => {
      const xm = (gsap.getProperty(a.el, 'x') + gsap.getProperty(b.el, 'x')) / 2;
      [a, b].forEach((p, k) => {
        anim(tl, p, 'Hop', k ? 6 : 2, t - 0.25, t + 0.3, { loop: false, vel: 1.6 });
        tl.to(p.corpo, { keyframes: { x: [k ? -40 : 40, 0], y: [-70, 0] }, duration: 0.5, ease: 'power1.inOut' }, t - 0.25);
      });
      estouro(tl, cam, xm, 1180, t, { tam: 150, dur: 0.35 });
    };
    const palmas = notas('palmas');
    toca(palmas[0].t, am[0], am[1]);
    toca(palmas[1].t, am[2], am[3]);
    // um grau acima: os amigos piscam como o logo (SOC: Pikachu e Charmander, CER: Squirtle e Bulbasaur, MON: Psyduck)
    [[0, 1], [2, 3], [4]].forEach((grupo, s) => {
      const t = tGancho(5)[s];
      for (const i of grupo) {
        const a = am[i];
        tl.set(a.spr, { filter: 'brightness(0) invert(1)' }, t);
        tl.set(a.spr, { filter: 'none' }, t + 0.12);
        tl.fromTo(a.corpo, { scale: 1 }, { keyframes: [{ scale: 1.25, duration: 0.06 }, { scale: 1, duration: 0.12 }], immediateRender: false }, t);
        estouro(tl, cam, gsap.getProperty(a.el, 'x'), gsap.getProperty(a.el, 'y') - 110, t, { tam: 230, z: 19 });
      }
      if (s === 2) treme(tl, '#cam', t, 0.7, 0.25);
    });
    // as palmas do 2º gancho: todo mundo pula junto, e a caixa chama pro jogo
    for (const n of palmas.filter((n) => n.t > T(5, 0) && n.t < tFunk)) am.forEach((a, i) => tl.to(a.corpo, { keyframes: { y: [-80, 0] }, duration: 0.28, ease: 'power1.inOut' }, n.t - 0.14 + i * 0.02));

    // ===== o funk: cada amigo tem o seu compasso, na pergunta (lead) e na resposta (metais) =====
    // 6 Pikachu dribla em zigue-zague soltando faísca em cada nota do lead · 7 Squirtle responde nos metais: desliza de
    // barriga e rouba a bola · 8 Bulbasaur faz embaixadinha de cipó no lead e lança · 9 Psyduck responde: a bola bate na
    // cabeça duas vezes, ele fica tonto (um "?" por nota dos metais) e ela entra na caixa · 10 Charmander levanta a bola
    // na escala do lead (a chama do rabo cresce) · 11 chute de fogo na caixa · 12–13 tabelinha de um toque, cada bumbo um
    // passe com a marca de quem toca · 14 o chute do Pikachu entra no prato da mudança de tom.
    const [PK, CH, SQ, BU, PS] = am;
    const YG = 1440; // a profundidade em que as bolas entram no gol
    const XG = GOL.boca(YG) + 110;
    /** A bola entra: bate no fundo da rede, afunda com ela e é devolvida (contatos da física). */
    const entra = (t, h, forca = 1) => {
      const r = G.rede.bate(t, h, { forca, y: YG, r: 32 });
      toques.push({ t, x: r.x, y: YG, h, por: 'rede', g: 0 }, { t: r.t1, x: r.xMax, y: YG, h: Math.max(0, h - 8), por: 'rede' });
      return { x: r.x + 26, y: YG - h - 32 };
    };
    const lerp = (a, b, f) => a + (b - a) * f;
    flash(tl, tFunk, 0.9, 0.3);
    const P0 = [[120, 1600], [610, 1400], [90, 1760], [760, 1590], [300, 1370]];
    const DIR0 = [2, 2, 2, 6, 2];
    am.forEach((a, i) => {
      tl.set(a.el, { x: P0[i][0], y: P0[i][1] }, tFunk);
      quadro(tl, a, 'Idle', DIR0[i], 0, tFunk);
    });
    const RAIO = 'M14 0 L4 22 H12 L6 40 L26 14 H17 L24 0 Z';
    function raio(x, y, t, { tam = 1, rot = 0, cor = '#ffe14a', dur = 0.2 } = {}) {
      const fx = div(cam, 'fx', 'z-index:63');
      fx.innerHTML = `<svg width="${30 * tam}" height="${40 * tam}" viewBox="0 0 30 40" style="position:absolute;left:${-15 * tam}px;top:${-20 * tam}px;overflow:visible"><path d="${RAIO}" fill="${cor}" stroke="#0e1430" stroke-width="${3 / Math.sqrt(tam)}"/></svg>`;
      gsap.set(fx, { x, y, rotation: rot, opacity: 0 });
      tl.fromTo(fx, { opacity: 1, scale: 0.5 }, { scale: 1.15, duration: 0.08, immediateRender: false }, t);
      tl.to(fx, { opacity: 0, duration: dur }, t + 0.1);
    }
    const faisca = (x, y, t) => [[-45, -5, -40], [45, -15, 35], [0, -60, 170]].forEach(([dx, dy, r]) => raio(x + dx, y + dy, t, { tam: 1.5, rot: r }));
    function pergunta(x, y, t, tam = 1) {
      const fx = div(cam, 'fx', 'z-index:64');
      fx.innerHTML = `<span style="position:absolute;transform:translate(-50%,-50%);font-size:${80 * tam}px;color:#ffcb05;-webkit-text-stroke:${10 * tam}px #0e1430;paint-order:stroke fill">?</span>`;
      gsap.set(fx, { x, y, opacity: 0 });
      tl.fromTo(fx, { opacity: 1, scale: 0.3 }, { scale: 1, duration: 0.15, ease: 'back.out(3)', immediateRender: false }, t);
      tl.to(fx, { y: y - 50, duration: 0.6, ease: 'power1.out' }, t);
      tl.to(fx, { opacity: 0, duration: 0.25 }, t + 0.4);
    }
    function cipo(t, x0, y0, x1, y1) {
      const len = Math.hypot(x1 - x0, y1 - y0);
      const c = div(cam, 'fx', 'z-index:23');
      c.innerHTML = `<div style="position:absolute;left:0;top:-8px;width:${len}px;height:16px;border-radius:8px;background:#4fae4a;box-shadow:0 0 0 4px #0e1430"></div><div style="position:absolute;left:${len - 18}px;top:-16px;width:30px;height:30px;border-radius:50% 0;background:#7ad06a;box-shadow:0 0 0 4px #0e1430"></div>`;
      gsap.set(c, { x: x0, y: y0, rotation: (Math.atan2(y1 - y0, x1 - x0) * 180) / Math.PI, scaleX: 0, transformOrigin: '0px 0px' });
      tl.fromTo(c, { scaleX: 0 }, { scaleX: 1, duration: 0.07, ease: 'power2.out', immediateRender: false }, t - 0.07);
      tl.to(c, { scaleX: 0, duration: 0.16, ease: 'power2.in' }, t + 0.05);
    }
    const gotas = (x, y, t) => poeira(tl, cam, x, y, t, { n: 5, r: 100, tam: 24, cor: '#6ec3ff' });
    const chama = (x, y, t, tam = 1) => {
      estouro(tl, cam, x, y, t, { tam: 100 * tam, cor: '#ff7a1c', anel: false, dur: 0.3 });
      estouro(tl, cam, x, y, t, { tam: 55 * tam, cor: '#ffd23f', anel: false, dur: 0.25, z: 61 });
    };
    const golNaRede = (t, n, ponto, cor = '#ffcb05') => {
      estouro(tl, cam, ponto.x, ponto.y, t, { tam: 200, cor, borda: 10, z: 27 });
      treme(tl, '#cam', t, 0.9, 0.3);
      tl.set(G.digs[0], { textContent: String(n) }, t);
      tl.fromTo(G.digs[0], { scale: 1.6 }, { scale: 1, duration: 0.35, ease: 'back.out(3)', immediateRender: false }, t);
      am.forEach((a, i) => tl.to(a.corpo, { keyframes: { y: [-60, 0] }, duration: 0.3, ease: 'power1.inOut' }, t + 0.05 + i * 0.03));
    };
    const ocupado = []; // [amigo, t0, t1]: enquanto faz o lance dele, não fica olhando a bola
    const lead = (b) => notas('lead', T(b, 0) - 0.01, T(b + 1, 0) - 0.01);
    const metaisDe = (b) => instantes(notas('metais', T(b, 0) - 0.01, T(b + 1, 0) - 0.01));
    const bumbos = (b) => notas('bumbo', T(b, 0) - 0.01, T(b + 1, 0) - 0.01).map((n) => n.t);

    // 6 · Pikachu: zigue-zague, faísca em cada nota do lead
    const ZZ = [[120, 1600], [190, 1680], [260, 1560], [330, 1670], [400, 1570], [450, 1650]];
    const l6 = lead(6);
    // o corte do prato (clarão): todo mundo já está em posição, a bola no pé do Pikachu
    toques.push({ t: tFunk - 0.001, x: REPOUSO.x, y: REPOUSO.y, g: 0, por: 'corte' }, { t: tFunk, x: 165, y: 1604, g: 0, por: 'pe' });
    l6.forEach((n, i) => {
      const [x, y] = ZZ[i];
      if (i) tl.to(PK.el, { x, y, duration: n.t - l6[i - 1].t, ease: 'sine.inOut' }, l6[i - 1].t);
      if (i) toques.push({ t: n.t, x: x + 45, y: y + 4, g: 0, por: 'pe' });
      faisca(x + 45, y - 30, n.t);
    });
    anim(tl, PK, 'Walk', 2, tFunk, T(7, 0) - 0.04, { vel: 2.2 });
    tl.to(PK.el, { x: 490, y: 1620, duration: T(7, 0) - l6.at(-1).t, ease: 'sine.inOut' }, l6.at(-1).t);
    ocupado.push([PK, tFunk, T(8, 0)]);
    // 7 · Squirtle responde nos metais: desliza de barriga (rastro d'água, gotas em cada nota) e rouba a bola
    const t7 = T(7, 0);
    toques.push({ t: t7, x: 535, y: 1624, g: 0, por: 'pe' });
    quadro(tl, PK, 'Shoot', 3, window.SPR[25].anims.Shoot.hit, t7 - 0.03);
    quadro(tl, PK, 'Idle', 3, 0, t7 + 0.16);
    raio(535, 1590, t7, { tam: 2 });
    // e sai do caminho
    tl.to(PK.el, { x: 200, y: 1540, duration: T(8, 0) - T(7, 3), ease: 'sine.inOut' }, T(7, 3));
    anim(tl, PK, 'Walk', 7, T(7, 3), T(8, 0), { vel: 1.6 });
    const tS0 = T(7, 3);
    const tS1 = T(7, 10);
    const SX = (t) => 90 + 415 * (1 - (1 - Math.min(1, Math.max(0, (t - tS0) / (tS1 - tS0)))) ** 2);
    quadro(tl, SQ, 'Walk', 2, 1, tS0);
    tl.to(SQ.corpo, { rotation: 65, transformOrigin: '0px -60px', duration: 0.12 }, tS0);
    tl.to(SQ.el, { x: 505, y: 1740, duration: tS1 - tS0, ease: 'power1.out' }, tS0);
    const rastro = div(cam, 'fx', 'z-index:14');
    rastro.innerHTML = '<div style="position:absolute;left:0;top:-22px;width:420px;height:44px;border-radius:22px;background:rgb(110 195 255 / 55%);box-shadow:0 0 0 4px rgb(14 20 48 / 40%)"></div>';
    gsap.set(rastro, { x: 90, y: 1752, scaleX: 0, transformOrigin: '0px 0px', opacity: 1 });
    tl.to(rastro, { scaleX: 1, duration: tS1 - tS0, ease: 'power1.out' }, tS0);
    tl.to(rastro, { opacity: 0, duration: 0.5 }, T(8, 2));
    for (const t of metaisDe(7)) gotas(SX(t) + 30, 1745, t);
    toques.push({ t: tS1, x: 550, y: 1744, g: 0, por: 'barriga' });
    gotas(550, 1740, tS1);
    tl.to(SQ.corpo, { rotation: 0, duration: 0.15 }, T(7, 12));
    const t7p = bumbos(7).at(-1);
    toques.push({ t: t7p, x: 565, y: 1740, por: 'pe' });
    quadro(tl, SQ, 'Shoot', 1, window.SPR[7].anims.Shoot.hit, t7p - 0.03);
    quadro(tl, SQ, 'Idle', 1, 0, t7p + 0.16);
    gotas(565, 1735, t7p);
    ocupado.push([SQ, tS0, T(8, 0)]);
    // 8 · Bulbasaur: embaixadinha de cipó no lead e o lançamento na cabeça do Psyduck
    const l8 = lead(8).map((n) => n.t);
    const BV = [720, 1520]; // de onde saem os cipós
    const vinha = [
      { t: l8[0], x: 640, y: 1590, h: 30, por: 'cipo' },
      { t: l8[1], x: 665, y: 1585, h: 170, por: 'cipo' },
      { t: l8[2], x: 650, y: 1585, h: 200, por: 'cipo' },
      { t: l8[3], x: 640, y: 1585, h: 210, por: 'cipo' },
    ];
    for (const q of vinha) {
      toques.push(q);
      cipo(q.t, BV[0], BV[1], q.x + 10, q.y - q.h - 30);
      quadro(tl, BU, 'Shoot', 6, window.SPR[1].anims.Shoot.hit, q.t - 0.04);
      quadro(tl, BU, 'Idle', 6, 0, q.t + 0.18);
    }
    for (const t of l8.slice(4)) tl.to(BU.corpo, { keyframes: { y: [-35, 0] }, duration: 0.2 }, t - 0.05);
    ocupado.push([BU, l8[0] - 0.1, T(9, 0)]);
    // 9 · Psyduck responde: a bola bate na cabeça, sobe, bate de novo, ele fica tonto e ela entra mesmo assim
    const t9 = T(9, 0);
    const HP = [330, 1374, 150];
    toques.push({ t: t9, x: HP[0], y: HP[1], h: HP[2], por: 'cabeca' });
    toques.push({ t: T(9, 6), x: HP[0] + 5, y: HP[1], h: HP[2], por: 'cabeca' });
    const t9g = T(9, 12);
    const gol1 = entra(t9g, 90);
    for (const t of [t9, T(9, 6)]) {
      estouro(tl, cam, HP[0], HP[1] - HP[2] - 20, t, { tam: 110, cor: '#fff', borda: 6 });
      quadro(tl, PS, 'Hurt', 0, 0, t);
    }
    metaisDe(9).forEach((t, i) => {
      quadro(tl, PS, 'Idle', [0, 2, 4, 6][i % 4], 0, t);
      pergunta(300 + (i % 2 ? 60 : -50), 1140 - i * 20, t, 0.9);
    });
    golNaRede(t9g, 1, gol1);
    pergunta(300, 1120, t9g, 1.6);
    quadro(tl, PS, 'Hurt', 0, 0, t9g);
    quadro(tl, PS, 'Idle', 2, 0, T(10, 0));
    ocupado.push([PS, t9, T(10, 0)]);
    toques.push({ t: T(9, 14.5), por: 'chao' }); // a rede devolve: quica e rola até o Charmander
    // 10 · Charmander levanta a bola na escala do lead e a chama do rabo cresce · 11 chute de fogo na caixa
    const cauda = div(CH.el, '', 'position:absolute;left:-62px;top:-96px;width:44px;height:44px;border-radius:50%;background:radial-gradient(#fff3a0 15%,#ffb02e 45%,#ff5a1c 65%,transparent 72%);opacity:0;z-index:5');
    const l10 = lead(10).map((n) => n.t);
    l10.forEach((t, i) => {
      toques.push({ t, x: 655, y: 1404, por: 'pe' });
      quadro(tl, CH, 'Shoot', 2, window.SPR[4].anims.Shoot.hit, t - 0.03);
      quadro(tl, CH, 'Idle', 2, 0, t + 0.14);
      chama(655, 1390, t, 0.6);
      tl.to(cauda, { opacity: 1, scale: 1 + i * 0.35, duration: 0.12, ease: 'back.out(3)' }, t);
    });
    const t11 = T(11, 0);
    const t11g = T(11, 4);
    toques.push({ t: t11, x: 665, y: 1404, h: 40, por: 'chute' });
    const gol2 = entra(t11g, 70);
    quadro(tl, CH, 'Shoot', 2, window.SPR[4].anims.Shoot.hit, t11 - 0.03);
    quadro(tl, CH, 'Idle', 2, 0, t11 + 0.25);
    chama(665, 1404 - 40 - 32, t11, 1.6);
    for (let i = 1; i <= 6; i++) chama(lerp(665, gol2.x, i / 7), lerp(1404 - 72, gol2.y, i / 7), lerp(t11, t11g, i / 7), 0.8);
    golNaRede(t11g, 2, gol2, '#ff7a1c');
    for (const n of lead(11).slice(1)) poeira(tl, cam, gol2.x + 30, gol2.y - 40, n.t, { n: 5, r: 90, tam: 46, cor: '#8a8fa8' });
    tl.to(cauda, { opacity: 0, scale: 1, duration: 0.6 }, T(11, 8));
    ocupado.push([CH, l10[0] - 0.1, T(11, 6)]);
    toques.push({ t: T(11, 6.5), por: 'chao', g: 0 }); // devolvida: quica e rola até o Charmander, que abre a tabelinha

    // 12–13 · tabelinha de um toque: os cinco se espalham e cada bumbo é um passe com a marca de quem toca
    const TP = [[430, 1360], [680, 1470], [300, 1700], [600, 1630], [230, 1400]]; // Pikachu, Charmander, Squirtle, Bulbasaur, Psyduck
    const ANTES = [[200, 1540], [610, 1400], [505, 1740], [760, 1590], [300, 1370]]; // onde cada um terminou o seu lance
    am.forEach((a, i) => {
      tl.to(a.el, { x: TP[i][0], y: TP[i][1], duration: T(12, 0) - T(11, 6) - 0.05, ease: 'sine.inOut' }, T(11, 6));
      anim(tl, a, 'Walk', TP[i][0] > ANTES[i][0] ? 2 : 6, T(11, 6), T(12, 0) - 0.05, { vel: 1.8 });
    });
    const tab = [...bumbos(12), ...bumbos(13)];
    const QUEM = [CH, SQ, BU, PS, CH, SQ, BU, PK];
    const ponto = (a, alvo) => {
      const [x, y] = TP[am.indexOf(a)];
      if (a === PS) return { x: x + 25, y: y + 4, h: 140 };
      if (a === BU) {
        const d = Math.hypot(alvo[0] - x, alvo[1] - y) || 1;
        return { x: x + ((alvo[0] - x) / d) * 110, y: y + ((alvo[1] - y) / d) * 60, h: 0 };
      }
      return { x: x + (alvo[0] > x ? 45 : -45), y: y + 4, h: 0 };
    };
    tab.forEach((t, k) => {
      const a = QUEM[k];
      const alvo = k + 1 < tab.length ? TP[am.indexOf(QUEM[k + 1])] : [XG, YG];
      const p = ponto(a, alvo);
      const proxPS = QUEM[k + 1] === PS;
      // passe rasteiro rolando; pra cabeça do Psyduck (e da cabeça dele) vai por cima
      toques.push({ t, ...p, por: a === PS ? 'cabeca' : a === BU ? 'cipo' : 'pe', g: a === PS || proxPS || k === tab.length - 1 ? undefined : 0 });
      const [x, y] = TP[am.indexOf(a)];
      const d = dir8(alvo[0] - x, alvo[1] - y);
      if (a === BU) {
        cipo(t, x - 30, y - 70, p.x, p.y - p.h - 30);
        quadro(tl, BU, 'Shoot', d, window.SPR[1].anims.Shoot.hit, t - 0.04);
      } else if (a === PS) {
        quadro(tl, PS, 'Hurt', 0, 0, t);
        estouro(tl, cam, p.x, p.y - p.h - 20, t, { tam: 90, cor: '#fff', anel: false, dur: 0.2 });
        pergunta(x, y - 240, t, 0.8);
      } else quadro(tl, a, 'Shoot', d, window.SPR[a.id].anims.Shoot.hit, t - 0.03);
      quadro(tl, a, 'Idle', d, 0, t + 0.16);
      if (a === SQ) gotas(p.x, p.y - 4, t);
      if (a === CH) chama(p.x, p.y - 20, t, 0.7);
      if (a === PK) faisca(p.x, p.y - 30, t);
    });
    // 14 · o chute do Pikachu entra no prato da mudança de tom: raio do teto na rede
    const gol3 = entra(tFinal, 80, 1.5);
    const P = percurso(toques, { nome: 'luzes' });
    for (const q of P.C.filter((q) => q.n)) anelPiso(tl, cam, q.x, q.y, q.t, { w: 50 + 100 * q.n.v, cor: '#fff', borda: 6 });
    raio(gol3.x, gol3.y - 260, tFinal, { tam: 8, dur: 0.35 });
    // quem não está no lance olha pra bola
    for (const q of P.C.filter((q) => q.t >= tFunk && q.t < tFinal))
      am.forEach((a, i) => {
        if (ocupado.some(([o, t0, t1]) => o === a && q.t >= t0 && q.t < t1)) return;
        if (q.t >= T(11, 6) && q.t < T(12, 0)) return;
        if (q.t >= T(12, 0) && Math.hypot(TP[i][0] - q.x, TP[i][1] - q.y) < 130) return;
        const [x, y] = q.t >= T(12, 0) ? TP[i] : (a === PK && q.t >= T(7, 0)) || (a === SQ && q.t >= T(8, 0)) ? ANTES[i] : P0[i];
        quadro(tl, a, 'Idle', dir8(q.x - x, q.y - y), 0, q.t + 0.02);
      });
    // a caixa no 2 e no 4: todo mundo balança junto
    for (const t of instantes(notas('caixa', tFunk, tFinal).filter((n) => n.v >= 1)))
      [...am, zel].forEach((a) => tl.fromTo(a.corpo, { scaleY: 0.9, scaleX: 1.06 }, { scaleY: 1, scaleX: 1, duration: 0.2, ease: 'power2.out', immediateRender: false }, t));
    // os metais respondem: as lâmpadas do placar
    for (const t of instantes(notas('metais', tFunk, tFinal))) tl.fromTo(G.lamps, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: 'power1.in', immediateRender: false }, t);
    // a câmera abre no lance de cada um e vai pro gol na virada
    gsap.set('#cam', { transformOrigin: '540px 1300px' });
    tl.set('#cam', { scale: 1.08, transformOrigin: '470px 1420px' }, tFunk);
    tl.to('#cam', { scale: 1, duration: T(8, 0) - tFunk, ease: 'sine.out' }, tFunk);
    tl.to('#cam', { scale: 1.12, transformOrigin: '600px 1300px', duration: tFinal - T(13, 0), ease: 'power2.in' }, T(13, 0));
    // o gol no prato
    golNaRede(tFinal, 3, gol3);
    estouro(tl, cam, gol3.x, gol3.y, tFinal, { tam: 360, borda: 12, z: 27 });
    am.forEach((a, i) => anim(tl, a, 'Hop', 0, tFinal + i * 0.05, tCorte, { loop: false, vel: 1.3 }));

    // ===== textos =====
    const tFalta = luzes[3].t + 0.4;
    tl.set('#falta', { opacity: 1 }, tFalta);
    tl.from('#falta', { y: 50, scale: 0.8, duration: 0.25, ease: 'back.out(2.5)' }, tFalta);
    tl.to('#falta', { opacity: 0, y: -40, duration: 0.2 }, tChega);
    tl.set('#chama', { opacity: 1 }, tFunk);
    tl.from('#chama', { y: 50, scale: 0.8, duration: 0.25, ease: 'back.out(2.5)' }, tFunk);
    tl.to('#chama', { opacity: 0, y: -40, duration: 0.25 }, T(7, 0) - 0.25);

    // ===== tela final: SOC-CER-MON em Ré pisca o logo, os cinco em fila embaixo =====
    flash(tl, tFinal, 0.7, 0.3);
    flash(tl, tCorte, 1, 0.3);
    tl.set('#logo', { opacity: 1, y: 0 }, tFinal);
    tl.fromTo('#logo', { scale: 0.7 }, { scale: 1, duration: 0.45, ease: 'back.out(3)', immediateRender: false }, tFinal);
    piscada(tl, tGancho(14), '#final-cena');
    const fc = document.getElementById('final-cena');
    // a tela final é o ginásio aceso: os cinco em fila embaixo dos quatro bancos, o placar com o 3 a 0
    const G2 = ginasio(fc, { bancos: BANCOS, cone: 520, larg: 200 });
    gsap.set(G2.noite, { opacity: 0.12 });
    gsap.set([...G2.tubos, ...G2.cones, ...G2.digs, G2.rel], { opacity: 1 });
    gsap.set(G2.pl, { opacity: 0 }); // o placar ficaria atrás do logo
    const fila = IDS.map((id, i) => ator(fc, id, { escala: 7, z: 20, x: 470 + (i - 2) * 125, y: 1430 }));
    fila.forEach((a) => anim(tl, a, 'Idle', 0, tCorte, T(16, 0)));
    for (const n of notas('palmas', tFinal)) fila.forEach((a, i) => tl.to(a.corpo, { keyframes: { y: [-70, 0] }, duration: 0.26, ease: 'power1.inOut' }, n.t - 0.13 + i * 0.02));
    tl.set('#tag', { opacity: 1 }, T(15, 0));
    tl.from('#tag', { scale: 1.6, duration: 0.25, ease: 'back.out(2)' }, T(15, 0));
    const tAcorde = T(16, 0);
    flash(tl, tAcorde, 0.5, 0.25);
    tl.to(['#site', '#selo', '#credito'], { opacity: 1, duration: 0.2 }, tAcorde);
    tl.from('#selo', { y: 40, duration: 0.25, ease: 'back.out(2)' }, tAcorde);
    fila.forEach((a, i) => anim(tl, a, 'Pose', 0, tAcorde + i * 0.04, FIM, { loop: false }));
    // os dois apitinhos: o Pikachu
    for (const n of notas('apitoCurto')) nota(tl, fc, 240, 1150, n.t, { cor: '#ffcb05', sobe: 120, dx: -40, dur: 0.7, tam: 0.9 });
    // a última bola cai, quica pela frente e sai; o Psyduck vai atrás
    const ult = notas('bola', 30);
    // a bola parada no pé do Pikachu: ele dá um toquinho por cima no fim e ela sai quicando pela frente do gol
    const BF = bola(fc, { d: 64, z: 28, x: 268, y: 1446 });
    const tToqueF = ult[0].t - 0.55;
    const fim = [
      { t: tCorte, x: 268, y: 1446, g: 0, por: 'parada' },
      { t: tToqueF, x: 268, y: 1446, por: 'pe' },
    ];
    {
      let x = 268;
      let vx = 390;
      ult.forEach((n, i) => {
        x += vx * (n.t - (i ? ult[i - 1].t : tToqueF));
        vx *= 0.95;
        fim.push({ t: n.t, x, y: Math.min(1650, 1446 + (n.t - tToqueF) * 160), por: 'chao', n });
      });
      fim.at(-1).g = 0;
      fim.push({ t: FIM, x: x + vx * (FIM - ult.at(-1).t), y: fim.at(-1).y, por: 'rola' });
    }
    quadro(tl, fila[0], 'Shoot', 2, window.SPR[25].anims.Shoot.hit, tToqueF - 0.03);
    anim(tl, fila[0], 'Pose', 0, tToqueF + 0.2, FIM, { loop: false, de: 2 });
    const PF = percurso(fim, { nome: 'final' });
    for (const q of PF.C.filter((q) => q.n)) anelPiso(tl, fc, q.x, q.y, q.t, { w: 50 + 100 * q.n.v, cor: '#fff', borda: 6, z: 7 });
    const ps = fila[4];
    quadro(tl, ps, 'Idle', 2, 0, ult[1].t);
    anim(tl, ps, 'Walk', 2, ult[2].t, FIM, { vel: 1.6 });
    tl.to(ps.el, { x: 1250, y: 1660, duration: FIM - ult[2].t, ease: 'power1.in' }, ult[2].t);
    tl.set(ps.el, { zIndex: 29 }, ult[2].t);

    // por quadro: as duas bolas e as duas redes (funções só do tempo)
    tl.set({}, {}, FIM);
    porQuadro(tl, (t) => {
      pintaBola(B, P, t, { d: 64 });
      pintaBola(BF, PF, t, { d: 64 });
      G.rede.pinta(t);
      G2.rede.pinta(t);
    });
    window.__luzes = { P, PF };
    if (window.__avisos?.length) console.warn(`física: ${window.__avisos.length} aviso(s)\n${window.__avisos.join('\n')}`);
    window.__timelines = window.__timelines || {};
    window.__timelines.root = tl;
  </script>
</div>
