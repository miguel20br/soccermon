  <script>
    const b = 60 / 178, G0 = 8.428, B = (n) => G0 + n * b;
    const LETRA = 0.08;
    const TEXTOS = {
      pt: {
        cx1: "Este mundo é habitado<br>por criaturas chamadas<br>POKÉMON!",
        cx2: "…e elas<br><b class=\"grande\">JOGAM FUTSAL.</b>",
        escolha: "ESCOLHA <b>1</b> DE <b>3</b>",
        icones: "ÍCONES <b>RAROS</b>",
        futsal: "<b>FUTSAL</b><br>5 CONTRA 5",
        evo: "<b>EVOLUÇÕES</b> NO MEIO DO JOGO",
        multi: "<b>MULTIPLAYER</b> ONLINE",
        copa: "COPA <b>RANKEADA</b>",
        usou: "CHARIZARD usou",
        tag: "Temos que chutar!",
        selo: "grátis no navegador<br>fan game sem fins lucrativos",
        credito: "Música: Trainer Battle Remix · Bliitzit",
      },
      en: {
        cx1: "This world is inhabited<br>by creatures called<br>POKéMON!",
        cx2: "…and they<br><b class=\"grande\">PLAY FUTSAL.</b>",
        escolha: "PICK <b>1</b> OF <b>3</b>",
        icones: "RARE <b>ICONS</b>",
        futsal: "<b>FUTSAL</b><br>5 VS 5",
        evo: "<b>EVOLUTIONS</b> MID-MATCH",
        multi: "ONLINE <b>MULTIPLAYER</b>",
        copa: "RANKED <b>CUP</b>",
        usou: "CHARIZARD used",
        tag: "Gotta kick 'em all!",
        selo: "free in your browser<br>non-profit fan game",
        credito: "Music: Trainer Battle Remix · Bliitzit",
      },
    };
    const vars = window.__hyperframes?.getVariables?.() ?? {};
    const T = TEXTOS[vars.lang] ?? TEXTOS.pt;
    // o texto vai num <span>: a legenda é flex e sem o span cada <b> virava uma coluna
    for (const [id, k] of [["escolha", "escolha"], ["icones", "icones"], ["futsal", "futsal"], ["evo", "evo"], ["multi", "multi"], ["copa", "copa"]])
      document.getElementById(`leg-${id}`).innerHTML = `<span>${T[k]}</span>`;
    document.getElementById("golpe-quem").textContent = T.usou;
    document.getElementById("tag").textContent = T.tag;
    document.getElementById("selo-txt").innerHTML = T.selo;
    document.getElementById("credito").textContent = T.credito;

    const tl = gsap.timeline({ paused: true });
    const flash = (t, o = 0.9, d = 0.3) => tl.fromTo("#flash", { opacity: o }, { opacity: 0, duration: d, ease: "power2.out", immediateRender: false }, t);
    const impacto = (sel, t, comFlash = true) => {
      tl.set(sel, { filter: "invert(1) contrast(1.6)" }, t);
      tl.set(sel, { filter: "none" }, t + 0.067);
      if (comFlash) flash(t + 0.067, 0.85, 0.3);
      tl.to(sel, { keyframes: { x: [22, -18, 13, -8, 4, 0], y: [-10, 9, -6, 4, -2, 0] }, duration: 0.3, ease: "none" }, t);
    };
    const corte = (sel, t, dur) => {
      tl.set(sel, { opacity: 1 }, t);
      tl.fromTo(sel, { scale: 1.06 }, { scale: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, t);
      if (dur) tl.set(sel, { opacity: 0 }, t + dur);
    };
    const legenda = (id, t) => tl.from(`#leg-${id}`, { y: 60, scale: 0.8, opacity: 0, duration: 0.22, ease: "back.out(2.5)" }, t + 0.03);

    // ===== abertura: a caixa digita letra por letra (0,08 s), como no Game Boy =====
    const digitar = (id, html, t0) => {
      const el = document.getElementById(id);
      const tmp = document.createElement("div");
      tmp.innerHTML = html;
      let n = 0;
      const out = [];
      const walk = (node, wrapB) => {
        for (const no of node.childNodes) {
          if (no.nodeName === "BR") out.push("<br>");
          else if (no.nodeType === 3) for (const c of no.textContent) out.push(`<span id="${id}-${n++}" style="visibility:hidden">${c}</span>`);
          else { out.push(`<b class="${no.className}">`); walk(no); out.push("</b>"); }
        }
      };
      walk(tmp);
      el.innerHTML = out.join("");
      for (let i = 0; i < n; i++) tl.set(`#${id}-${i}`, { visibility: "visible" }, t0 + i * LETRA);
      return t0 + n * LETRA;
    };
    // o Carvalho surge em 3 passos de paleta (como no Red/Blue), já com a caixa digitando
    tl.fromTo("#oak", { opacity: 0.25 }, { opacity: 1, duration: 0.3, ease: "steps(3)", immediateRender: false }, 0);
    const fim1 = digitar("cx1", T.cx1, 0); // 4,24 s
    tl.to("#seta1", { opacity: 1, duration: 0.01, repeat: 3, yoyo: true, repeatDelay: 0.18 }, fim1 + 0.05);
    // caixa 2: o Carvalho sai, o Pikachu entra animado
    tl.set("#caixa1", { opacity: 0 }, 5.04);
    tl.set("#caixa2", { opacity: 1 }, 5.04);
    tl.to("#oak", { x: -700, duration: 0.25, ease: "power2.in" }, 5.04);
    tl.fromTo("#pika", { x: 700, opacity: 1 }, { x: 0, opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 5.04);
    for (let k = 0, t = 5.04; t < 7.52; k++, t += 0.1) tl.set("#pika", { attr: { src: `midia/pika/${String(k % 60).padStart(2, "0")}.png` } }, t);
    const fim2 = digitar("cx2", T.cx2, 5.04);
    // a bola cai no pé do Pikachu na palavra FUTSAL
    tl.fromTo("#bola-gb", { y: -900, opacity: 1 }, { y: 0, opacity: 1, duration: 0.24, ease: "power2.in", immediateRender: false }, 6.16);
    tl.to("#bola-gb", { keyframes: { y: [-60, 0, -18, 0] }, duration: 0.35, ease: "none" }, 6.4);

    // ===== bola parada → apito → a música entra e a câmera abre =====
    tl.set("#zoom-bola", { scale: 3.2 }, 7.52);
    tl.to("#zoom-bola", { scale: 3.35, duration: 0.44, ease: "none" }, 7.52);
    tl.to("#zoom-bola", { scale: 1, duration: G0 - 7.96, ease: "power3.in" }, 7.96);
    tl.to("#com-times", { opacity: 1, duration: 0.3 }, 8.1);
    tl.to("#fundo-bola", { opacity: 1, duration: 0.3 }, 8.1);

    // ===== draft =====
    tl.set(["#d1", "#d2", "#d3"], { opacity: 0 }, 0);
    corte("#d1", B(0)); corte("#d2", B(1)); corte("#d3", B(2));
    tl.to(["#d1", "#d3"], { opacity: 0.35, duration: 0.12 }, B(3));
    tl.fromTo("#d2", { scale: 1 }, { scale: 1.1, duration: 0.15, ease: "back.out(3)", immediateRender: false }, B(3));
    flash(B(3), 0.4, 0.2);
    tl.set("#d-cartas", { opacity: 0 }, B(4));
    legenda("escolha", B(0));
    corte("#pk1", B(4), b);
    corte("#pk2", B(5), b);
    flash(B(5), 0.6, 0.2);
    corte("#ic", B(6), 2 * b);
    flash(B(6), 0.7, 0.25);
    legenda("icones", B(6));
    ["#e1", "#e2", "#e3", "#e4"].forEach((s, i) => corte(s, B(8 + i), i === 3 ? b + 0.01 : b));

    // ===== partida =====
    tl.from("#placar", { y: -200, opacity: 0, duration: 0.25, ease: "back.out(2)" }, B(12));
    legenda("futsal", B(12));
    // golpe: anel em quem usa e a faixa do jogo saindo dele
    tl.from("#mira", { scale: 2.4, opacity: 0, duration: 0.2, ease: "power2.out" }, B(16));
    tl.to("#mira", { scale: 0.9, duration: 0.15, yoyo: true, repeat: 3, ease: "sine.inOut" }, B(16) + 0.2);
    tl.from("#golpe", { x: -120, scale: 0.3, opacity: 0, duration: 0.18, ease: "back.out(2)", transformOrigin: "0% 100%" }, B(16) + 0.04);
    tl.from("#golpe .nome", { scale: 1.8, opacity: 0, duration: 0.16, ease: "back.out(2.5)", transformOrigin: "0% 50%" }, B(16) + 0.2);
    tl.to("#golpe", { opacity: 0, duration: 0.1 }, B(16) + 1.0);
    flash(B(16) + 0.27, 0.5, 0.2);
    // defesa: quadro invertido e tremida, sem o clarão de gol
    impacto("#v-defesa", B(20), false);
    // evolução
    legenda("evo", B(24));
    tl.fromTo("#v-evo-zoom", { scale: 1 }, { scale: 1.12, duration: 2 * b, ease: "power1.in", immediateRender: false }, B(24));
    flash(B(28), 1, 0.35);
    // a corrida do Raichu: a câmera fecha devagar na câmera lenta
    tl.fromTo("#v-corrida-l", { scale: 1 }, { scale: 1.12, duration: 4 * b, ease: "power1.in", immediateRender: false }, B(36));
    impacto("#v-gol", B(40));

    // ===== extras =====
    tl.from("#em1", { scale: 0.2, opacity: 0, duration: 0.2, ease: "back.out(2.5)", transformOrigin: "50% 100%" }, B(44));
    tl.set("#em2", { opacity: 1 }, B(45));
    tl.from("#em2", { scale: 0.2, duration: 0.2, ease: "back.out(2.5)", transformOrigin: "50% 100%" }, B(45));
    tl.set(["#em1", "#em2"], { opacity: 0 }, B(46));
    legenda("multi", B(44));
    corte("#lg1", B(46), 2 * b);
    corte("#lg2", B(47), b);
    legenda("copa", B(46));
    corte("#camp", B(48), 2 * b);
    flash(B(48), 0.6, 0.25);
    corte("#vit", B(50), 2 * b + 0.01);
    tl.set("#mvp", { opacity: 1 }, B(51));
    tl.from("#mvp", { x: 300, rotation: 20, duration: 0.2, ease: "back.out(2)" }, B(51));

    // ===== final: o pacote cai, treme, rasga; a carta holo sobe e vira o logo =====
    tl.to("#raios-final", { rotation: 40, duration: 6.742, ease: "none" }, B(52));
    tl.from("#pacote", { y: -1400, rotation: -12, duration: 0.25, ease: "power2.in" }, B(52));
    tl.to("#pacote", { keyframes: { y: [0, 26, 0] }, duration: 0.18, ease: "none" }, B(52) + 0.25);
    for (const n of [54, 55]) tl.to("#pacote", { keyframes: { rotation: [-5, 5, -3, 3, 0] }, duration: 0.25, ease: "none" }, B(n));
    tl.to("#pacote .corpo", { boxShadow: "0 0 160px rgba(255,220,90,0.95), 0 30px 60px rgba(0,0,0,0.6)", duration: 4 * b, ease: "power2.in" }, B(52));
    // B56: rasga
    flash(B(56), 0.9, 0.3);
    tl.to("#lacre-cima", { x: 160, y: -260, rotation: 28, opacity: 0, duration: 0.45, ease: "power2.out" }, B(56));
    tl.to("#leque", { opacity: 1, duration: 0.15 }, B(56));
    tl.to("#leque", { rotation: 25, duration: 8 * b, ease: "none" }, B(56));
    tl.set("#simbolo", { opacity: 1 }, B(56) + 0.1);
    tl.fromTo("#simbolo", { y: 0, scale: 0.6, rotationY: 0 }, { y: -560, scale: 1.25, rotationY: 720, duration: 3 * b + 0.1, ease: "power2.out", immediateRender: false }, B(56) + 0.1);
    tl.to("#pacote", { y: 700, opacity: 0, duration: 0.6, ease: "power2.in" }, B(58));
    // B60: a carta vira o O do logo
    flash(B(60), 1, 0.35);
    tl.set("#simbolo", { opacity: 0 }, B(60));
    tl.set("#logo", { opacity: 1 }, B(60));
    tl.fromTo("#logo", { scale: 0.7 }, { scale: 1, duration: 0.45, ease: "back.out(3)", immediateRender: false }, B(60));
    tl.to("#leque", { opacity: 0.45, y: -140, duration: 0.4 }, B(60));
    // B64: tagline; B68: site, selo e crédito
    tl.set("#tag", { opacity: 1 }, B(64));
    tl.from("#tag", { scale: 1.6, duration: 0.25, ease: "back.out(2)" }, B(64));
    tl.to(["#site", "#selo"], { opacity: 1, duration: 0.2 }, B(68));
    tl.from("#selo", { y: 40, duration: 0.25, ease: "back.out(2)" }, B(68));
    tl.to("#credito", { opacity: 1, duration: 0.3 }, B(68));

    window.__timelines = window.__timelines || {};
    window.__timelines.root = tl;
  </script>
</div>
</body>
</html>
