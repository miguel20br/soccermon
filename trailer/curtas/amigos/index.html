  <script>
    const { T, div, quadra, ator, anim, quadro, bola, estouro, poeira, treme, flash, telaFinal, piscada } = C;
    const tl = gsap.timeline({ paused: true });
    const $ = (id) => document.getElementById(id);

    // ---------- utilidades (tudo com antecipação e assentamento: nada linear) ----------
    const ver = (els, t, on = true) => tl.set(els, { autoAlpha: on ? 1 : 0 }, t);
    const op = (els, t, on = true) => tl.set(els, { opacity: on ? 1 : 0 }, t);
    /** Pulo com agachada antes, esticada no ar e amassada na volta (squash & stretch a partir do pé). */
    const salto = (a, t, h, d = 0.3) => {
      const pre = 0.07;
      tl.to(a.corpo, { keyframes: [{ y: -h, duration: d / 2, ease: 'power2.out' }, { y: 0, duration: d / 2, ease: 'power2.in' }] }, t);
      tl.to(a.corpo, { keyframes: [
        { scaleX: 1.1, scaleY: 0.88, duration: pre, ease: 'power1.out' },
        { scaleX: 0.93, scaleY: 1.1, duration: 0.1, ease: 'power1.out' },
        { scaleX: 1, scaleY: 1, duration: Math.max(0.02, d - 0.15), ease: 'sine.inOut' },
        { scaleX: 1.12, scaleY: 0.88, duration: 0.05, ease: 'power1.in' },
        { scaleX: 1, scaleY: 1, duration: 0.16, ease: 'back.out(2.5)' },
      ] }, t - pre);
    };
    /** Entra com escala (de `s` a 1) passando do ponto e voltando. */
    const pop = (el, t, s = 0.4, d = 0.32) => tl.fromTo(el, { scale: s }, { scale: 1, duration: d, ease: 'back.out(2.2)', immediateRender: false }, t);
    const balao = (pai, txt, x, y, t0, t1) => {

      tl.fromTo(b, { scale: 0.2, rotation: -12 }, { scale: 1, rotation: 0, duration: 0.34, ease: 'back.out(2.6)', immediateRender: false }, t0);
      tl.to(b, { scale: 0, opacity: 0, duration: 0.14, ease: 'power2.in' }, t1 - 0.14);
    };
    const ronco = (pai, t, x, y, n = 2, gap = 0.45) => {
      for (let k = 0; k < n; k++) {
        const z = div(pai, 'zz');
        z.textContent = 'Z';
        tl.set(z, { x, y }, 0);
        tl.fromTo(z, { opacity: 0, scale: 0.4 + 0.3 * (k % 2) }, { opacity: 1, scale: 0.8 + 0.3 * (k % 2), duration: 0.3, ease: 'back.out(2)', immediateRender: false }, t + gap * k);
        tl.to(z, { x: x + 70 + 30 * (k % 2), y: y - 190 - 40 * (k % 2), rotation: k % 2 ? 12 : -10, duration: 1.2, ease: 'sine.out' }, t + gap * k);
        tl.to(z, { opacity: 0, duration: 0.3, ease: 'power1.in' }, t + 0.9 + gap * k);
      }
    };
    /** Pixel art na grade: `linhas` de caracteres, `cores` por caractere ('.' = vazio). */
    const pixelSvg = (linhas, cores, px) => {
      const w = Math.max(...linhas.map((l) => l.length));
      return `<svg class="pixel" width="${w * px}" height="${linhas.length * px}" viewBox="0 0 ${w} ${linhas.length}" shape-rendering="crispEdges">${linhas.flatMap((l, y) => [...l].map((c, x) =>
        c === '.' ? '' : `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${cores[c]}"/>`)).join('')}</svg>`;
    };
    /** Desloca o desenho (ox, oy) pixels na grade. */
    const grade = (linhas, ox, oy) => [...Array(oy).fill(''), ...linhas.map((l) => '.'.repeat(ox) + l)];
    // a mão (pixel, desenhada na grade): a ponta do dedo fica no (45, 0)
    const MAO = ['....XX.......', '...XooX......', '...XooX......', '...XooXXX....', '...XooXooXX..', '.XXXooXooXoX.', 'XooXooooooooX', 'XoooooooooooX',
      '.XooooooooooX', '..XoooooooooX', '..XooooooooX.', '...XoooooooX.', '...XXXXXXXXX.'];
    $('mao').innerHTML = pixelSvg(MAO, { X: '#0e1430', o: '#f8f8f0' }, 10);
    /**
     * A mão entra numa curva (passa do ponto e volta), paira um pouco acima, desce e toca em (x, y) em cada instante de
     * `ts` (aperta, anel branco abrindo e um círculo cheio que some), sobe de novo e sai em curva depois do último.
     */
    const toca = (x, y, ts, { fica = 0.45 } = {}) => {
      ts = [].concat(ts);
      const X = x - 45;
      const H = y - 36;
      const t0 = ts[0] - 0.5;
      op('#mao', t0);
      tl.fromTo('#mao', { x: X + 230, y: y + 380, rotation: 22, scale: 1 }, { x: X, y: H, rotation: 0, duration: 0.38, ease: 'back.out(1.4)', immediateRender: false }, t0);
      for (const t of ts) {

      const dentro = (x, y) => x >= 9 && x <= 38 && y >= TOPO[x] - 1 && y <= 20;

    op('#versao', FIM + 0.2);
    pop('#versao', FIM + 0.2, 0.5);
    piscada(tl, [T(18, 2), T(18, 4), T(18, 6)], '#final-cena');
    tl.set('#tag', { opacity: 1 }, T(18, 6));
    tl.from('#tag', { scale: 1.6, duration: 0.3, ease: 'back.out(2)' }, T(18, 6));
    tl.to(['#site', '#credito'], { opacity: 1, duration: 0.25, ease: 'power1.out' }, T(18, 7));
    tl.to(['#selo'], { opacity: 1, duration: 0.25, ease: 'power1.out' }, T(18, 8));

    // nada parado: a câmera de fora respira (vai e volta 3% por compasso, em curva)
    const nb = 18;
    tl.fromTo('#cena', { scale: 1 }, {
      keyframes: { scale: Array.from({ length: nb }, (_, b) => (b % 2 ? 1 : 1.03)), easeEach: 'sine.inOut' },
      duration: T(18, 0), ease: 'none', transformOrigin: '540px 700px', immediateRender: false,
    }, 0);

    window.__timelines = window.__timelines || {};
    window.__timelines.root = tl;
  </script>
</div>
