  <audio id="a-musica" class="clip" src="midia/som/amigos-14.wav" data-start="0" data-duration="34.2" data-media-start="0" data-fade-out="0.6"></audio>
  <!-- gritos: o Pikachu responde o motivo (C1.11), o Snorlax acorda bravo no silêncio (C4.12), o Pikachu carrega o choque (C6.0) -->
  <audio id="a-pk-ve" class="clip" src="som/25.ogg" data-start="4.068" data-duration="0.93" data-media-start="0" data-volume="0.8"></audio>

  <script>
    const { T, div, quadra, ator, anim, bola, estouro, treme, flash, telaFinal, piscada } = C;
    const tl = gsap.timeline({ paused: true });
    const $ = (id) => document.getElementById(id);

    // ---------- utilidades ----------
    const ver = (els, t, on = true) => tl.set(els, { autoAlpha: on ? 1 : 0 }, t);
    const op = (els, t, on = true) => tl.set(els, { opacity: on ? 1 : 0 }, t);
    const salto = (a, t, h, d = 0.3) => tl.to(a.corpo, { keyframes: { y: [-h, 0] }, duration: d, ease: 'power1.inOut' }, t);
    const pop = (el, t, s = 0.4) => tl.fromTo(el, { scale: s }, { scale: 1, duration: 0.25, ease: 'back.out(2.5)', immediateRender: false }, t);
    const balao = (pai, txt, x, y, t0, t1) => {
      const b = div(pai, 'balao');
      b.textContent = txt;
      tl.set(b, { x, y }, 0);
      op(b, t0);
      pop(b, t0, 0.3);
      op(b, t1, false);
    };
    const ronco = (pai, t, x, y, n = 2, gap = 0.45) => {
      for (let k = 0; k < n; k++) {
        const z = div(pai, 'zz');
        z.textContent = 'Z';
        tl.set(z, { x, y }, 0);
        tl.fromTo(z, { opacity: 0, scale: 0.6 + 0.3 * (k % 2) }, { opacity: 1, duration: 0.2, immediateRender: false }, t + gap * k);
        tl.to(z, { x: x + 70 + 30 * (k % 2), y: y - 190 - 40 * (k % 2), duration: 1.2, ease: 'sine.out' }, t + gap * k);
        tl.to(z, { opacity: 0, duration: 0.3 }, t + 0.9 + gap * k);
      }
    };
    /** Pixel art na grade: `linhas` de caracteres, `cores` por caractere ('.' = vazio). */
    const pixelSvg = (linhas, cores, px) => {
      const w = Math.max(...linhas.map((l) => l.length));
      return `<svg class="pixel" width="${w * px}" height="${linhas.length * px}" viewBox="0 0 ${w} ${linhas.length}" shape-rendering="crispEdges">${linhas.flatMap((l, y) => [...l].map((c, x) =>
        c === '.' ? '' : `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${cores[c]}"/>`)).join('')}</svg>`;
    };
    // a mão (pixel, desenhada na grade): a ponta do dedo fica no (45, 0)
    const MAO = ['....XX.......', '...XooX......', '...XooX......', '...XooXXX....', '...XooXooXX..', '.XXXooXooXoX.', 'XooXooooooooX', 'XoooooooooooX',
      '.XooooooooooX', '..XoooooooooX', '..XooooooooX.', '...XoooooooX.', '...XXXXXXXXX.'];
    $('mao').innerHTML = pixelSvg(MAO, { X: '#0e1430', o: '#f8f8f0' }, 10);
    /** A mão entra, toca em (x, y) da tela em cada instante de `ts` (anel branco a cada toque) e sai depois do último. */
    const toca = (x, y, ts, { fica = 0.45 } = {}) => {
      ts = [].concat(ts);
      op('#mao', ts[0] - 0.45);
      tl.fromTo('#mao', { x: x - 45 + 160, y: y + 300 }, { x: x - 45, y, duration: 0.38, ease: 'power2.out', immediateRender: false }, ts[0] - 0.45);
      for (const t of ts) {
        tl.fromTo('#mao', { scale: 1 }, { keyframes: { scale: [0.82, 1] }, duration: 0.12, ease: 'none', immediateRender: false }, t);
        const r = div($('root'), 'toque');
        tl.set(r, { x, y }, 0);
        tl.fromTo(r, { scale: 0.3, opacity: 1 }, { scale: 1.5, opacity: 0, duration: 0.4, ease: 'power2.out', immediateRender: false }, t);
      }
      tl.to('#mao', { opacity: 0, duration: 0.15 }, ts.at(-1) + fica);
    };
    const aperta = (el, t) => tl.fromTo(el, { scale: 1 }, { keyframes: { scale: [0.9, 1.06, 1] }, duration: 0.2, ease: 'none', immediateRender: false }, t);
    /** O aviso de desafio do jogo. */
    const aviso = (pai) => {
      const a = div(pai, 'aviso');
      a.innerHTML = `<svg width="96" height="112" viewBox="0 0 10 12"><path d="M0 1L5 0L10 1V6C10 9 7 11 5 12C3 11 0 9 0 6Z" fill="#e8423f" stroke="#0e1430" stroke-width="0.8"/><circle cx="5" cy="5.5" r="2.2" fill="#f8f8f0"/><path d="M2.8 5.5h4.4" stroke="#0e1430" stroke-width="0.6"/></svg>`
        + '<div class="txt"><b>Pikachu</b> te chamou pro Duelo<small>Pallet FC · PAL</small></div><div class="entrar">Entrar</div>';
      return a;
    };

    // ----- o Snorlax deitado (Sleep, 40x24, pé na linha 19): olho aberto e o cobertor por cima, na grade da folha -----
    const SLEEP_PE = 0.792 * 24;
    /** Põe a pixel art `svg` no corpo do ator `a` (o Sleep), alinhada ao pixel (0, 0) da folha. */
    const naFolha = (a, svg, z = 3) => {
      const s = a.escala;
      a.corpo.insertAdjacentHTML('beforeend', svg);
      const el = a.corpo.lastElementChild;
      gsap.set(el, { x: -20 * s, y: -SLEEP_PE * s, zIndex: z });
      return el;
    };
    // olho aberto (bravo: sobrancelha caída pra dentro), por cima do olho fechado do pixel (27, 7)
    const OLHO = ['.........................X...', '..........................XX.', '..........................www', '..........................wXX', '..........................wXX'];

    op('#ex-l', 0, false);
    op('#ex-l', T(10, 1));
    pop('#ex-l', T(10, 1), 0.6);
    toca(330, 850, [T(10, 6), T(10, 13)], { fica: 0.3 });
    for (const r of [6, 13]) tl.fromTo('#ex-nome', { color: '#ffcb05' }, { color: '#fff', duration: 0.6, immediateRender: false }, T(10, r));
    op(['#lg1', '#ex-l'], T(11, 0), false);
    // 11 · Adicionar amigo
    op('#lg2', T(11, 0));
    pop('#lg2', T(11, 0), 0.6);
    exc.insertAdjacentHTML('beforeend', `<div class="btn verde" id="ex-add" style="left:60px;top:800px;width:960px;opacity:0"><span id="ex-add-1">${$('add-1').innerHTML}</span><span id="ex-add-2" style="opacity:0">${$('add-2').innerHTML}</span></div>`);
    op('#ex-add', T(11, 1));
    pop('#ex-add', T(11, 1), 0.4);
    toca(540, 900, T(11, 6), { fica: 0.3 });
    aperta('#ex-add', T(11, 6));
    tl.set('#ex-add', { attr: { class: 'btn feito' } }, T(11, 7));
    op('#ex-add-1', T(11, 7), false);
    op('#ex-add-2', T(11, 7));
    op(['#lg2', '#ex-add'], T(12, 0), false);
    // 12 · Desafiar: o convite sobe e vai
    op('#lg3', T(12, 0));
    pop('#lg3', T(12, 0), 0.6);
    exc.insertAdjacentHTML('beforeend', '<div class="btn azul" id="ex-des" style="left:60px;top:800px;width:960px;opacity:0"><span>Desafiar</span></div>');
    op('#ex-des', T(12, 1));
    pop('#ex-des', T(12, 1), 0.4);
    toca(540, 900, T(12, 6), { fica: 0.3 });
    aperta('#ex-des', T(12, 6));
    {
      const conv = aviso(exc);
      tl.set(conv, { x: 0, y: 900 - 125, scale: 0.4, transformOrigin: '50% 50%' }, 0);
      op(conv, T(12, 7));
      tl.to(conv, { y: -400, scale: 0.8, rotation: -6, duration: 0.6, ease: 'power2.in' }, T(12, 7));
    }
    // embaixo, os dois o tempo todo: o Pikachu pulando, o Snorlax dormindo
    const pkE = ator(exc, 25, { escala: 9, z: 5, x: 320, y: 1660, opacity: 0 });
    const snE = ator(exc, '143x', { escala: 12, z: 5, x: 730, y: 1650, opacity: 0 });
    op([pkE.el, snE.el], T(10, 0));
    anim(tl, pkE, 'Idle', 0, T(10, 0), T(13, 0));
    anim(tl, snE, 'Sleep', 0, T(10, 0), T(13, 0), { vel: 0.5 });
    for (const [b, r] of [[10, 0], [10, 8], [11, 0], [11, 8], [12, 0], [12, 3], [12, 8]]) salto(pkE, T(b, r), 70, 0.25);
    ronco(exc, T(10, 4), 880, 1400, 2, 0.6);
    ronco(exc, T(11, 4), 880, 1400, 2, 0.6);
    ronco(exc, T(12, 4), 880, 1400, 2, 0.6);

    // =====================================================================================================
    // 13 · tela final: logo, NOVO NA 0.9.25, soccermon.com
    // =====================================================================================================
    const FIM = T(13, 0);
    telaFinal($('final'));
    const fc = $('final-cena');
    const pkF = ator(fc, 25, { escala: 7, z: 5, x: 330, y: 1460, opacity: 0 });
    const snF = ator(fc, '143x', { escala: 9, z: 5, x: 730, y: 1450, opacity: 0 });
    op([pkF.el, snF.el], FIM);
    anim(tl, pkF, 'Idle', 0, FIM, FIM + 3);
    anim(tl, snF, 'Sleep', 0, FIM, FIM + 3, { vel: 0.5 });
    for (const r of [0, 4, 8]) salto(pkF, T(13, r), 90, 0.36);
    ronco(fc, FIM + 0.4, 880, 1340, 3, 0.6);
    tl.to('#raios-final', { rotation: 30, duration: 3, ease: 'none' }, FIM);
    flash(tl, FIM, 0.6, 0.3);
    tl.set('#logo', { opacity: 1 }, FIM);
    tl.fromTo('#logo', { scale: 0.7 }, { scale: 1, duration: 0.45, ease: 'back.out(3)', immediateRender: false }, FIM);
    op('#versao', FIM + 0.1);
    pop('#versao', FIM + 0.1, 0.5);
    piscada(tl, [T(13, 2), T(13, 4), T(13, 6)], '#final-cena');
    tl.set('#tag', { opacity: 1 }, T(13, 6));
    tl.from('#tag', { scale: 1.6, duration: 0.25, ease: 'back.out(2)' }, T(13, 6));
    tl.to(['#site', '#credito'], { opacity: 1, duration: 0.2 }, T(13, 7));
    tl.to(['#selo'], { opacity: 1, duration: 0.2 }, T(13, 8));

    // nada parado: a câmera de fora respira (vai e volta 3% por compasso)
    const nb = 13;
    tl.fromTo('#cena', { scale: 1 }, {
      keyframes: { scale: Array.from({ length: nb }, (_, b) => (b % 2 ? 1 : 1.03)) },
      duration: T(13, 0), ease: 'none', easeEach: 'none', transformOrigin: '540px 700px', immediateRender: false,
    }, 0);

    window.__timelines = window.__timelines || {};
    window.__timelines.root = tl;
  </script>
</div>
</body>
</html>
