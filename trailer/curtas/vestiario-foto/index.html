  <script>
    const { T, div, ator, anim, quadro, poeira, flash, estouro, telaFinal, piscada } = C;
    const tl = gsap.timeline({ paused: true });
    const $ = (id) => document.getElementById(id);
    const ver = (els, t, on = true) => tl.set(els, { autoAlpha: on ? 1 : 0 }, t);
    const op = (els, t, on = true) => tl.set(els, { opacity: on ? 1 : 0 }, t);
    const salto = (a, t, h, d = 0.3) => tl.to(a.corpo, { keyframes: { y: [-h, 0] }, duration: d, ease: 'power1.inOut' }, t);
    const carimbo = (sel, t, s = 2.2) => {
      tl.set(sel, { opacity: 1 }, t);
      tl.fromTo(sel, { scale: s }, { scale: 1, duration: 0.22, ease: 'back.out(2.2)', immediateRender: false }, t);
    };
    const TITULO = new URLSearchParams(location.search).get('titulo') === 'b' ? '#tituloB' : '#tituloA';
    const CENAS = ['#tituloA', '#tituloB', '#vest', '#closeMk', '#closeSn', '#closePk', '#closeSq', '#closeDt', '#closeJg', '#closeSn2', '#closeSp', '#visor', '#mesa', '#fim'];
    /** Corte seco: só a cena `id` no ar a partir de t. */
    const corta = (id, t) => {
      ver(CENAS, t, false);
      ver(id, t);
    };
    const PRETO = '#0e1430';

    // ====================================================================================================
    // pixel art por cima dos sprites, na escala deles
    // ====================================================================================================
    /** Retângulos [x, y, w, h, cor] num <svg> cuja origem (0, 0) fica no canto do div (px da folha × E). */
    function desenho(pai, rects, E, z = 3) {
      const x0 = Math.min(...rects.map((r) => r[0]));
      const y0 = Math.min(...rects.map((r) => r[1]));
      const x1 = Math.max(...rects.map((r) => r[0] + r[2]));
      const y1 = Math.max(...rects.map((r) => r[1] + r[3]));
      const d = div(pai, 'pix', `z-index:${z}`);
      d.innerHTML = `<svg style="position:absolute;left:${x0 * E}px;top:${y0 * E}px" width="${(x1 - x0) * E}" height="${(y1 - y0) * E}" viewBox="${x0} ${y0} ${x1 - x0} ${y1 - y0}" shape-rendering="crispEdges">`
        + `${rects.map((r) => `<rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" fill="${r[4]}"/>`).join('')}</svg>`;
      return d;
    }
    /** Desenho em texto (uma string por linha; ' ' e '.' = vazio), cores pelo caractere. */
    const arte = (linhas, cores) => linhas.flatMap((l, y) => [...l].map((c, x) => (cores[c] ? [x, y, 1, 1, cores[c]] : null)).filter(Boolean));
    /** Contorno escuro de 1 px em volta (a tinta do PMD) e o desenho por cima. */
    const contorno = (rects) => [...rects.map((r) => [r[0] - 1, r[1] - 1, r[2] + 2, r[3] + 2, PRETO]), ...rects];
    /**
     * Pixel art presa ao quadro do sprite: `rects` em px do quadro (w×h) da animação `nome` (o canto de cima à esquerda
     * do quadro), com contorno. Mora no corpo do ator.
     */
    function pix(a, nome, rects, { z = 3, id = a.id, borda = true } = {}) {
      const A = SPR[id].anims[nome];
      const E = a.escala;
      const d = desenho(a.corpo, borda ? contorno(rects) : rects, E, z);
      gsap.set(d, { x: (-A.w * E) / 2, y: -A.pe * A.h * E });
      return d;
    }
    /**
     * Faz `el` (filho do corpo) seguir o quadro do sprite: `pos(nome, dir, i)` devolve o ponto em px do quadro (ou null,
     * e ele some). Lê as trocas de quadro já agendadas: chamar depois de todas as animações do ator (o segueFaixa do
     * "O atrasado").
     */
    function segue(a, el, pos) {
      const S = SPR[a.id];
      const E = a.escala;
      const mapa = new Map();
      for (const [nome, A] of Object.entries(S.anims)) A.rects.forEach((r, d) => r.forEach(([rx, ry], i) => mapa.set(`${-rx * E}px ${-ry * E}px`, [nome, d, i, A])));
      for (const tw of tl.getTweensOf(a.spr)) {
        const k = mapa.get(tw.vars.backgroundPosition);
        if (!k) continue;
        const p = pos(k[0], k[1], k[2]);
        tl.set(el, p ? { opacity: 1, x: (p[0] - k[3].w / 2) * E, y: (p[1] - k[3].pe * k[3].h) * E } : { opacity: 0 }, tw.startTime());
      }
    }

    // ---------- os óculos escuros do Squirtle ----------
    // A cabeça dele no PMD é a mesma em todo quadro; img/cabeca.js tem o canto de cima à esquerda dela (a 1ª linha opaca)
    // em cada quadro. De frente (Idle/0, canto em 12,3) os olhos ficam nas colunas 11–12 e 18–19, linhas 8–10; de lado
    // (olhando pra direita, Walk/2 e Shoot/2, canto em 15,3) o olho fica nas colunas 20–21. Os óculos são desenhados em
    // relação a esse canto: armação preta (a barra de cima reta, os cantos de baixo redondos), a lente escura com o
    // fundo um tom acima, o brilho branco na diagonal, a ponte e as hastes.
    const ARM = '#07080f';
    const LENTE = '#1c2140';

      div(f, 'fp', `width:${FW}px;height:${FH * 0.62}px;background-image:linear-gradient(90deg, rgb(0 0 0 / 18%) 2px, transparent 2px), linear-gradient(rgb(0 0 0 / 18%) 2px, transparent 2px), linear-gradient(#1c2640, #34446c);background-size:60px 60px,60px 60px,100% 100%`);
      div(f, 'fp', `top:${FH * 0.62}px;width:${FW}px;height:${FH * 0.38}px;background:repeating-conic-gradient(#3a4560 0 25%, #333d56 0 50%) 0 0 / 80px 80px;box-shadow:inset 0 12px 0 rgb(0 0 0 / 30%)`);
      for (const x of [60, 200, 340, 480]) div(f, 'armario', `left:${x}px;top:${FH * 0.08}px;width:110px;height:${FH * 0.52}px;border-width:6px;background-size:54px 90px;background-position:22px 30px`);
      if (porta) {
        div(f, 'fp', `left:630px;top:${FH * 0.08}px;width:170px;height:${FH * 0.54}px;box-sizing:border-box;background:#0b0f1e;border:10px solid #a8743f;border-bottom:none;box-shadow:0 0 0 6px #0e1430`);
        div(f, 'fp', `left:786px;top:${FH * 0.08}px;width:40px;height:${FH * 0.54}px;box-sizing:border-box;background:#7a4a2a;border:6px solid #0e1430;transform:skewY(-14deg);transform-origin:0 0`);
      }
      if (banco) div(f, 'fp', `left:-10px;top:${banco}px;width:${FW + 20}px;height:34px;box-sizing:border-box;background:#c98a4f;border:6px solid #0e1430;border-radius:8px;box-shadow:0 10px 0 #7a4a2a`);
    }
    /** Um Pokémon parado na foto (quadro `i` da animação). */
    const fa = (f, id, x, y, e, z, nome, dir, i) => {
      const a = ator(f, id, { escala: e, z, x, y, sombra: false });
      quadro(tl, a, nome, dir, i, 0);
      return a;
    };
    /** A medalha parada (a do quadro 0 do Idle de frente), `k` vezes maior. */
    const medalhaFoto = (a, k) => {
      const m = medalha(a, 1);
      gsap.set(m.d, { scale: k });
      return m;
    };

    // 3 · FOTO 1: o Magikarp grudado na lente, só a medalha (as barbatanas escapam em volta)
    {
      const p = polaroide('FOTO 1', { rot: -3, dx: -10, dy: 10 });
      fundoFoto(p.f);
      fa(p.f, 129, 450, 860, 24, 5, 'Idle', 0, 0);
      const med = div(p.f, 'medalha', 'z-index:8');
      med.innerHTML = '<div class="fita" style="left:-90px;top:-330px;width:180px;height:240px"></div><div class="disco" style="left:-230px;top:-170px;width:460px;height:460px;border-width:20px"></div>'
        + '<div style="position:absolute;left:-130px;top:-90px;width:56px;height:56px;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)"></div>';
      gsap.set(med, { x: 450, y: 260 });
      cai(p, T(3, 0));
    }
    // 6 · FOTO 2: um Snorlax enorme dormindo e o Magikarp pulando na frente, apitando
    {
      const p = polaroide('FOTO 2', { rot: 4, dx: 12, dy: -6 });
      fundoFoto(p.f);
      fa(p.f, 143, 470, 720, 15, 3, 'Idle', 0, 0);
      const z = div(p.f, 'zz', 'opacity:1;font-size:72px');
      gsap.set(z, { x: 650, y: 40 });
      z.textContent = 'Z';
      const m = fa(p.f, 129, 270, 420, 9, 6, 'Idle', 2, 0);
      medalhaFoto(m, 1);
      pix(m, 'Idle', APITO);
      gsap.set(m.el, { rotation: -12 });
      // os risquinhos do pulo e do som
      for (const [x, y, w] of [[160, 440, 70], [180, 470, 50], [500, 260, 60], [510, 290, 44]]) div(p.f, 'fp', `left:${x}px;top:${y}px;width:${w}px;height:10px;background:#f8f8f0;box-shadow:0 0 0 5px #0e1430;z-index:7`);
      cai(p, T(6, 0));
    }
    // 9 · FOTO 3: o choquinho queimou o filme: o Pikachu tostado na frente de tudo, borda queimada, fumaça
    {
      const p = polaroide('FOTO 3', { rot: -5, dx: -6, dy: 14 });
      fundoFoto(p.f);
      const g = div(p.f, 'fp', `width:${FW}px;height:${FH}px;filter:sepia(1) saturate(1.8) brightness(0.55) contrast(1.6)`);
      fundoFoto(g, { banco: 380 });
      fa(g, 143, 450, 404, 9, 2, 'Idle', 0, 0);
      const m = fa(g, 129, 640, 560, 9, 4, 'Idle', 0, 0);
      medalhaFoto(m, 1);
      fa(g, 25, 320, 690, 16, 6, 'Pose', 0, 1);
      div(p.f, 'queima');
      div(p.pl, 'fp', 'left:auto;right:-8px;top:-8px;width:190px;height:170px;background:#1a0e06;clip-path:polygon(0 0,100% 0,100% 100%,80% 72%,62% 88%,50% 55%,30% 62%,22% 30%,6% 22%);z-index:70');
      const t0 = T(9, 0);
      cai(p, t0);
      [[300, 640], [620, 560], [760, 760], [200, 900]].forEach(([x, y], i) => {
        const f = div(mesa, 'fumaca');
        tl.set(f, { x, y }, 0);
        const t = t0 + 0.15 + 0.22 * i;
        tl.fromTo(f, { opacity: 0.9, scale: 0.5 }, { opacity: 0, scale: 1.8, y: y - 380, x: x + 40, duration: 1.4, ease: 'sine.out', immediateRender: false }, t);
      });
    }
    // 13 · FOTO 4: o Pikachu encharcado (o jato pego no ar) e o Squirtle tranquilo, de óculos no lugar
    {
      const p = polaroide('FOTO 4', { rot: 3, dx: 8, dy: 0 });
      fundoFoto(p.f, { banco: 380 });
      const s = fa(p.f, 143, 450, 404, 9, 2, 'Idle', 0, 0);
      pix(s, 'Idle', [[13, 9, 1, 1, '#f8f8f0']], { borda: false });
      const m = fa(p.f, 129, 600, 570, 9, 5, 'Idle', 0, 0);
      medalhaFoto(m, 1);
      const pq = fa(p.f, 25, 330, 575, 9, 5, 'Hurt', 6, 0);
      pq.spr.style.filter = 'saturate(0.55) brightness(0.85) hue-rotate(-12deg)';
      const q = fa(p.f, 7, 150, 570, 9, 6, 'Idle', 0, 0);
      const oq = desenho(q.corpo, OC_FRENTE, 9);
      const A7 = SPR['7'].anims.Idle;
      gsap.set(oq, { x: (12 - A7.w / 2) * 9, y: (3 - A7.pe * A7.h) * 9 });
      // o jato congelado no ar, da boca do Squirtle até a cabeça do Pikachu, e as gotas
      Array.from({ length: 8 }, (_, i) => {
        const u = i / 7;
        const j = div(p.f, 'jato', 'opacity:1');
        gsap.set(j, { x: 190 + 130 * u - 10, y: 470 - 170 * u + 100 * u * u - 10 });
        return j;
      });
      for (const [x, y] of [[300, 330], [360, 340], [330, 300], [390, 380], [270, 380], [345, 450], [300, 470]]) {
        const g = div(p.f, 'gota', 'opacity:1');
        gsap.set(g, { x, y });
      }
      div(p.f, 'fp', 'left:250px;top:560px;width:170px;height:26px;border-radius:50%;background:#7cc8ff;box-shadow:inset 0 -6px 0 #3a7bd5, 0 0 0 5px #0e1430;z-index:4');
      cai(p, T(13, 0));
    }
    // os óculos parados no Squirtle (`dy` px do quadro: 3 = abaixados; −4 = na testa, o do Ditto)
    const A7 = SPR['7'].anims.Idle;
    const oculosFoto = (a, dy) => gsap.set(desenho(a.corpo, OC_FRENTE, a.escala), { x: (12 - A7.w / 2) * a.escala, y: (3 + dy - A7.pe * A7.h) * a.escala });
    // um "z" parado na foto
    const zFoto = (f, x, y, tam = 48) => {
      const z = div(f, 'zz', `opacity:1;font-size:${tam}px`);
      z.textContent = 'z';
      gsap.set(z, { x, y });
      return z;
    };
    // 16 · FOTO 5: dois Squirtles de perto, lado a lado e na mesma pose; o de verdade de óculos abaixados, o Ditto com a
    //      cara dele e os óculos na testa. Atrás, o Snorlax dormindo e o Magikarp
    {
      const p = polaroide('FOTO 5', { rot: -4, dx: -8, dy: 8 });
      fundoFoto(p.f, { banco: 380 });
      fa(p.f, 143, 450, 404, 9, 2, 'Idle', 0, 0);
      zFoto(p.f, 560, 90);
      const m = fa(p.f, 129, 800, 570, 9, 4, 'Idle', 0, 0);
      medalhaFoto(m, 1);
      oculosFoto(fa(p.f, 7, 290, 585, 16, 6, 'Idle', 0, 0), 3);
      oculosFoto(fa(p.f, '7d', 590, 585, 16, 6, 'Idle', 0, 0), -4);
      cai(p, T(16, 0));
    }
    // 21 · FOTO 6: todo mundo dormindo (tombados, os "z"); o Snorlax de bigode, e o Jigglypuff bravo no banco, inchado e
    //      vermelho, com a caneta na mão
    {
      const p = polaroide('FOTO 6', { rot: 5, dx: 10, dy: -4 });
      fundoFoto(p.f, { banco: 380 });
      const s6 = fa(p.f, 143, 420, 404, 9, 2, 'Idle', 0, 0);
      pix(s6, 'Idle', BIGODE, { borda: false });
      zFoto(p.f, 520, 90);
      const j6 = fa(p.f, 39, 650, 404, 9, 3, 'Idle', 0, 0);
      j6.spr.style.filter = BRAVO;
      gsap.set(j6.corpo, { scale: 1.2 });
      pix(j6, 'Idle', CANETA);
      gsap.set(raiva(j6.corpo, 7), { x: 40, y: -240 });
      const q = fa(p.f, 7, 110, 575, 9, 6, 'Idle', 0, 0);
      oculosFoto(q, 3);
      const d = fa(p.f, '7d', 240, 575, 9, 6, 'Idle', 0, 0);
      oculosFoto(d, -4);
      const pq = fa(p.f, 25, 420, 575, 9, 5, 'Idle', 0, 0);
      pq.spr.style.filter = 'brightness(0.85) saturate(0.85)';
      const m = fa(p.f, 129, 700, 578, 9, 5, 'Idle', 0, 0);
      medalhaFoto(m, 1);
      for (const [a, r] of [[q, -14], [d, 16], [pq, 18], [m, -78]]) gsap.set(a.corpo, { rotation: r });
      for (const [x, y] of [[120, 330], [270, 300], [470, 240], [610, 460]]) zFoto(p.f, x, y, 40);
      cai(p, T(21, 0));
    }
    // 23 · o visor da câmera (o que a lente vê: a foto final ao vivo, na mesma composição): o timer mostra 2 no 1; o
    //      Psyduck chega correndo pela direita até o lugar dele (linha 4) e todo mundo acorda num pulo; no 1 (linha 8) cada
    //      um faz a sua pose: o chifrinho, o Ditto vira "meio Pikachu" num POOF, a medalha estufa. O Snorlax dorme
    {
      const t0 = T(23, 0);
      const tA = T(23, 4);
      const t1 = T(23, 8);
      const v = $('visor');
      const f = $('vq');
      corta('#visor', t0);
      [[70, 670, 'top', 'left'], [920, 670, 'top', 'right'], [70, 1220, 'bottom', 'left'], [920, 1220, 'bottom', 'right']].forEach(([x, y, a, b]) =>
        div(v, 'canto', `left:${x}px;top:${y}px;border-${a}-width:12px;border-${b}-width:12px`));
      for (const t of [t0 + 0.5, T(23, 6), t1 + 0.5, T(23, 14)]) {
        op('#rec', t, false);
        op('#rec', t + 0.25);
      }
      timer(v, 540, 410, '2', t0, t1);
      timer(v, 540, 410, '1', t1, T(24, 0));
      fundoFoto(f, { banco: 362, porta: true });
      const E = 8;
      const BACK = 372;
      const FRENTE = 548;
      const snv = fa(f, 143, 450, BACK + 6, 11, 2, 'Idle', 0, 0);
      pix(snv, 'Idle', BIGODE, { borda: false });
      zFoto(f, 600, 40, 56);
      const jgv = fa(f, 39, 450, BACK + 4, E, 3, 'Idle', 0, 0);
      pix(jgv, 'Idle', CANETA);
      const rv = raiva(jgv.corpo, 6);
      gsap.set(rv, { x: 36, y: -200 });
      tl.set(jgv.spr, { filter: BRAVO }, 0);
      tl.set(jgv.spr, { filter: 'none' }, t1);
      op(rv, t1, false);
      const sqv = fa(f, 7, 100, FRENTE, E, 9, 'Idle', 0, 0);
      oculosFoto(sqv, 3);
      const pkv = fa(f, 25, 182, FRENTE, E, 7, 'Idle', 0, 0);
      const chP = chifre(pkv, 6, 14, '#ffe14d', '#fff6a8');
      const dqv = fa(f, '7d', 290, FRENTE, E, 5, 'Idle', 0, 0);
      oculosFoto(dqv, -4);
      const dtv = fa(f, '25d', 290, FRENTE, E, 5, 'Pose', 0, 1);
      const chD = chifre(dtv, 6, 14, '#af77af', '#dfafd7');
      const mkv = fa(f, 129, 470, FRENTE, E, 10, 'Idle', 0, 0);
      const md = medalhaFoto(mkv, 1);
      const psv = ator(f, 54, { escala: E, z: 10, x: 1000, y: FRENTE, sombra: false });
      op([chP, dtv.el], 0, false);
      // dormindo até a linha 4
      const DORME = [[sqv, -14, 120, 330], [pkv, 18, 200, 300], [dqv, 16, 310, 330], [mkv, -78, 470, 460]];
      DORME.forEach(([a, r, zx, zy], i) => {
        tl.set(a.corpo, { rotation: r }, 0);
        zzz(t0 + 0.15 * i, 0, zx, zy, f, 0.5);
        tl.to(a.corpo, { rotation: 0, duration: 0.15, ease: 'power2.out' }, tA);
        salto(a, tA + 0.15 + 0.04 * i, 40, 0.26);
      });
      // o Psyduck chega correndo
      anim(tl, psv, 'Walk', 6, t0, tA, { vel: 2.4 });
      tl.fromTo(psv.el, { x: 1000 }, { x: 810, duration: tA - t0, ease: 'power2.out', immediateRender: false }, t0);
      quadro(tl, psv, 'Idle', 0, 0, tA);
      // 1: as poses
      quadro(tl, psv, 'Charge', 0, 5, t1);
      quadro(tl, pkv, 'Pose', 0, 1, t1);
      op(chP, t1);
      op(dqv.el, t1, false);
      op(dtv.el, t1);
      estouro(tl, f, 290, FRENTE - 110, t1, { tam: 170, cor: '#dfafd7' });
      tl.to(md.d, { scale: 1.8, duration: 0.25, ease: 'back.out(2.5)' }, t1);
      tl.to(md.m, { y: gsap.getProperty(md.m, 'y') - 11 * E, duration: 0.25, ease: 'back.out(2.5)' }, t1);
      const br = div(mkv.corpo, 'brilho', 'width:44px;height:44px;margin:-22px 0 0 -22px');
      gsap.set(br, { x: -10, y: -36 });
      tl.fromTo(br, { opacity: 1, scale: 0.3, rotation: 0 }, { scale: 1.3, rotation: 90, duration: 0.4, ease: 'sine.out', immediateRender: false }, t1 + 0.1);
      tl.to(br, { opacity: 0, duration: 0.2 }, t1 + 0.45);
      for (const a of [sqv, pkv, mkv, psv]) tl.fromTo(a.corpo, { scaleY: 0.85, scaleX: 1.1 }, { scaleY: 1, scaleX: 1, duration: 0.3, ease: 'elastic.out(1, 0.5)', immediateRender: false }, t1);
    }
    // 14–15 · A FOTO FINAL (clique no 1, o "tan-tan-TAAN"; "awww" e aplauso), 4,5 s. Duas fileiras numa foto 3:2 com
    //         todos na escala 8: atrás, o Snorlax dormindo sentado no banco (bigodinho rabiscado) com o Jigglypuff no colo
    //         segurando a caneta, e o Slowpoke BORRADO entrando pela porta; na frente, o chifrinho em cadeia (o Ditto
    //         meio Pikachu copia a pose do Pikachu e faz chifrinho nele, o Pikachu faz no Squirtle, de óculos abaixados),
    //         o Magikarp no meio estufando a medalha e o Psyduck no canto segurando a cabeça
    {
      const t0 = T(24, 0);
      const p = polaroide('PALLET FC', { rot: -1.5 });
      const f = p.f;
      fundoFoto(f, { banco: 362, porta: true });
      const E = 8;
      const BACK = 372;
      const FRENTE = 548;
      // o Slowpoke borrado na porta (rastro de três cópias apagando)
      [[48, 0.14], [32, 0.24], [16, 0.4]].forEach(([dx, o]) => {
        const r = fa(f, 79, 720 + dx, BACK, E, 1, 'Walk', 6, 1);
        gsap.set(r.el, { opacity: o, filter: 'blur(4px)' });
      });
      const sp = fa(f, 79, 720, BACK, E, 1, 'Walk', 6, 1);
      gsap.set(sp.el, { filter: 'blur(2.5px)' });
      // o Snorlax e o Jigglypuff no colo, com a caneta
      // o Snorlax é o grandão do fundo (escala 11); o Jigglypuff sentado no colo, embaixo da cara dele
      const snf = fa(f, 143, 450, BACK + 6, 11, 2, 'Idle', 0, 0);
      pix(snf, 'Idle', BIGODE, { borda: false });
      const jgf = fa(f, 39, 450, BACK + 4, E, 3, 'Idle', 0, 0);
      pix(jgf, 'Idle', [[18, 14, 2, 6, '#2b2f45'], [18, 12, 2, 2, '#e8423f'], [18, 19, 2, 1, '#c8d0f0']]);
      const z = div(f, 'zz', 'opacity:1;font-size:56px');
      gsap.set(z, { x: 600, y: 40 });
      z.textContent = 'z';
      // a fileira da frente
      const sqf = fa(f, 7, 100, FRENTE, E, 9, 'Idle', 0, 0);
      const oq = desenho(sqf.corpo, OC_FRENTE, E);
      const A7 = SPR['7'].anims.Idle;
      gsap.set(oq, { x: (12 - A7.w / 2) * E, y: (3 + 3 - A7.pe * A7.h) * E });
      const pkf = fa(f, 25, 182, FRENTE, E, 7, 'Pose', 0, 1);
      chifre(pkf, 6, 14, '#ffe14d', '#fff6a8');
      const dtf = fa(f, '25d', 290, FRENTE, E, 5, 'Pose', 0, 1);
      chifre(dtf, 6, 14, '#af77af', '#dfafd7');
      const mkf = fa(f, 129, 470, FRENTE, E, 10, 'Idle', 0, 0);
      // a medalha estufada pra lente: sobe do pescoço pro peito e fica 1,8×
      const mdf = medalhaFoto(mkf, 1.8);
      gsap.set(mdf.m, { y: `-=${11 * E}` });
      const brilho = div(mkf.corpo, 'brilho', 'opacity:1;width:44px;height:44px;margin:-22px 0 0 -22px');
      gsap.set(brilho, { x: -10, y: -36 });
      tl.fromTo(brilho, { scale: 0.3, rotation: 0 }, { keyframes: { scale: [1.3, 0.6, 1.1, 0.8] }, rotation: 90, duration: 2.4, ease: 'sine.inOut', immediateRender: false }, t0 + 0.6);
      fa(f, 54, 810, FRENTE, E, 10, 'Charge', 0, 5);
      cai(p, t0);
      tl.fromTo(p.pl, { scale: 1 }, { scale: 1.05, duration: T(26, 0) - t0 - 0.3, ease: 'sine.inOut', immediateRender: false }, t0 + 0.3);
    }

    // 29 · tela final (2,5 s): o logo com a piscada SOC-CER-MON (linhas 0, 3 e 6), a frase e o soccermon.com
    {
      const t0 = T(29, 0);
      telaFinal($('fim'));
      corta('#fim', t0);
      flash(tl, t0, 0.6, 0.3);
      tl.fromTo('#raios-fim', { rotation: 0 }, { rotation: 25, duration: 2.5, ease: 'none', immediateRender: false }, t0);
      tl.set('#logo', { opacity: 1 }, t0);
      tl.fromTo('#logo', { scale: 0.7 }, { scale: 1, duration: 0.45, ease: 'back.out(3)', immediateRender: false }, t0);
      piscada(tl, [T(29, 0), T(29, 3), T(29, 6)]);
      tl.set('#tag', { opacity: 1 }, T(29, 6));
      tl.fromTo('#tag', { scale: 1.6 }, { scale: 1, duration: 0.25, ease: 'back.out(2)', immediateRender: false }, T(29, 6));
      tl.to(['#site', '#selo', '#credito'], { opacity: 1, duration: 0.2 }, T(29, 6));
    }

    // 0 · o título abre o vídeo
    corta(TITULO, 0);
    flash(tl, 0, 0.5, 0.2);
    tl.set({}, {}, 60.5);

    window.__timelines = window.__timelines || {};
    window.__timelines.root = tl;
  </script>
</div>
