  Trilha provisória scripts/musica/pecas/livre-foto.mjs: 120 BPM, compasso = 2 s, um plano por compasso. Tempos:
  C.T(compasso, linha).

  dorme | 3 FOTO DO TIME! | 4 o Magikarp na frente da lente | 5 foto 1 | 6 o Psyduck segura a cabeça | 7 o Pikachu pula
  no Magikarp e o choquinho acerta a câmera | 8 foto 2 (queimada) | 9 o Squirtle apaga a câmera e encharca o Pikachu |
  10 foto 3 | 11 a pose do Squirtle; o Ditto vê | 12 EU TAMBÉM! (POOF) | 13 a briga | 14 foto 4 | 15 CALMA, GENTE… |
  16 a canção: todo mundo dorme | 17 o bigode no Snorlax | 18 foto 5 | 19 o timer: 3, 2 | 20 NÃO TÁ FALTANDO NINGUÉM,
  NÉ? | 21 todos se olham, NÃO!, 1 | 22–23½ a FOTO FINAL | 23½–27 a tela final, e o Slowpoke chega nela.
  Os óculos e a medalha seguem o quadro do sprite (segue(); a cabeça do Squirtle quadro a quadro vem do gerar.cjs,

  <script>
    const { T, div, ator, anim, quadro, poeira, flash, estouro, telaFinal, piscada } = C;
    const tl = gsap.timeline({ paused: true });
    const $ = (id) => document.getElementById(id);
    const ver = (els, t, on = true) => tl.set(els, { autoAlpha: on ? 1 : 0 }, t);
    const op = (els, t, on = true) => tl.set(els, { opacity: on ? 1 : 0 }, t);
    const salto = (a, t, h, d = 0.3) => tl.to(a.corpo, { keyframes: { y: [-h, 0] }, duration: d, ease: 'power1.inOut' }, t);
    const carimbo = (sel, t, s = 2.2) => {
      tl.set(sel, { opacity: 1 }, t);
      tl.fromTo(sel, { scale: s }, { scale: 1, duration: 0.22, ease: 'back.out(2.2)', immediateRender: false }, t);
    };
    const CENAS = ['#abertura', '#vest', '#mesa', '#fim'];
    /** Corte seco: só a cena `id` no ar a partir de t. */
    const corta = (id, t) => {
      ver(CENAS, t, false);
      ver(id, t);
    };
    const PRETO = '#0e1430';

    // ====================================================================================================
    // pixel art por cima dos sprites, na escala deles
    // ====================================================================================================
    /** Retângulos [x, y, w, h, cor] num <svg> cuja origem (0, 0) fica no canto do div (px da folha × E). */
    function desenho(pai, rects, E, z = 3) {
      const x0 = Math.min(...rects.map((r) => r[0]));
      const y0 = Math.min(...rects.map((r) => r[1]));
      const x1 = Math.max(...rects.map((r) => r[0] + r[2]));
      const y1 = Math.max(...rects.map((r) => r[1] + r[3]));
      const d = div(pai, 'pix', `z-index:${z}`);
      d.innerHTML = `<svg style="position:absolute;left:${x0 * E}px;top:${y0 * E}px" width="${(x1 - x0) * E}" height="${(y1 - y0) * E}" viewBox="${x0} ${y0} ${x1 - x0} ${y1 - y0}" shape-rendering="crispEdges">`
        + `${rects.map((r) => `<rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" fill="${r[4]}"/>`).join('')}</svg>`;
      return d;
    }
    /** Desenho em texto (uma string por linha; ' ' e '.' = vazio), cores pelo caractere. */
    const arte = (linhas, cores) => linhas.flatMap((l, y) => [...l].map((c, x) => (cores[c] ? [x, y, 1, 1, cores[c]] : null)).filter(Boolean));
    /** Contorno escuro de 1 px em volta (a tinta do PMD) e o desenho por cima. */
    const contorno = (rects) => [...rects.map((r) => [r[0] - 1, r[1] - 1, r[2] + 2, r[3] + 2, PRETO]), ...rects];
    /**
     * Pixel art presa ao quadro do sprite: `rects` em px do quadro (w×h) da animação `nome` (o canto de cima à esquerda
     * do quadro), com contorno. Mora no corpo do ator.
     */
    function pix(a, nome, rects, { z = 3, id = a.id, borda = true } = {}) {
      const A = SPR[id].anims[nome];
      const E = a.escala;
      const d = desenho(a.corpo, borda ? contorno(rects) : rects, E, z);
      gsap.set(d, { x: (-A.w * E) / 2, y: -A.pe * A.h * E });
      return d;
    }
    /**
     * Faz `el` (filho do corpo) seguir o quadro do sprite: `pos(nome, dir, i)` devolve o ponto em px do quadro (ou null,
     * e ele some). Lê as trocas de quadro já agendadas: chamar depois de todas as animações do ator.
     */
    function segue(a, el, pos) {
      const S = SPR[a.id];
      const E = a.escala;
      const mapa = new Map();
      for (const [nome, A] of Object.entries(S.anims)) A.rects.forEach((r, d) => r.forEach(([rx, ry], i) => mapa.set(`${-rx * E}px ${-ry * E}px`, [nome, d, i, A])));
      for (const tw of tl.getTweensOf(a.spr)) {
        const k = mapa.get(tw.vars.backgroundPosition);
        if (!k) continue;
        const p = pos(k[0], k[1], k[2]);
        tl.set(el, p ? { opacity: 1, x: (p[0] - k[3].w / 2) * E, y: (p[1] - k[3].pe * k[3].h) * E } : { opacity: 0 }, tw.startTime());
      }
    }

    // ---------- os óculos escuros do Squirtle (seguem a cabeça: img/cabeca.js) ----------
    const ARM = '#07080f';
    const LENTE = '#1c2140';
    const LENTE2 = '#36437a';
    const lente = (x, y, w, h) => [
      [x, y, w, h - 1, ARM], [x + 1, y + h - 1, w - 2, 1, ARM],
      [x + 1, y + 1, w - 2, h - 2, LENTE], [x + 1, y + h - 2, w - 2, 1, LENTE2],
      [x + w - 3, y + 1, 1, 1, '#ffffff'], [x + w - 4, y + 2, 1, 1, '#ffffff'],
    ];
    const OC_FRENTE = [...lente(-3, 4, 6, 5), ...lente(4, 4, 6, 5), [3, 5, 1, 1, ARM], [-4, 5, 1, 1, ARM], [10, 5, 1, 1, ARM]];
    const OC_LADO = [[-2, 5, 6, 1, ARM], ...lente(4, 4, 5, 5)];
    /** Os óculos no Squirtle `a`: seguem a cabeça (de frente ou olhando pra direita); `baixa` é o div que desce. */

      const fr = desenho(baixa, OC_FRENTE, E);

      const cab = (vista) => (nome, d, i) => (d === vista && CABECA[`${nome}/${d}`] ? CABECA[`${nome}/${d}`][i] : null);
      return { baixa, prende: () => (segue(a, fr, cab(0)), segue(a, la, cab(2))) };

    // ---------- a medalha do Magikarp ----------
    /** A medalha no pescoço do Idle (o segueMedalha do EP 3); `k` aumenta. O `.d` de dentro é o que estufa. */
    const PESCOCO = { 0: [16, 24, 0], 2: [24.5, 20.5, 1], 6: [9.5, 19.5, 0] };
    function medalha(a, k = 1) {

      return { m, d, prende: () => segue(a, m, (nome, dir, i) => (nome === 'Idle' && PESCOCO[dir] ? [PESCOCO[dir][0] + (i % 2) * PESCOCO[dir][2], PESCOCO[dir][1] + (i % 2)] : null)) };
    }
    // o chifrinho: a mão em V (dedos pra cima) com a ponta do braço em (x, y) do quadro do Pose
    const chifre = (a, x, y, cor, claro) => pix(a, 'Pose', [
      [x - 4, y - 9, 2, 3, cor], [x - 3, y - 6, 2, 3, cor], [x - 2, y - 3, 2, 2, cor],

    const RAIO = '<svg viewBox="0 0 14 22" width="70" height="110"><path d="M8 1 L2 12 L7 12 L5 21 L12 8 L7 8 L10 1 Z" fill="#ffe14d" stroke="#0e1430" stroke-width="1.4" stroke-linejoin="round"/></svg>';

    // ====================================================================================================

    /** Texto solto com a base em (sx, sy) da TELA, centrado em sx (sem sair da tela); entra com um pop curto. */

    const sn = ator(cam, 143, { escala: 11, z: 10, x: 540, y: BANCO + 6, sombra: false });

      tl.fromTo(dq.el, { x: 380 }, { x: 720, duration: 0.45, ease: 'none', immediateRender: false }, t2 + 0.08);
      salto(dq, t2 + 0.08, 230, 0.45);
      poeira(tl, cam, 720, CHAO, t2 + 0.53, { n: 6, r: 100, tam: 36 });
      tl.fromTo(jg.el, { x: 800, y: BANCO }, { x: 540, y: BANCO + 70, duration: 0.4, ease: 'none', immediateRender: false }, t2 + 0.1);
      salto(jg, t2 + 0.1, 140, 0.4);
      anim(tl, jg, 'Idle', 0, t2, FIM, { vel: 0.6 });
    }
    // 20 · punch-in no capitão, já no lugar da foto: NÃO TÁ FALTANDO NINGUÉM, NÉ?
    {
      const t0 = T(20, 0);
      const P = plano(t0, [540, 1320]);
      const [x, y] = P(540, CHAO - 290);
      fala(VEST, 'NÃO TÁ FALTANDO<br>NINGUÉM, NÉ?', t0 + 0.05, T(21, 0), x, y, 96);
      tl.to(mk.corpo, { keyframes: { scaleY: [1.08, 1], scaleX: [0.95, 1] }, duration: 0.3, ease: 'power1.out' }, t0 + 0.05);
    }
    // 21 · todos se olham (linhas 1, 3 e 5, um pra cada lado), e juntos: NÃO! (8). O bip do 1 (12) e as poses: o
    //      chifrinho do Pikachu no Squirtle, a medalha estufa
    {
      const t0 = T(21, 0);
      const tN = T(21, 8);
      const t1 = T(21, 12);
      plano(t0);
      const OLHA = [
        // [ator, folha com os óculos (vira o corpo inteiro) ou não, começa olhando pra direita]
        [sq, true, true], [pk, false, false], [mk, false, true], [dq, true, false], [jg, false, true], [ps2, false, false],
      ];
      OLHA.forEach(([a, vira, dir0]) => {
        [1, 3, 5].forEach((l, k) => {
          const direita = (k % 2 === 0) === dir0;
          const t = T(21, l);
          if (vira) {
            quadro(tl, a, 'Idle', 2, 0, t);
            tl.set(a.el, { scaleX: direita ? 1 : -1 }, t);
          } else quadro(tl, a, 'Idle', direita ? 2 : 6, 0, t);
        });
        anim(tl, a, 'Idle', 0, tN, FIM, { vel: 0.6 });
        if (vira) tl.set(a.el, { scaleX: 1 }, tN);
        salto(a, tN, 50, 0.26);
      });
      fala(VEST, 'NÃO!', tN, T(22, 0), 540, 1010, 170);
      timer(540, 640, '1', t1, T(22, 0));
      tl.set(luz, { backgroundColor: '#58c26b' }, t1);
      quadro(tl, pk, 'Pose', 0, 1, t1);
      const chV = chifre(pk, 6, 14, '#ffe14d', '#fff6a8');
      gsap.set(chV, { y: `-=${6 * pk.escala}` });
      tl.set(sq.el, { zIndex: 26 }, t1);
      op(chV, 0, false);
      op(chV, t1);
      tl.to(medV.d, { scale: 1.8, duration: 0.25, ease: 'back.out(2.5)' }, t1);
      for (const a of [sq, pk, mk, dq]) tl.fromTo(a.corpo, { scaleY: 0.85, scaleX: 1.1 }, { scaleY: 1, scaleX: 1, duration: 0.3, ease: 'elastic.out(1, 0.5)', immediateRender: false }, t1);
    }
    // os óculos e a medalha seguem o quadro (depois de todas as animações)
    ocV.prende();
    ocD.prende();
    medV.prende();

    // ====================================================================================================
    // as fotos: cada clique (no 1 do compasso) é um flash e uma polaroide HORIZONTAL que cai na pilha da mesa
    // ====================================================================================================
    const mesa = $('mesa');
    const PW = 980;
    const FW = 900;
    const FH = 600;
    const MG = 40;
    function polaroide(legenda, { rot, dx = 0, dy = 0 }) {
      const pl = div(mesa, 'polaroide', `left:${(1080 - PW) / 2 + dx}px;top:${470 + dy}px;width:${PW}px;height:${FH + MG + 150}px`);
      const f = div(pl, 'foto', `left:${MG}px;top:${MG}px;width:${FW}px;height:${FH}px`);
      const l = div(pl, 'leg', `top:${MG + FH + 36}px;font-size:72px`);
      l.textContent = legenda;
      gsap.set(pl, { rotation: rot, transformOrigin: '50% 50%' });
      return { pl, f, rot };
    }
    /** O clique: corte pra mesa, flash, a foto entra grande e girada e assenta na pilha. */
    function cai(p, t) {
      corta('#mesa', t);
      flash(tl, t, 0.95, 0.35);
      op(p.pl, 0, false);
      op(p.pl, t);
      tl.fromTo(p.pl, { scale: 1.35, rotation: p.rot - 9, y: -60 }, { scale: 1, rotation: p.rot, y: 0, duration: 0.25, ease: 'back.out(1.6)', immediateRender: false }, t + 0.05);
    }
    /** O mini-vestiário dentro da foto: parede, armários, piso e (opcional) o banco e a porta. */
    function fundoFoto(f, { banco = 0, porta = false } = {}) {
      div(f, 'fp', `width:${FW}px;height:${FH * 0.62}px;background-image:linear-gradient(90deg, rgb(0 0 0 / 18%) 2px, transparent 2px), linear-gradient(rgb(0 0 0 / 18%) 2px, transparent 2px), linear-gradient(#1c2640, #34446c);background-size:60px 60px,60px 60px,100% 100%`);
      div(f, 'fp', `top:${FH * 0.62}px;width:${FW}px;height:${FH * 0.38}px;background:repeating-conic-gradient(#3a4560 0 25%, #333d56 0 50%) 0 0 / 80px 80px;box-shadow:inset 0 12px 0 rgb(0 0 0 / 30%)`);
      for (const x of [60, 200, 340, 480]) div(f, 'armario', `left:${x}px;top:${FH * 0.08}px;width:110px;height:${FH * 0.52}px;border-width:6px;background-size:54px 90px;background-position:22px 30px`);
      if (porta) {
        div(f, 'fp', `left:630px;top:${FH * 0.08}px;width:170px;height:${FH * 0.54}px;box-sizing:border-box;background:#0b0f1e;border:10px solid #a8743f;border-bottom:none;box-shadow:0 0 0 6px #0e1430`);
        div(f, 'fp', `left:786px;top:${FH * 0.08}px;width:40px;height:${FH * 0.54}px;box-sizing:border-box;background:#7a4a2a;border:6px solid #0e1430;transform:skewY(-14deg);transform-origin:0 0`);
      }
      if (banco) div(f, 'fp', `left:-10px;top:${banco}px;width:${FW + 20}px;height:34px;box-sizing:border-box;background:#c98a4f;border:6px solid #0e1430;border-radius:8px;box-shadow:0 10px 0 #7a4a2a`);
    }
    /** Um Pokémon parado na foto (quadro `i` da animação). */
    const fa = (f, id, x, y, e, z, nome, dir, i) => {
      const a = ator(f, id, { escala: e, z, x, y, sombra: false });
      quadro(tl, a, nome, dir, i, 0);
      return a;
    };
    /** A medalha parada (a do quadro 0 do Idle de frente), `k` vezes maior. */
    const medalhaFoto = (a, k) => {
      const m = medalha(a, 1);
      gsap.set(m.d, { scale: k });
      return m;
    };
    // os óculos parados no Squirtle (`dy` px do quadro: 3 = abaixados), de frente ou de lado (Idle 2, quadro 0)
    const A7 = SPR['7'].anims.Idle;
    const oculosFoto = (a, dy = 3) => gsap.set(desenho(a.corpo, OC_FRENTE, a.escala), { x: (12 - A7.w / 2) * a.escala, y: (3 + dy - A7.pe * A7.h) * a.escala });
    const oculosLado = (a, dy = 3) => gsap.set(desenho(a.corpo, OC_LADO, a.escala), { x: (15 - A7.w / 2) * a.escala, y: (3 + dy - A7.pe * A7.h) * a.escala });
    // um "z" parado na foto
    const zFoto = (f, x, y, tam = 48) => {
      const z = div(f, 'zz', `opacity:1;font-size:${tam}px`);
      z.textContent = 'z';
      gsap.set(z, { x, y });
      return z;
    };
    const gotas = (f, pts) => pts.forEach(([x, y]) => gsap.set(div(f, 'gota', 'opacity:1'), { x, y }));

    // 5 · FOTO 1: o Magikarp grudado na lente, só a medalha (as barbatanas escapam em volta)
    {
      const p = polaroide('FOTO 1', { rot: -3, dx: -10, dy: 10 });
      fundoFoto(p.f);
      fa(p.f, 129, 450, 860, 24, 5, 'Idle', 0, 0);
      const med = div(p.f, 'medalha', 'z-index:8');
      med.innerHTML = '<div class="fita" style="left:-90px;top:-330px;width:180px;height:240px"></div><div class="disco" style="left:-230px;top:-170px;width:460px;height:460px;border-width:20px"></div>'
        + '<div style="position:absolute;left:-130px;top:-90px;width:56px;height:56px;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)"></div>';
      gsap.set(med, { x: 450, y: 260 });
      cai(p, T(5, 0));
    }
    // 8 · FOTO 2: o choquinho queimou o filme: o Pikachu em cima do Magikarp, tostados, borda queimada, fumaça
    {
      const p = polaroide('FOTO 2', { rot: 4, dx: 12, dy: -6 });
      fundoFoto(p.f);
      const g = div(p.f, 'fp', `width:${FW}px;height:${FH}px;filter:sepia(1) saturate(1.8) brightness(0.55) contrast(1.6)`);
      fundoFoto(g, { banco: 380 });
      fa(g, 143, 250, 404, 9, 2, 'Idle', 0, 0);
      const m = fa(g, 129, 480, 640, 12, 4, 'Idle', 0, 0);
      medalhaFoto(m, 1);
      fa(g, 25, 480, 345, 12, 6, 'Pose', 0, 1);
      for (const [x, y, r] of [[300, 120, -20], [660, 110, 18], [300, 330, -30], [660, 340, 26]]) {
        const z = div(g, 'raio', 'opacity:1');
        z.innerHTML = RAIO;
        gsap.set(z, { x, y, rotation: r });
      }
      div(p.f, 'queima');
      div(p.pl, 'fp', 'left:auto;right:-8px;top:-8px;width:190px;height:170px;background:#1a0e06;clip-path:polygon(0 0,100% 0,100% 100%,80% 72%,62% 88%,50% 55%,30% 62%,22% 30%,6% 22%);z-index:70');
      const t0 = T(8, 0);
      cai(p, t0);
      [[300, 640], [620, 560], [760, 760], [200, 900]].forEach(([x, y], i) => {
        const f = div(mesa, 'fumaca');
        tl.set(f, { x, y }, 0);
        const t = t0 + 0.15 + 0.22 * i;
        tl.fromTo(f, { opacity: 0.9, scale: 0.5 }, { opacity: 0, scale: 1.8, y: y - 380, x: x + 40, duration: 1.4, ease: 'sine.out', immediateRender: false }, t);
      });
    }
    // 10 · FOTO 3: o Pikachu encharcado em cima do Magikarp (a água escorrendo) e o Squirtle tranquilo, abaixando os óculos
    {
      const p = polaroide('FOTO 3', { rot: -4, dx: -6, dy: 14 });
      fundoFoto(p.f, { banco: 380 });
      fa(p.f, 143, 330, 404, 9, 2, 'Idle', 0, 0);
      zFoto(p.f, 420, 90);
      const m = fa(p.f, 129, 640, 575, 10, 5, 'Idle', 0, 0);
      medalhaFoto(m, 1);
      const pq = fa(p.f, 25, 640, 345, 10, 6, 'Hurt', 0, 0);
      pq.spr.style.filter = MOLHADO;
      gotas(p.f, [[560, 150], [720, 140], [600, 110], [700, 230], [570, 260], [610, 380], [690, 420], [650, 470]]);
      div(p.f, 'fp', 'left:560px;top:560px;width:180px;height:26px;border-radius:50%;background:#7cc8ff;box-shadow:inset 0 -6px 0 #3a7bd5, 0 0 0 5px #0e1430;z-index:4');
      const q = fa(p.f, 7, 200, 575, 12, 6, 'Idle', 0, 0);
      oculosFoto(q, 2);
      cai(p, T(10, 0));
    }
    // 14 · FOTO 4: dois Squirtles IGUAIS cara a cara, bravos, de óculos abaixados; o Pikachu molhado e o Magikarp pulando
    //      pra briga, poeira; atrás, o Snorlax dormindo
    {
      const p = polaroide('FOTO 4', { rot: 3, dx: 8, dy: 0 });
      fundoFoto(p.f, { banco: 380 });
      fa(p.f, 143, 450, 404, 9, 2, 'Idle', 0, 0);
      zFoto(p.f, 560, 90);
      const pq = fa(p.f, 25, 700, 470, 9, 3, 'Hurt', 6, 1);
      pq.spr.style.filter = MOLHADO;
      gsap.set(pq.el, { rotation: -10 });
      const m = fa(p.f, 129, 790, 520, 9, 3, 'Idle', 6, 0);
      gsap.set(m.el, { rotation: 14 });
      for (const [x, y, d] of [[300, 585, 110], [440, 595, 130], [580, 585, 110]]) div(p.f, 'nuvem', `opacity:1;z-index:4;width:${d}px;height:${d * 0.55}px;left:${x - d / 2}px;top:${y - d * 0.3}px`);
      const a = fa(p.f, 7, 330, 580, 13, 6, 'Idle', 2, 0);
      oculosLado(a);
      const b = fa(p.f, 7, 550, 580, 13, 6, 'Idle', 2, 0);
      oculosLado(b);
      gsap.set(b.el, { scaleX: -1 });
      gsap.set(raiva(a.corpo, 6), { x: -60, y: -300 });
      gsap.set(raiva(b.corpo, 6), { x: -60, y: -300 });
      cai(p, T(14, 0));
    }
    // 18 · FOTO 5: todo mundo dormindo (tombados, os "z"); o Snorlax de bigode, e o Jigglypuff bravo no banco, inchado e
    //      vermelho, com a caneta na mão
    {
      const p = polaroide('FOTO 5', { rot: 5, dx: 10, dy: -4 });
      fundoFoto(p.f, { banco: 380 });
      const s6 = fa(p.f, 143, 450, 404, 9, 2, 'Idle', 0, 0);
      pix(s6, 'Idle', BIGODE, { borda: false });
      zFoto(p.f, 550, 90);
      const j6 = fa(p.f, 39, 680, 404, 9, 3, 'Idle', 0, 0);
      j6.spr.style.filter = BRAVO;
      gsap.set(j6.corpo, { scale: 1.2 });
      pix(j6, 'Idle', CANETA);
      gsap.set(raiva(j6.corpo, 7), { x: 40, y: -240 });
      const q = fa(p.f, 7, 170, 575, 9, 6, 'Idle', 2, 0);
      oculosLado(q);
      const d = fa(p.f, 7, 310, 575, 9, 6, 'Idle', 2, 0);
      oculosLado(d);
      gsap.set(d.el, { scaleX: -1 });
      const pq = fa(p.f, 25, 410, 575, 9, 5, 'Idle', 0, 0);
      pq.spr.style.filter = MOLHADO;
      const m = fa(p.f, 129, 520, 578, 9, 5, 'Idle', 0, 0);
      medalhaFoto(m, 1);
      for (const [a, r] of [[q, -14], [d, 16], [pq, 18], [m, 78]]) gsap.set(a.corpo, { rotation: r });
      for (const [x, y] of [[150, 330], [300, 300], [420, 240], [560, 460]]) zFoto(p.f, x, y, 40);
      cai(p, T(18, 0));
    }
    // 22–23½ · A FOTO FINAL (3 s; clique no 1, o "tan-tan-TAAN", "awww" e aplauso): uma foto de time de verdade, simétrica,
    //         numa foto 3:2, todos na escala 8 menos o Snorlax (11, o grandão do meio). Atrás, no banco: o Snorlax no
    //         centro dormindo (bigodinho rabiscado) com o Jigglypuff no colo, de caneta na mão; o Psyduck em pé no banco à
    //         esquerda, segurando a cabeça; à direita, a porta, com o Slowpoke BORRADO entrando. Na frente, agachados: o
    //         Magikarp NO CENTRO com a medalha estufada; à esquerda o Squirtle de óculos abaixados e o Pikachu fazendo
    //         chifrinho nele; à direita, colado no capitão, o Ditto (um Squirtle idêntico)
    {
      const t0 = T(22, 0);
      const p = polaroide('PALLET FC', { rot: -1.5 });
      const f = p.f;
      fundoFoto(f, { banco: 362, porta: true });
      const E = 8;
      const BACK = 372;
      const FRENTE = 572;
      [[48, 0.14], [32, 0.24], [16, 0.4]].forEach(([dx, o]) => {
        const r = fa(f, 79, 720 + dx, BACK, E, 1, 'Walk', 6, 1);
        gsap.set(r.el, { opacity: o, filter: 'blur(4px)' });
      });
      const sp = fa(f, 79, 720, BACK, E, 1, 'Walk', 6, 1);
      gsap.set(sp.el, { filter: 'blur(2.5px)' });
      fa(f, 54, 220, BACK, E, 3, 'Charge', 0, 5);
      const snf = fa(f, 143, 450, BACK + 6, 11, 2, 'Idle', 0, 0);
      pix(snf, 'Idle', BIGODE, { borda: false });
      const jgf = fa(f, 39, 450, BACK + 4, E, 3, 'Idle', 0, 0);
      pix(jgf, 'Idle', CANETA);
      zFoto(f, 600, 40, 56);
      oculosFoto(fa(f, 7, 200, FRENTE, E, 9, 'Idle', 0, 0));
      const pkf = fa(f, 25, 282, FRENTE, E, 7, 'Pose', 0, 1);
      chifre(pkf, 6, 14, '#ffe14d', '#fff6a8');
      const mkf = fa(f, 129, 450, FRENTE, E, 10, 'Idle', 0, 0);
      const mdf = medalhaFoto(mkf, 1.8);
      gsap.set(mdf.m, { y: `-=${11 * E}` });
      const brilho = div(mkf.corpo, 'brilho', 'opacity:1;width:44px;height:44px;margin:-22px 0 0 -22px');
      gsap.set(brilho, { x: -10, y: -36 });
      tl.fromTo(brilho, { scale: 0.3, rotation: 0 }, { keyframes: { scale: [1.3, 0.6, 1.1, 0.8] }, rotation: 90, duration: 2.4, ease: 'sine.inOut', immediateRender: false }, t0 + 0.4);
      oculosFoto(fa(f, 7, 612, FRENTE, E, 8, 'Idle', 0, 0));
      cai(p, t0);
      tl.fromTo(p.pl, { scale: 1 }, { scale: 1.04, duration: T(23, 8) - t0 - 0.3, ease: 'sine.inOut', immediateRender: false }, t0 + 0.3);
    }

    // 23½–27 · A TELA FINAL é a última coisa, e a tag acontece nela: o logo com a piscada SOC-CER-MON (linhas 8, 11 e 14
    //          do 23), "Temos que chutar!", soccermon.com, o selo e "Música original: Soccermon". Com ela no ar, o
    //          Slowpoke entra DEVAGAR pela direita (24, linha 8), para no meio, embaixo do site (25, linha 8), silêncio e
    //          o grilo; inclina a cabeça (25, 13) e: …JÁ TIRARAM? (26, linha 2). A plateia explode e o vídeo acaba aí
    {
      const t0 = T(23, 8);
      const fim = $('fim');
      telaFinal(fim);
      corta('#fim', t0);
      flash(tl, t0, 0.6, 0.3);
      tl.fromTo('#raios-fim', { rotation: 0 }, { rotation: 40, duration: 54 - t0, ease: 'none', immediateRender: false }, t0);
      tl.set('#logo', { opacity: 1 }, t0);
      tl.fromTo('#logo', { scale: 0.7 }, { scale: 1, duration: 0.45, ease: 'back.out(3)', immediateRender: false }, t0);
      piscada(tl, [T(23, 8), T(23, 11), T(23, 14)]);
      tl.set('#tag', { opacity: 1 }, T(23, 14));
      tl.fromTo('#tag', { scale: 1.6 }, { scale: 1, duration: 0.25, ease: 'back.out(2)', immediateRender: false }, T(23, 14));
      tl.to(['#site', '#selo', '#credito'], { opacity: 1, duration: 0.2 }, T(23, 14));
      const sp = ator($('fim-cena'), 79, { escala: 12, z: 30, x: 1250, y: 1470, sombra: true });
      const tE = T(24, 8);
      const tP = T(25, 8);
      anim(tl, sp, 'Walk', 6, tE, tP, { vel: 0.45 });
      tl.fromTo(sp.el, { x: 1250 }, { x: 540, duration: tP - tE, ease: 'none', immediateRender: false }, tE);
      anim(tl, sp, 'Idle', 0, tP, 54, { vel: 0.35 });
      tl.to(sp.corpo, { keyframes: { rotation: [0, -7, -7] }, duration: 0.5, ease: 'sine.inOut' }, T(25, 13));
      fala(fim, '…JÁ<br>TIRARAM?', T(26, 2), 54, 540, 1160);
    }

    // 0 · a abertura abre o vídeo
    corta('#abertura', 0);
    tl.set({}, {}, 54);

    window.__timelines = window.__timelines || {};
    window.__timelines.root = tl;
  </script>
</div>
