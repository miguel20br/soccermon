<!doctype html>
<!--
  Cartelas do trailer do Time Ultimate (rascunho). Abre em 360x640 a 3x (= 1080x1920) e cada combinação da URL vira
  um PNG (montar.sh): ?c=legenda&t=<texto> (só o texto, fundo transparente), ?c=metais&n=1..3, ?c=edicoes&n=1..4,
  ?c=clube, ?c=final&n=1..3. &m=<pasta da mídia> (file://) com as cartas e o clube.png do capturar.mjs.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: G11; src: url("../../../public/fonts/Galmuri11-Bold.woff2") format("woff2"); }
:root { --ink: #070a18; --yellow: #ffd23f; }
* { margin: 0; box-sizing: border-box; }
html, body { width: 360px; height: 640px; overflow: hidden; background: transparent; }
body { font-family: G11, monospace; color: #fff; }
.bg {
  position: absolute; inset: 0;
  background:
    repeating-conic-gradient(from 0deg at 50% 46%, rgba(255,255,255,.05) 0 7.5deg, transparent 7.5deg 15deg),
    radial-gradient(circle at 50% 46%, #2a3a7a 0%, #070a18 72%);
}
/* legenda: 2 a 5 palavras, caixa alta, centrada em x 180 (540 no vídeo), fora dos 15% de baixo */
.leg {
  position: absolute; left: 0; right: 0; top: 92px; text-align: center; padding: 0 28px;
  font-size: 25px; line-height: 1.2; text-wrap: balance; letter-spacing: .5px; text-transform: uppercase;
  text-shadow: 0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink);
}
.leg b { color: var(--yellow); font-weight: inherit; }
.row { position: absolute; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 4px; }
.row img { width: 112px; filter: drop-shadow(0 4px 0 rgba(0,0,0,.55)); }
.grid { position: absolute; left: 50%; top: 168px; width: 260px; margin-left: -130px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid img { width: 124px; filter: drop-shadow(0 4px 0 rgba(0,0,0,.55)); }
.off { visibility: hidden; }
.tela { position: absolute; left: 50%; top: 150px; width: 204px; margin-left: -102px; border: 3px solid var(--ink); border-radius: 10px; overflow: hidden; box-shadow: 0 5px 0 rgba(0,0,0,.6); }
.tela img { display: block; width: 100%; }
.logo { position: absolute; left: 50%; top: 210px; width: 300px; margin-left: -150px; }
.modo { position: absolute; left: 0; right: 0; top: 306px; text-align: center; font-size: 30px; color: var(--yellow); }
.data { position: absolute; left: 0; right: 0; top: 352px; text-align: center; font-size: 46px; }
.url { position: absolute; left: 0; right: 0; top: 432px; text-align: center; font-size: 17px; color: #c9d3ff; }
.modo, .data, .url { text-shadow: 0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink); }
</style>
</head>
<body>
<script>
const q = new URLSearchParams(location.search);
const c = q.get('c');
const n = Number(q.get('n') || 99);
const m = q.get('m') || '.';
const img = (f, i) => `<img src="${m}/${f}" class="${i > n ? 'off' : ''}">`;
const leg = (t) => `<div class="leg">${t}</div>`;
let h = '';
if (c === 'legenda') h = leg(q.get('t')).replace('top: 92px', '').replace('<div class="leg"', `<div class="leg" style="top:${q.get('y') || 92}px"`);
if (c === 'metais')
  h = `<div class="bg"></div>${leg('Bronze, prata e <b>ouro</b>')}<div class="row" style="top:230px">${['bronze', 'prata', 'ouro'].map((x, i) => img(`carta-${x}.png`, i + 1)).join('')}</div>`;
if (c === 'edicoes')
  h = `<div class="bg"></div>${leg('Edições <b>especiais</b>')}<div class="grid">${['icone', 'destaque', 'evento', 'shiny'].map((x, i) => img(`carta-${x}.png`, i + 1)).join('')}</div>`;
if (c === 'clube') h = `<div class="bg"></div>${leg('Monte seu <b>time</b>')}<div class="tela"><img src="${m}/clube.png"></div>`;
if (c === 'final')
  h = `<div class="bg"></div><img class="logo" src="../../../public/assets/ui/logo.svg">` +
    (n >= 2 ? '<div class="modo">TIME ULTIMATE</div><div class="data">27/11</div>' : '') +
    (n >= 3 ? '<div class="url">soccermon.com</div>' : '');
document.body.innerHTML = h;
</script>
</body>
</html>
