  4/4, compasso = 2,4 s, 28 compassos (67,2 s) + 0,6 s de rabo. Roteiro em compassos:
  0 roleta | 1 EP 3 | 2 vestiário (ninguém olha o Ditto) | 3 apito: Snorlax pequenininho | 4 gol no meio das pernas |
  5 derrete numa poça | 6 noite: o Magikarp pendura a faixa, desce pro júri | 7 TENTATIVA 1 | 8 Snorlax roxo afunda
  no palco | 9 júri 2·1·3 | 10 TENTATIVA 2 | 11 panqueca | 12 júri 1·1·1 | 13 TENTATIVA 3 | 14 Onix roxo escorre até
  virar poça | 15 júri sem placa (PLOF) | 16 TENTATIVA 4 | 17 Snorlax perfeito | 18 a cara do Ditto volta | 19 júri
  10·10·10 | 20 ÚLTIMO MINUTO | 21 apito: vira o Snorlax com a cara dele, a torcida ri | 22 o Mewtwo e a bola |
  23–24 o chute em câmera lenta e a barriga de gelatina segurando | 25 DITTO! | 26 o banco | 27 fim (EP 4?).
  Regras: uma coisa por vez; quem anda, anda com a animação; a sombra acompanha o pulo; troca de lugar só debaixo de
  transição (cortina, pano ou o pano de chão do júri); nada parado (a câmera e o Idle sempre mexendo).
  Os disfarces saem do gerar.cjs (img/): a folha do jogo pintada com a paleta do Ditto e a cara dele em cada quadro do
  Idle de frente, o único que os disfarces usam (o resto é escala no corpo: afundar, panqueca, escorrer).
  Tempos: C.T(compasso, linha), 16 linhas por compasso. midia/ e comum.js são links; som/ tem os gritos e o apito.
  Música: a peça própria do EP 3 (midia/som/ditto-14.wav e ditto.js, 100 BPM, swing 0,12), no mesmo mapa. Acentos que
  o vídeo segue: BOING da roleta 1,50 (C0.10), encolhe 8,57 (C3.9), estalos das tentativas em C8.4, C11.4, C14.4 e o
  perfeito em C17.0; os pratos abrem a cortina no começo de C8, C11, C14 e C17 (a transformação concentra atrás da
  cortina, a luz vazando pela fresta); a cara volta em C18.0; breque em C15.0; explosão do júri em C19.0; apito e
  BOING em C21.2; silêncio em C18.2–C18.8, no C22 inteiro e em C25.0–C25.4 (DITTO! na volta); BOING final em C27.12.
-->

  <audio id="a-dt-ri" class="clip" src="som/132.ogg" data-start="44.4" data-duration="0.65" data-media-start="0"></audio>
  <audio id="a-sn-acorda" class="clip" src="som/143.ogg" data-start="45.6" data-duration="1.4" data-media-start="0"></audio>
  <audio id="a-apito2" class="clip" src="som/apito-curto.mp3" data-start="49.8" data-duration="1" data-media-start="0"></audio>
  <audio id="a-mt" class="clip" src="som/150.ogg" data-start="54" data-duration="1.8" data-media-start="0"></audio>
  <audio id="a-dt-fim" class="clip" src="som/132.ogg" data-start="62.4" data-duration="0.65" data-media-start="0"></audio>

  <script>
    const { T, div, quadra, ator, anim, quadro, bola, estouro, poeira, treme, flash, torcida, torcidaAnim, telaFinal, piscada } = C;
    const tl = gsap.timeline({ paused: true });
    const $ = (id) => document.getElementById(id);
    const cam = $('cam');
    const pc = $('pc');
    const jc = $('jc');
    const vest = $('vest');
    const recorte = $('recorte');

    // ---------- utilidades ----------
    const ver = (els, t, on = true) => tl.set(els, { autoAlpha: on ? 1 : 0 }, t);
    const op = (els, t, on = true) => tl.set(els, { opacity: on ? 1 : 0 }, t);
    const salto = (a, t, h, d = 0.3, ease = 'power1.inOut') => {
      tl.to(a.corpo, { keyframes: { y: [-h, 0] }, duration: d, ease }, t);
      if (a.sh) tl.to(a.sh, { keyframes: { scale: [Math.max(0.45, 1 - h / 500), 1], opacity: [0.5, 1] }, duration: d, ease }, t);
    };
    const mover = (a, t0, t1, x, y, ease = 'none') => tl.to(a.el, { x, y, duration: t1 - t0, ease }, t0);
    const andar = (a, t0, t1, x, y, dir, vel = 1.4, ease = 'power1.inOut') => {
      anim(tl, a, 'Walk', dir, t0, t1, { vel });
      mover(a, t0, t1, x, y, ease);
    };
    const camera = (el, t0, t1, scale, ox, oy, ease = 'sine.inOut') =>
      tl.to(el, { scale, transformOrigin: `${ox}px ${oy}px`, duration: t1 - t0, ease }, t0);
    const carimbo = (sel, t, txt, s = 2.2) => {
      if (txt !== undefined) tl.set(sel, { textContent: txt }, t);
      tl.set(sel, { opacity: 1 }, t);
      tl.fromTo(sel, { scale: s }, { scale: 1, duration: 0.22, ease: 'back.out(2.2)', immediateRender: false }, t);
    };
    // a cortina diagonal do EP 2 (agora roxa): troca de cena debaixo dela, no instante t
    const cortina = (t) => {
      tl.set('#cortina', { opacity: 1 }, t - 0.16);
      tl.fromTo('#cortina', { x: -900 }, { x: 1500, duration: 0.32, ease: 'power2.inOut', immediateRender: false }, t - 0.16);
      tl.set('#cortina', { opacity: 0 }, t + 0.17);
    };
    const balao = (pai, txt, x, y, t0, t1) => {
      const b = div(pai, 'balao');
      b.textContent = txt;
      tl.set(b, { x, y }, 0);
      op(b, t0);
      tl.from(b, { scale: 0.3, duration: 0.2, ease: 'back.out(3)' }, t0);
      op(b, t1, false);
    };
    const ronco = (pai, t, x, y, n = 2, gap = 0.45) => {
      for (let k = 0; k < n; k++) {
        const z = div(pai, 'zz');
        z.textContent = 'Z';
        tl.set(z, { x, y }, 0);
        tl.fromTo(z, { opacity: 0, scale: 0.6 + 0.3 * (k % 2) }, { opacity: 1, duration: 0.2, immediateRender: false }, t + gap * k);
        tl.to(z, { x: x + 70 + 30 * (k % 2), y: y - 190 - 40 * (k % 2), duration: 1.2, ease: 'sine.out' }, t + gap * k);
        tl.to(z, { opacity: 0, duration: 0.3 }, t + 0.9 + gap * k);
      }
    };
    const risada = (pai, t0, t1, y = 1700) => {
      for (let i = 0; i < 6; i++) {
        const h = div(pai, 'ha');
        h.textContent = i % 2 ? 'HA' : 'HAHA';
        const x = 90 + i * 160;
        tl.set(h, { x, y }, 0);
        tl.fromTo(h, { opacity: 0, y: y + 20 }, { opacity: 1, y: y - 100 - (i % 3) * 40, duration: 0.3, ease: 'back.out(2)', immediateRender: false }, t0 + i * 0.08);
        tl.to(h, { y: `-=${40}`, duration: t1 - t0 - 0.6, ease: 'none' }, t0 + 0.4 + i * 0.08);
        tl.to(h, { opacity: 0, duration: 0.25 }, t1 - 0.25);
      }
    };
    const CORES = ['#ffcb05', '#e8423f', '#3a7bd5', '#4ec36b', '#f8f8f0', '#b46be0'];
    const confete = (t, n = 70) => {
      for (let i = 0; i < n; i++) {
        const c = div($('festa'), 'confete', `background:${CORES[i % CORES.length]}`);
        const x = (i * 157 + t * 31) % 1080;
        tl.set(c, { x, y: -60 - (i % 7) * 70, rotation: i * 37, opacity: 0 }, 0);
        op(c, t);
        tl.to(c, { y: 2000, x: x + ((i % 5) - 2) * 90, rotation: `+=${540 + (i % 4) * 120}`, duration: 2.4 + (i % 5) * 0.3, ease: 'none' }, t);
        op(c, t + 2.4 + (i % 5) * 0.3, false);
      }
    };
    // lágrima/gota em arco de (x, y) pro lado `lado`
    const gota = (pai, t, x, y, lado, { roxa = false, alto = 60, longe = 120, cai = 140, d = 0.5 } = {}) => {
      const g = div(pai, roxa ? 'gota roxa' : 'gota');
      tl.set(g, { x, y, opacity: 0 }, 0);
      tl.fromTo(g, { x, y, opacity: 1 }, { x: x + lado * longe, duration: d, ease: 'none', immediateRender: false }, t);
      tl.fromTo(g, { y }, { keyframes: { y: [y - alto, y + cai] }, duration: d, ease: 'power1.in', immediateRender: false }, t);
      op(g, t + d, false);
    };
    // medalha do EP 2 pendurada no pescoço (no corpo: pula junto)
    const medalha = (a, x, y, s = 1) => {
      const m = div(a.corpo, 'medalha');
      m.innerHTML = '<div class="fita"></div><div class="disco"></div>';
      m.style.zIndex = 2;
      gsap.set(m, { x, y, scale: s });
      return m;
    };

    // ---------- o Ditto e as formas dele (uma cópia branca de cada, por cima, pro brilho) ----------
    function forma(pai, id, x, y, E, z = 13) {
      const a = ator(pai, id, { escala: E, z, x, y, opacity: 0 });
      const b = ator(pai, id, { escala: E, z: z + 1, x, y, sombra: false, opacity: 0 });
      b.spr.classList.add('branco');
      return { a, b, id, E };
    }
    function ditto(pai, x, y, E, z = 13) {
      const d = forma(pai, 132, x, y, E, z);
      d.aura = div(pai, 'aura');
      gsap.set(d.aura, { x, y: y - 9.3 * E, scale: E / 14 });
      d.x = x;
      d.y = y;
      return d;
    }
    const par = (f, nome, t0, t1, op2 = {}) => {
      anim(tl, f.a, nome, 0, t0, t1, { id: f.id, ...op2 });
      anim(tl, f.b, nome, 0, t0, t1, { id: f.id, ...op2 });
    };
    const parQuadro = (f, i, t, id = f.id) => {
      quadro(tl, f.a, 'Idle', 0, i, t, { id });
      quadro(tl, f.b, 'Idle', 0, i, t, { id });
    };
    // ta-da: os braços pra cima (quadros 1–3 do Idle do Snorlax), segura e volta a respirar
    const tada = (f, t, segura = 0.75, id = f.id) => {
      parQuadro(f, 1, t, id);
      parQuadro(f, 2, t + 0.15, id);
      parQuadro(f, 3, t + 0.3, id);
      parQuadro(f, 4, t + 0.3 + segura, id);
      parQuadro(f, 5, t + 0.45 + segura, id);
      return t + 0.6 + segura;
    };
    /**
     * A transformação do rascunho aprovado: concentra (amassa), brilha (a cópia branca acende, aura e estrelinhas), estica
     * branco e, debaixo do branco, vira a forma `F` (com o quadro do Idle), que estala em `tPop`. `estica` = keyframes do
     * esticão; `dur` = de concentrar ao estalo.
     */
    function virar(D, F, tPop, { dur = 1.2, estica = { scaleX: [1.05, 1.4, 1.2, 1.5], scaleY: [1.25, 1.35, 1.75, 1.95] }, id = F.id, brilhos = 6, fx = 520 } = {}) {
      const t0 = tPop - dur;
      const tb = t0 + dur * 0.125;
      const tE = t0 + dur * 0.5;
      const tS = tPop - dur * 0.125;
      const pai = D.a.el.parentNode;
      const s = D.E / 14;
      par(D, 'Idle', Math.max(0, t0 - 0.01), tS);
      tl.fromTo([D.a.corpo, D.b.corpo], { scaleX: 1, scaleY: 1 }, { scaleX: 1.22, scaleY: 0.78, duration: dur * 0.2, ease: 'sine.inOut', immediateRender: false }, t0);
      tl.fromTo(D.b.el, { opacity: 0 }, { opacity: 1, duration: tE - tb, ease: 'power1.in', immediateRender: false }, tb);
      tl.fromTo(D.aura, { opacity: 0, scale: 0.4 * s }, { opacity: 0.9, scale: s, duration: tS - tb, ease: 'power1.in', immediateRender: false }, tb);
      for (let k = 0; k < brilhos; k++) {
        const b = div(pai, 'brilho');
        const a0 = (k / brilhos) * Math.PI * 2;
        const pos = (a, r) => ({ x: D.x + Math.cos(a) * r * s, y: D.y - 140 * s + Math.sin(a) * r * 0.8 * s });
        tl.set(b, { ...pos(a0, 260), opacity: 0 }, 0);
        const tk = tb + k * 0.06;
        tl.fromTo(b, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1.2, duration: 0.15, immediateRender: false }, tk);
        tl.to(b, { keyframes: [pos(a0 + 1, 220), pos(a0 + 2, 150), pos(a0 + 2.6, 60)], rotation: 180, duration: tS - tk, ease: 'power1.in' }, tk);
        op(b, tS, false);
      }
      tl.to([D.a.corpo, D.b.corpo], { keyframes: estica, duration: tS - tE, ease: 'power1.in' }, tE);
      if (D.a.sh) tl.to(D.a.sh, { scale: 1.6, duration: tS - tE }, tE);
      // troca debaixo do branco
      op([D.a.el, D.b.el], tS, false);
      tl.set([D.a.corpo, D.b.corpo], { scaleX: 1, scaleY: 1 }, tS);
      if (D.a.sh) tl.set(D.a.sh, { scale: 1 }, tS);
      op([F.a.el, F.b.el], tS);
      parQuadro(F, 0, tS, id);
      tl.fromTo([F.a.corpo, F.b.corpo], { scaleX: 0.8, scaleY: 1.1 }, { scaleX: 1, scaleY: 1, duration: tPop - tS, ease: 'power2.in', immediateRender: false }, tS);
      // estala
      tl.to(F.b.el, { opacity: 0, duration: 0.4, ease: 'power1.in' }, tPop);
      tl.to(D.aura, { opacity: 0, scale: 1.5 * s, duration: 0.3, ease: 'power2.out' }, tPop);
      tl.fromTo([F.a.corpo, F.b.corpo], { scaleX: 1.25, scaleY: 0.8 }, { scaleX: 1, scaleY: 1, duration: 0.6, ease: 'elastic.out(1, 0.35)', immediateRender: false }, tPop);
      const e = estouro(tl, pai, D.x, D.y - 200 * s, tPop, { tam: fx * Math.max(0.5, s), cor: '#ffcb05' });
      e.style.zIndex = 12;
      flash(tl, tPop, 0.6, 0.3);
    }
    // volta pro Ditto (debaixo de uma cortina ou de um estouro): esconde as formas e mostra o Ditto em pé
    const reset = (D, formas, t) => {
      for (const F of formas) op([F.a.el, F.b.el], t, false);
      op(D.a.el, t);
      op(D.b.el, t, false);
      tl.set([D.a.el], { x: D.x, y: D.y }, t);
      tl.set([D.a.corpo, D.b.corpo], { scaleX: 1, scaleY: 1, y: 0, rotation: 0, skewX: 0 }, t);
    };
    // derrete numa poça: o corpo achata pelo pé (escala inteira no fim: 4 de 14 de altura, 26 de 14 de largura)
    const poca = (a, t0, t1, E = 14) => {
      tl.to(a.corpo, { keyframes: { scaleY: [0.8, 0.55, 0.38, 4 / E], scaleX: [1.15, 1.4, 1.65, 26 / E] }, duration: t1 - t0, ease: 'power1.in' }, t0);
    };
    // gelatina: a poça ou a panqueca respirando mole (não fica parada)
    const mole = (a, t0, t1, sx, sy, amp = 0.06) => {
      const n = Math.max(2, Math.round((t1 - t0) / 0.3));
      tl.to(a.corpo, { keyframes: { scaleX: Array.from({ length: n }, (_, i) => sx * (1 + (i % 2 ? -amp : amp))), scaleY: Array.from({ length: n }, (_, i) => sy * (1 + (i % 2 ? amp : -amp))) }, duration: t1 - t0, ease: 'sine.inOut' }, t0);
    };

    // ====================================================================================================
    // a quadra (treino de dia e o estádio do EP 2): gol grande, K = 190 px/m
    // ====================================================================================================
    const K = 190;
    const FUNDO = 1.5;
    const GL = 760;
    quadra(cam, 'madeira', { K, gy: GL, fundo: FUNDO });
    const PSI = 'drop-shadow(0 0 18px #c070ff) drop-shadow(0 0 36px #a040ff)';
    const lampadas = [200, 540, 880].map((x) => {
      const l = div(cam, 'lampada');
      gsap.set(l, { x, y: 120 });
      return l;
    });
    const Dq = ditto(cam, 540, GL + 40, 10);
    const Fpeq = forma(cam, '143d', 540, GL + 40, 4);
    const Fest = forma(cam, '143c', 540, GL + 40, 10);
    const Fgel = forma(cam, '143d', 540, GL + 40, 10, 15); // a barriga de gelatina por cima do Snorlax do estádio
    const pkq = ator(cam, 25, { escala: 10, z: 14, x: 540, y: 1560, opacity: 0 });
    const mt = ator(cam, 150, { escala: 11, z: 14, x: 540, y: 2250 });
    const bl = bola(cam, { d: 88, z: 12, x: 540, y: 1440 });
    const fila = torcida($('frente'));
    const poe = (t, x, y) => {
      tl.set(bl.el, { opacity: 1, x, y }, t);
      tl.set(bl.corpo, { y: 0, scale: 1 }, t);
      tl.set(bl.sh, { scale: 1, opacity: 1 }, t);
    };
    const some = (t) => tl.set(bl.el, { opacity: 0 }, t);
    const voo = (t0, t1, x, y, alto = 140, chega = 60, voltas = 2, ease = 'none') => {
      mover(bl, t0, t1, x, y, ease);
      tl.to(bl.gira, { rotation: `+=${360 * voltas}`, duration: t1 - t0, ease }, t0);
      tl.to(bl.corpo, { keyframes: { y: [-alto, -chega] }, duration: t1 - t0, ease }, t0);
      tl.to(bl.sh, { keyframes: { scale: [0.6, Math.max(0.5, 1 - chega / 400)] }, duration: t1 - t0, ease }, t0);
    };
    const rola = (t0, t1, x, y, ease = 'power1.out', voltas = 1.5) => {
      mover(bl, t0, t1, x, y, ease);
      tl.to(bl.gira, { rotation: `+=${360 * voltas}`, duration: t1 - t0, ease }, t0);
    };
    const rede = (t, x) => {
      estouro(tl, cam, x, GL - 120, t, { tam: 200, cor: '#ffcb05' });
    };
    const tremer = (t, f, d = 0.3) => treme(tl, ['#cam', '#frente'], t, f, d);
    some(0);
    for (const F of [Fpeq, Fest, Fgel]) op([F.a.el, F.b.el], 0, false);

    // ====================================================================================================
    // o palco: tábuas, a beira, a luz de cima e a plateia de costas embaixo
    // ====================================================================================================
    const PE = 1330;
    const E = 14;
    {
      let y = 0;
      const tons = ['#a8683a', '#9c5f33', '#b0703f', '#985a30'];
      for (let i = 0; y < 540; i++) {
        const h = 38 + i * 9;
        const tb = div($('tablado'), 'tabua', `top:${y}px;height:${h}px;background:${tons[i % 4]};` +
          `background-image:linear-gradient(90deg, #3a1e0c 6px, transparent 6px);background-size:${300 + i * 40}px 100%;background-position:${(i * 137) % 300}px 0`);
        y += h;
      }
    }
    const plateia = torcida($('plateia'), { y: 2000, escala: 10 });
    const Dp = ditto(recorte, 540, PE, E);
    const Fsn = forma(recorte, '143d', 540, PE, E);
    const Fon = forma(recorte, '95d', 540, PE, 12);
    const buraco = div(pc, 'buraco');
    gsap.set(buraco, { x: 540, y: PE + 10 });
    for (const F of [Fsn, Fon]) op([F.a.el, F.b.el], 0, false);
    const CAMP = [pc, $('plateia')]; // a câmera do palco leva a plateia junto
    const camPalco = (t0, t1, s, ease) => camera(CAMP, t0, t1, s, 540, PE - 340, ease);

    // ====================================================================================================
    // o júri: Magikarp de frente com a medalha, Snorlax (o do EP 1) e Pikachu, grandes atrás da mesa
    // ====================================================================================================
    const mk = ator(jc, 129, { escala: 19, z: 10, x: 200, y: 1360, sombra: false });
    const sn = ator(jc, 143, { escala: 21, z: 9, x: 540, y: 1440, sombra: false });
    const pk = ator(jc, 25, { escala: 18, z: 10, x: 880, y: 1400, sombra: false });
    medalha(mk, 0, -190, 1.5);
    const placaJ = (x, n) => {
      const p = div(jc, 'placa');
      p.innerHTML = `<div class="cabo"></div><div class="cartao${n === 10 ? ' dez' : ''}">${n}</div>`;
      gsap.set(p, { x, y: 1500 });
      return p;
    };
    const JX = [200, 540, 880];
    const ALTO = [830, 800, 850]; // onde cada placa para (acima da cabeça)
    // o Snorlax do júri dormindo: o quadro de olho fechado, respirando
    const dorme = (t0, t1) => {
      quadro(tl, sn, 'Idle', 0, 0, t0);
      const n = Math.max(2, Math.round((t1 - t0) / 0.45));
      tl.fromTo(sn.corpo, { scaleY: 1, scaleX: 1 }, { keyframes: { scaleY: Array.from({ length: n }, (_, i) => (i % 2 ? 1 : 1.05)), scaleX: Array.from({ length: n }, (_, i) => (i % 2 ? 1 : 0.98)) }, duration: t1 - t0, ease: 'sine.inOut', immediateRender: false }, t0);
    };
    // entra no júri: o pano de chão (zoom de entrada) e os raios girando
    const juri = (t, t1) => {
      ver('#juri', t);
      tl.fromTo(jc, { scale: 1.1 }, { scale: 1, transformOrigin: '540px 900px', duration: 0.45, ease: 'power2.out', immediateRender: false }, t);
      tl.fromTo('#juri-raios', { rotation: 0 }, { rotation: 10, duration: t1 - t, ease: 'none', immediateRender: false }, t);
    };
    const fecharJuri = (placas, t) => {
      ver('#juri', t, false);
      op(placas, t, false);
    };

    // ====================================================================================================
    // 0 · a roleta já girando no 1º quadro; trava no Ditto (linha 10)
    // ====================================================================================================
    ver(['#vest', '#quadra', '#palco', '#juri', '#cortinas', '#plateia'], 0, false);
    const ROSTOS = ['143', '150', '6', '94', '7', '25', '1', '113', '129', '39', '54', '79', '95', '143', '150', '6', '94', '7', '132'];
    const fita = $('fita');
    fita.innerHTML = ROSTOS.map((r) => `<img src="midia/${r}.png" alt="" />`).join('');
    const tTrava = T(0, 10);
    tl.fromTo('#rl-raios', { rotation: 0 }, { rotation: 90, duration: T(2, 0), ease: 'none', immediateRender: false }, 0);
    tl.fromTo(fita, { y: -276 * 2 }, { y: -(ROSTOS.length - 1) * 276, duration: tTrava, ease: 'power3.out', immediateRender: false }, 0);
    tl.fromTo('.rl-caixa', { scale: 1.18 }, { scale: 1, duration: 0.35, ease: 'back.out(3)', immediateRender: false }, tTrava);
    // o retrato do Ditto quica que nem gelatina na caixa
    tl.fromTo('.rl-caixa', { scaleX: 1, scaleY: 1 }, { keyframes: { scaleX: [1.12, 0.94, 1.04, 1], scaleY: [0.88, 1.06, 0.97, 1] }, duration: 0.6, ease: 'none', immediateRender: false }, tTrava + 0.35);
    op('#rl-nome', tTrava);
    tl.from('#rl-nome', { scale: 1.8, duration: 0.3, ease: 'back.out(2.5)' }, tTrava);
    tl.to('#rl-gol', { y: 90, duration: 0.25, ease: 'back.out(2)' }, tTrava);
    flash(tl, tTrava, 0.4, 0.25);

    // ====================================================================================================
    // 1 · EP 3
    // ====================================================================================================
    tl.to('#roleta .rl-txt, #roleta .rl-caixa, #rl-nome', { scale: 0.6, opacity: 0, duration: 0.25, ease: 'power2.in', stagger: 0.03 }, T(1, 0));
    op('#ep', T(1, 4));
    tl.fromTo('#ep b', { scale: 3, rotation: -20 }, { scale: 1, rotation: -4, duration: 0.3, ease: 'back.out(2)', immediateRender: false }, T(1, 4));
    tl.from('#ep small', { y: 60, opacity: 0, duration: 0.25, ease: 'back.out(2)' }, T(1, 6));
    tl.to('#ep b', { keyframes: { scaleX: [1.08, 0.96, 1.03, 1], scaleY: [0.92, 1.05, 0.98, 1] }, duration: 0.7, ease: 'none' }, T(1, 9));
    tl.to('#ep', { y: -30, duration: T(2, 0) - T(1, 8), ease: 'sine.inOut' }, T(1, 8));
    flash(tl, T(1, 4), 0.5, 0.25);
    tl.to('#ep', { scale: 1.3, opacity: 0, duration: 0.3, ease: 'power2.in' }, T(2, 0) - 0.3);
    tl.to('#roleta', { opacity: 0, duration: 0.3 }, T(2, 0) - 0.3);
    tl.set('#roleta', { visibility: 'hidden' }, T(2, 0));

    // ====================================================================================================
    // 2 · vestiário: o Snorlax dorme no banco, o Magikarp admira a medalha; o Ditto chega com a plaquinha GOLEIRO
    // ====================================================================================================
    const t2 = T(2, 0);
    ver('#vest', t2);
    [60, 220, 380, 700, 860].forEach((x) => div(vest, 'armario', `left:${x}px`));
    const snV = ator(vest, '143x', { escala: 11, z: 10, x: 280, y: 1150, sombra: false });
    const mkV = ator(vest, 129, { escala: 12, z: 10, x: 840, y: 1140, sombra: false });
    const pkV = ator(vest, 25, { escala: 10, z: 10, x: 680, y: 1150, sombra: false, opacity: 0 });
    const dtV = ator(vest, 132, { escala: 11, z: 12, x: 1250, y: 1500 });
    medalha(mkV, 0, -120, 1);
    const plq = div(dtV.corpo, 'plaquinha');
    plq.innerHTML = '<div class="pau"></div><div class="txt">GOLEIRO</div>';
    gsap.set(plq, { x: 60, y: -250 });
    plq.style.zIndex = 3;
    tl.fromTo(vest, { scale: 1.06 }, { scale: 1, transformOrigin: '540px 1200px', duration: T(3, 0) - t2, ease: 'sine.out', immediateRender: false }, t2);
    anim(tl, snV, 'Sleep', 0, t2, T(3, 0), { id: '143x', vel: 0.5 });
    ronco(vest, t2 + 0.2, 330, 950, 3, 0.7);
    anim(tl, mkV, 'Idle', 0, t2, T(3, 0));
    // a medalha brilha (o Magikarp só olha pra ela)
    estouro(tl, mkV.corpo, 0, -80, T(2, 6), { tam: 120, cor: '#fff', anel: false });
    estouro(tl, mkV.corpo, 0, -80, T(2, 12), { tam: 120, cor: '#fff', anel: false });
    andar(dtV, t2, T(2, 9), 540, 1500, 6, 1.6, 'power1.out');
    anim(tl, dtV, 'Idle', 0, T(2, 9), T(3, 0));
    // ele balança a plaquinha (escolhe eu!)
    tl.to(plq, { keyframes: { rotation: [-10, 10, -10, 10, -6, 0] }, duration: T(3, 0) - T(2, 9), ease: 'sine.inOut' }, T(2, 9));
    salto(dtV, T(2, 10), 60, 0.3);
    salto(dtV, T(2, 13), 60, 0.3);

    // ====================================================================================================
    // 3 · apito: na quadra, ele tenta virar Snorlax e sai um Snorlax pequenininho com a cara dele
    // ====================================================================================================
    const t3 = T(3, 0);
    cortina(t3);
    ver('#vest', t3, false);
    ver('#quadra', t3);
    op(lampadas, t3, false);
    op(fila.map((a) => a.el), t3, false);
    tl.set(cam, { scale: 1.45, transformOrigin: `540px ${GL}px` }, t3);
    camera(cam, t3, T(4, 0), 1.7, 540, GL - 40);
    op(Dq.a.el, t3);
    virar(Dq, Fpeq, T(3, 9), { dur: 1.1, estica: { scaleX: [1.05, 1.3, 1.2, 1.4], scaleY: [1.3, 1.6, 2.0, 2.3] } });
    par(Fpeq, 'Idle', T(3, 9), T(5, 0));
    // pequenininho, ele quica no lugar (o motivo sobe e encolhe)
    for (const r of [12, 14]) for (const a of [Fpeq.a, Fpeq.b]) salto(a, T(3, r), 40, 0.28);
    balao(cam, '?', 610, GL - 150, T(3, 12), T(4, 2));
    poe(T(4, 0), 540, 1430);
    op(pkq.el, T(4, 0));
    anim(tl, pkq, 'Idle', 4, T(4, 0), T(4, 2));

    // ====================================================================================================
    // 4 · o Pikachu chuta no meio das pernas: gol; a torcida ri
    // ====================================================================================================
    const t4 = T(4, 0);
    camera(cam, t4, T(4, 4), 1, 540, 1100, 'power2.inOut');
    op(fila.map((a) => a.el), t4);
    torcidaAnim(tl, fila, 'Idle', t4, T(4, 9));
    anim(tl, pkq, 'Shoot', 4, T(4, 4) - 0.05, T(4, 4) + 0.5, { loop: false });
    rola(T(4, 4), T(4, 8), 540, GL - 20, 'none', 3);
    tl.to(bl.sh, { opacity: 0.6, duration: 0.2 }, T(4, 4));
    tl.to(bl.corpo, { scale: 0.85, duration: T(4, 8) - T(4, 4), ease: 'none' }, T(4, 4));
    // ele pula atrasado (a bola já passou)
    salto(Fpeq.a, T(4, 7), 70, 0.3);
    salto(Fpeq.b, T(4, 7), 70, 0.3);
    rede(T(4, 8), 540);
    some(T(4, 10));
    anim(tl, pkq, 'Pose', 4, T(4, 9), T(5, 0), { loop: false });
    torcidaAnim(tl, fila, 'Hop', T(4, 9), T(5, 4), { vel: 1.3 });
    risada($('frente'), T(4, 9), T(5, 4));
    torcidaAnim(tl, fila, 'Idle', T(5, 4), T(6, 0));

    // ====================================================================================================
    // 5 · o Ditto derrete numa poça (vira Ditto de novo num plim e escorre)
    // ====================================================================================================
    const t5 = T(5, 0);
    camera(cam, t5, T(5, 10), 1.55, 540, GL, 'sine.inOut');
    op([Fpeq.a.el, Fpeq.b.el], T(5, 2), false);
    op(Dq.a.el, T(5, 2));
    tl.set(Dq.a.corpo, { scaleX: 1, scaleY: 1 }, T(5, 2));
    estouro(tl, cam, 540, GL - 60, T(5, 2), { tam: 200, cor: '#dfafd7' });
    anim(tl, Dq.a, 'Idle', 0, T(5, 2), T(6, 0), { vel: 0.5 });
    poca(Dq.a, T(5, 4), T(5, 13), 10);
    mole(Dq.a, T(5, 13), T(6, 0), 2.6, 0.4, 0.05);
    tl.to('#noite', { opacity: 0.55, duration: T(6, 0) - T(5, 4), ease: 'sine.in' }, T(5, 4));
    for (let k = 0; k < 4; k++) gota(cam, T(5, 6) + k * 0.3, 540 + (k % 2 ? 60 : -60), GL - 120, k % 2 ? 1 : -1, { roxa: true, alto: 20, longe: 60, cai: 110, d: 0.45 });

    // ====================================================================================================
    // 6 · noite no palco: o Magikarp pendura a faixa TESTE PRA GOLEIRO; a câmera desce pro júri
    // ====================================================================================================
    const t6 = T(6, 0);
    cortina(t6);
    ver('#quadra', t6, false);
    ver(['#palco', '#cortinas', '#plateia'], t6);
    tl.set('#holofote', { opacity: 0.6, x: 540, y: 980 }, t6);
    tl.to('#holofote', { keyframes: { x: [420, 660, 540] }, duration: T(6, 10) - t6, ease: 'sine.inOut' }, t6);
    const mkN = ator($('cortinas'), 129, { escala: 12, z: 5, x: 1220, y: 1560 });
    medalha(mkN, 0, -120, 1);
    // ele vem pulando (o Hop do PMD) até o meio e, no pulo alto, a faixa desce
    [0, 3].forEach((r, k) => {
      anim(tl, mkN, 'Idle', 0, T(6, r), T(6, r) + 0.42, { loop: false, vel: 1.3 });
      salto(mkN, T(6, r), 150, 0.42);
      tl.to(mkN.el, { x: 1220 - 340 * (k + 1), duration: 0.42, ease: 'none' }, T(6, r));
    });
    anim(tl, mkN, 'Idle', 0, T(6, 6), T(6, 6) + 0.5, { loop: false, vel: 1.1 });
    salto(mkN, T(6, 6), 520, 0.5);
    tl.to(mkN.el, { x: 540, duration: 0.5, ease: 'none' }, T(6, 6));
    op('#faixa', T(6, 8));
    tl.fromTo('#faixa', { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: 'back.out(1.6)', immediateRender: false }, T(6, 8));
    tl.to('#faixa', { keyframes: { rotation: [-4, 3, -2, 1, 0] }, duration: 1.0, ease: 'sine.out' }, T(6, 9));
    anim(tl, mkN, 'Idle', 0, T(6, 9) + 0.2, T(7, 0));
    // a câmera desce: palco, cortinas e plateia sobem; o júri vem de baixo (o Magikarp chega na cadeira dele pulando)
    const tDesce = T(6, 10);
    tl.to(['#palco', '#cortinas', '#plateia'], { y: -1920, duration: 0.45, ease: 'power2.inOut' }, tDesce);
    tl.to('#holofote', { opacity: 0, duration: 0.2 }, tDesce);
    op([mkN.el, '#faixa'], T(7, 0) - 0.02, false);
    ver('#juri', tDesce);
    tl.fromTo('#juri', { y: 1920 }, { y: 0, duration: 0.45, ease: 'power2.inOut', immediateRender: false }, tDesce);
    dorme(tDesce, T(7, 0) + 0.3);
    anim(tl, pk, 'Idle', 0, tDesce, T(7, 0) + 0.3);
    tl.fromTo(mk.el, { y: 500 }, { y: 1360, duration: 0.35, ease: 'power2.in', immediateRender: false }, T(6, 13));
    anim(tl, mk, 'Idle', 0, T(6, 13), T(6, 13) + 0.35, { loop: false, vel: 1.4 });
    tl.fromTo(mk.corpo, { scaleX: 1.2, scaleY: 0.8 }, { scaleX: 1, scaleY: 1, duration: 0.4, ease: 'elastic.out(1, 0.4)', immediateRender: false }, T(6, 13) + 0.35);
    anim(tl, mk, 'Idle', 0, T(6, 13) + 0.35, T(7, 0) + 0.3);
    tl.set(mk.el, { y: 500 }, 0);

    // ====================================================================================================
    // as tentativas: a cortina fecha por cima do júri, TENTATIVA n, a cortina abre e ele concentra
    // ====================================================================================================
    function tentativa(A, n) {
      const tF = T(A, 0);
      const tAbre = T(A + 1, 0); // o prato
      // a cortina fecha por cima do júri; o palco volta pro lugar atrás dela
      tl.set(['#palco', '#cortinas', '#plateia'], { y: 0 }, tF - 0.01);
      ver(['#palco', '#cortinas', '#plateia'], tF - 0.01);
      tl.fromTo('#pano-e', { x: -620 }, { x: 0, duration: 0.24, ease: 'power2.in', immediateRender: false }, tF - 0.01);
      tl.fromTo('#pano-d', { x: 620 }, { x: 0, duration: 0.24, ease: 'power2.in', immediateRender: false }, tF - 0.01);
      tl.set('.pano', { skewX: 0 }, tF - 0.01);
      treme(tl, ['#pano-e', '#pano-d'], tF + 0.23, 0.4, 0.2);
      tl.set(CAMP, { scale: 1, transformOrigin: `540px ${PE - 340}px` }, tF);
      // o holofote varre a cortina
      tl.set('#holofote', { opacity: 1 }, tF);
      tl.fromTo('#holofote', { x: n % 2 ? 160 : 920, y: 1100 }, { x: 540, y: 860, duration: T(A, 7) - tF, ease: 'sine.inOut', immediateRender: false }, tF);
      tl.to('#holofote', { opacity: 0, duration: 0.3 }, T(A, 12));
      // ele concentra atrás da cortina: a luz vaza pela fresta e cresce até o prato
      tl.fromTo('#fresta', { opacity: 0, scaleX: 0.4 }, { opacity: 1, scaleX: 1.6, duration: tAbre - T(A, 11), ease: 'power1.in', immediateRender: false }, T(A, 11));
      tl.set('#fresta', { opacity: 0 }, tAbre);
      // TENTATIVA n
      tl.set('#placa', { opacity: 1, scale: 1 }, tF);
      tl.set('#placa b, #placa-n', { opacity: 0 }, tF);
      tl.set('#placa-n', { textContent: String(n) }, tF);
      carimbo('#placa b', T(A, 2));
      carimbo('#placa-n', T(A, 4), undefined, 2.6);
      flash(tl, T(A, 4), 0.3, 0.2);
      tl.to('#placa-n', { keyframes: { scale: [1.08, 1, 1.06, 1] }, duration: tAbre - T(A, 6) - 0.2, ease: 'sine.inOut' }, T(A, 6));
      tl.to('#placa', { scale: 0.6, opacity: 0, duration: 0.16, ease: 'power2.in' }, tAbre - 0.16);
      // a cortina abre no prato
      tl.to('#pano-e', { x: -480, duration: 0.4, ease: 'power2.out' }, tAbre);
      tl.to('#pano-d', { x: 480, duration: 0.4, ease: 'power2.out' }, tAbre);
      tl.fromTo('.pano', { skewX: 0 }, { keyframes: { skewX: [0, 3, -2, 1, 0] }, duration: 0.6, ease: 'none', immediateRender: false }, tAbre);
      reset(Dp, [Fsn, Fon], tF);
      op(buraco, tF, false);
      tl.set(recorte, { clipPath: 'none' }, tF);
      anim(tl, Dp.a, 'Idle', 0, tF, T(A, 11));
      torcidaAnim(tl, plateia, 'Idle', tF, T(A + 2, 0));
      // a câmera já vem chegando no palco desde a cortina
      tl.fromTo(CAMP, { scale: 1 }, { scale: 1.12, duration: 0.6, ease: 'sine.inOut', immediateRender: false }, tAbre);
      return T(A + 1, 4);
    }

    // ====================================================================================================
    // 7–8 · TENTATIVA 1: Snorlax roxo com a cara do Ditto… cai sentado e afunda no palco
    // ====================================================================================================
    let tPop = tentativa(7, 1);
    fecharJuri([], T(7, 0) + 0.25);
    virar(Dp, Fsn, tPop);
    let tFim = tada(Fsn, tPop, 0.45);
    camPalco(tPop, T(8, 8), 1.28);
    // cai sentado (pulinho, BUUM), o tablado quebra e ele afunda devagar
    const tSenta = T(8, 8);
    salto(Fsn.a, tSenta, 80, 0.25, 'power2.out');
    parQuadro(Fsn, 0, tSenta);
    tl.fromTo(Fsn.a.corpo, { scaleX: 1.3, scaleY: 0.75 }, { scaleX: 1, scaleY: 1, duration: 0.5, ease: 'elastic.out(1, 0.4)', immediateRender: false }, tSenta + 0.25);
    treme(tl, '#palco', tSenta + 0.25, 1.4, 0.35);
    op(buraco, tSenta + 0.25);
    tl.fromTo(buraco, { scale: 0.3 }, { scale: 1, duration: 0.2, ease: 'back.out(2)', immediateRender: false }, tSenta + 0.25);
    poeira(tl, pc, 540, PE, tSenta + 0.25, { n: 8, r: 280, tam: 46, cor: '#b0703f' });
    tl.set(recorte, { clipPath: `inset(0px 0px ${1920 - PE - 14}px 0px)` }, tSenta + 0.25);
    tl.to(Fsn.a.el, { y: PE + 380, duration: T(9, 0) - tSenta - 0.35, ease: 'power1.in' }, tSenta + 0.35);
    camera(CAMP, tSenta + 0.3, T(9, 0), 1.36, 540, PE - 200, 'sine.inOut');
    tl.set(Fsn.a.el, { y: PE }, T(10, 0));

    // ====================================================================================================
    // 9 · júri: o Magikarp chora de rir (2), o Snorlax ronca e a placa sobe com o ronco (1), o Pikachu imita a cara (3)
    // ====================================================================================================
    const t9 = T(9, 0);
    juri(t9, T(10, 0) + 0.3);
    ver(['#palco', '#cortinas', '#plateia'], t9, false);
    const p9 = [placaJ(200, 2), placaJ(540, 1), placaJ(880, 3)];
    // Magikarp: chacoalha de rir e as lágrimas espirram dos dois lados
    anim(tl, mk, 'Idle', 0, t9, T(10, 0) + 0.3, { vel: 2.2 });
    tl.fromTo(mk.corpo, { rotation: 0 }, { keyframes: { rotation: [-7, 7, -7, 7, -6, 6, -4, 4, 0] }, duration: 1.4, ease: 'none', immediateRender: false }, T(9, 1));
    for (let k = 0; k < 8; k++) gota(jc, T(9, 1) + k * 0.13, 200 + (k % 2 ? 90 : -90), 1010, k % 2 ? 1 : -1, { alto: 70, longe: 140, cai: 160, d: 0.5 });
    tl.to(p9[0], { y: ALTO[0], duration: 0.24, ease: 'back.out(2)' }, T(9, 4));
    // Snorlax: cada ronco (Z) a placa sobe um degrau, no fôlego
    dorme(t9, T(10, 0) + 0.3);
    ronco(jc, T(9, 5), 650, 930, 3, 0.45);
    tl.to(p9[1], { keyframes: { y: [1300, 1290, 1080, 1070, ALTO[1]] }, duration: T(9, 11) - T(9, 5), ease: 'power1.inOut' }, T(9, 5));
    // Pikachu: imita a cara do Ditto (mole que nem gelatina) e levanta 3
    anim(tl, pk, 'Idle', 0, t9, T(9, 8));
    anim(tl, pk, 'Idle', 0, T(9, 8), T(10, 0) + 0.3, { id: '25c' });
    tl.fromTo(pk.corpo, { scaleX: 1, scaleY: 1 }, { keyframes: { scaleX: [1.2, 0.92, 1.1, 0.96, 1.04, 1], scaleY: [0.82, 1.08, 0.9, 1.04, 0.97, 1] }, duration: 1.0, ease: 'none', immediateRender: false }, T(9, 8));
    tl.to(p9[2], { y: ALTO[2], duration: 0.24, ease: 'back.out(2)' }, T(9, 11));
    camera(jc, T(9, 3), T(10, 0) + 0.3, 1.04, 540, 1000, 'sine.inOut');

    // ====================================================================================================
    // 10–11 · TENTATIVA 2: estica demais pra virar Snorlax e se esmaga: panqueca
    // ====================================================================================================
    tPop = tentativa(10, 2);
    fecharJuri(p9, T(10, 0) + 0.25);
    virar(Dp, Fsn, tPop, { estica: { scaleX: [1.05, 1.2, 0.9, 1.1], scaleY: [1.4, 1.9, 2.4, 2.7] } });
    parQuadro(Fsn, 1, tPop);
    parQuadro(Fsn, 2, tPop + 0.15);
    // o peso desce: esmaga até a panqueca (4 de 14 de altura) e fica mole
    const tEsm = T(11, 6);
    parQuadro(Fsn, 0, tEsm);
    tl.to(Fsn.a.corpo, { scaleY: 4 / 14, scaleX: 22 / 14, duration: 0.22, ease: 'power3.in' }, tEsm);
    tl.to(Fsn.b.corpo, { scaleY: 4 / 14, scaleX: 22 / 14, duration: 0.22, ease: 'power3.in' }, tEsm);
    treme(tl, '#palco', tEsm + 0.22, 1.2, 0.3);
    poeira(tl, pc, 540, PE, tEsm + 0.22, { n: 8, r: 320, tam: 46, cor: '#f3e3c3' });
    mole(Fsn.a, tEsm + 0.3, T(12, 0), 22 / 14, 4 / 14, 0.07);
    camPalco(tPop, T(11, 6), 1.22);
    camera(CAMP, T(11, 6), T(12, 0), 1.4, 540, PE - 60, 'power1.out');

    // ====================================================================================================
    // 12 · júri: 1 · 1 · 1, cada um de um jeito
    // ====================================================================================================
    const t12 = T(12, 0);
    juri(t12, T(13, 0) + 0.3);
    ver(['#palco', '#cortinas', '#plateia'], t12, false);
    const p12 = [placaJ(200, 1), placaJ(540, 1), placaJ(880, 1)];
    // Magikarp: pula (Splash) e a placa sobe junto
    anim(tl, mk, 'Idle', 0, t12, T(12, 2));
    anim(tl, mk, 'Idle', 0, T(12, 2), T(12, 2) + 0.5, { loop: false });
    salto(mk, T(12, 2), 160, 0.5);
    tl.to(p12[0], { y: ALTO[0], duration: 0.3, ease: 'back.out(2)' }, T(12, 2));
    anim(tl, mk, 'Idle', 0, T(12, 2) + 0.5, T(13, 0) + 0.3);
    // Snorlax: sobe no ronco, tomba e bate na cabeça dele (não acorda)
    dorme(t12, T(13, 0) + 0.3);
    ronco(jc, T(12, 4), 650, 930, 2, 0.45);
    tl.to(p12[1], { y: ALTO[1], duration: 0.6, ease: 'sine.out' }, T(12, 4));
    tl.to(p12[1], { rotation: -28, x: 470, y: ALTO[1] + 120, duration: 0.25, ease: 'power2.in' }, T(12, 9));
    estouro(tl, jc, 470, 880, T(12, 9) + 0.25, { tam: 150, cor: '#fff' });
    tl.to(sn.el, { keyframes: { y: [1460, 1440] }, duration: 0.3, ease: 'power1.out' }, T(12, 9) + 0.25);
    // Pikachu: imita a panqueca, com a cara do Ditto
    anim(tl, pk, 'Idle', 0, t12, T(12, 10));
    anim(tl, pk, 'Idle', 0, T(12, 10), T(13, 0) + 0.3, { id: '25c' });
    tl.fromTo(pk.corpo, { scaleX: 1, scaleY: 1 }, { scaleX: 1.5, scaleY: 0.5, duration: 0.2, ease: 'power3.in', immediateRender: false }, T(12, 10));
    tl.to(pk.corpo, { keyframes: { scaleX: [1.45, 1.52, 1.46, 1.5], scaleY: [0.53, 0.48, 0.52, 0.5] }, duration: T(13, 0) - T(12, 11), ease: 'sine.inOut' }, T(12, 11));
    tl.to(p12[2], { y: ALTO[2] + 120, duration: 0.24, ease: 'back.out(2)' }, T(12, 12));
    camera(jc, t12 + 0.45, T(13, 0) + 0.3, 1.05, 540, 1000, 'sine.inOut');

    // ====================================================================================================
    // 13–14 · TENTATIVA 3: Onix roxo com a cara do Ditto; amolece e escorre até virar poça
    // ====================================================================================================
    tPop = tentativa(13, 3);
    fecharJuri(p12, T(13, 0) + 0.25);
    tl.set(p12[1], { rotation: 0, x: 540 }, T(13, 1));
    tl.set(pk.corpo, { scaleX: 1, scaleY: 1 }, T(13, 1));
    virar(Dp, Fon, tPop, { estica: { scaleX: [1.0, 0.8, 0.7, 0.62], scaleY: [1.4, 1.9, 2.5, 2.9] } });
    par(Fon, 'Idle', tPop, T(14, 7));
    camPalco(tPop, T(14, 6), 1.08, 'sine.out');
    // amolece: balança, a cabeça cai, escorre
    const tMole = T(14, 6);
    tl.to(Fon.a.corpo, { keyframes: { skewX: [8, -10, 12, -6, 0], scaleY: [0.92, 0.78, 0.6, 0.42, 0.26], scaleX: [1.06, 1.15, 1.3, 1.5, 1.7] }, duration: T(14, 12) - tMole, ease: 'power1.in' }, tMole);
    for (let k = 0; k < 6; k++) gota(recorte, tMole + k * 0.14, 540 + (k % 2 ? 90 : -90), PE - 360 + k * 40, k % 2 ? 1 : -1, { roxa: true, alto: 10, longe: 50, cai: 300 - k * 40, d: 0.45 });
    camera(CAMP, tMole, T(15, 0), 1.3, 540, PE - 60, 'sine.inOut');
    // vira poça: troca pro Ditto achatado debaixo de um respingo
    const tPoca = T(14, 12);
    op([Fon.a.el, Fon.b.el], tPoca, false);
    op(Dp.a.el, tPoca);
    tl.set(Dp.a.corpo, { scaleX: 26 / 14, scaleY: 4 / 14 }, tPoca);
    anim(tl, Dp.a, 'Idle', 0, tPoca, T(15, 0) + 0.3, { vel: 0.6 });
    estouro(tl, recorte, 540, PE - 30, tPoca, { tam: 260, cor: '#af77af', anel: false });
    mole(Dp.a, tPoca + 0.05, T(15, 0), 26 / 14, 4 / 14, 0.06);

    // ====================================================================================================
    // 15 · júri: o Magikarp cai da cadeira (PLOF), o Snorlax ronca, o Pikachu tapa os olhos; ninguém levanta placa
    // ====================================================================================================
    const t15 = T(15, 0);
    juri(t15, T(16, 0) + 0.3);
    ver(['#palco', '#cortinas', '#plateia'], t15, false);
    anim(tl, mk, 'Idle', 0, t15, T(15, 2));
    anim(tl, mk, 'Hurt', 0, T(15, 2), T(15, 7), { loop: false });
    tl.to(mk.corpo, { rotation: -80, duration: 0.25, ease: 'power2.in' }, T(15, 2));
    tl.to(mk.el, { x: 120, y: 1900, duration: 0.45, ease: 'power2.in' }, T(15, 2) + 0.1);
    estouro(tl, jc, 160, 1300, T(15, 5), { tam: 240, cor: '#7cc8ff' });
    treme(tl, jc, T(15, 5), 0.8, 0.25);
    for (let k = 0; k < 4; k++) gota(jc, T(15, 5) + k * 0.04, 160, 1270, k % 2 ? 1 : -1, { alto: 140, longe: 60 + k * 30, cai: 40, d: 0.5 });
    dorme(t15, T(16, 0) + 0.3);
    ronco(jc, T(15, 6), 650, 930, 3, 0.45);
    anim(tl, pk, 'Idle', 0, t15, T(15, 9));
    anim(tl, pk, 'Hurt', 0, T(15, 9), T(16, 0) + 0.3, { id: '25o', vel: 0.6 });
    tl.fromTo(pk.el, { x: 880 }, { keyframes: { x: [872, 888, 874, 886, 880] }, duration: T(16, 0) - T(15, 9), ease: 'none', immediateRender: false }, T(15, 9));
    camera(jc, t15 + 0.45, T(16, 0) + 0.3, 1.05, 540, 1000, 'sine.inOut');
    // o Magikarp volta pra cadeira escondido debaixo da cortina
    tl.set(mk.el, { x: 200, y: 1360 }, T(16, 1));
    tl.set(mk.corpo, { rotation: 0 }, T(16, 1));

    // ====================================================================================================
    // 16–17 · TENTATIVA 4 (concentra mais): o Snorlax perfeito
    // ====================================================================================================
    tentativa(16, 4);
    tPop = T(17, 0);
    fecharJuri([], T(16, 0) + 0.25);
    virar(Dp, Fsn, tPop, { dur: 1.65, id: '143', brilhos: 10, fx: 680 });
    flash(tl, tPop, 0.85, 0.35);
    treme(tl, '#palco', tPop, 1.2, 0.35);
    tFim = tada(Fsn, tPop, 0.9, '143');
    par(Fsn, 'Idle', tFim, T(18, 0), { id: '143' });
    tl.to('#cone', { opacity: 1.6, duration: 0.3 }, tPop);
    camPalco(tPop + 0.6, T(18, 4), 1.32);
    confete(tPop, 40);

    // ====================================================================================================
    // 18 · …a cara do Ditto volta sozinha; ele percebe, olha pra plateia e ri
    // ====================================================================================================
    const tCara = T(18, 0);
    par(Fsn, 'Idle', tCara, T(18, 8), { id: '143c' });
    estouro(tl, recorte, 540, PE - 420, tCara, { tam: 150, cor: '#dfafd7' });
    balao(recorte, '?', 760, PE - 520, T(18, 2), T(18, 8));
    tl.to(Fsn.a.corpo, { keyframes: { rotation: [-4, 4, -3, 3, 0] }, duration: T(18, 7) - T(18, 2), ease: 'sine.inOut' }, T(18, 2));
    // olha pra plateia (a câmera abre) e ri: quadros de braço pra cima, pulando
    camera(CAMP, T(18, 7), T(19, 0), 1, 540, PE - 340, 'power2.inOut');
    for (const r of [8, 11, 14]) {
      tada(Fsn, T(18, r), 0.05, '143c');
      salto(Fsn.a, T(18, r), 90, 0.38);
      salto(Fsn.b, T(18, r), 90, 0.38);
    }
    torcidaAnim(tl, plateia, 'Hop', T(18, 8), T(19, 0), { vel: 1.3 });

    // ====================================================================================================
    // 19 · júri: o Snorlax acorda e levanta 10; Magikarp 10; Pikachu 10
    // ====================================================================================================
    const t19 = T(19, 0);
    juri(t19, T(20, 0) + 0.3);
    ver(['#palco', '#cortinas', '#plateia'], t19, false);
    const p19 = [placaJ(200, 10), placaJ(540, 10), placaJ(880, 10)];
    // explode no 1º tempo: o Snorlax acorda de braço pra cima (os quadros do bocejo) e a placa dele sobe junto
    flash(tl, t19, 0.6, 0.3);
    confete(t19, 70);
    [1, 2, 3].forEach((q, k) => quadro(tl, sn, 'Idle', 0, q, t19 + 0.1 * k));
    tl.to(p19[1], { y: ALTO[1], duration: 0.26, ease: 'back.out(2)' }, t19);
    salto(sn, t19, 90, 0.35);
    estouro(tl, jc, 540, ALTO[1] - 100, t19 + 0.2, { tam: 300 });
    // Magikarp 10
    anim(tl, mk, 'Idle', 0, t19, T(19, 4));
    anim(tl, mk, 'Idle', 0, T(19, 4), T(19, 4) + 0.5, { loop: false });
    salto(mk, T(19, 4), 200, 0.5);
    tl.to(p19[0], { y: ALTO[0], duration: 0.26, ease: 'back.out(2)' }, T(19, 4));
    estouro(tl, jc, 200, ALTO[0] - 100, T(19, 4) + 0.2, { tam: 300 });
    // Pikachu 10
    anim(tl, pk, 'Idle', 0, t19, T(19, 8));
    anim(tl, pk, 'Hop', 0, T(19, 8), T(19, 8) + 0.4, { loop: false, vel: 1.4 });
    salto(pk, T(19, 8), 120, 0.4);
    tl.to(p19[2], { y: ALTO[2], duration: 0.26, ease: 'back.out(2)' }, T(19, 8));
    estouro(tl, jc, 880, ALTO[2] - 100, T(19, 8) + 0.2, { tam: 300 });
    // os três pulam juntos
    anim(tl, mk, 'Idle', 0, T(19, 4) + 0.5, T(20, 0) + 0.3, { vel: 1.2 });
    anim(tl, pk, 'Hop', 0, T(19, 8) + 0.4, T(20, 0) + 0.3, { vel: 1.2 });
    [11, 14].forEach((r) => {
      salto(sn, T(19, r), 70, 0.3);
      salto(mk, T(19, r) + 0.05, 120, 0.3);
      salto(pk, T(19, r) + 0.1, 100, 0.3);
    });
    tl.to(p19, { keyframes: { rotation: [-6, 6, -4, 0] }, duration: 0.9, ease: 'sine.inOut', stagger: 0.07 }, T(19, 11));
    [4, 6, 10, 13].forEach((r, k) => quadro(tl, sn, 'Idle', 0, [2, 3, 2, 3][k], T(19, r)));
    camera(jc, t19 + 0.45, T(20, 0) + 0.3, 1.06, 540, 1000, 'sine.inOut');

    // ====================================================================================================
    // 20 · o estádio: a placa ÚLTIMO MINUTO toma a tela e sobe pro placar
    // ====================================================================================================
    const t20 = T(20, 0);
    cortina(t20);
    ver('#festa', t20, false);
    ver('#festa', T(25, 0));
    ver('#festa', T(26, 0), false);
    fecharJuri(p19, t20);
    ver('#quadra', t20);
    op(lampadas, t20);
    tl.set('#noite', { opacity: 0 }, t20);
    op(fila.map((a) => a.el), t20);
    torcidaAnim(tl, fila, 'Idle', t20, T(21, 8));
    tl.set(cam, { scale: 0.95, transformOrigin: '540px 900px' }, t20);
    camera(cam, t20, T(20, 12), 1.08, 540, 900, 'sine.inOut');
    reset(Dq, [Fpeq], t20);
    anim(tl, Dq.a, 'Idle', 0, t20, T(20, 12));
    op(pkq.el, t20, false);
    poe(t20, 540, 1440);
    op('#placar', t20);
    tl.fromTo('#placar', { y: 1000, scale: 1.2 }, { y: 960, scale: 1.25, duration: T(20, 9) - t20, ease: 'sine.inOut', immediateRender: false }, t20);
    tl.fromTo('#placar b', { scale: 1.8 }, { scale: 1, duration: 0.25, ease: 'back.out(2)', immediateRender: false }, T(20, 1));
    tl.to('#placar', { y: 0, scale: 1, duration: 0.4, ease: 'power2.inOut' }, T(20, 10));
    tl.set('#placar', { y: 1000, scale: 1.2 }, 0);

    // ====================================================================================================
    // 21 · apito: ele vira o Snorlax perfeito com a cara do Ditto; a torcida rival aponta e ri
    // ====================================================================================================
    // o apito sai no fim do 20 e o BOING da transformação cai em C21.2
    const t21 = T(21, 2);
    camera(cam, T(20, 12), t21, 1.3, 540, GL);
    virar(Dq, Fest, t21, { dur: 0.9, id: '143c' });
    tFim = tada(Fest, t21, 0.6);
    const tFimEst = tFim;
    const tGrito0 = T(25, 4);
    par(Fest, 'Idle', tFim, tGrito0);
    camera(cam, T(21, 8), T(22, 0), 1, 540, 1100, 'power2.inOut');
    torcidaAnim(tl, fila, 'Hop', T(21, 8), T(22, 2), { vel: 1.3 });
    risada($('frente'), T(21, 8), T(22, 2));
    torcidaAnim(tl, fila, 'Idle', T(22, 2), T(25, 4));

    // ====================================================================================================
    // 22 · pênalti: o Mewtwo do EP 2 vai até a bola; silêncio; a força psíquica junta e a bola levita
    // ====================================================================================================
    const t22 = T(22, 0);
    tl.set(mt.el, { x: 540, y: 2250 }, 0);
    andar(mt, t22, T(22, 7), 540, 1530, 4, 1.2, 'power1.out');
    anim(tl, mt, 'Idle', 4, T(22, 7), T(22, 9));
    camera(cam, T(22, 6), T(23, 0), 1.18, 540, 1250, 'power1.in');
    anim(tl, mt, 'Charge', 4, T(22, 9), T(23, 0) - 0.1);
    tl.set(mt.el, { filter: PSI }, T(22, 9));
    tl.to('#psi-tela', { opacity: 0.85, duration: T(23, 0) - T(22, 9), ease: 'power1.in' }, T(22, 9));
    [9, 12].forEach((r) => {
      const a = div(cam, 'anel-psi');
      tl.set(a, { x: 540, y: 1420 }, 0);
      tl.fromTo(a, { scale: 0.2, opacity: 0.9 }, { scale: 2.4, opacity: 0, duration: 0.9, ease: 'power1.out', immediateRender: false }, T(22, r));
    });
    tl.set(bl.el, { filter: PSI }, T(22, 10));
    tl.to(bl.corpo, { y: -90, duration: T(23, 0) - T(22, 10), ease: 'sine.out' }, T(22, 10));
    tl.to(bl.gira, { rotation: '+=150', duration: T(23, 0) - T(22, 10), ease: 'none' }, T(22, 10));
    tl.to(bl.sh, { scale: 0.6, opacity: 0.6, duration: T(23, 0) - T(22, 10) }, T(22, 10));
    // o Ditto-Snorlax firma: treme de leve no gol
    tl.to(Fest.a.el, { keyframes: { x: [536, 544, 537, 543, 540] }, duration: T(23, 0) - T(22, 8), ease: 'none' }, T(22, 8));

    // ====================================================================================================
    // 23–24 · o clímax (4,8 s): o chute em câmera lenta; a barriga vira gelatina roxa, estica e segura a bola
    // ====================================================================================================
    const tK = T(23, 0);
    const tBate = T(23, 12); // a bola chega na barriga
    const tSolta = T(24, 11); // a barriga devolve
    const BX = 540;
    const BY = GL + 30; // o chão debaixo da barriga
    const BH = 70; // a altura da barriga
    anim(tl, mt, 'Shoot', 4, tK - 0.1, tK + 1.4, { loop: false, vel: 0.3 });
    anim(tl, mt, 'Idle', 4, tK + 1.4, T(25, 4), { vel: 0.5 });
    const onda = div(cam, 'anel-psi');
    tl.set(onda, { x: 540, y: 1360 }, 0);
    tl.fromTo(onda, { scale: 0.3, opacity: 1 }, { scale: 4, opacity: 0, duration: 1.0, ease: 'power2.out', immediateRender: false }, tK);
    tremer(tK, 0.5, 0.3);
    tl.set(bl.el, { zIndex: 16 }, tK);
    voo(tK, tBate, BX, BY, 280, BH, 2.2, 'sine.in');
    tl.to(bl.corpo, { scale: 0.9, duration: tBate - tK, ease: 'none' }, tK);
    [1, 2, 3, 4].forEach((k) => {
      const g = div(cam, 'rastro');
      tl.set(g, { x: 540, y: 1360 }, 0);
      tl.set(g, { opacity: 0.85 - k * 0.15, scale: 1.4 - k * 0.15 }, tK);
      tl.to(g, { x: BX, y: BY - BH - 40, duration: tBate - tK, ease: 'sine.in' }, tK + k * 0.12);
      op(g, tBate + k * 0.12, false);
    });
    tl.to('#psi-tela', { opacity: 0.5, duration: tBate - tK }, tK);
    tl.set(mt.el, { filter: 'none' }, tK + 1.4);
    camera(cam, tK, tBate, 1.55, BX, BY - 110, 'sine.inOut');
    // ele se prepara: estufa a barriga
    tl.to(Fest.a.corpo, { scaleX: 1.1, scaleY: 0.95, duration: tBate - T(23, 6), ease: 'sine.inOut' }, T(23, 6));
    // o contato: a barriga vira gelatina roxa (a forma do Ditto aparece por baixo da do Snorlax) e cede pra trás
    op(Fgel.a.el, tBate - 0.01);
    tl.set(Fgel.a.el, { opacity: 0 }, tBate - 0.01);
    // os mesmos quadros do Snorlax de baixo (começam juntos), senão aparecem duas cabeças
    par(Fgel, 'Idle', tFimEst, tGrito0, { id: '143d' });
    tl.to(Fgel.a.el, { opacity: 0.8, duration: 0.25, ease: 'power1.out' }, tBate);
    tl.to(Fgel.a.el, { opacity: 0, duration: 0.4, ease: 'power1.in' }, tSolta + 0.2);
    // estica: larga e baixa, mole, segurando (sem parar de balançar)
    const GEL = { scaleX: [1.32, 1.22, 1.4, 1.3, 1.36, 1.28, 1.34, 1.3], scaleY: [0.8, 0.9, 0.74, 0.84, 0.78, 0.86, 0.8, 0.83] };
    for (const a of [Fest.a, Fgel.a]) {
      tl.fromTo(a.corpo, { scaleX: 1.1, scaleY: 0.95 }, { keyframes: GEL, duration: tSolta - tBate, ease: 'sine.inOut', immediateRender: false }, tBate);
      tl.fromTo(a.corpo, { y: 0 }, { keyframes: { y: [-30, -24, -36, -28, -32] }, duration: tSolta - tBate, ease: 'sine.inOut', immediateRender: false }, tBate);
    }
    // a bola afunda na barriga (vai pra longe: diminui) e para de girar devagar
    tl.to(bl.corpo, { keyframes: { scale: [0.72, 0.62, 0.66, 0.6, 0.64], y: [-BH - 30, -BH - 40, -BH - 34, -BH - 38] }, duration: tSolta - tBate, ease: 'sine.inOut' }, tBate);
    tl.to(bl.gira, { rotation: '+=260', duration: tSolta - tBate, ease: 'power3.out' }, tBate);
    tl.to(bl.sh, { opacity: 0, duration: 0.3 }, tBate);
    // ondas de gelatina na barriga
    [0, 0.55, 1.1, 1.65, 2.2].forEach((dt, k) => {
      const o = div(cam, 'onda');
      tl.set(o, { x: BX, y: BY - BH - 40 }, 0);
      tl.fromTo(o, { scale: 0.3, opacity: 0.95 }, { scale: 1.6 + 0.1 * k, opacity: 0, duration: 0.8, ease: 'power1.out', immediateRender: false }, tBate + dt);
    });
    tl.set(bl.el, { filter: 'none' }, tBate + 0.6);
    tl.to('#psi-tela', { opacity: 0, duration: 1.2 }, tBate + 0.2);
    // a câmera continua chegando devagar enquanto ele segura
    camera(cam, tBate, tSolta, 1.75, BX, BY - 110, 'sine.inOut');
    // solta: a barriga volta (BOING), a bola cai mole na frente dele e rola um pouco
    tl.to([Fest.a.corpo, Fgel.a.corpo], { scaleX: 1, scaleY: 1, y: 0, duration: 0.6, ease: 'elastic.out(1, 0.35)' }, tSolta);
    tl.to(bl.el, { x: 600, y: GL + 170, duration: 0.55, ease: 'power1.out' }, tSolta);
    tl.to(bl.corpo, { keyframes: { y: [-BH - 60, 0, -50, 0] }, scale: 1, duration: 0.75, ease: 'power1.in' }, tSolta);
    tl.to(bl.sh, { opacity: 1, scale: 1, duration: 0.4 }, tSolta + 0.3);
    tl.to(bl.gira, { rotation: '+=120', duration: 0.9, ease: 'power1.out' }, tSolta);
    tl.set(bl.el, { zIndex: 16 }, tSolta);

    // ====================================================================================================
    // 25 · silêncio, depois a torcida: DITTO!
    // ====================================================================================================
    const t25 = T(25, 0);
    camera(cam, t25, T(25, 6), 1, 540, 1000, 'power2.inOut');
    const tGrito = T(25, 4);
    carimbo('#grito', tGrito);
    tl.to('#grito', { keyframes: { scale: [1.08, 1, 1.06, 1] }, duration: T(26, 0) - tGrito - 0.4, ease: 'sine.inOut' }, tGrito + 0.25);
    tl.to('#grito', { opacity: 0, duration: 0.2 }, T(26, 0) - 0.2);
    flash(tl, tGrito, 0.5, 0.3);
    tremer(tGrito, 1.2, 0.35);
    torcidaAnim(tl, fila, 'Hop', tGrito, T(26, 0), { vel: 1.3 });
    confete(tGrito, 70);
    tFim = tada(Fest, tGrito, 0.6);
    par(Fest, 'Idle', tFim, T(26, 0));
    salto(Fest.a, tGrito, 110, 0.4);
    salto(Fest.b, tGrito, 110, 0.4);
    anim(tl, mt, 'Hurt', 4, tGrito, T(26, 0), { loop: false });

    // ====================================================================================================
    // 26 · o banco: o Snorlax dormindo, o Magikarp com a medalha, o Pikachu e o Ditto sorrindo com a cara dele
    // ====================================================================================================
    const t26 = T(26, 0);
    cortina(t26);
    ver('#quadra', t26, false);
    ver('#vest', t26);
    tl.set(dtV.el, { x: 520, y: 1150 }, t26);
    tl.set(plq, { opacity: 0 }, t26);
    tl.set(dtV.sh, { opacity: 0 }, t26);
    tl.set(mkV.el, { x: 880 }, t26);
    tl.set(snV.el, { x: 230 }, t26);
    op(pkV.el, t26);
    tl.fromTo(vest, { scale: 1 }, { scale: 1.12, transformOrigin: '600px 1000px', duration: T(27, 0) - t26, ease: 'sine.inOut', immediateRender: false }, t26);
    anim(tl, snV, 'Sleep', 0, t26, T(27, 0), { id: '143x', vel: 0.5 });
    ronco(vest, t26 + 0.2, 280, 950, 3, 0.7);
    anim(tl, mkV, 'Idle', 0, t26, T(27, 0));
    anim(tl, pkV, 'Idle', 0, t26, T(26, 6));
    anim(tl, dtV, 'Idle', 0, t26, T(26, 4));
    // o Ditto pula feliz; o Pikachu imita (com a cara dele) e os dois riem
    anim(tl, dtV, 'Hop', 0, T(26, 4), T(26, 4) + 0.4, { loop: false, vel: 1.3 });
    salto(dtV, T(26, 4), 90, 0.4);
    anim(tl, dtV, 'Idle', 0, T(26, 4) + 0.4, T(27, 0));
    anim(tl, pkV, 'Idle', 0, T(26, 6), T(27, 0), { id: '25c' });
    salto(pkV, T(26, 8), 70, 0.35);
    salto(dtV, T(26, 8), 70, 0.35);
    salto(pkV, T(26, 12), 70, 0.35);
    salto(dtV, T(26, 12), 70, 0.35);
    estouro(tl, mkV.corpo, 0, -80, T(26, 10), { tam: 120, cor: '#fff', anel: false });

    // ====================================================================================================
    // 27 · tela final (EP 4?)
    // ====================================================================================================
    const FIM = T(27, 0);
    telaFinal($('final'));
    const fc = $('final-cena');
    const dt2 = ator(fc, 132, { escala: 8, z: 5, x: 320, y: 1480 });
    const pk2 = ator(fc, 25, { escala: 7, z: 5, x: 770, y: 1480 });
    anim(tl, dt2, 'Idle', 0, FIM, FIM + 3);
    anim(tl, pk2, 'Idle', 0, FIM, FIM + 3);
    for (const r of [0, 4, 8, 12]) {
      tl.to(dt2.corpo, { keyframes: { y: [-90, 0], scaleY: [1.1, 0.85, 1] }, duration: 0.36, ease: 'power1.inOut' }, T(27, r));
      tl.to(pk2.corpo, { keyframes: { y: [-110, 0] }, duration: 0.36, ease: 'power1.inOut' }, T(27, r) + 0.08);
    }
    fc.insertAdjacentHTML('beforeend', '<div id="teaser"><div id="fita2"></div></div><div id="teaser-txt">EP 4?</div>');
    $('fita2').innerHTML = ['150', '94', '113', '95', '39', '6'].map((r) => `<img src="midia/${r}.png" alt="" />`).join('');
    flash(tl, FIM, 0.6, 0.3);
    tl.to('#raios-final', { rotation: 30, duration: 3, ease: 'none' }, FIM);
    tl.set('#logo', { opacity: 1 }, FIM);
    tl.fromTo('#logo', { scale: 0.7 }, { scale: 1, duration: 0.45, ease: 'back.out(3)', immediateRender: false }, FIM);
    piscada(tl, [T(27, 2), T(27, 4), T(27, 6)], '#final-cena');
    tl.set('#tag', { opacity: 1 }, T(27, 6));
    tl.from('#tag', { scale: 1.6, duration: 0.25, ease: 'back.out(2)' }, T(27, 6));
    tl.to(['#site', '#credito'], { opacity: 1, duration: 0.2 }, T(27, 7));
    op('#teaser', T(27, 8));
    carimbo('#teaser-txt', T(27, 12));
    tl.fromTo('#teaser', { scaleX: 1, scaleY: 1 }, { keyframes: { scaleX: [1.2, 0.92, 1.06, 1], scaleY: [0.82, 1.08, 0.96, 1] }, duration: 0.5, ease: 'none', immediateRender: false }, T(27, 12));
    tl.fromTo('#fita2', { y: 0 }, { y: -160 * 5, duration: 0.35, ease: 'none', repeat: 6, immediateRender: false }, T(27, 8));

    window.__timelines = window.__timelines || {};
    window.__timelines.root = tl;
  </script>
