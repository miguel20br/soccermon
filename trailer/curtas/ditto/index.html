  <script>
    const { T, div, quadra, ator, anim, quadro, bola, estouro, poeira, treme, flash, torcida, torcidaAnim, telaFinal, piscada } = C;
    const tl = gsap.timeline({ paused: true });
    const $ = (id) => document.getElementById(id);
    const cam = $('cam');
    const jc = $('jc');
    const vest = $('vest');

    // ---------- o rival da final: um lugar só (o grito é som/rival.ogg) ----------
    const RIVAL = { id: '6', fogo: ['#fff6a0', '#ffb020', '#ff5a1a'], tela: 'rgb(255 120 30 / 55%)', brilho: 'drop-shadow(0 0 18px #ff8a1a) drop-shadow(0 0 36px #ff4a00)' };

    // ---------- utilidades ----------
    const ver = (els, t, on = true) => tl.set(els, { autoAlpha: on ? 1 : 0 }, t);
    const op = (els, t, on = true) => tl.set(els, { opacity: on ? 1 : 0 }, t);
    const salto = (a, t, h, d = 0.3, ease = 'power1.inOut') => {
      tl.to(a.corpo, { keyframes: { y: [-h, 0] }, duration: d, ease }, t);
      if (a.sh) tl.to(a.sh, { keyframes: { scale: [Math.max(0.45, 1 - h / 500), 1], opacity: [0.5, 1] }, duration: d, ease }, t);
    };
    const mover = (a, t0, t1, x, y, ease = 'none') => tl.to(a.el, { x, y, duration: t1 - t0, ease }, t0);
    const andar = (a, t0, t1, x, y, dir, vel = 1.4, ease = 'power1.inOut') => {
      anim(tl, a, 'Walk', dir, t0, t1, { vel });
      mover(a, t0, t1, x, y, ease);
    };
    const camera = (el, t0, t1, scale, ox, oy, ease = 'sine.inOut') =>
      tl.to(el, { scale, transformOrigin: `${ox}px ${oy}px`, duration: t1 - t0, ease }, t0);
    const carimbo = (sel, t, txt, s = 2.2) => {
      if (txt !== undefined) tl.set(sel, { innerHTML: txt }, t);
      tl.set(sel, { opacity: 1 }, t);
      tl.fromTo(sel, { scale: s }, { scale: 1, duration: 0.22, ease: 'back.out(2.2)', immediateRender: false }, t);
    };
    // o título grande (2 a 5 palavras) entra carimbado e sai encolhendo
    const titulo = (txt, t0, t1) => {
      carimbo('#titulo', t0, txt);
      tl.to('#titulo', { keyframes: { scale: [1.04, 1, 1.03, 1] }, duration: t1 - t0 - 0.4, ease: 'sine.inOut' }, t0 + 0.22);
      tl.to('#titulo', { scale: 0.7, opacity: 0, duration: 0.18, ease: 'power2.in' }, t1 - 0.18);
    };
    // a cortina diagonal do EP 2 (roxa): troca de lugar debaixo dela, no instante t
    const cortina = (t) => {
      tl.set('#cortina', { opacity: 1 }, t - 0.16);
      tl.fromTo('#cortina', { x: -900 }, { x: 1500, duration: 0.32, ease: 'power2.inOut', immediateRender: false }, t - 0.16);
      tl.set('#cortina', { opacity: 0 }, t + 0.17);
    };
    // a câmera vira pro banco (à direita do gol) e volta: as duas cenas correm juntas pro lado
    const VIRA = 0.3;
    const praJuri = (t) => {
      ver('#juri', t - 0.2);
      tl.fromTo('#juri', { x: 1080 }, { x: 0, duration: VIRA, ease: 'power2.inOut', immediateRender: false }, t - 0.2);
      tl.fromTo('#quadra', { x: 0 }, { x: -1080, duration: VIRA, ease: 'power2.inOut', immediateRender: false }, t - 0.2);
      ver('#quadra', t + 0.1, false);
      tl.set('#quadra', { x: 0 }, t + 0.1);
      tl.fromTo('#juri-raios', { rotation: 0 }, { rotation: 10, duration: 2.6, ease: 'none', immediateRender: false }, t - 0.2);
    };
    const praQuadra = (t, placas = []) => {
      ver('#quadra', t - 0.2);
      tl.fromTo('#quadra', { x: -1080 }, { x: 0, duration: VIRA, ease: 'power2.inOut', immediateRender: false }, t - 0.2);
      tl.fromTo('#juri', { x: 0 }, { x: 1080, duration: VIRA, ease: 'power2.inOut', immediateRender: false }, t - 0.2);
      ver('#juri', t + 0.1, false);
      op(placas, t + 0.1, false);
      tl.set('#juri', { x: 0 }, t + 0.1);
    };
    const balao = (pai, txt, x, y, t0, t1) => {
      const b = div(pai, 'balao');
      b.textContent = txt;
      tl.set(b, { x, y }, 0);
      op(b, t0);
      tl.fromTo(b, { scale: 0.3 }, { scale: 1, duration: 0.2, ease: 'back.out(3)', immediateRender: false }, t0);
      op(b, t1, false);
      return b;
    };
    const ronco = (pai, t, x, y, n = 2, gap = 0.45) => {
      for (let k = 0; k < n; k++) {
        const z = div(pai, 'zz');
        z.textContent = 'Z';
        tl.set(z, { x, y }, 0);
        tl.fromTo(z, { opacity: 0, scale: 0.6 + 0.3 * (k % 2) }, { opacity: 1, duration: 0.2, immediateRender: false }, t + gap * k);
        tl.to(z, { x: x + 70 + 30 * (k % 2), y: y - 190 - 40 * (k % 2), duration: 1.2, ease: 'sine.out' }, t + gap * k);
        tl.to(z, { opacity: 0, duration: 0.3 }, t + 0.9 + gap * k);
      }
    };
    const risada = (pai, t0, t1, y = 1700, xs = [90, 250, 410, 570, 730, 890]) => {
      xs.forEach((x, i) => {
        const h = div(pai, 'ha');
        h.textContent = i % 2 ? 'HA' : 'HAHA';
        tl.set(h, { x, y }, 0);
        tl.fromTo(h, { opacity: 0, y: y + 20 }, { opacity: 1, y: y - 100 - (i % 3) * 40, duration: 0.3, ease: 'back.out(2)', immediateRender: false }, t0 + i * 0.08);
        tl.to(h, { y: `-=${40}`, duration: t1 - t0 - 0.6, ease: 'none' }, t0 + 0.4 + i * 0.08);
        tl.to(h, { opacity: 0, duration: 0.25 }, t1 - 0.25);
      });
    };
    const CORES = ['#ffcb05', '#e8423f', '#3a7bd5', '#4ec36b', '#f8f8f0', '#b46be0'];
    const confete = (t, n = 70) => {
      for (let i = 0; i < n; i++) {
        const c = div($('festa'), 'confete', `background:${CORES[i % CORES.length]}`);
        const x = (i * 157 + t * 31) % 1080;
        tl.set(c, { x, y: -60 - (i % 7) * 70, rotation: i * 37, opacity: 0 }, 0);
        op(c, t);
        tl.to(c, { y: 2000, x: x + ((i % 5) - 2) * 90, rotation: `+=${540 + (i % 4) * 120}`, duration: 2.4 + (i % 5) * 0.3, ease: 'none' }, t);
        op(c, t + 2.4 + (i % 5) * 0.3, false);
      }
    };
    const gota = (pai, t, x, y, lado, { roxa = false, alto = 60, longe = 120, cai = 140, d = 0.5 } = {}) => {
      const g = div(pai, roxa ? 'gota roxa' : 'gota');
      tl.set(g, { x, y, opacity: 0 }, 0);
      tl.fromTo(g, { x, y, opacity: 1 }, { x: x + lado * longe, duration: d, ease: 'none', immediateRender: false }, t);
      tl.fromTo(g, { y }, { keyframes: { y: [y - alto, y + cai] }, duration: d, ease: 'power1.in', immediateRender: false }, t);
      op(g, t + d, false);
    };
    const medalha = (a, x, y, s = 1) => {
      const m = div(a.corpo, 'medalha');
      m.innerHTML = '<div class="fita"></div><div class="disco"></div>';
      m.style.zIndex = 2;
      gsap.set(m, { x, y, scale: s });
      return m;
    };
    // placa na mão: `cls` grande ou num
    const placaMao = (a, cls, txt, x, y) => {
      const p = div(a.corpo, `pm ${cls}`);
      p.innerHTML = `<div class="pau"></div><div class="txt">${txt}</div>`;
      p.style.zIndex = 3;
      gsap.set(p, { x, y });
      return p;
    };

    // ---------- o Ditto e as formas dele (uma cópia branca de cada, por cima, pro brilho) ----------
    function forma(pai, id, x, y, E, z = 13) {
      const a = ator(pai, id, { escala: E, z, x, y, opacity: 0 });
      const b = ator(pai, id, { escala: E, z: z + 1, x, y, sombra: false, opacity: 0 });
      b.spr.classList.add('branco');
      return { a, b, id, E };
    }
    function ditto(pai, x, y, E, z = 13) {
      const d = forma(pai, 132, x, y, E, z);
      d.aura = div(pai, 'aura');
      gsap.set(d.aura, { x, y: y - 9.3 * E, scale: E / 14 });
      d.x = x;
      d.y = y;
      return d;
    }
    const par = (f, nome, t0, t1, op2 = {}) => {
      anim(tl, f.a, nome, 0, t0, t1, { id: f.id, ...op2 });
      anim(tl, f.b, nome, 0, t0, t1, { id: f.id, ...op2 });
    };
    const parQuadro = (f, i, t, id = f.id) => {
      quadro(tl, f.a, 'Idle', 0, i, t, { id });
      quadro(tl, f.b, 'Idle', 0, i, t, { id });
    };
    // ta-da: os braços pra cima (quadros 1–3 do Idle do Snorlax), segura e volta a respirar
    const tada = (f, t, segura = 0.75, id = f.id) => {
      parQuadro(f, 1, t, id);
      parQuadro(f, 2, t + 0.15, id);
      parQuadro(f, 3, t + 0.3, id);
      parQuadro(f, 4, t + 0.3 + segura, id);
      parQuadro(f, 5, t + 0.45 + segura, id);
      return t + 0.6 + segura;
    };
    /**
     * A transformação: concentra (amassa), brilha (a cópia branca acende, aura e estrelinhas), estica branco e, debaixo
     * do branco, vira a forma `F`, que estala em `tPop` (o BOING). `dur` = de concentrar ao estalo.
     */
    function virar(D, F, tPop, { dur = 1.2, estica = { scaleX: [1.05, 1.4, 1.2, 1.5], scaleY: [1.25, 1.35, 1.75, 1.95] }, id = F.id, brilhos = 6, fx = 520 } = {}) {
      const t0 = tPop - dur;
      const tb = t0 + dur * 0.125;
      const tE = t0 + dur * 0.5;
      const tS = tPop - dur * 0.125;
      const pai = D.a.el.parentNode;
      const s = D.E / 14;
      par(D, 'Idle', Math.max(0, t0 - 0.01), tS);
      tl.fromTo([D.a.corpo, D.b.corpo], { scaleX: 1, scaleY: 1 }, { scaleX: 1.22, scaleY: 0.78, duration: dur * 0.2, ease: 'sine.inOut', immediateRender: false }, t0);
      tl.fromTo(D.b.el, { opacity: 0 }, { opacity: 1, duration: tE - tb, ease: 'power1.in', immediateRender: false }, tb);
      tl.fromTo(D.aura, { opacity: 0, scale: 0.4 * s }, { opacity: 0.9, scale: s, duration: tS - tb, ease: 'power1.in', immediateRender: false }, tb);
      for (let k = 0; k < brilhos; k++) {
        const b = div(pai, 'brilho');
        const a0 = (k / brilhos) * Math.PI * 2;
        const pos = (a, r) => ({ x: D.x + Math.cos(a) * r * s, y: D.y - 140 * s + Math.sin(a) * r * 0.8 * s });
        tl.set(b, { ...pos(a0, 260), opacity: 0 }, 0);
        const tk = tb + k * 0.06;
        tl.fromTo(b, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1.2, duration: 0.15, immediateRender: false }, tk);
        tl.to(b, { keyframes: [pos(a0 + 1, 220), pos(a0 + 2, 150), pos(a0 + 2.6, 60)], rotation: 180, duration: tS - tk, ease: 'power1.in' }, tk);
        op(b, tS, false);
      }
      tl.to([D.a.corpo, D.b.corpo], { keyframes: estica, duration: tS - tE, ease: 'power1.in' }, tE);
      if (D.a.sh) tl.to(D.a.sh, { scale: 1.6, duration: tS - tE }, tE);
      op([D.a.el, D.b.el], tS, false);
      tl.set([D.a.corpo, D.b.corpo], { scaleX: 1, scaleY: 1 }, tS);
      if (D.a.sh) tl.set(D.a.sh, { scale: 1 }, tS);
      op([F.a.el, F.b.el], tS);
      parQuadro(F, 0, tS, id);
      tl.fromTo([F.a.corpo, F.b.corpo], { scaleX: 0.8, scaleY: 1.1 }, { scaleX: 1, scaleY: 1, duration: tPop - tS, ease: 'power2.in', immediateRender: false }, tS);
      tl.to(F.b.el, { opacity: 0, duration: 0.4, ease: 'power1.in' }, tPop);
      tl.to(D.aura, { opacity: 0, scale: 1.5 * s, duration: 0.3, ease: 'power2.out' }, tPop);
      tl.fromTo([F.a.corpo, F.b.corpo], { scaleX: 1.25, scaleY: 0.8 }, { scaleX: 1, scaleY: 1, duration: 0.6, ease: 'elastic.out(1, 0.35)', immediateRender: false }, tPop);
      const e = estouro(tl, pai, D.x, D.y - 200 * s, tPop, { tam: fx * Math.max(0.5, s), cor: '#ffcb05' });
      e.style.zIndex = 12;
      flash(tl, tPop, 0.6, 0.3);
    }
    // volta pro Ditto (escondido: no júri ou debaixo da cortina)
    const reset = (D, formas, t) => {
      for (const F of formas) {
        op([F.a.el, F.b.el], t, false);
        tl.set([F.a.corpo, F.b.corpo], { scaleX: 1, scaleY: 1, y: 0, rotation: 0, skewX: 0 }, t);
      }
      op(D.a.el, t);
      op(D.b.el, t, false);
      tl.set([D.a.el], { x: D.x, y: D.y }, t);
      tl.set([D.a.corpo, D.b.corpo], { scaleX: 1, scaleY: 1, y: 0, rotation: 0, skewX: 0 }, t);
    };
    const poca = (a, t0, t1, E = 14) => {
      tl.to(a.corpo, { keyframes: { scaleY: [0.8, 0.55, 0.38, 4 / E], scaleX: [1.15, 1.4, 1.65, 26 / E] }, duration: t1 - t0, ease: 'power1.in' }, t0);
    };
    const mole = (a, t0, t1, sx, sy, amp = 0.06) => {
      const n = Math.max(2, Math.round((t1 - t0) / 0.3));
      tl.to(a.corpo, { keyframes: { scaleX: Array.from({ length: n }, (_, i) => sx * (1 + (i % 2 ? -amp : amp))), scaleY: Array.from({ length: n }, (_, i) => sy * (1 + (i % 2 ? amp : -amp))) }, duration: t1 - t0, ease: 'sine.inOut' }, t0);
    };

    // ====================================================================================================
    // a quadra: gol grande (K = 190 px/m), o banco com o Snorlax dormindo à direita do gol
    // ====================================================================================================
    const K = 190;
    const GL = 760;
    quadra(cam, 'madeira', { K, gy: GL, fundo: 1.5 });
    const lampadas = [200, 540, 880].map((x) => {
      const l = div(cam, 'lampada');
      gsap.set(l, { x, y: 120 });
      return l;
    });
    $('fogo-tela').style.background = `radial-gradient(ellipse 700px 900px at 540px 1100px, ${RIVAL.tela}, rgb(120 20 0 / 30%) 70%)`;
    const snq = ator(cam, '143x', { escala: 6, z: 9, x: 945, y: 690, sombra: false });
    const Dq = ditto(cam, 540, GL + 40, 10);
    const Fpeq = forma(cam, '143d', 540, GL + 40, 4);
    const Fon = forma(cam, '95d', 540, GL + 40, 7);
    const Fper = forma(cam, '143', 540, GL + 40, 11);
    const Fest = forma(cam, '143c', 540, GL + 40, 11);
    const Fgel = forma(cam, '143d', 540, GL + 40, 11, 15); // a barriga de gelatina por cima do Snorlax do estádio
    const mkq = ator(cam, 129, { escala: 8, z: 14, x: 170, y: 1000 });
    medalha(mkq, 0, -70, 0.75);
    const apito = div(mkq.corpo, 'apito');
    gsap.set(apito, { x: 4, y: -58 });
    apito.style.zIndex = 3;
    const pkq = ator(cam, 25, { escala: 10, z: 14, x: 540, y: 1580 });
    const rv = ator(cam, RIVAL.id, { escala: 11, z: 14, x: 540, y: 2250 });
    const bl = bola(cam, { d: 88, z: 16, x: 540, y: 1440 });
    const chamas = [0, 1].map((k) => {
      const c = div(bl.corpo, 'chama');
      c.style.background = `radial-gradient(ellipse at 50% 30%, ${RIVAL.fogo[0]} 0 18%, ${RIVAL.fogo[1]} 42%, ${RIVAL.fogo[2]} 66%, transparent 70%)`;
      if (k) gsap.set(c, { scale: 0.7, x: 0, y: 20 });
      bl.corpo.prepend(c);
      return c;
    });
    const fila = torcida($('frente'), { ids: window.TORCIDA.filter((id) => id !== 132) });
    const poe = (t, x, y) => {
      tl.set(bl.el, { opacity: 1, x, y }, t);
      tl.set(bl.corpo, { y: 0, scale: 1 }, t);
      tl.set(bl.sh, { scale: 1, opacity: 1 }, t);
    };
    const some = (t) => tl.set(bl.el, { opacity: 0 }, t);
    const voo = (t0, t1, x, y, alto = 140, chega = 60, voltas = 2, ease = 'none') => {
      mover(bl, t0, t1, x, y, ease);
      tl.to(bl.gira, { rotation: `+=${360 * voltas}`, duration: t1 - t0, ease }, t0);
      tl.to(bl.corpo, { keyframes: { y: [-alto, -chega] }, duration: t1 - t0, ease }, t0);
      tl.to(bl.sh, { keyframes: { scale: [0.6, Math.max(0.5, 1 - chega / 400)] }, duration: t1 - t0, ease }, t0);
    };
    const rede = (t, y = GL - 120) => {
      estouro(tl, cam, 540, y, t, { tam: 220, cor: '#ffcb05' });
      tl.fromTo('#rede', { scaleY: 1 }, { keyframes: { scaleY: [1.35, 0.9, 1.1, 1] }, duration: 0.5, ease: 'none', immediateRender: false }, t);
    };
    const tremer = (t, f, d = 0.3) => treme(tl, ['#cam', '#frente'], t, f, d);
    // o Snorlax do banco dorme o curta inteiro
    anim(tl, snq, 'Sleep', 0, 0, T(26, 0), { id: '143x', vel: 0.5 });
    // a tentativa: a cortina vermelha fecha no fim do bloco anterior, carimba TENTATIVA n e abre no 1 do compasso A
    // (na quadra de treino vazia); o Magikarp apita; a placa vira um selo no canto até o júri
    const tentativa = (A, n) => {
      const tA = T(A, 0);
      const tF = tA - 0.6;
      ver('#cortinas', tF);
      tl.fromTo('#pano-e', { x: -620 }, { x: 0, duration: 0.22, ease: 'power2.in', immediateRender: false }, tF);
      tl.fromTo('#pano-d', { x: 620 }, { x: 0, duration: 0.22, ease: 'power2.in', immediateRender: false }, tF);
      tl.fromTo('#bambinela', { y: -170 }, { y: 0, duration: 0.22, ease: 'power2.out', immediateRender: false }, tF);
      treme(tl, ['#pano-e', '#pano-d'], tF + 0.22, 0.4, 0.2);
      tl.set('#placa', { opacity: 1, scale: 1, x: 0, y: 0 }, tF);
      tl.set('#placa b, #placa-n', { opacity: 0 }, tF);
      tl.set('#placa-n', { textContent: String(n) }, tF);
      carimbo('#placa b', tF + 0.2);
      carimbo('#placa-n', tF + 0.34, undefined, 2.6);
      flash(tl, tF + 0.34, 0.3, 0.2);
      tl.to('#pano-e', { x: -620, duration: 0.4, ease: 'power2.out' }, tA);
      tl.to('#pano-d', { x: 620, duration: 0.4, ease: 'power2.out' }, tA);
      tl.fromTo('.pano', { skewX: 0 }, { keyframes: { skewX: [0, 3, -2, 1, 0] }, duration: 0.4, ease: 'none', immediateRender: false }, tA);
      tl.to('#bambinela', { y: -170, duration: 0.35, ease: 'power2.in' }, tA + 0.05);
      ver('#cortinas', tA + 0.45, false);
      tl.to('#placa', { scale: 0.3, x: -370, y: -600, duration: 0.3, ease: 'power2.inOut' }, tA + 0.3);
      salto(mkq, tA, 70, 0.3);
      estouro(tl, mkq.corpo, 0, -60, tA, { tam: 110, cor: '#fff' });
    };
    const tiraPlaca = (t) => tl.to('#placa', { opacity: 0, duration: 0.2 }, t);
    // troca debaixo da cortina fechada (do banco pra quadra, sem a câmera virar)
    const trocaPraQuadra = (t, placas) => {
      ver('#juri', t, false);
      op(placas, t, false);
      ver('#quadra', t);
    };
    ver('#cortinas', 0, false);
    some(0);
    for (const F of [Fpeq, Fon, Fper, Fest, Fgel]) op([F.a.el, F.b.el], 0, false);
    op(rv.el, 0, false);

    // ====================================================================================================
    // o júri no banco: Magikarp de frente com a medalha, Snorlax (o do EP 1, dormindo) e Pikachu, atrás da mesa
    // ====================================================================================================
    const mk = ator(jc, 129, { escala: 19, z: 10, x: 200, y: 1360, sombra: false });
    const sn = ator(jc, 143, { escala: 21, z: 9, x: 540, y: 1440, sombra: false });
    const pk = ator(jc, 25, { escala: 18, z: 10, x: 880, y: 1400, sombra: false });
    medalha(mk, 0, -190, 1.5);
    const placaJ = (x, n) => {
      const p = div(jc, 'placa');
      p.innerHTML = `<div class="cabo"></div><div class="cartao${n === 10 ? ' dez' : ''}">${n}</div>`;
      gsap.set(p, { x, y: 1500 });
      return p;
    };
    const ALTO = [830, 800, 850];
    const dorme = (t0, t1) => {
      quadro(tl, sn, 'Idle', 0, 0, t0);
      const n = Math.max(2, Math.round((t1 - t0) / 0.45));
      tl.fromTo(sn.corpo, { scaleY: 1, scaleX: 1 }, { keyframes: { scaleY: Array.from({ length: n }, (_, i) => (i % 2 ? 1 : 1.05)), scaleX: Array.from({ length: n }, (_, i) => (i % 2 ? 1 : 0.98)) }, duration: t1 - t0, ease: 'sine.inOut', immediateRender: false }, t0);
    };

    // ====================================================================================================
    // 0 · a roleta já girando no 1º quadro; trava no Ditto (linha 10, o BOING)
    // ====================================================================================================
    ver(['#vest', '#quadra', '#juri'], 0, false);
    const ROSTOS = ['143', '150', '6', '94', '7', '25', '1', '113', '129', '39', '54', '79', '95', '143', '150', '6', '94', '7', '132'];
    const fita = $('fita');
    fita.innerHTML = ROSTOS.map((r) => `<img src="midia/${r}.png" alt="" />`).join('');
    const tTrava = T(0, 10);

    }
    flash(tl, FIM, 0.6, 0.3);
    tl.set('#logo', { opacity: 1 }, FIM);
    tl.fromTo('#logo', { scale: 0.7 }, { scale: 1, duration: 0.45, ease: 'back.out(3)', immediateRender: false }, FIM);
    piscada(tl, [T(27, 2), T(27, 4), T(27, 6)], '#final-cena');
    tl.set('#tag', { opacity: 1 }, T(27, 6));
    tl.from('#tag', { scale: 1.6, duration: 0.25, ease: 'back.out(2)' }, T(27, 6));
    tl.to(['#site', '#credito'], { opacity: 1, duration: 0.2 }, T(27, 7));
    tl.fromTo('#teaser', { scaleX: 1, scaleY: 1 }, { keyframes: { scaleX: [1.2, 0.92, 1.06, 1], scaleY: [0.82, 1.08, 0.96, 1] }, duration: 0.5, ease: 'none', immediateRender: false }, T(27, 12));

    // nada parado: a câmera de fora respira devagar (vai e volta 4% por compasso, em linha reta, presa perto do topo
    // pra não cortar o placar e o selo da tentativa: o freezedetect pegava os planos em que só a bola mexia)
    const nb = 24;
    tl.fromTo('#cena', { scale: 1, y: 0 }, {
      keyframes: { scale: Array.from({ length: nb }, (_, b) => (b % 2 ? 1 : 1.04)), y: Array.from({ length: nb }, () => 0) },
      duration: T(26, 0) - T(2, 0), ease: 'none', easeEach: 'none', transformOrigin: '540px 300px', immediateRender: false,
    }, T(2, 0));

    window.__timelines = window.__timelines || {};
    window.__timelines.root = tl;
  </script>
</div>
</body>
</html>
