<!doctype html>
<!--

<html lang="pt-BR">

<style>
.cena { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; visibility: hidden; }
.estudio { background: #0b1030; }
/* o telão atrás da bancada (v8: sobe pra 330, o conteúdo fica acima das cabeças da dupla; v11: mais estreito, entre as
   pilhas de monitores, e dividido em 6 telas como uma parede de vídeo) */
.telao { position: absolute; left: 160px; top: 330px; width: 760px; height: 560px; box-sizing: border-box; overflow: hidden; border-radius: 26px;

.telao > .tela { position: absolute; inset: 0; opacity: 0; display: flex; align-items: flex-start; justify-content: center; }
.telao .marca img { width: 250px; margin-top: 40px; filter: drop-shadow(0 12px 0 #0e1430); }
/* a bancada (a da dupla e a ponta do convidado) */
.mesa-n { position: absolute; left: 60px; top: 1080px; width: var(--w, 600px); height: 260px; z-index: 30; }
.mesa-n .tampo { position: absolute; left: 0; top: 0; width: 100%; height: 46px; box-sizing: border-box; border-radius: 14px; background: linear-gradient(#fff0a8 0 6px, #ffcb05 6px); border: 8px solid #0e1430; }
.mesa-n .frente { position: absolute; left: 30px; top: 38px; width: calc(100% - 60px); height: 200px; box-sizing: border-box; background: #10183d; border: 8px solid #0e1430; border-top: none;

.mesa-n .frente img { height: 104px; }
.mesa-n .frente i { width: 100px; height: 18px; margin-top: 44px; border-radius: 9px; background: #ffcb05; border: 6px solid #0e1430; }
/* as cadeiras, vinho escuro */
.cadeira { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 8; }
.cadeira .encosto { position: absolute; left: -120px; top: -330px; width: 240px; height: 260px; box-sizing: border-box; border-radius: 30px 30px 14px 14px; background: #5a1c26; border: 8px solid #0e1430; box-shadow: inset 0 -16px 0 #3e121a; }
.cadeira .assento { position: absolute; left: -150px; top: -90px; width: 300px; height: 60px; box-sizing: border-box; border-radius: 16px; background: #5a1c26; border: 8px solid #0e1430; box-shadow: inset 0 -12px 0 #3e121a; z-index: 30; }
.cadeira .pe { position: absolute; left: -14px; top: -40px; width: 28px; height: 200px; background: #2b3045; border: 7px solid #0e1430; }
.cadeira .base { position: absolute; left: -100px; top: 150px; width: 200px; height: 28px; border-radius: 14px; background: #2b3045; border: 7px solid #0e1430; }
.piso-n { position: absolute; left: 0; top: 1240px; width: 1080px; height: 680px; background: linear-gradient(#1a2350, #0b1028); box-shadow: inset 0 14px 0 rgb(0 0 0 / 35%); }
/* a prancheta queimada do Psyduck (a do EP 2) */
.prancheta { position: absolute; left: 0; top: 0; width: 140px; height: 180px; box-sizing: border-box; z-index: 5; border: 8px solid #0e1430; border-radius: 10px;
  background: radial-gradient(circle at 75% 80%, #120804 0 16%, transparent 28%), linear-gradient(#5a3a1e, #3a2410); }

  clip-path: polygon(0 0, 100% 0, 100% 62%, 84% 76%, 70% 68%, 52% 88%, 34% 82%, 18% 100%, 0 100%); }
.prancheta::after { content: ""; position: absolute; left: 38px; top: -16px; width: 48px; height: 26px; box-sizing: border-box; background: #6e6e78; border: 6px solid #0e1430; border-radius: 6px; }
/* o estúdio é mais largo que a tela: nos planos fechados (e no do convidado) a câmera vai além das bordas */
#cam .piso-n { left: -900px; width: 2680px; }
/* o microfone do repórter, num pedestal na frente dele */
.pedestal { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.pedestal svg { position: absolute; left: 0; top: -200px; width: 200px; height: 230px; overflow: visible; }
/* a varrida (v11: só 2 no vídeo, faixas diagonais vermelhas e amarelas, como vinheta de esporte; a cartinha ficou só na
   abertura) */
#varre { position: absolute; left: -1060px; top: -640px; width: 3200px; height: 3200px; z-index: 90; display: flex; justify-content: center; pointer-events: none; }
#varre i { flex: none; height: 100%; box-sizing: border-box; border-left: 18px solid #0e1430; }
/* o zoom da v11: a cena 12% maior, descendo, pra ocupar o terço de baixo sem entrar nas safe zones */
.zoom { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 413px; transform: scale(1.12); }
/* o estúdio (v11): parede escura, as pilhas de monitores dos lados do telão, as luzes no teto e o reflexo no piso */
.set-n { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.set-n .parede-e { position: absolute; left: -900px; top: -200px; width: 2680px; height: 1440px;
  background: repeating-linear-gradient(90deg, rgb(255 255 255 / 3%) 0 6px, transparent 6px 180px), linear-gradient(#070b22, #121b48 55%, #0e1638); }
.set-n .rodape { position: absolute; left: -900px; top: 960px; width: 2680px; height: 40px; background: #0a0f2a; box-shadow: 0 -6px 0 #2a4ea0; }
.mon { position: absolute; width: 200px; height: 150px; box-sizing: border-box; border: 10px solid #0e1430; border-radius: 10px; background: #0e1430; box-shadow: 0 0 0 5px #2b3045, 0 12px 0 5px rgb(0 0 0 / 35%); overflow: hidden; }

.mon .brilho-m { position: absolute; inset: 0; background: linear-gradient(135deg, rgb(255 255 255 / 16%) 0 22%, transparent 22%); }
.cone-n { position: absolute; top: -200px; width: 520px; height: 1400px; mix-blend-mode: screen; transform-origin: 50% 0; clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%);
  background: linear-gradient(rgb(255 246 200 / 22%), rgb(255 246 200 / 0%) 85%); }
.lata { position: absolute; top: -40px; width: 110px; height: 70px; box-sizing: border-box; border-radius: 0 0 18px 18px; background: #2b3045; border: 8px solid #0e1430; }
.lata::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 4px; height: 14px; border-radius: 6px; background: #fff6c8; }
.reflexo { position: absolute; left: -560px; top: 1318px; width: 2000px; height: 120px; background: linear-gradient(rgb(255 203 5 / 13%), transparent); }
.telao .bezel { position: absolute; inset: 0; z-index: 8; pointer-events: none;
  background: linear-gradient(90deg, transparent calc(33.3% - 4px), #0e1430 calc(33.3% - 4px) calc(33.3% + 4px), transparent calc(33.3% + 4px) calc(66.6% - 4px), #0e1430 calc(66.6% - 4px) calc(66.6% + 4px), transparent calc(66.6% + 4px)),
    linear-gradient(transparent calc(50% - 4px), #0e1430 calc(50% - 4px) calc(50% + 4px), transparent calc(50% + 4px)); }
/* o logo do programa na frente da bancada */
.logo-mesa { position: relative; display: flex; align-items: center; gap: 10px; height: 64px; padding: 0 10px 0 14px; box-sizing: border-box; border-radius: 0 0 12px 12px; background: #10183d; border: 6px solid #0e1430; border-top: none; box-shadow: inset 0 -4px 0 #ffcb05; }
.logo-mesa img { width: 200px; }
.logo-mesa b { height: 40px; padding: 0 8px 0 18px; background: #e8423f; color: #fff; font-size: 28px; letter-spacing: 10px; line-height: 40px; border-radius: 6px; -webkit-text-stroke: 7px #0e1430; paint-order: stroke fill; }

.papeis { position: absolute; width: 0; height: 0; z-index: 32; }
.papeis .deitado { position: absolute; left: -70px; top: -24px; width: 140px; height: 24px; box-sizing: border-box; border: 5px solid #0e1430; border-radius: 4px; transform: skewX(-24deg);
  background: repeating-linear-gradient(#f8f8f0 0 5px, #c8d0f0 5px 7px); }
.papeis .empe { position: absolute; left: -58px; top: -150px; width: 116px; height: 150px; box-sizing: border-box; border: 6px solid #0e1430; border-radius: 6px; opacity: 0; transform-origin: 50% 100%;
  background: repeating-linear-gradient(transparent 0 24px, #c8d0f0 24px 28px) 0 14px / 100% calc(100% - 28px) no-repeat, #f8f8f0; box-shadow: 10px -8px 0 -6px #e4e4da, 10px -8px 0 0 #0e1430; }
/* o quadro gráfico da notícia no close (OTS): ao lado da cabeça de quem chama a matéria */
.ots { position: absolute; top: 720px; width: 360px; height: 270px; z-index: 40; box-sizing: border-box; overflow: hidden; border-radius: 18px; border: 12px solid #0e1430; opacity: 0;

.ots > .tela { position: absolute; inset: 0; opacity: 0; display: flex; align-items: flex-start; justify-content: center; }
.ots .tv { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
.ots .ver { flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.ots .ver b { font-size: 76px; letter-spacing: 3px; -webkit-text-stroke-width: 12px; }
.ots .ver em { font-style: normal; font-size: 52px; letter-spacing: 2px; -webkit-text-stroke-width: 10px; }
.ots .rec-charanga { margin-top: 14px; transform: scale(0.43); transform-origin: 50% 0; }
/* a capa (?capa=1): a manchete grande, dentro do recorte 3:4 do perfil */
#capa { position: absolute; left: 50px; top: 1250px; width: 980px; z-index: 95; display: none; flex-direction: column; align-items: flex-start; gap: 14px; }
#capa small { padding: 6px 26px; border-radius: 14px; background: #e8423f; border: 8px solid #0e1430; color: #fff; font-size: 54px; letter-spacing: 6px; }
/* a placa azul (v11b) segura o contraste da manchete sobre o banco e o piso, qualquer que seja o recorte */
#capa b { padding: 6px 30px 16px; border-radius: 18px; background: #10183d; border: 8px solid #0e1430; box-shadow: 0 12px 0 rgb(0 0 0 / 45%); font-size: 102px; line-height: 1.08; color: #fff; letter-spacing: 2px; -webkit-text-stroke: 18px #0e1430; paint-order: stroke fill; text-shadow: 0 12px 0 #0e1430; }

/* a porta do estúdio (o "e mais" da escalada) */
.porta { position: absolute; left: 300px; top: 380px; width: 480px; height: 880px; box-sizing: border-box; border-radius: 18px 18px 0 0; background: linear-gradient(90deg, #8a5a32, #a06a3c 50%, #8a5a32);
  border: 12px solid #0e1430; box-shadow: 0 0 0 10px #3a2a20, 0 0 0 18px #0e1430; z-index: 5; }
.porta .vidro { position: absolute; left: 60px; top: 60px; width: 336px; height: 420px; box-sizing: border-box; overflow: hidden; border: 10px solid #0e1430; border-radius: 10px;

.porta .macaneta { position: absolute; left: 380px; top: 500px; width: 44px; height: 44px; border-radius: 50%; background: #ffcb05; border: 8px solid #0e1430; }
.porta .luz { position: absolute; left: 150px; top: -110px; width: 156px; height: 60px; border-radius: 12px; background: #e8423f; border: 8px solid #0e1430; box-shadow: 0 0 40px 10px rgb(232 66 63 / 55%); }
/* a manchete fixa em cima, com o nome do bloco */
#manchete { position: absolute; left: 40px; top: 214px; width: 1000px; height: 100px; z-index: 85; opacity: 0; filter: drop-shadow(0 10px 0 rgb(0 0 0 / 40%)); }

/* a caixa de diálogo na largura toda (termina em 946, fora da faixa dos botões) e o retrato PMD em cima dela, à esquerda */
#caixa { position: absolute; left: 28px; top: 1380px; width: 918px; height: 212px; box-sizing: border-box; z-index: 85; opacity: 0; background: #f8f8f0; border: 10px solid #0e1430; border-radius: 24px;
  box-shadow: inset 0 0 0 7px #f8f8f0, inset 0 0 0 13px #4a6ac8, 0 14px 0 rgb(0 0 0 / 45%); }
#caixa .nome { position: absolute; left: 226px; top: -60px; height: 60px; padding: 0 26px; box-sizing: border-box; display: flex; align-items: center; background: #10183d; color: #ffcb05;

#caixa .txt { position: absolute; left: 32px; right: 30px; top: 32px; bottom: 24px; color: #1c2238; font-size: 43px; line-height: 1.32; letter-spacing: 0; opacity: 0; }

#caixa .seta { position: absolute; right: 22px; bottom: 22px; width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 22px solid #e8423f; opacity: 0; }

#retrato .todos img { position: static; width: 80px; height: 80px; border-radius: 0; opacity: 1; }
/* as telas do jogo num painel com moldura */
.moldura { position: absolute; z-index: 20; box-sizing: border-box; border-radius: 22px; border: 12px solid #0e1430; background: #0e1430; overflow: hidden;
  box-shadow: 0 0 0 8px #ffcb05, 0 0 0 16px #0e1430, 0 26px 0 14px rgb(0 0 0 / 45%); opacity: 0; }

video.painel { position: absolute; z-index: 21; border-radius: 10px; }

.moeda { position: absolute; left: 0; top: 0; width: 70px; height: 70px; margin: -35px 0 0 -35px; z-index: 40; box-sizing: border-box; border-radius: 50%; background: radial-gradient(circle at 38% 35%, #fff3a0, #ffcb05 45%, #d99a00);

.brilho-n { position: absolute; left: 0; top: 0; width: 60px; height: 60px; margin: -30px 0 0 -30px; background: #fff; z-index: 45; opacity: 0;

   (logo-horizontal.svg, não escrito em fonte), a faixa vermelha com NEWS e o #1. Cores chapadas, sem brilho borrado. */
.vinheta-n { background: radial-gradient(circle at 50% 45%, #2a3a7a, #070a18 72%); }

.fb { position: absolute; left: -760px; top: -400px; width: 2600px; height: 900px; z-index: 2; transform: rotate(-24deg); border-top: 16px solid #0e1430; border-bottom: 16px solid #0e1430; }

.logo-v .faixa-r { position: absolute; left: 26px; right: 26px; top: 236px; height: 116px; background: #e8423f; box-shadow: inset 0 -12px 0 #b22b29; }

.faixa { position: absolute; left: -100px; width: 1280px; height: 120px; transform: rotate(-8deg); border-top: 10px solid #0e1430; border-bottom: 10px solid #0e1430; }

/* ESCALADA */
.esc-bg { background: radial-gradient(circle at 50% 50%, #3a2a7a, #0b0a20 75%); }
#hoje { position: absolute; left: 40px; top: 150px; width: 1000px; height: 170px; z-index: 60; box-sizing: border-box; border-radius: 30px; background: #e8423f; border: 12px solid #0e1430;

      // o Voltorb reage quando falam dele: pisca vermelho e brilha como um pavio (3 pulsos acelerando, a aura cresce),

    // ===================== a manchete, o selo do canal, a caixa e o retrato =====================
    const barra = $('barra');

    const fade = (els, a, z) => {

      for (const bt of BEATS.filter((x) => x.s >= a && x.s < fim)) {

    for (const [a, z] of [[M.abertura, M.escalada], [M.plantao, M.final]]) fade('#bug', a, z);

    const CAIXA = $('caixa');
    const RET = $('retrato');
    // v10: sem a tarja GC; o cargo do repórter e do convidado vai na aba de nome da caixa
    const NOMES = { raichu: 'RAICHU', machoke: 'MACHOKE', meowth: 'MEOWTH · REPÓRTER', charmeleon: 'CHARMELEON · EX-CAPITÃO', todos: 'TODOS' };
    const ROSTO = {};
    const rosto = (r) => {
      if (ROSTO[r]) return ROSTO[r];
      if (r === 'todos') {
        ROSTO[r] = div(RET, 'todos');
        ROSTO[r].innerHTML = ['26-joyous', '67-joyous', '52-joyous'].map((x) => `<img src="midia/${x}-g.png" alt="" />`).join('');
      } else {
        ROSTO[r] = document.createElement('img');
        ROSTO[r].src = /^(26|52|67)/.test(r) ? `midia/${r}-g.png` : `midia/${r}.png`; // v2: com o gorro
        RET.appendChild(ROSTO[r]);
      }
      return ROSTO[r];
    };
    // o retrato troca em crossfade (0,2 s), com um leve pulo de escala; resolvidos em ordem de tempo no fim
    const ROSTOS = [];
    const mostraRosto = (r, t) => ROSTOS.push([t, rosto(r)]);
    function resolveRostos() {
      let atual = null;
      for (const [t, el] of ROSTOS.sort((a, b) => a[0] - b[0])) {
        if (el === atual) continue;
        if (atual) tl.fromTo(atual, { opacity: 1 }, { opacity: 0, duration: 0.16, ease: 'power2.in', immediateRender: false }, t);
        tl.fromTo(el, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.22, ease: 'back.out(2)', immediateRender: false }, t);
        atual = el;
      }
    }
    const abre = (els, t) => tl.fromTo(els, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.24, ease: 'power3.out', stagger: 0.04, immediateRender: false }, t);
    const fecha = (els, t) => tl.fromTo(els, { opacity: 1, y: 0 }, { opacity: 0, y: 24, duration: 0.2, ease: 'power2.in', immediateRender: false }, t);
    tl.set([CAIXA, RET], { opacity: 0 }, 0);

      const ant = FALAS[k - 1];

      if (!ant || ant.z < troca - 0.01) abre([RET, CAIXA], troca);

      tl.set('#nome', { textContent: NOMES[f.quem] }, troca);
      for (const [t, r] of f.rostos) mostraRosto(r, t === f.a ? troca : t);
      f.paginas.forEach((p, n) => {

    $('varre').innerHTML = [['#e8423f', 180], ['#ffcb05', 120], ['#e8423f', 1200], ['#ffcb05', 160], ['#e8423f', 140], ['#ffcb05', 220]]

    /** Quem fala: um pulinho só no começo da fala e um balanço leve do corpo (a partir do pé) enquanto a caixa digita. */

    const brilho = (A) => {
      const aura = document.createElement('div');

      gsap.set(A.corpo, { filter: PAZ });

    /** A Eviolite flutuando em cima de quem segura. */
    const evioFlut = (pai, x, y, w = 150) => {

    // ===================== 0–2 · o gancho: o clipe do jogo (o pacote rasgando e o clarão dourado do walkout), corte seco =====================
    corta('#fundo', 0);

    // ===================== 2–4,5 · VINHETA DE ABERTURA (v10: 3 alternativas, o Miguel escolhe) =====================
    // A: a bola de pixel do jogo (a do ensureBallTexture, 18 x 18) grande, girando quadro a quadro, com linhas de luz em

    // B: sem bola: faixas de cor da marca varrem a tela na diagonal e o logo monta em camadas no meio.
    // C: a cartinha da marca (a das transições) gira cada vez mais rápido e, de lado, vira o logo.
    // Nas 3, o logo montado é o mesmo: a placa, o logo do jogo, a faixa vermelha com NEWS e o #1 carimbando em 3,85 s.
    {
      const t0 = M.vinheta;
      const d = M.abertura - t0;
      const V = VINHETA.toUpperCase();
      corta('#vin', t0);
      gsap.set(`#vin${V}`, { visibility: 'visible' });
      flash(tl, t0, 0.5, 0.25);

      // o logo montado (o mesmo nas 3): tP = quando a placa já está no lugar

        tl.fromTo('#n1', { scale: 2.4, rotation: -20 }, { scale: 1, rotation: 6, duration: 0.22, ease: 'back.out(2.5)', immediateRender: false }, t0 + 1.85);
        estouro(tl, $('logo-v'), 845, -5, t0 + 1.88, { tam: 240 });
        tl.fromTo('#logo-v', { scale: 1 }, { scale: 1.03, duration: t0 + d - tP, ease: 'sine.out', immediateRender: false }, tP);

        // a bola do jogo em pixel (court.ts: o círculo de raio 8, o pentágono no meio e os 5 gomos na borda), 30 px por
        // pixel; 8 quadros girando 72° (a bola tem simetria de 5), a 12 quadros por segundo
        const bolaPx = (th) => {
          const c = 9;
          const pent = Array.from({ length: 5 }, (_, i) => { const a = -Math.PI / 2 + th + (i * 2 * Math.PI) / 5; return [c + Math.cos(a) * 2.9, c + Math.sin(a) * 2.9]; });
          const gomos = Array.from({ length: 5 }, (_, i) => { const a = -Math.PI / 2 + Math.PI / 5 + th + (i * 2 * Math.PI) / 5; return [c + Math.cos(a) * 6.9, c + Math.sin(a) * 6.9]; });
          const noPent = (x, y) => {
            const lados = pent.map(([x1, y1], i) => { const [x2, y2] = pent[(i + 1) % 5]; return Math.sign((x2 - x1) * (y - y1) - (y2 - y1) * (x - x1)); });
            return lados.every((v) => v >= 0) || lados.every((v) => v <= 0);
          };
          let o = '';
          for (let j = 0; j < 18; j++)
            for (let i = 0; i < 18; i++) {
              const x = i + 0.5;
              const y = j + 0.5;
              const r = Math.hypot(x - c, y - c);
              if (r > 8.5) continue;
              let cor = '#f4f1e6';
              if (r > 7.4) cor = '#0e1430';
              else if (noPent(x, y) || gomos.some(([a, b]) => Math.hypot(x - a, y - b) < 1.45)) cor = '#1d1d1d';
              else if (x - c + (y - c) > 6.2) cor = '#a6aed6';
              else if (x - c + (y - c) < -6.5) cor = '#ffffff';
              o += `<rect x="${i}" y="${j}" width="1" height="1" fill="${cor}"/>`;
            }
          return `<svg viewBox="0 0 18 18" shape-rendering="crispEdges">${o}</svg>`;
        };
        const B = $('bolapx');
        B.innerHTML = Array.from({ length: 8 }, (_, k) => bolaPx((k * 2 * Math.PI) / 5 / 8)).join('');
        const qs = [...B.children];

        tl.fromTo(B, { scale: 0 }, { scale: 1, duration: 0.25, ease: 'steps(5)', immediateRender: false }, t0);

        // as linhas de luz em pixel: blocos com rastro (branco, amarelo, laranja), andando em degraus
        const luz = (y, dir, t, w = 1) => {

          l.innerHTML = [[30, '#ff8a1c'], [60, '#ff8a1c'], [120, '#ffcb05'], [240, '#ffffff']].map(([x, c]) => `<i style="width:${x * w}px;background:${c}"></i>`).join('');
          tl.fromTo(l, { x: dir > 0 ? -620 : 1100 }, { x: dir > 0 ? 1100 : -620, duration: 0.5, ease: 'steps(10)', immediateRender: false }, t);

        luz(930, -1, t0 + 0.14);
        luz(1000, 1, t0 + 0.28, 0.7);

        monta(t0 + 1.2);
      } else if (V === 'B') {
        // as faixas de cor da marca varrem a tela na diagonal, uma atrás da outra; duas faixas finas ficam atrás do logo
        gsap.set('#logo-v', { y: -250 });
        ['#ffcb05', '#e8423f', '#3a7bd5', '#0e1430'].forEach((cor, k) => {
          const f = div($('vinB'), 'fb', `background:${cor};z-index:${2 + k}`);
          tl.fromTo(f, { x: 2300 }, { x: -2900, duration: 0.6, ease: 'power2.inOut', immediateRender: false }, t0 + 0.02 + k * 0.09);
        });
        [['#ffcb05', 890, 1], ['#e8423f', 960, -1]].forEach(([cor, y, s], k) => {
          const f = div($('vinB'), 'fb-fina', `top:${y}px;background:${cor}`);
          tl.fromTo(f, { x: s * 1700 }, { x: 0, duration: 0.3, ease: 'power3.out', immediateRender: false }, t0 + 0.62 + k * 0.06);
        });
        tl.fromTo('#placa-v', { opacity: 1, x: -1200, skewX: -12 }, { x: 0, skewX: 0, duration: 0.3, ease: 'power3.out', immediateRender: false }, t0 + 0.72);
        tl.fromTo('#placa-v', { scaleY: 1 }, { keyframes: { scaleY: [1, 0.9, 1] }, duration: 0.2, ease: 'sine.inOut', immediateRender: false }, t0 + 1.02);
        monta(t0 + 1.0);
      } else {
        // a cartinha gira no eixo Y cada vez mais rápido; de lado (90°) ela some e a placa do logo vira pra frente
        gsap.set('#logo-v', { y: -250 });
        const G = $('carta-c').querySelector('.gira');
        tl.fromTo('#carta-c', { scale: 0.2, rotation: -30, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.3, ease: 'back.out(1.8)', immediateRender: false }, t0);

      faisca(FC, 470, 1050, t0 + 1.5, 1.1);
      faisca(FC, 720, 1030, t0 + 1.9, 0.9);
    }

    // a câmera nunca para (nenhum quadro parado por 0,5 s): um balanço leve e contínuo, em velocidade constante, das
    // câmeras das cenas e dos painéis (o clipe do jogo vai junto com o #pan, pra não sair da moldura). Vai na propriedade
    // CSS `translate`, separada do transform que os planos e os empurrões já animam; a caixa, a manchete e o retrato ficam firmes
    const BALANCO = [[-8, -6], [8, -2], [5, 6], [-7, 3]];
    for (const [alvos, k] of [[['#cam', '#rota-cam', '#esc .cartela', '#hoje', '#fim-cena'], 1], [['#pan', '#v-pacote', '#v-brock'], 1.2]]) {
      const kf = [...BALANCO.slice(1), BALANCO[0]].map(([x, y]) => ({ translate: `${x * k}px ${y * k}px`, duration: 0.6, ease: 'none' }));
      tl.fromTo(alvos, { translate: `${BALANCO[0][0] * k}px ${BALANCO[0][1] * k}px` }, { keyframes: kf, ease: 'none', repeat: Math.ceil(FIM / 2.4), immediateRender: false }, 0);
    }
    // as luzinhas piscam em 2 grupos, alternando a cada 0,5 s
    for (let t = 0, k = 0; t < FIM; t += 0.5, k++) {
      tl.set(LUZES[k % 2], { opacity: 1 }, t);
      tl.set(LUZES[(k + 1) % 2], { opacity: 0.3 }, t);
    }
    resolveTrocas();
    resolveRostos();
    tl.set({}, {}, FIM);
    window.__timelines = window.__timelines || {};
    window.__timelines.root = tl;
  </script>
  <script>
    // as durações fixas no HTML têm que bater com a linha do tempo (linha.mjs): o qa-quadros mostra o erro
    {
      const L = window.LINHA;
      const d = Number(document.getElementById('root').dataset.duration);
      const erros = [];
      if (Math.abs(d - L.FIM) > 0.01) erros.push(`data-duration ${d} ≠ FIM ${L.FIM}`);
      for (const [id, c] of Object.entries(L.CLIPES)) {
        const v = document.getElementById(id).dataset;
        if (Math.abs(Number(v.start) - c.s) > 0.01 || Math.abs(Number(v.duration) - (c.z - c.s + L.SAIDA)) > 0.01) erros.push(`${id} fora da linha do tempo`);
      }
      if (erros.length) setTimeout(() => { throw new Error(`linha do tempo desatualizada: ${erros.join('; ')}`); });
    }
  </script>
</div>
