<!doctype html>
<!--
  Soccermon News #1 v11 (9:16, 86,2 s): telejornal com a dupla Raichu e Machoke de terno na bancada. A linha do tempo
  inteira sai de linha.mjs (midia/som/news-falas.js: window.LINHA), a mesma que a música e os blips usam; ROTEIRO.md
  tem a tabela.
  Regra de leitura (v9): a caixa de diálogo tem a largura toda e o retrato PMD fica em cima dela, à esquerda; 1 letra a
  cada 25 ms, cada fala no mínimo 2,7 s na tela e 1,8 s inteira depois de digitar.
  v9: a vinheta de abertura nova (a bola girando como globo, faixas de luz e o logo montando em camadas com o brilho),
  sem relógio (o selo do canal; o AO VIVO só no link da Rota), sem a sonora do Magikarp e sem o atraso no sinal, a Rota
  com a barraca do Mercado, a torcida e os holofotes, a entrevista com o Psyduck no vestiário do Pallet FC (o Voltorb de
  colete no banco atrás), o Voltorb reagindo quando falam dele, PRA FECHAR no lugar de NOTA PÉ, e toda troca de cena,
  painel, caixa, retrato e tela do telão com easing de 200 a 300 ms.
  Só 2 transições com a cartinha (a varrida: escalada e VEM AÍ).
  v10: "texto, coisinha, texto": entre os blocos de fala, um beat sem texto (BEATS do linha.mjs: a caixa fecha e a
  manchete sai); texto só na caixa e numa manchete por vez (saíram as tarjas GC, os preços, as placas e os rótulos);
  uma ação de fundo por vez; o Psyduck de volta à ponta da bancada; 3 vinhetas, o Miguel escolheu a C (?vinheta=a|b|c,
  ou a constante VINHETA).
  v11: o gancho com 2,5 s e a manchete maior; tudo 12% maior e mais baixo (a caixa em 1380, fora das safe zones: 120 px
  em cima, 320 embaixo, 130 à direita de 640 pra baixo); o colete do Voltorb virou um colete amarelo de malha na metade de baixo, com um 12 (v11b; a regata com R em cima
  parecia capacete); as 2
  varridas viraram faixas diagonais vermelhas e amarelas (a cartinha só na vinheta); a Rota sem a barraca; e a cara de
  telejornal: o estúdio novo (pilhas de monitores, o telão em 6 telas, latas de luz, o logo na bancada, o reflexo), o
  close de quem chama a matéria com o quadro gráfico ao lado (OTS: f3, f4, f8, f18), os papéis batendo na mesa no
  encerramento e os quatro sentados na bancada no "Temos que chutar!". ?capa=1 = o quadro da capa.
  Render (de trailer/curtas): ../../scripts/pesado.sh npx hyperframes render news-01 -q high -w 1 --no-browser-gpu -o news-01/render/v11.mp4
-->

  <script>
    const { div, ator, anim, quadro, flash, estouro, telaFinal, piscada, quadra, treme, torcida, torcidaPulo, torcidaAnim } = C;
    const { M, FALAS, BLOCOS, BEATS, FIM, CARTELAS, VARRIDAS, DT, SAIDA } = window.LINHA;
    // a vinheta de abertura: o Miguel escolhe entre A, B e C (a A é o padrão só por ser a primeira; ?vinheta=b troca)
    const VINHETA = new URLSearchParams(location.search).get('vinheta') ?? 'c';
    // ?capa=1: o quadro da capa (o gancho com a manchete grande no recorte 3:4 do perfil; a manchete de cima sai)
    const CAPA = new URLSearchParams(location.search).has('capa');
    const F = Object.fromEntries(FALAS.map((f) => [f.id, f]));
    const tl = gsap.timeline({ paused: true });
    const $ = (id) => document.getElementById(id);
    const ver = (els, t, on = true) => tl.set(els, { autoAlpha: on ? 1 : 0 }, t);
    const CENAS = ['#vin', '#banc', '#rota', '#esc', '#banco-c', '#fundo', '#fim'];
    // v9, nada teleporta: as trocas de cena e de painel são juntadas aqui e resolvidas no fim (resolveTrocas), em ordem de
    // tempo. A cena nova entra por cima num fade de 0,25 s (e um leve recuo da câmera); a que sai some depois. Corte
    // `seco` só onde a varrida da cartinha cobre a tela.
    const TROCAS = [];
    const corta = (ids, t, { seco = false } = {}) => TROCAS.push({ t, on: [ids ?? []].flat(), seco });
    const PAINEIS = ['#m-rec', '#p-trof', '#p-barras', '#p-rota', '#p-cal', '#p-pacote', '#m-vt'];
    const TROCAS_P = [];
    const paineis = (t, ...on) => TROCAS_P.push({ t, on });
    function resolveTrocas() {
      let z = 1;
      let antes = [];
      for (const { t, on, seco } of TROCAS.sort((a, b) => a.t - b.t)) {
        const off = CENAS.filter((c) => !on.includes(c));
        for (const c of on) {
          tl.set(c, { autoAlpha: 1, zIndex: ++z }, t);
          if (!seco && t > 0 && !antes.includes(c)) tl.fromTo(c, { opacity: 0, scale: 1.03 }, { opacity: 1, scale: 1, duration: SAIDA, ease: 'power2.out', immediateRender: false }, t);
        }
        ver(off, seco || t === 0 ? t : t + SAIDA, false);
        antes = on;
      }
      antes = [];
      for (const { t, on } of TROCAS_P.sort((a, b) => a.t - b.t)) {
        for (const p of PAINEIS.filter((p) => !on.includes(p) && antes.includes(p))) {
          tl.to(p, { opacity: 0, duration: 0.2, ease: 'power2.in' }, t);
        }
        for (const p of PAINEIS.filter((p) => !on.includes(p) && !antes.includes(p))) tl.set(p, { opacity: 0 }, t);
        for (const p of on) if (!antes.includes(p)) tl.fromTo(p, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: SAIDA, ease: 'power3.out', immediateRender: false }, t);
        antes = on;
      }
    }
    const entra = (id, t, de = 0.9) => tl.fromTo(id, { scale: de }, { scale: 1, duration: 0.28, ease: 'back.out(1.6)', immediateRender: false }, t);
    const PEDESTAL = '<svg viewBox="0 -200 200 230"><g stroke="#0e1430" stroke-linecap="round">'
      + '<path d="M128 -6 L96 22 M128 -6 L160 22 M128 -6 L128 24" stroke-width="13"/><path d="M128 -6 L96 22 M128 -6 L160 22 M128 -6 L128 24" stroke="#2b3045" stroke-width="6"/>'
      + '<rect x="121" y="-122" width="14" height="120" rx="5" fill="#2b3045" stroke-width="5"/>'
      + '<rect x="117" y="-70" width="22" height="12" rx="4" fill="#e8423f" stroke-width="4"/>'
      + '<path d="M128 -122 L112 -138" stroke-width="13"/><path d="M128 -122 L112 -138" stroke="#2b3045" stroke-width="6"/>'
      + '<g transform="rotate(-38 104 -150)"><rect x="92" y="-160" width="24" height="34" rx="6" fill="#2b3045" stroke-width="5"/>'
      + '<rect x="90" y="-188" width="28" height="34" rx="14" fill="#c8d0f0" stroke-width="5"/><path d="M95 -177h18M94 -169h20M96 -161h16" stroke="#8a94b8" stroke-width="3"/>'
      + '<path d="M80 -158 L88 -166 L134 -166 L126 -158 Z" fill="#3a5bb0" stroke-width="3.5" stroke-linejoin="round"/>'
      + '<path d="M126 -158 L134 -166 L134 -132 L126 -124 Z" fill="#0b1028" stroke-width="3.5" stroke-linejoin="round"/>'
      + '<rect x="80" y="-158" width="46" height="34" rx="3" fill="#10183d" stroke-width="3.5"/>'
      + '<text x="103" y="-133" text-anchor="middle" font-family="Galmuri11" font-weight="700" font-size="21" fill="#ffcb05" stroke="none">SN</text>'
      + '</g></g></svg>';
    const microfone = (a, e = 1, dx = 0) => {
      const m = div(a.el, 'pedestal');
      m.innerHTML = PEDESTAL;
      gsap.set(m, { x: dx, scale: e, transformOrigin: '0px 0px', zIndex: 3 });
      return m;
    };
    const TROFEU = (aceso) => {
      const c = aceso ? '#ffcb05' : '#2a3566';
      const a = aceso ? '#d99a00' : '#3a4570';
      return `<svg viewBox="0 0 100 112"><g stroke="#0e1430" stroke-width="6" stroke-linejoin="round">`
        + `<path d="M24 20 H8 V30 a18 18 0 0 0 20 18" fill="none" stroke-width="14"/><path d="M24 20 H8 V30 a18 18 0 0 0 20 18" fill="none" stroke="${a}" stroke-width="5"/>`
        + `<path d="M76 20 H92 V30 a18 18 0 0 1 -20 18" fill="none" stroke-width="14"/><path d="M76 20 H92 V30 a18 18 0 0 1 -20 18" fill="none" stroke="${a}" stroke-width="5"/>`
        + `<path d="M20 8 H80 V38 a30 30 0 0 1 -60 0 Z" fill="${c}"/><rect x="42" y="66" width="16" height="16" fill="${a}"/><rect x="24" y="82" width="52" height="22" rx="5" fill="${c}"/></g>`
        + (aceso ? '<path d="M32 18 V38" stroke="#fff8d0" stroke-width="7" stroke-linecap="round"/><path d="M50 26 l4 8 9 1 -7 6 2 9 -8 -5 -8 5 2 -9 -7 -6 9 -1 z" fill="#fff3a0" stroke="#0e1430" stroke-width="3"/>' : '')
        + '</svg>';
    };
    const BUMBO = (cor = '#fff', tampa = '#fff', aro = '#fff') =>
      `<svg viewBox="0 0 60 60"><g stroke="#0e1430" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">`
      + `<path d="M14 4 L30 22 M46 4 L30 22" stroke-width="8"/><path d="M14 4 L30 22 M46 4 L30 22" stroke="#c98a4f" stroke-width="3.5"/>`
      + `<path d="M10 28 V46 a20 7 0 0 0 40 0 V28 Z" fill="${cor}"/><path d="M10 44 a20 7 0 0 0 40 0" fill="none" stroke="${aro}" stroke-width="3"/>`
      + `<ellipse cx="30" cy="28" rx="20" ry="7" fill="${tampa}"/></g></svg>`;
    const BOLA = `<svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#fff"/><polygon points="${Array.from({ length: 5 }, (_, i) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5; return `${9 + Math.cos(a) * 3.2},${9 + Math.sin(a) * 3.2}`; }).join(' ')}" fill="#1d1d1d"/>${Array.from({ length: 5 }, (_, i) => { const a = -Math.PI / 2 + Math.PI / 5 + (i * 2 * Math.PI) / 5; return `<circle cx="${9 + Math.cos(a) * 7.2}" cy="${9 + Math.sin(a) * 7.2}" r="1.8" fill="#1d1d1d"/>`; }).join('')}<circle cx="9" cy="9" r="8" fill="none" stroke="#0e1430" stroke-width="1.6"/></svg>`;
    const poe = (el, txt, t, de = 1.5) => {
      tl.set(el, { textContent: txt }, t);
      tl.fromTo(el, { scale: de }, { scale: 1, duration: 0.22, ease: 'back.out(2.5)', immediateRender: false }, t);
    };
    const faisca = (pai, x, y, t, tam = 1) => {
      const br = div(pai, 'brilho-n faisca');
      gsap.set(br, { x, y });
      tl.fromTo(br, { opacity: 1, scale: 0.4 * tam, rotation: 0 }, { scale: 1.5 * tam, rotation: 90, opacity: 0, duration: 0.45, ease: 'power2.out', immediateRender: false }, t);
    };
    /** O colete de treino do Voltorb (v11b: amarelo, na metade branca de baixo, como o corpo dele; a metade vermelha de
     *  cima fica livre, sem nada na cabeça; um 12 pequeno na frente), em pixel na grade da folha (Idle, quadro 0, de
     *  frente), e os olhos fechados. */
    const vestirVoltorb = (V) => {
      const PX = V.escala;
      const X0 = -12 * PX;
      const Y0 = -0.656 * 32 * PX;
      // o colete de malha, um pouco mais largo que a bola (folgado): as cavas sobem dos lados até a linha 16 (fora dos
      // olhos, que vão até a 16 nas colunas 7 a 15), a gola reta na 17 e a barra na 21. O = contorno, Y = malha, S = sombra
      // (do lado direito e embaixo, como o vermelho escuro da folha), N = a gola e as cavas (âmbar escuro: em preto, a
      // gola virava uma faixa preta debaixo dos olhos)
      const MAPA = {
        16: '....OOON........NOOO....',
        17: '....OYYYNNNNNNNNYYSO....',
        18: '....OYYYYYYYYYYYYYSO....',
        19: '.....OYYYYYYYYYYYSO.....',
        20: '......OOYYYYYYYSOO......',
        21: '........OOOOOOOO........',
      };
      const COR = { O: '#000', S: '#c98a00', N: '#8a4a00' };
      const rects = [];
      for (const [r, l] of Object.entries(MAPA))
        [...l].forEach((ch, c) => {
          if (ch === '.') return;
          const cor = COR[ch] ?? ((+r + c) % 2 ? '#ffd52e' : '#ffe680');
          rects.push(`<rect x="${X0 + c * PX}" y="${Y0 + r * PX}" width="${PX}" height="${PX}" fill="${cor}"/>`);
        });
      // o 12, pequeno, no meio da frente (3 x 5 por algarismo)
      const h = PX * 0.42;
      ['.#.###', '##...#', '.#.###', '.#.#..', '######'].forEach((l, j) =>
        [...l].forEach((ch, i) => { if (ch === '#') rects.push(`<rect x="${X0 + 12 * PX - 3.5 * h + (i >= 3 ? i + 1 : i) * h}" y="${Y0 + 18.35 * PX + j * h}" width="${h}" height="${h}" fill="#0e1430"/>`); }));
      const W = 27 * PX;
      const caixa = `viewBox="${-W} ${-W} ${W} ${W}" style="left:${-W}px;top:${-W}px;width:${W}px;height:${W}px" shape-rendering="crispEdges"`;
      div(V.corpo, 'colete').innerHTML = `<svg ${caixa}>${rects.join('')}</svg>`;
      const palp = div(V.corpo, 'colete');
      const olho = (c0) => `<rect x="${X0 + c0 * PX}" y="${Y0 + 13 * PX}" width="${4 * PX}" height="${4 * PX}" fill="#FF875F"/><rect x="${X0 + c0 * PX}" y="${Y0 + 15 * PX}" width="${4 * PX}" height="${PX}" fill="#000"/>`;
      palp.innerHTML = `<svg ${caixa}>${olho(7)}${olho(13)}</svg>`;
      gsap.set(palp, { opacity: 0 });
      quadro(tl, V, 'Idle', 0, 0, 0);
      // o Voltorb reage quando falam dele: pisca vermelho e brilha como um pavio (3 pulsos acelerando, a aura cresce),
      // treme, sua uma gota, fecha os olhos de alívio e volta ao normal (sem explosão)
      const aura = document.createElement('div');
      aura.className = 'aura-v';
      V.el.insertBefore(aura, V.corpo);
      gsap.set(aura, { scale: V.escala / 15, y: (-120 * V.escala) / 15 + 120 });
      const gota = div(V.corpo, 'gota');
      const PAZ = 'brightness(1) sepia(0) saturate(1) hue-rotate(0deg) drop-shadow(0px 0px 0px rgb(255 60 30 / 0%))';
      const QUENTE = 'brightness(1.2) sepia(0.7) saturate(3.2) hue-rotate(-28deg) drop-shadow(0px 0px 26px rgb(255 60 30 / 90%))';
      gsap.set(V.corpo, { filter: PAZ });
      const pisca = (t) => {
        tl.set(palp, { opacity: 1 }, t);
        tl.set(palp, { opacity: 0 }, t + 0.14);
      };
      const reage = (t) => {
        const e = V.escala / 15;
        [0, 0.3, 0.52, 0.68].forEach((d, k) => {
          tl.fromTo(V.corpo, { filter: PAZ }, { filter: QUENTE, duration: 0.07, ease: 'power2.out', immediateRender: false }, t + d);
          tl.fromTo(V.corpo, { filter: QUENTE }, { filter: PAZ, duration: k === 3 ? 0.3 : 0.12, ease: 'power2.in', immediateRender: false }, t + d + 0.07);
          tl.fromTo(aura, { opacity: 0.95, scale: e * (0.7 + 0.15 * k) }, { opacity: 0, scale: e * (1.05 + 0.2 * k), duration: 0.24, ease: 'power2.out', immediateRender: false }, t + d);
        });
        tl.to(V.corpo, { keyframes: { x: [-5, 5, -6, 6, -7, 7, -6, 6, -3, 0] }, duration: 0.85, ease: 'none' }, t + 0.1);
        tl.to(V.corpo, { keyframes: { scaleX: [1, 1.06, 1.1, 1], scaleY: [1, 1.05, 1.08, 1] }, duration: 0.95, ease: 'sine.inOut' }, t);
        tl.fromTo(gota, { x: 120 * e, y: -215 * e, opacity: 0, scale: e }, { y: -190 * e, opacity: 1, duration: 0.2, ease: 'power2.out', immediateRender: false }, t + 0.95);
        tl.to(gota, { y: -120 * e, opacity: 0, duration: 0.45, ease: 'power2.in' }, t + 1.35);
        pisca(t + 1.05);
        pisca(t + 1.5);
      };
      return { pisca, reage };
    };

    // ===================== a manchete, o selo do canal, a caixa e o retrato =====================
    const barra = $('barra');
    const mancheteNova = (txt, t, grande = false) => {
      const sp = div(barra, '', 'position:absolute;inset:0;opacity:0');
      const el = sp.appendChild(document.createElement('span'));
      el.textContent = txt;
      if (grande) Object.assign(el.style, { fontSize: '50px', letterSpacing: '1px' });
      tl.set(barra.children, { opacity: 0 }, t);
      tl.set(sp, { opacity: 1 }, t);
      tl.fromTo('#manchete', { x: 1100 }, { x: 0, duration: 0.32, ease: 'power3.out', immediateRender: false }, t + 0.04);
    };
    for (const b of BLOCOS) if (b.manchete && b.nome !== 'escalada') mancheteNova(b.manchete, b.s, b.nome === 'gancho');
    // v11: no gancho a manchete é maior (a barra mais alta) e volta ao normal na vinheta
    tl.set('#manchete', { height: 118 }, 0);
    tl.set('#manchete', { height: 100 }, M.vinheta);
    if (CAPA) gsap.set('#capa', { display: 'flex' }), gsap.set('#manchete', { visibility: 'hidden' });
    // v10: a manchete fica no ar nos blocos de fala e sai em cada beat sem texto (volta no bloco seguinte, ou depois do
    // beat se o bloco continua); o selo do canal (só o símbolo) fica o vídeo todo, menos na vinheta, na escalada e no fim
    const fade = (els, a, z) => {
      tl.fromTo(els, { opacity: a ? 0 : 1 }, { opacity: 1, duration: a ? 0.25 : 0, ease: 'power2.out', immediateRender: false }, a);
      tl.to(els, { opacity: 0, duration: 0.2, ease: 'power2.in' }, z - 0.2);
    };
    BLOCOS.forEach((b, k) => {
      if (!b.manchete || b.nome === 'escalada') return;
      const fim = BLOCOS[k + 1]?.s ?? FIM;
      let a = b.s;
      for (const bt of BEATS.filter((x) => x.s >= a && x.s < fim)) {
        fade('#manchete', a, bt.s);
        a = bt.z;
      }
      if (a < fim - 0.3) fade('#manchete', a, fim);
    });
    for (const [a, z] of [[0, M.vinheta], [M.abertura, M.escalada], [M.bCartas, M.final]]) fade('#bug', a, z);

    const CAIXA = $('caixa');
    const RET = $('retrato');
    // v10: sem a tarja GC; o cargo do repórter e do convidado vai na aba de nome da caixa
    const NOMES = { raichu: 'RAICHU', machoke: 'MACHOKE', meowth: 'MEOWTH · REPÓRTER', psyduck: 'PSYDUCK · TÉCNICO', todos: 'TODOS' };
    const ROSTO = {};
    const rosto = (r) => {
      if (ROSTO[r]) return ROSTO[r];
      if (r === 'todos') {
        ROSTO[r] = div(RET, 'todos');
        ROSTO[r].innerHTML = ['26-joyous', '67-joyous', '52-joyous', '54-joyous'].map((x) => `<img src="midia/${x}.png" alt="" />`).join('');
      } else {
        ROSTO[r] = document.createElement('img');
        ROSTO[r].src = `midia/${r}.png`;
        RET.appendChild(ROSTO[r]);
      }
      return ROSTO[r];
    };
    // o retrato troca em crossfade (0,2 s), com um leve pulo de escala; resolvidos em ordem de tempo no fim
    const ROSTOS = [];
    const mostraRosto = (r, t) => ROSTOS.push([t, rosto(r)]);
    function resolveRostos() {
      let atual = null;

      piscada(tl, [t0, t0 + 0.375, t0 + 0.75]);
      tl.fromTo('#tag', { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.22, ease: 'back.out(2)', immediateRender: false }, t0 + 0.35);
      tl.fromTo('#site', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.25, ease: 'power2.out', immediateRender: false }, t0 + 0.5);
      tl.fromTo('#mesa-fim', { y: 200, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: 'power3.out', immediateRender: false }, t0 + 0.05);
      const MESA_F = 1240;
      const turma = [
        ator(FC, 52, { escala: 9, z: 20, x: 230, y: 1225, sombra: false }),
        naMesa(FC, '26t', 420, 9, 28, MESA_F),
        naMesa(FC, '67t', 640, 10, 22, MESA_F),
        ator(FC, 54, { escala: 9, z: 20, x: 840, y: 1235, sombra: false }),
      ];
      gsap.set(turma[3].spr, { filter: TOSTADO });
      turma.forEach((x, k) => {
        if (k === 2) quadro(tl, x, 'Idle', 0, 0, 0);
        else anim(tl, x, 'Idle', 0, 0, FIM, k === 3 ? { vel: 0.6 } : {});
        tl.fromTo(x.el, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: 'power2.out', immediateRender: false }, t0 + 0.12 + k * 0.06);
        tl.fromTo(x.corpo, { y: 90 }, { y: 0, duration: 0.3, ease: 'back.out(1.8)', immediateRender: false }, t0 + 0.12 + k * 0.06);
        tl.to(x.corpo, { keyframes: [{ y: -50, scaleY: 1.08, duration: 0.14, ease: 'power2.out' }, { y: 0, scaleY: 1, duration: 0.14, ease: 'power2.in' }, { scaleY: 0.88, scaleX: 1.1, duration: 0.05 }, { scaleY: 1, scaleX: 1, duration: 0.12, ease: 'back.out(3)' }] }, t0 + 0.75 + k * 0.05);
      });
      faisca(FC, 420, 1050, t0 + 1.5, 1.1);
    }

    resolveTrocas();
    resolveRostos();
    tl.set({}, {}, FIM);
    window.__timelines = window.__timelines || {};
    window.__timelines.root = tl;
  </script>
  <script>
    // as durações fixas no HTML têm que bater com a linha do tempo (linha.mjs): o qa-quadros mostra o erro
    {
      const L = window.LINHA;
      const d = Number(document.getElementById('root').dataset.duration);
      const v = document.getElementById('v-bola').dataset;
      const erros = [];
      if (Math.abs(d - L.FIM) > 0.01) erros.push(`data-duration ${d} ≠ FIM ${L.FIM}`);
      if (Math.abs(Number(v.start) - L.M.vestiario) > 0.01) erros.push(`v-bola data-start ${v.start} ≠ ${L.M.vestiario}`);
      if (Math.abs(Number(v.duration) - (L.M.reacao - L.M.vestiario + L.SAIDA)) > 0.01) erros.push(`v-bola data-duration ${v.duration} ≠ ${(L.M.reacao - L.M.vestiario + L.SAIDA).toFixed(2)}`);
      if (Math.abs(Number(v.mediaStart) - (3.5 - (L.M.kaboom - L.M.vestiario))) > 0.01) erros.push(`v-bola data-media-start ${v.mediaStart} ≠ ${(3.5 - (L.M.kaboom - L.M.vestiario)).toFixed(2)}`);
      if (erros.length) setTimeout(() => { throw new Error(`linha do tempo desatualizada: ${erros.join('; ')}`); });
    }
  </script>
</div>
