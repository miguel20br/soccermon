      [24.4, 27.6, 'Agora eu tenho quina.'],
      [30.1, 31.55, 'Agora é uma atualização'],
      [31.55, 33, 'por semana.'],
      [33.25, 36, 'Sexta que vem, Time Ultimate.'],
    ];
    for (const [a, z, txt] of FALAS) {
      tl.set('#fala-t', { textContent: txt }, a);
      tl.set('#fala', { opacity: 1 }, a);
      tl.fromTo('#fala', { y: 16 }, { y: 0, duration: 0.15, ease: 'power2.out', immediateRender: false }, a);
      if (!FALAS.some(([b]) => Math.abs(b - z) < 1e-6)) tl.set('#fala', { opacity: 0 }, z);
    }
    /** Tarja entra pela esquerda com overshoot e sai pro mesmo lado. */
    const tarja = (id, a, z, y = 1400) => {
      tl.set(id, { opacity: 1, top: y }, a);
      tl.fromTo(id, { x: -700 }, { x: 0, duration: 0.25, ease: 'back.out(1.6)', immediateRender: false }, a);
      tl.to(id, { x: -800, duration: 0.18, ease: 'power2.in' }, z - 0.18);
      tl.set(id, { opacity: 0 }, z);
    };
    tarja('#tj-ala', 3.0, 4.0, 1300);
    tarja('#tj-meo', 3.12, 4.0, 1400);
    tarja('#tj-meo', 13.0, 15.0);
    tarja('#tj-por', 21.0, 24.0);
    tarja('#tj-ala', 30.0, 31.6);
    const QUADROS = [[4, 'PLANTÃO'], [13, 'NÚMERO DA SEMANA'], [21, 'CONVIDADO DA SEMANA'], [30, 'VEM AÍ']];
    tl.set('#bug', { opacity: 1 }, 3.0);
    for (const [a, q] of QUADROS) {
      tl.set('#bug-q', { textContent: q }, a);
      tl.fromTo('#bug', { scale: 1.12 }, { scale: 1, duration: 0.2, ease: 'back.out(2)', immediateRender: false, transformOrigin: '0% 50%' }, a);
    }
    tl.set('#bug', { opacity: 0 }, 38);

    // ===== 0–2 · o gancho: o gol em câmera lenta (gol.mp4: a bola entra na rede; corte pro artilheiro pulando) =====
    corta(null, 0);
    flash(tl, 1.1, 0.5, 0.2);

    // ===== 2–3 · VINHETA DE PLANTÃO =====
    {
      const t0 = T(1, 0);
      corta('#vin', t0);
      flash(tl, t0, 0.9, 0.3);
      tl.fromTo('#raios-vin', { rotation: 0 }, { rotation: 60, duration: 1, ease: 'none', immediateRender: false }, t0);
      tl.fromTo('#fx1', { x: -1400 }, { x: 0, duration: 0.25, ease: 'power3.out', immediateRender: false }, t0);
      tl.fromTo('#fx2', { x: 1400 }, { x: 0, duration: 0.25, ease: 'power3.out', immediateRender: false }, t0 + 0.06);
      tl.fromTo('#fx3', { x: -1400 }, { x: 0, duration: 0.25, ease: 'power3.out', immediateRender: false }, t0 + 0.12);
      tl.fromTo('#placa', { scale: 0.3, rotation: -6 }, { scale: 1, rotation: 0, duration: 0.3, ease: 'back.out(2.4)', immediateRender: false }, t0);
      // a bola que gira como um globo em cima da placa
      $('globo').innerHTML = `<svg viewBox="0 0 18 18"><g id="globo-g" style="transform-origin:9px 9px"><circle cx="9" cy="9" r="8" fill="#fff"/><polygon points="${Array.from({ length: 5 }, (_, i) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5; return `${9 + Math.cos(a) * 3.2},${9 + Math.sin(a) * 3.2}`; }).join(' ')}" fill="#1d1d1d"/>${Array.from({ length: 5 }, (_, i) => { const a = -Math.PI / 2 + Math.PI / 5 + (i * 2 * Math.PI) / 5; return `<circle cx="${9 + Math.cos(a) * 7.2}" cy="${9 + Math.sin(a) * 7.2}" r="1.8" fill="#1d1d1d"/>`; }).join('')}<circle cx="9" cy="9" r="8" fill="none" stroke="#0e1430" stroke-width="1.6"/></g></svg>`;
      tl.fromTo('#globo', { y: -500 }, { y: 0, duration: 0.3, ease: 'bounce.out', immediateRender: false }, t0 + 0.05);
      tl.fromTo('#globo-g', { rotation: 0 }, { rotation: 400, duration: 1, ease: 'power1.out', immediateRender: false }, t0);
      tl.set('#n1', { opacity: 1 }, T(1, 4));
      tl.fromTo('#n1', { scale: 2.4 }, { scale: 1, duration: 0.2, ease: 'back.out(2.5)', immediateRender: false }, T(1, 4));
      estouro(tl, $('vin'), 855, 1115, T(1, 4), { tam: 260 });
    }

    // ===== o estúdio: os três =====
    const ALA = ator(BANC, 65, { escala: 12, z: 20, x: 250, y: 1330 });
    // a sombra do Meowth fica atrás da bancada (nunca aparece): sem ela, o bote do Attack não conta como sombra solta
    const MEO = ator(BANC, 52, { escala: 12, z: 20, x: 560, y: 1250, sombra: false });
    const POR = ator(BANC, 137, { escala: 11, z: 12, x: 880, y: 1240, opacity: 0 });
    gsap.set($('cadeira'), { opacity: 0 });
    // o Alakazam e o Meowth respiram o tempo todo (Idle de frente); o Porygon só depois que chega
    anim(tl, ALA, 'Idle', 0, 0, FIM);
    anim(tl, MEO, 'Idle', 0, 0, FIM);
    const telas = ['#t-marca', '#t-numero', '#t-pct', '#t-conv', '#t-cal', '#t-fatia'];
    const telao = (id, t) => {
      tl.set(telas, { opacity: 0 }, t);
      tl.set(id, { opacity: 1 }, t);
      tl.fromTo(id, { scale: 0.8 }, { scale: 1, duration: 0.22, ease: 'back.out(2)', immediateRender: false }, t);
    };
    tl.fromTo('#raios-tel', { rotation: 0 }, { rotation: 120, duration: FIM, ease: 'none', immediateRender: false }, 0);
    /** Câmera da bancada: escala e posição (origem no canto). */
    const camera = (t, s = 1, x = 0, y = 0, d = 0) => (d ? tl.to('#cam', { scale: s, x, y, duration: d, ease: 'power2.inOut' }, t) : tl.set('#cam', { scale: s, x, y }, t));
    gsap.set('#cam', { transformOrigin: '0px 0px' });

    // 3–4 · a bancada: "Boa noite." (a colher: o Alakazam levanta a colher, um brilho no 8 do C1)
    {
      const t0 = T(1, 8);
      corta('#banc', t0);
      camera(t0, 1);
      telao('#t-marca', t0);
      tl.to(ALA.corpo, { keyframes: { y: [-10, 0], rotation: [-3, 0] }, duration: 0.3, ease: 'sine.inOut' }, t0 + 0.1);
      const br = div($('banc'), 'brilho-n');
      gsap.set(br, { x: 380, y: 860 });
      tl.fromTo(br, { opacity: 1, scale: 0.4, rotation: 0 }, { scale: 1.6, rotation: 90, opacity: 0, duration: 0.4, ease: 'power2.out', immediateRender: false }, t0);
    }

    // ===== 4–7 · PLANTÃO: a barrinha de N (Gomos) enchendo até o N3 =====
    {
      const t0 = 4;
      corta('#fundo', t0);
      tl.fromTo('#raios-fundo', { rotation: 0 }, { rotation: 40, duration: 9, ease: 'none', immediateRender: false }, t0);
      ver('#m-gomos', t0);
      ver('#m-gomos', 7, false);
      tl.fromTo('#m-gomos', { scale: 0.85 }, { scale: 1, duration: 0.25, ease: 'back.out(2)', immediateRender: false }, t0);
      // N1, N2 e N3 grandes em cima da barra, no gomo que acende (gomos.mp4: quadros 41, 60 e 82 a partir de 0,617 s)
      const NIV = [[T(2, 6), '#nv1'], [T(2, 11), '#nv2'], [T(3, 1), '#nv3']];
      NIV.forEach(([t, id], i) => {
        tl.set(['#nv1', '#nv2', '#nv3'], { opacity: 0 }, t);
        tl.set(id, { opacity: 1 }, t);
        tl.fromTo(id, { scale: 2 }, { scale: 1, duration: 0.2, ease: 'back.out(2.5)', immediateRender: false }, t);
        estouro(tl, document.getElementById('nivel').parentElement, 540, 560, t, { tam: 180 + 60 * i, cor: ['#ffcb05', '#ff8a1c', '#ff5c8a'][i] });
      });
      tl.set('#nv3', { opacity: 0 }, 7);
    }
    // ===== 7–10 · Seus duelos: o placar contra cada amigo =====
    {
      const t0 = 7;
      ver('#m-duelos', t0);
      ver('#m-duelos', 10, false);
      tl.fromTo('#m-duelos', { scale: 0.9 }, { scale: 1, duration: 0.25, ease: 'back.out(2)', immediateRender: false }, t0);
    }
    // ===== 10–13 · a bola amassa (trave.mp4 de 0,55 s: o chute em 10,52 s, a trave em 12,4 s) =====
    corta(null, 10);
    flash(tl, 12.4, 0.35, 0.18);

    // ===== 13–15 · NÚMERO DA SEMANA: o Meowth; o 40% no telão =====
    {
      const t0 = T(6, 8);
      corta('#banc', t0);
      camera(t0, 1.12, -150, -150);
      camera(t0, 1.25, -330, -300, 1.6);
      telao('#t-numero', t0);
      // ele levanta a pata pra câmera no "é meu"
      anim(tl, MEO, 'Pose', 0, t0 + 0.6, t0 + 1.4, { loop: false });
      anim(tl, MEO, 'Idle', 0, t0 + 1.4, FIM);
      telao('#t-pct', T(7, 0));
      tl.fromTo('#t-pct .pct', { rotation: -8 }, { rotation: 0, duration: 0.3, ease: 'back.out(3)', immediateRender: false }, T(7, 0));
      flash(tl, T(7, 0), 0.4, 0.2);
    }
    // ===== 15–17 · o 1 de 3 com o Patrocínio no lugar do último =====
    {
      const t0 = T(7, 8);
      corta('#fundo', t0);
      ver('#m-patro', t0);
      ver('#m-patro', 17, false);
      tl.fromTo('#m-patro', { scale: 0.9 }, { scale: 1, duration: 0.25, ease: 'back.out(2)', immediateRender: false }, t0);
      // o pacote abre em ~0,4 s; o Patrocínio ganha a moldura dourada pulsando
      tl.set('#dest-patro', { opacity: 1 }, t0 + 0.75);
      tl.fromTo('#dest-patro', { scale: 1.3 }, { scale: 1, duration: 0.25, ease: 'back.out(2)', immediateRender: false }, t0 + 0.75);
      tl.to('#dest-patro', { scale: 1.04, duration: 0.25, ease: 'sine.inOut', repeat: 3, yoyo: true }, t0 + 1.0);
      tl.set('#dest-patro', { opacity: 0 }, 17);
    }
    // ===== 17–19 · a Rota: vitória num Jogo, o +₽9 e o ₽ subindo moeda por moeda =====
    const FX = $('fx-moedas');
    const moeda = (x, y) => {
      const m = div(FX, 'moeda');
      m.textContent = '₽';
      gsap.set(m, { x, y });
      return m;
    };
    {
      const t0 = T(8, 8);
      ver('#m-rota', t0);
      ver('#m-rota', 19, false);
      tl.fromTo('#m-rota', { scale: 0.9 }, { scale: 1, duration: 0.25, ease: 'back.out(2)', immediateRender: false }, t0);
      tl.set('#contador', { opacity: 1 }, t0 + 0.2);
      tl.fromTo('#contador', { scale: 0.4 }, { scale: 1, duration: 0.25, ease: 'back.out(2.4)', immediateRender: false }, t0 + 0.2);
      // as 9 moedas do +₽9 (linha 10 do C8 em diante, uma por linha, como na música): saem do +₽9 e caem no contador
      for (let k = 0; k < 9; k++) {
        const t = T(8, 10 + k) - 0.28;
        const m = moeda(205 + k * 6, 1005);
        tl.set(m, { opacity: 1 }, t);
        tl.fromTo(m, { x: 205 + k * 6, y: 1005 }, { keyframes: { x: [300, 380], y: [960, 1365], easeEach: 'sine.inOut' }, duration: 0.28, ease: 'none', immediateRender: false }, t);
        tl.set(m, { opacity: 0 }, t + 0.28);
        tl.set('#conta', { textContent: String(28 + k) }, t + 0.28);
        tl.fromTo('#contador', { scale: 1.08 }, { scale: 1, duration: 0.12, ease: 'power2.out', immediateRender: false }, t + 0.28);
      }
      tl.set('#contador', { opacity: 0 }, 19);
    }
    // ===== 19–21 · PAY DAY!: chovem moedas na bancada e o Meowth junta tudo com as patas =====
    {
      const t0 = T(9, 8);
      corta('#banc', t0);
      camera(t0, 1);
      telao('#t-marca', t0);
      anim(tl, MEO, 'Hop', 0, t0, t0 + 0.6, { loop: false });
      anim(tl, MEO, 'Idle', 0, t0 + 0.6, FIM);
      flash(tl, t0, 0.4, 0.2);
      // 22 moedas descendo (uma por linha da música, do C9 linha 10), quicando no tampo da bancada
      const caidas = [];
      for (let k = 0; k < 22; k++) {
        const t = T(9, 10) + k * 0.125 - 0.3;
        const x = 120 + ((k * 263) % 560);
        const yf = 1150 - ((k * 37) % 30);
        const m = moeda(x, -80);
        caidas.push([m, x, yf]);
        tl.set(m, { opacity: 1 }, t);
        tl.fromTo(m, { y: -80, rotation: 0 }, { y: yf, rotation: 200 + k * 30, duration: 0.3, ease: 'power2.in', immediateRender: false }, t);
        tl.to(m, { keyframes: { y: [yf - 40, yf] }, duration: 0.2, ease: 'sine.inOut' }, t + 0.3);
      }
      // o Meowth junta: o golpe de pata (Attack) e as moedas escorregam pra ele e somem
      const tj = T(10, 6);
      anim(tl, MEO, 'Attack', 0, tj, tj + 0.6, { loop: false });
      anim(tl, MEO, 'Idle', 0, tj + 0.6, FIM);
      caidas.forEach(([m], k) => {
        tl.to(m, { x: 560, y: 1080, scale: 0.4, duration: 0.25, ease: 'power2.in' }, tj + 0.1 + (k % 6) * 0.03);
        tl.set(m, { opacity: 0 }, tj + 0.35 + (k % 6) * 0.03);
      });
      estouro(tl, $('banc'), 560, 1050, tj + 0.4, { tam: 200 });
    }

    // ===== 21–24 · CONVIDADO DA SEMANA: o Porygon na cadeira, borrado =====
    {
      const t0 = T(10, 8);
      telao('#t-conv', t0);
      tl.set(['#cadeira', POR.el], { opacity: 1 }, t0);
      // ele chega aparecendo em pixels (sobe da cadeira) e fica borrado até o "quina"
      tl.fromTo(POR.corpo, { scaleY: 0, scaleX: 1.4 }, { scaleY: 1, scaleX: 1, duration: 0.3, ease: 'back.out(2.5)', immediateRender: false }, t0);
      anim(tl, POR, 'Idle', 6, t0, FIM);
      tl.set(POR.spr, { filter: 'blur(9px)' }, t0);
      tl.set('#banc', { filter: 'blur(3px)' }, t0);
      tl.set('#banc', { filter: 'none' }, 24);
      tl.set(POR.spr, { filter: 'none' }, 24);
    }
    // 24–28 · SPRITES NÍTIDOS: corta pra quadra de perto (close.mp4), um flash no "quina"
    corta(null, 24);
    flash(tl, 24, 0.8, 0.25);
    // 28–30 · ele gira uma vez na cadeira (as 8 direções do Idle) e a cadeira gira junto
    {
      const t0 = T(14, 0);
      corta('#banc', t0);
      camera(t0, 1.1, -190, -140);
      telao('#t-conv', t0);
      const dirs = [6, 5, 4, 3, 2, 1, 0, 7, 6];
      dirs.forEach((d, i) => quadro(tl, POR, 'Idle', d, 0, t0 + i * 0.07));
      anim(tl, POR, 'Idle', 6, t0 + dirs.length * 0.07, FIM);
      tl.fromTo('#encosto', { scaleX: 1 }, { keyframes: { scaleX: [0.2, -1, -0.2, 1] }, duration: dirs.length * 0.07, ease: 'none', immediateRender: false }, t0);
      tl.to(POR.corpo, { keyframes: { y: [-30, 0] }, duration: 0.3, ease: 'power2.out' }, t0 + dirs.length * 0.07);
    }

    // ===== 30–33 · VEM AÍ: o Alakazam; no telão, o calendário com uma bola em cada sexta =====
    const DIAS = ['20/11', '27/11', '04/12', '11/12'];
    const bolinhaSVG = () => `<svg class="bolinha" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#fff"/><polygon points="${Array.from({ length: 5 }, (_, i) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5; return `${9 + Math.cos(a) * 3.2},${9 + Math.sin(a) * 3.2}`; }).join(' ')}" fill="#1d1d1d"/>${Array.from({ length: 5 }, (_, i) => { const a = -Math.PI / 2 + Math.PI / 5 + (i * 2 * Math.PI) / 5; return `<circle cx="${9 + Math.cos(a) * 7.2}" cy="${9 + Math.sin(a) * 7.2}" r="1.8" fill="#1d1d1d"/>`; }).join('')}<circle cx="9" cy="9" r="8" fill="none" stroke="#0e1430" stroke-width="1.6"/></svg>`;
    $('dias').innerHTML = DIAS.map((d, i) => `<div class="dia${i === 1 ? ' ut' : ''}"><span>${d}</span><small>SEXTA</small>${bolinhaSVG()}</div>`).join('');
    {
      const t0 = T(15, 0);
      camera(t0, 1.18, 0, -90);
      tl.set(POR.el, { opacity: 0 }, t0);
      tl.set('#cadeira', { opacity: 0 }, t0);
      telao('#t-cal', t0);
      flash(tl, t0, 0.4, 0.2);
      const bs = [...document.querySelectorAll('#dias .bolinha')];
      [T(15, 4), T(15, 8), T(15, 12), T(16, 0)].forEach((t, i) => {
        tl.set(bs[i], { opacity: 1 }, t);
        tl.fromTo(bs[i], { y: -260, scaleY: 1 }, { keyframes: [{ y: 0, duration: 0.16, ease: 'power2.in' }, { scaleY: 0.7, scaleX: 1.2, duration: 0.05 }, { scaleY: 1, scaleX: 1, duration: 0.12, ease: 'back.out(3)' }], immediateRender: false }, t - 0.16);
      });
      tl.to(ALA.corpo, { keyframes: { rotation: [-4, 3, 0] }, duration: 0.6, ease: 'sine.inOut' }, t0 + 0.2);
    }
    // ===== 33–38 · Time Ultimate: a fatia no telão e a carta ouro virando =====
    {
      const t0 = T(16, 8);
      camera(t0, 1);
      telao('#t-fatia', t0);
      tl.set('#fatia', { opacity: 1 }, t0);
      // a carta sai do telão girando e cresce até o meio da tela; termina de virar (a face) em 36,0 s
      tl.set('#carta', { opacity: 1 }, T(16, 12));
      tl.fromTo('#carta', { x: -70, y: -230, scale: 0.25 }, { x: -70, y: -40, scale: 1, duration: 1.4, ease: 'power2.out', immediateRender: false }, T(16, 12));
      tl.fromTo('#gira', { rotationY: 0 }, { rotationY: 900, duration: T(18, 0) - T(16, 12), ease: 'power2.inOut', immediateRender: false }, T(16, 12));
      flash(tl, T(18, 0), 0.7, 0.3);
      estouro(tl, document.body.querySelector('#root'), 540, 950, T(18, 0), { tam: 520, dur: 0.5 });
      tl.to('#carta', { keyframes: { y: [-60, -40] }, duration: 1, ease: 'sine.inOut', repeat: 1, yoyo: true }, T(18, 2));
      tl.set('#carta', { opacity: 0 }, 38);
      tl.to(ALA.corpo, { keyframes: { y: [-14, 0] }, duration: 0.3, ease: 'power2.out' }, T(18, 0));
    }

    // ===== 38–41 · TELA FINAL: o logo (SOC-CER-MON no 0, 3 e 6 do C19), os três na bancada, o site =====
    {
      const t0 = T(19, 0);
      const fim = $('fim');
      const FC = $('fim-cena');
      telaFinal(fim);
      corta('#fim', t0);
      tl.fromTo('#raios-fim', { rotation: 0 }, { rotation: 25, duration: FIM - t0, ease: 'none', immediateRender: false }, t0);
      tl.set('#logo', { opacity: 1 }, t0);
      tl.fromTo('#logo', { scale: 0.7 }, { scale: 1, duration: 0.3, ease: 'back.out(3)', immediateRender: false }, t0);
      piscada(tl, [T(19, 0), T(19, 3), T(19, 6)]);
      tl.set('#tag', { opacity: 1 }, T(19, 8));
      tl.fromTo('#tag', { scale: 1.6 }, { scale: 1, duration: 0.25, ease: 'back.out(2)', immediateRender: false }, T(19, 8));
      tl.to(['#site', '#selo', '#credito'], { opacity: 1, duration: 0.2 }, t0 + 0.3);
      // os três na bancada pequena: pulam juntos no MON
      const a = ator(FC, 65, { escala: 8, z: 20, x: 330, y: 1380 });
      const m = ator(FC, 52, { escala: 8, z: 20, x: 540, y: 1340 });
      const p = ator(FC, 137, { escala: 8, z: 20, x: 750, y: 1360 });
      for (const [x, d] of [[a, 0], [m, 0], [p, 0]]) {
        anim(tl, x, 'Idle', d, t0, FIM);
        tl.to(x.corpo, { keyframes: [{ y: -50, scaleY: 1.08, duration: 0.14, ease: 'power2.out' }, { y: 0, scaleY: 1, duration: 0.14, ease: 'power2.in' }, { scaleY: 0.88, scaleX: 1.1, duration: 0.05 }, { scaleY: 1, scaleX: 1, duration: 0.12, ease: 'back.out(3)' }] }, T(19, 6));
      }
    }

    tl.set({}, {}, FIM);
    window.__timelines = window.__timelines || {};
    window.__timelines.root = tl;
  </script>
</div>
</body>
</html>
