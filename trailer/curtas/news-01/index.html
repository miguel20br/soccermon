      [69.5, 70.0, 70.5, 71.0].forEach((t, i) => {
        tl.set(bs[i], { opacity: 1 }, t - 0.16);
        tl.fromTo(bs[i], { y: -260, scaleY: 1 }, { keyframes: [{ y: 0, duration: 0.16, ease: 'power2.in' }, { scaleY: 0.7, scaleX: 1.2, duration: 0.05 }, { scaleY: 1, scaleX: 1, duration: 0.12, ease: 'back.out(3)' }], immediateRender: false }, t - 0.16);
      });
    }

    // ===================== TIME ULTIMATE (72–79,5) =====================
    // 72: o menu de modos, a fatia do Time Ultimate com a moldura dourada
    corta('#fundo', B[19].s);
    tl.fromTo('#raios-fundo', { rotation: 100 }, { rotation: 140, duration: 7.5, ease: 'none', immediateRender: false }, B[19].s);
    paineis(B[19].s, '#m-menu');
    entra('#m-menu', B[19].s);
    tl.set('#dest-ut', { opacity: 1 }, 73.0);
    tl.fromTo('#dest-ut', { scale: 1.15 }, { scale: 1, duration: 0.25, ease: 'back.out(2)', immediateRender: false }, 73.0);
    tl.to('#dest-ut', { scale: 1.03, duration: 0.4, ease: 'sine.inOut', repeat: 4, yoyo: true }, 73.25);
    // 76: a carta ouro sai do pacote da fatia girando e vira em 77 (flash), no meio, sem ninguém atrás
    {
      const t0 = B[20].s;
      const tv = 77.0;
      tl.to(['#m-menu', '#dest-ut'], { opacity: 0, scale: 0.92, duration: 0.35, ease: 'power2.in' }, t0 + 0.1);
      tl.set('#carta', { opacity: 1 }, t0);
      tl.fromTo('#carta', { x: -217, y: -242, scale: 0.15 }, { x: 0, y: 0, scale: 1.1, duration: tv - t0, ease: 'power2.out', immediateRender: false }, t0);
      tl.fromTo('#gira', { rotationY: 0 }, { rotationY: 540, duration: tv - t0, ease: 'power2.inOut', immediateRender: false }, t0);
      flash(tl, tv, 0.6, 0.25);
      estouro(tl, $('fx-moedas'), 540, 860, tv, { tam: 520, dur: 0.5 });
      tl.to('#carta', { keyframes: { y: [-16, 0] }, duration: 1.2, ease: 'sine.inOut', repeat: 1, yoyo: true }, tv + 0.1);
      tl.set('#carta', { opacity: 0 }, B[21].s);
    }

    // ===================== 79,5 · "Boa noite": a bancada com os três =====================
    corta('#banc', B[21].s);
    paineis(B[21].s);
    camera(B[21].s, 1);
    telao('#t-marca', B[21].s);
    tl.set(ME.el, { opacity: 1 }, B[21].s);
    acena(B[21].a);
    anim(tl, ME, 'Pose', 0, 81.0, 81.8, { loop: false });
    anim(tl, ME, 'Idle', 0, 81.8, FIM);
    tl.to(PS.corpo, { keyframes: { y: [0, -24, 0] }, duration: 0.4, ease: 'sine.inOut' }, 81.2);

    // ===================== 83 · TELA FINAL: logo (SOC-CER-MON), Temos que chutar!, o site, os três pulando no MON =====================
    {
      const t0 = FIM_FALAS;
      const fim = $('fim');
      const FC = $('fim-cena');
      telaFinal(fim);
      corta('#fim', t0);
      tl.fromTo('#raios-fim', { rotation: 0 }, { rotation: 20, duration: FIM - t0, ease: 'none', immediateRender: false }, t0);
      tl.set('#logo', { opacity: 1 }, t0);
      tl.fromTo('#logo', { scale: 0.7 }, { scale: 1, duration: 0.3, ease: 'back.out(3)', immediateRender: false }, t0);
      piscada(tl, [t0, t0 + 0.375, t0 + 0.75]);
      tl.set('#tag', { opacity: 1 }, t0 + 1.0);
      tl.fromTo('#tag', { scale: 1.4 }, { scale: 1, duration: 0.2, ease: 'back.out(2)', immediateRender: false }, t0 + 1.0);
      tl.to('#site', { opacity: 1, duration: 0.2 }, t0 + 1.6);
      const a = ator(FC, 65, { escala: 10, z: 20, x: 330, y: 1330 });
      const m = ator(FC, 52, { escala: 10, z: 20, x: 540, y: 1300 });
      const p = ator(FC, 54, { escala: 10, z: 20, x: 750, y: 1300 });
      gsap.set(p.spr, { filter: TOSTADO });
      for (const x of [a, m, p]) {
        anim(tl, x, 'Idle', 0, t0, FIM);
        tl.to(x.corpo, { keyframes: [{ y: -50, scaleY: 1.08, duration: 0.14, ease: 'power2.out' }, { y: 0, scaleY: 1, duration: 0.14, ease: 'power2.in' }, { scaleY: 0.88, scaleX: 1.1, duration: 0.05 }, { scaleY: 1, scaleX: 1, duration: 0.12, ease: 'back.out(3)' }] }, t0 + 0.75);
      }
      // o "ting" da colher no fim (85 s)
      const br = div(FC, 'brilho-n');
      gsap.set(br, { x: 420, y: 1060 });
      tl.fromTo(br, { opacity: 1, scale: 0.4, rotation: 0 }, { scale: 1.8, rotation: 90, opacity: 0, duration: 0.5, ease: 'power2.out', immediateRender: false }, 85.0);
    }

    tl.set({}, {}, FIM);
    window.__timelines = window.__timelines || {};
    window.__timelines.root = tl;
  </script>
