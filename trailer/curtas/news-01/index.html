<!doctype html>
<!--
  Soccermon News #1 v2 (9:16, 35 s, mais calma): o jornal da semana da 0.9.51. Roteiro em ROTEIRO.md. Regra de leitura:
  um texto por vez (cartela, tarja ou fala), cada um parado no mínimo 2 s, até 5 palavras.
  Bancada animada com os sprites PMD (Alakazam apresentador, Meowth da economia, Porygon convidado), vinheta de plantão e
  trechos do jogo gravados headless: os lances da quadra pelo scripts/trailer-capture.mjs (--demo dribles&evento=goal|post,
  --vertical) e as telas pelo capturar.mjs desta pasta (relógio parado, 30 fps); a barra de golpe em gomos-lento.mp4
  (os gomos acendem em 4,25, 5 e 6 s). Sem voz: a fala vai em legenda embaixo.
  Música: scripts/musica/pecas/news-plantao.mjs (120 BPM, compasso = 2 s, 18 compassos), em midia/som/news-14.wav. Tempos: T(compasso,
  linha) da música.
  Render (de trailer/curtas): ../../scripts/pesado.sh npx hyperframes render news-01 -q high -w 1 --no-browser-gpu -o news-01/render/v2.mp4
-->

<style>
.cena { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; visibility: hidden; }
.estudio { background: radial-gradient(circle at 50% 38%, #2a3a7a, #070a18 78%); }
.estudio .grade { position: absolute; inset: 0; background-image: linear-gradient(90deg, rgb(255 255 255 / 4%) 2px, transparent 2px), linear-gradient(rgb(255 255 255 / 4%) 2px, transparent 2px); background-size: 90px 90px; }
/* o telão atrás da bancada */
.telao { position: absolute; left: 90px; top: 470px; width: 900px; height: 560px; box-sizing: border-box; overflow: hidden; border-radius: 26px;
  background: radial-gradient(circle at 50% 45%, #2a4ea0, #10183d 75%); border: 12px solid #0e1430; box-shadow: 0 0 0 8px #3a5bb0, 0 0 0 16px #0e1430, 0 24px 0 16px rgb(0 0 0 / 40%); }
.telao .raios { left: 50%; top: 50%; }
.telao > .tela { position: absolute; inset: 0; opacity: 0; display: flex; align-items: center; justify-content: center; }
.telao .marca img { width: 300px; filter: drop-shadow(0 12px 0 #0e1430); }
.telao .pct { font-size: 300px; line-height: 1; color: #ffcb05; -webkit-text-stroke: 26px #0e1430; paint-order: stroke fill; text-shadow: 0 18px 0 #0e1430; letter-spacing: 6px; }
/* o calendário: as quatro sextas, uma bola em cada */
.cal { flex-direction: column; gap: 26px; }
.cal .topo { width: 780px; height: 70px; border-radius: 16px; background: #e8423f; border: 8px solid #0e1430; display: flex; align-items: center; justify-content: center; gap: 120px; box-sizing: border-box; }
.cal .topo i { width: 26px; height: 56px; margin-top: -50px; border-radius: 10px; background: #c8d0f0; border: 7px solid #0e1430; }
.cal .dias { display: flex; gap: 22px; }
.cal .dia { width: 178px; height: 300px; box-sizing: border-box; border-radius: 18px; background: #f8f8f0; border: 8px solid #0e1430; display: flex; flex-direction: column; align-items: center; padding-top: 18px; gap: 26px; }
.cal .dia span { font-size: 48px; color: #0e1430; letter-spacing: 2px; }
.cal .dia small { font-size: 30px; color: #2a3a7a; letter-spacing: 2px; margin-top: -18px; }
.cal .dia .bolinha { width: 120px; height: 120px; opacity: 0; }
.cal .dia.ut { background: #ffcb05; }
#m-fatia img { display: block; width: 100%; height: 100%; border-radius: 10px; }
#t-pct { align-items: flex-start; padding-top: 40px; box-sizing: border-box; }
/* a bancada: tampo amarelo e a frente com o letreiro */
.mesa-n { position: absolute; left: 30px; top: 1140px; width: var(--w, 720px); height: 260px; z-index: 30; }
.mesa-n .tampo { position: absolute; left: 0; top: 0; width: 100%; height: 46px; box-sizing: border-box; border-radius: 14px; background: #ffcb05; border: 8px solid #0e1430; }
.mesa-n .frente { position: absolute; left: 30px; top: 38px; width: calc(100% - 60px); height: 160px; box-sizing: border-box; background: #10183d; border: 8px solid #0e1430; border-top: none;
  box-shadow: inset 0 0 0 8px #2a4ea0; display: flex; align-items: center; justify-content: center; gap: 22px; }
.mesa-n .frente img { height: 104px; }
.mesa-n .frente i { width: 120px; height: 18px; border-radius: 9px; background: #ffcb05; border: 6px solid #0e1430; }
.cadeira { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 8; }
.cadeira .encosto { position: absolute; left: -110px; top: -300px; width: 220px; height: 230px; box-sizing: border-box; border-radius: 30px 30px 14px 14px; background: #e8423f; border: 8px solid #0e1430; box-shadow: inset 0 -16px 0 #b02a2a; }
.cadeira .assento { position: absolute; left: -130px; top: -90px; width: 260px; height: 56px; box-sizing: border-box; border-radius: 16px; background: #e8423f; border: 8px solid #0e1430; box-shadow: inset 0 -12px 0 #b02a2a; z-index: 2; }
.cadeira .pe { position: absolute; left: -14px; top: -40px; width: 28px; height: 200px; background: #2b3045; border: 7px solid #0e1430; }
.cadeira .base { position: absolute; left: -100px; top: 150px; width: 200px; height: 28px; border-radius: 14px; background: #2b3045; border: 7px solid #0e1430; }
.piso-n { position: absolute; left: 0; top: 1300px; width: 1080px; height: 620px; background: linear-gradient(#1a2350, #0b1028); box-shadow: inset 0 14px 0 rgb(0 0 0 / 35%); }
/* a vinheta de plantão */
.vinheta-n { background: radial-gradient(circle at 50% 45%, #2a3a7a, #070a18 72%); }
.faixa { position: absolute; left: -100px; width: 1280px; height: 120px; transform: rotate(-8deg); border-top: 10px solid #0e1430; border-bottom: 10px solid #0e1430; }
.placa-n { position: absolute; left: 70px; top: 640px; width: 940px; height: 470px; z-index: 5; }
.placa-n .fundo { position: absolute; inset: 0; border-radius: 44px; background: #10183d; border: 14px solid #0e1430; box-shadow: inset 0 0 0 12px #ffcb05, inset 0 0 0 24px #10183d, inset 0 0 0 30px #2a4ea0, 0 26px 0 rgb(0 0 0 / 45%); }
.placa-n .l1 { position: absolute; left: 0; width: 940px; top: 70px; text-align: center; font-size: 130px; letter-spacing: 6px; color: #ffcb05; -webkit-text-stroke: 20px #0e1430; paint-order: stroke fill; text-shadow: 0 8px 0 #ff8a1c, 0 16px 0 #2a4ea0, 0 24px 0 #0e1430; }
.placa-n .l2 { position: absolute; left: 0; width: 940px; top: 250px; text-align: center; font-size: 120px; letter-spacing: 26px; color: #f8f8f0; -webkit-text-stroke: 18px #0e1430; paint-order: stroke fill; text-shadow: 0 14px 0 #0e1430; }
.n1 { position: absolute; left: 740px; top: 1040px; width: 230px; height: 150px; z-index: 6; display: flex; align-items: center; justify-content: center; border-radius: 26px;
  background: #e8423f; border: 12px solid #0e1430; box-shadow: 0 16px 0 #8c1d1b; font-size: 100px; color: #fff; -webkit-text-stroke: 14px #0e1430; paint-order: stroke fill; transform: rotate(6deg); opacity: 0; }
.globo { position: absolute; left: 540px; top: 470px; width: 0; height: 0; z-index: 4; }
.globo svg { position: absolute; left: -130px; top: -130px; width: 260px; height: 260px; overflow: visible; }
/* o selo do programa no canto (quadro da vez) */
#bug { position: absolute; left: 40px; top: 140px; z-index: 70; display: flex; align-items: stretch; opacity: 0; }
#bug b { padding: 6px 14px; background: #e8423f; color: #fff; font-size: 28px; letter-spacing: 2px; border: 6px solid #0e1430; border-radius: 12px 0 0 12px; }
#bug span { padding: 6px 14px; background: #10183d; color: #c8d0f0; font-size: 28px; letter-spacing: 2px; border: 6px solid #0e1430; border-left: none; border-radius: 0 12px 12px 0; min-width: 40px; }
/* cartela (caixa alta, 2 a 5 palavras) */
.cartela-n { position: absolute; left: 60px; width: 960px; top: 230px; height: 220px; z-index: 85; display: flex; align-items: center; justify-content: center; text-align: center;
  font-size: 86px; line-height: 1.12; letter-spacing: 3px; color: #fff; -webkit-text-stroke: 16px #0e1430; paint-order: stroke fill; text-shadow: 0 10px 0 #0e1430; opacity: 0; }
.cartela-n span b { color: #ffcb05; font-weight: 700; }
/* a fala (legenda) e a tarja NOME · FUNÇÃO */
.fala-n { position: absolute; left: 60px; width: 960px; top: 1490px; height: 140px; z-index: 85; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.15;
  font-size: 76px; letter-spacing: 2px; color: #fff; -webkit-text-stroke: 16px #0e1430; paint-order: stroke fill; text-shadow: 0 8px 0 #0e1430; opacity: 0; }
.tarja { position: absolute; top: 1400px; z-index: 85; display: flex; align-items: stretch; opacity: 0; }
.tarja b { padding: 10px 24px; background: #ffcb05; color: #0e1430; font-size: 64px; letter-spacing: 2px; border: 7px solid #0e1430; border-radius: 12px 0 0 12px; }
.tarja span { padding: 10px 22px; background: #10183d; color: #f8f8f0; font-size: 48px; letter-spacing: 2px; border: 7px solid #0e1430; border-left: none; border-radius: 0 12px 12px 0; display: flex; align-items: center; }
/* as telas do jogo num painel com moldura (o vídeo fica por cima da moldura, fora dela no DOM) */
.moldura { position: absolute; z-index: 20; box-sizing: border-box; border-radius: 22px; border: 12px solid #0e1430; background: #0e1430; box-shadow: 0 0 0 8px #ffcb05, 0 0 0 16px #0e1430, 0 26px 0 14px rgb(0 0 0 / 45%); opacity: 0; }
video.jogo { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; z-index: 10; }
video.painel { position: absolute; z-index: 21; border-radius: 10px; }
.destaque { position: absolute; z-index: 24; box-sizing: border-box; border: 10px solid #ffcb05; border-radius: 22px; box-shadow: 0 0 0 7px #0e1430, inset 0 0 0 7px #0e1430; opacity: 0; }
/* moedas (Pay Day, Rota): disco dourado com o ₽ */
.moeda { position: absolute; left: 0; top: 0; width: 70px; height: 70px; margin: -35px 0 0 -35px; z-index: 40; box-sizing: border-box; border-radius: 50%; background: radial-gradient(circle at 38% 35%, #fff3a0, #ffcb05 45%, #d99a00);
  border: 7px solid #0e1430; display: flex; align-items: center; justify-content: center; font-size: 34px; color: #7a4a00; opacity: 0; }
.brilho-n { position: absolute; left: 0; top: 0; width: 60px; height: 60px; margin: -30px 0 0 -30px; background: #fff; z-index: 45; opacity: 0;
  clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); }
/* a carta ouro virando (verso: o símbolo do jogo) */
.carta3d { position: absolute; left: 610px; top: 980px; width: 0; height: 0; z-index: 50; perspective: 1800px; opacity: 0; }
.carta3d .gira { position: absolute; left: -220px; top: -304px; width: 440px; height: 608px; transform-style: preserve-3d; }
.carta3d .face, .carta3d .verso { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 26px; }
.carta3d .face { background: url(midia/news/carta-ouro.png) center / 100% 100% no-repeat; transform: rotateY(180deg); }
.carta3d .verso { box-sizing: border-box; background: radial-gradient(circle at 50% 45%, #2a4ea0, #10183d 70%); border: 14px solid #ffcb05; box-shadow: inset 0 0 0 8px #0e1430; display: flex; align-items: center; justify-content: center; }
.carta3d .verso img { width: 260px; }
.carta3d .sombra-c { position: absolute; left: -200px; top: 330px; width: 400px; height: 60px; border-radius: 50%; background: rgb(0 0 0 / 35%); }
/* tela final */
#fim #logo { top: 330px; }
#fim .tag { top: 560px; }
#fim .site { top: 680px; }
#fim .selo { top: 780px; }
#fim .credito { top: 1540px; }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-start="0" data-duration="35">
  <div id="cena" class="clip" data-start="0" data-duration="35">
    <!-- vinheta de plantão -->
    <div id="vin" class="cena vinheta-n"><div class="raios" id="raios-vin"></div>
      <div class="faixa" id="fx1" style="top:300px;background:#e8423f"></div>
      <div class="faixa" id="fx2" style="top:1260px;background:#3a7bd5"></div>
      <div class="faixa" id="fx3" style="top:1420px;background:#ffcb05;height:60px"></div>
      <div class="globo" id="globo"></div>
      <div class="placa-n" id="placa"><div class="fundo"></div><div class="l1">SOCCERMON</div><div class="l2">NEWS</div></div>
      <div class="n1" id="n1">#1</div>
    </div>
    <!-- o estúdio: telão, bancada larga (os três cabem atrás dela), a cadeira do convidado -->
    <div id="banc" class="cena estudio"><div id="cam" class="camada"><div class="grade"></div><div class="piso-n"></div>
      <div class="telao" id="telao"><div class="raios" id="raios-tel"></div>
        <div class="tela marca" id="t-marca"><img src="midia/logo-simbolo.svg" alt="" /></div>
        <div class="tela" id="t-pct"><span class="pct">40%</span></div>
        <div class="tela cal" id="t-cal"><div class="topo"><i></i><i></i><i></i><i></i></div><div class="dias" id="dias"></div></div>
      </div>
      <div class="cadeira" id="cadeira" style="transform:translate(840px,1330px)"><div class="encosto" id="encosto"></div><div class="pe"></div><div class="base"></div><div class="assento"></div></div>
      <div class="mesa-n" style="--w:1020px"><div class="tampo"></div><div class="frente"><i></i><img src="midia/logo-simbolo.svg" alt="" /><i></i></div></div>
    </div></div>
    <div id="fundo" class="cena estudio"><div class="raios" id="raios-fundo"></div></div>
    <div id="fim" class="cena palco"><div class="raios" id="raios-fim"></div><div id="fim-cena" class="camada"><div class="mesa-n" id="mesa-fim" style="left:180px;top:1240px"><div class="tampo"></div><div class="frente"><i></i><img src="midia/logo-simbolo.svg" alt="" /><i></i></div></div></div></div>
  </div>
  <!-- moldura da barra de golpe (o vídeo vai por cima, fora de elemento com tempo) e o destaque dourado do Patrocínio -->
  <div class="moldura" id="m-gomos" style="left:48px;top:742px;width:984px;height:493px"></div>
  <div class="moldura" id="m-fatia" style="left:90px;top:560px;width:900px;height:814px"><img src="midia/news/ultimate-fatia.png" alt="" /></div>
  <div class="destaque" id="dest-patro" style="left:364px;top:608px;width:512px;height:864px"></div>
  <div id="fx-moedas"></div>
  <div class="carta3d" id="carta"><div class="sombra-c"></div><div class="gira" id="gira"><div class="verso"><img src="midia/logo-simbolo.svg" alt="" /></div><div class="face"></div></div></div>
  <div id="bug"><b>AO VIVO</b><span>PLANTÃO</span></div>
  <div class="cartela-n" id="cartela"><span id="cartela-t"></span></div>
  <div class="tarja" id="tj-ala" style="left:40px"><b>ALAKAZAM</b><span>APRESENTADOR</span></div>
  <div class="tarja" id="tj-por" style="left:40px"><b>PORYGON</b><span>CONVIDADO</span></div>
  <div class="fala-n" id="fala"><span id="fala-t"></span></div>
  <div class="flash" id="flash"></div>

  <!-- trechos do jogo -->
  <video id="v-gol1" class="jogo" src="midia/news/gol.mp4" muted playsinline data-start="0" data-duration="1" data-media-start="1.3"></video>
  <video id="v-gol2" class="jogo" src="midia/news/gol-pulo.mp4" muted playsinline data-start="1" data-duration="1" data-media-start="0" style="transform:scale(1.35);transform-origin:540px 520px"></video>
  <video id="v-gomos" class="painel" src="midia/news/gomos-lento.mp4" muted playsinline data-start="3" data-duration="5" data-media-start="0" style="left:60px;top:754px;width:960px;height:469px"></video>
  <video id="v-patro" class="painel" src="midia/news/patrocinio-c.mp4" muted playsinline data-start="10" data-duration="2" data-media-start="0" style="left:-700px;top:135px;width:1620px;height:1500px;border-radius:0;clip-path:inset(225px 0 0 0)"></video>
  <video id="v-close" class="jogo" src="midia/news/close.mp4" muted playsinline data-start="18.5" data-duration="2.5" data-media-start="0.65"></video>

  <audio id="a-musica" class="clip" src="midia/som/news-14.wav" data-start="0" data-duration="35" data-media-start="0" data-fade-out="0.6"></audio>

  <script>
    const { T, div, ator, anim, quadro, flash, estouro, telaFinal, piscada } = C;
    const FIM = 35;
    const tl = gsap.timeline({ paused: true });
    const $ = (id) => document.getElementById(id);
    const ver = (els, t, on = true) => tl.set(els, { autoAlpha: on ? 1 : 0 }, t);
    const CENAS = ['#vin', '#banc', '#fundo', '#fim'];
    const corta = (id, t) => {
      ver(CENAS, t, false);
      if (id) ver(id, t);
    };
    const BANC = $('cam');

    // ===== textos: UM por vez, cada um parado no mínimo 2 s (cartela no alto, tarja ou fala embaixo) =====
    // [início, fim, texto]; a entrada é um pulinho de 0,1 s com o texto já inteiro
    const CARTELAS = [
      [3.05, 5.5, 'BARRA DE GOLPE <b>NOVA</b>'],
      [5.6, 8.0, 'ATÉ O <b>N3</b>'],
      [10.0, 12.0, '<b>PATROCÍNIO</b> NA RECOMPENSA'],
      [23.4, 26.0, 'ATUALIZAÇÃO <b>TODA SEMANA</b>'],
      [30.0, 32.0, 'FALTAM <b>7 DIAS</b>'],
    ];
    for (const [a, z, txt] of CARTELAS) {
      tl.set('#cartela-t', { innerHTML: txt }, a);
      tl.set('#cartela', { opacity: 1 }, a);
      tl.fromTo('#cartela', { scale: 1.08 }, { scale: 1, duration: 0.1, ease: 'power2.out', immediateRender: false }, a);
      tl.set('#cartela', { opacity: 0 }, z);
    }
    const FALAS = [
      [12.0, 14.0, 'Pay Day!'],
      [16.45, 18.5, 'Antes eu era borrado.'],
      [18.5, 21.0, 'Agora eu tenho quina.'],
    ];
    for (const [a, z, txt] of FALAS) {
      tl.set('#fala-t', { textContent: txt }, a);
      tl.set('#fala', { opacity: 1 }, a);
      tl.fromTo('#fala', { y: 8 }, { y: 0, duration: 0.1, ease: 'power2.out', immediateRender: false }, a);
      if (!FALAS.some(([b]) => Math.abs(b - z) < 1e-6)) tl.set('#fala', { opacity: 0 }, z);
    }
    /** Tarja NOME · FUNÇÃO: entra pela esquerda em 0,18 s e some de uma vez (sozinha na tela). */
    const tarja = (id, a, z) => {
      tl.set(id, { opacity: 1 }, a);
      tl.fromTo(id, { x: -900 }, { x: 0, duration: 0.18, ease: 'power3.out', immediateRender: false }, a);
      tl.set(id, { opacity: 0 }, z);
    };
    tarja('#tj-por', 14.1, 16.4);
    tarja('#tj-ala', 21.05, 23.35);
    // o selo pequeno do plantão: parado do começo da barra até a tela final
    tl.set('#bug', { opacity: 0.9 }, 3.0);
    tl.set('#bug', { opacity: 0 }, 32);

    // ===== 0–2 · o gancho: o gol em câmera lenta (a bola entra; o flash do gol em 0,7 s) e o artilheiro pulando
    // (gol-pulo.mp4: o pulo de 5,35 a 5,65 s do gol.mp4 a 0,6x, de perto) =====
    corta(null, 0);
    flash(tl, 1, 0.5, 0.2);

    // ===== 2–3 · VINHETA DE PLANTÃO =====
    {
      const t0 = T(1, 0);
      corta('#vin', t0);
      flash(tl, t0, 0.9, 0.3);
      tl.fromTo('#raios-vin', { rotation: 0 }, { rotation: 60, duration: 1, ease: 'none', immediateRender: false }, t0);
      tl.fromTo('#fx1', { x: -1400 }, { x: 0, duration: 0.25, ease: 'power3.out', immediateRender: false }, t0);
      tl.fromTo('#fx2', { x: 1400 }, { x: 0, duration: 0.25, ease: 'power3.out', immediateRender: false }, t0 + 0.06);
      tl.fromTo('#fx3', { x: -1400 }, { x: 0, duration: 0.25, ease: 'power3.out', immediateRender: false }, t0 + 0.12);
      tl.fromTo('#placa', { scale: 0.3, rotation: -6 }, { scale: 1, rotation: 0, duration: 0.3, ease: 'back.out(2.4)', immediateRender: false }, t0);
      // a bola que gira como um globo em cima da placa
      $('globo').innerHTML = `<svg viewBox="0 0 18 18"><g id="globo-g" style="transform-origin:9px 9px"><circle cx="9" cy="9" r="8" fill="#fff"/><polygon points="${Array.from({ length: 5 }, (_, i) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5; return `${9 + Math.cos(a) * 3.2},${9 + Math.sin(a) * 3.2}`; }).join(' ')}" fill="#1d1d1d"/>${Array.from({ length: 5 }, (_, i) => { const a = -Math.PI / 2 + Math.PI / 5 + (i * 2 * Math.PI) / 5; return `<circle cx="${9 + Math.cos(a) * 7.2}" cy="${9 + Math.sin(a) * 7.2}" r="1.8" fill="#1d1d1d"/>`; }).join('')}<circle cx="9" cy="9" r="8" fill="none" stroke="#0e1430" stroke-width="1.6"/></g></svg>`;
      tl.fromTo('#globo', { y: -500 }, { y: 0, duration: 0.3, ease: 'bounce.out', immediateRender: false }, t0 + 0.05);
      tl.fromTo('#globo-g', { rotation: 0 }, { rotation: 400, duration: 1, ease: 'power1.out', immediateRender: false }, t0);
      tl.set('#n1', { opacity: 1 }, T(1, 4));
      tl.fromTo('#n1', { scale: 2.4 }, { scale: 1, duration: 0.2, ease: 'back.out(2.5)', immediateRender: false }, T(1, 4));
      estouro(tl, $('vin'), 855, 1115, T(1, 4), { tam: 260 });
    }

    // ===== o estúdio: os três atrás da bancada larga (o Porygon na cadeira dele, longe da borda) =====
    const ALA = ator(BANC, 65, { escala: 16, z: 20, x: 230, y: 1250 });
    const MEO = ator(BANC, 52, { escala: 16, z: 20, x: 520, y: 1200, sombra: false });
    const POR = ator(BANC, 137, { escala: 13, z: 12, x: 840, y: 1240, opacity: 0 });
    gsap.set($('cadeira'), { opacity: 0 });
    anim(tl, ALA, 'Idle', 0, 0, FIM);
    anim(tl, MEO, 'Idle', 0, 0, FIM);
    const telas = ['#t-marca', '#t-pct', '#t-cal'];
    const telao = (id, t) => {
      tl.set(telas, { opacity: 0 }, t);
      tl.set(id, { opacity: 1 }, t);
      tl.fromTo(id, { scale: 0.8 }, { scale: 1, duration: 0.22, ease: 'back.out(2)', immediateRender: false }, t);
    };
    tl.fromTo('#raios-tel', { rotation: 0 }, { rotation: 100, duration: FIM, ease: 'none', immediateRender: false }, 0);
    /** Câmera da bancada: escala e posição (origem no canto). */
    const camera = (t, s = 1, x = 0, y = 0, d = 0) => (d ? tl.to('#cam', { scale: s, x, y, duration: d, ease: 'sine.inOut' }, t) : tl.set('#cam', { scale: s, x, y }, t));
    gsap.set('#cam', { transformOrigin: '0px 0px' });

    // ===== 3–8 · a barra de golpe nova: os gomos acendem devagar até o N3 (gomos-lento.mp4: 4,25 s, 5 s e 6 s) =====
    {
      const t0 = 3;
      corta('#fundo', t0);
      tl.fromTo('#raios-fundo', { rotation: 0 }, { rotation: 30, duration: 5, ease: 'none', immediateRender: false }, t0);
      ver('#m-gomos', t0);
      ver('#m-gomos', 8, false);
      tl.fromTo('#m-gomos', { scale: 0.85 }, { scale: 1, duration: 0.25, ease: 'back.out(2)', immediateRender: false }, t0);
      [[4.25, 568], [5.0, 700], [6.0, 828]].forEach(([t, x], i) =>
        estouro(tl, $('fx-moedas'), x, 988, t, { tam: 180 + 70 * i, cor: ['#ffcb05', '#ff8a1c', '#ff5c8a'][i] }),
      );
    }

    // ===== 8–10 · o Meowth e o 40% no telão =====
    {
      const t0 = 8;
      corta('#banc', t0);
      camera(t0, 1.12, -60, -60);
      camera(t0, 1.18, -95, -110, 2);
      telao('#t-pct', t0);
      tl.fromTo('#t-pct .pct', { rotation: -8 }, { rotation: 0, duration: 0.3, ease: 'back.out(3)', immediateRender: false }, t0);
      flash(tl, t0, 0.4, 0.2);
      anim(tl, MEO, 'Pose', 0, t0 + 0.3, t0 + 1.1, { loop: false });
      anim(tl, MEO, 'Idle', 0, t0 + 1.1, FIM);
    }
    // ===== 10–12 · o 1 de 3 de perto: o Patrocínio (Charanga de Pewter) ganha a moldura dourada =====
    {
      const t0 = 10;
      corta('#fundo', t0);
      tl.fromTo('#raios-fundo', { rotation: 30 }, { rotation: 45, duration: 2, ease: 'none', immediateRender: false }, t0);
      tl.set('#dest-patro', { opacity: 1 }, t0 + 0.6);
      tl.fromTo('#dest-patro', { scale: 1.2 }, { scale: 1, duration: 0.25, ease: 'back.out(2)', immediateRender: false }, t0 + 0.6);
      tl.to('#dest-patro', { scale: 1.03, duration: 0.3, ease: 'sine.inOut', repeat: 3, yoyo: true }, t0 + 0.85);
      tl.set('#dest-patro', { opacity: 0 }, 12);
    }
    // ===== 12–14 · PAY DAY!: chovem moedas na bancada e o Meowth junta tudo com as patas =====
    const FX = $('fx-moedas');
    const moeda = (x, y) => {
      const m = div(FX, 'moeda');
      m.textContent = '₽';
      gsap.set(m, { x, y });
      return m;
    };
    {
      const t0 = 12;
      corta('#banc', t0);
      camera(t0, 1);
      telao('#t-marca', t0);
      anim(tl, MEO, 'Hop', 0, t0, t0 + 0.6, { loop: false });
      anim(tl, MEO, 'Idle', 0, t0 + 0.6, FIM);
      // 9 moedas: cada uma pousa no tampo na nota dela (linhas 3 a 11 do C6)
      const caidas = [];
      for (let k = 0; k < 9; k++) {
        const pouso = T(6, 3 + k);
        const x = 120 + ((k * 263) % 600);
        const yf = 1150 - ((k * 37) % 30);
        const m = moeda(x, -80);
        caidas.push(m);
        tl.set(m, { opacity: 1 }, pouso - 0.3);
        tl.fromTo(m, { y: -80, rotation: 0 }, { y: yf, rotation: 200 + k * 30, duration: 0.3, ease: 'power2.in', immediateRender: false }, pouso - 0.3);
        tl.to(m, { keyframes: { y: [yf - 40, yf] }, duration: 0.2, ease: 'sine.inOut' }, pouso);
      }
      // ele puxa com as patas (Charge) no ka-ching (C6, 12) e as moedas escorregam pra ele
      const tj = T(6, 12) - 0.1;
      anim(tl, MEO, 'Charge', 0, tj, tj + 0.5, { loop: false });
      anim(tl, MEO, 'Idle', 0, tj + 0.5, FIM);
      caidas.forEach((m, k) => {
        tl.to(m, { x: 520, y: 1080, scale: 0.4, duration: 0.22, ease: 'power2.in' }, tj + 0.05 + (k % 5) * 0.025);
        tl.set(m, { opacity: 0 }, tj + 0.27 + (k % 5) * 0.025);
      });
      estouro(tl, $('banc'), 520, 1050, tj + 0.35, { tam: 200 });
    }

    // ===== 14–18,5 · o convidado: o Porygon chega na cadeira, ele e o estúdio borrados =====
    {
      const t0 = 14;
      camera(t0, 1.15, -266, -190);
      telao('#t-marca', t0);
      tl.set(['#cadeira', POR.el], { opacity: 1 }, t0);
      tl.fromTo(POR.corpo, { scaleY: 0, scaleX: 1.4 }, { scaleY: 1, scaleX: 1, duration: 0.3, ease: 'back.out(2.5)', immediateRender: false }, t0);
      anim(tl, POR, 'Idle', 6, t0, FIM);
      tl.set(POR.spr, { filter: 'blur(9px)' }, t0);
      tl.set('#banc', { filter: 'blur(3px)' }, t0);
      tl.set('#banc', { filter: 'none' }, 18.5);
      tl.set(POR.spr, { filter: 'none' }, 18.5);
    }
    // 18,5–21 · corta pra quadra de perto (close.mp4 de 0,65 s: sem o ícone de status, termina no chute do Persian)
    corta(null, 18.5);
    flash(tl, 18.5, 0.8, 0.25);

    // ===== 21–26 · o Alakazam; no telão, o calendário com uma bola em cada sexta =====
    const DIAS = ['20/11', '27/11', '04/12', '11/12'];
    const bolinhaSVG = () => `<svg class="bolinha" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#fff"/><polygon points="${Array.from({ length: 5 }, (_, i) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5; return `${9 + Math.cos(a) * 3.2},${9 + Math.sin(a) * 3.2}`; }).join(' ')}" fill="#1d1d1d"/>${Array.from({ length: 5 }, (_, i) => { const a = -Math.PI / 2 + Math.PI / 5 + (i * 2 * Math.PI) / 5; return `<circle cx="${9 + Math.cos(a) * 7.2}" cy="${9 + Math.sin(a) * 7.2}" r="1.8" fill="#1d1d1d"/>`; }).join('')}<circle cx="9" cy="9" r="8" fill="none" stroke="#0e1430" stroke-width="1.6"/></svg>`;
    $('dias').innerHTML = DIAS.map((d, i) => `<div class="dia${i === 1 ? ' ut' : ''}"><span>${d}</span><small>SEXTA</small>${bolinhaSVG()}</div>`).join('');
    {
      const t0 = 21;
      corta('#banc', t0);
      camera(t0, 1.08, -20, -40);
      tl.set([POR.el, '#cadeira'], { opacity: 0 }, t0);
      telao('#t-cal', t0);
      flash(tl, t0, 0.4, 0.2);
      // a colher: ele levanta e brilha (o "ting")
      tl.to(ALA.corpo, { keyframes: { y: [-12, 0], rotation: [-3, 0] }, duration: 0.35, ease: 'sine.inOut' }, t0 + 0.05);
      const br = div($('banc'), 'brilho-n');
      gsap.set(br, { x: 360, y: 880 });
      tl.fromTo(br, { opacity: 1, scale: 0.4, rotation: 0 }, { scale: 1.6, rotation: 90, opacity: 0, duration: 0.4, ease: 'power2.out', immediateRender: false }, t0);
      // uma bola por sexta, na nota de sino dela
      const bs = [...document.querySelectorAll('#dias .bolinha')];
      [T(11, 12), T(12, 0), T(12, 4), T(12, 8)].forEach((t, i) => {
        tl.set(bs[i], { opacity: 1 }, t - 0.16);
        tl.fromTo(bs[i], { y: -260, scaleY: 1 }, { keyframes: [{ y: 0, duration: 0.16, ease: 'power2.in' }, { scaleY: 0.7, scaleX: 1.2, duration: 0.05 }, { scaleY: 1, scaleX: 1, duration: 0.12, ease: 'back.out(3)' }], immediateRender: false }, t - 0.16);
      });
      tl.to(ALA.corpo, { keyframes: { rotation: [-4, 3, 0] }, duration: 0.6, ease: 'sine.inOut' }, T(12, 8));
    }
    // ===== 26–28,8 · o Time Ultimate: a fatia da tela do jogo ampliada (TIME ULTIMATE, EM BREVE 27/11) é o texto =====
    {
      const t0 = 26;
      corta('#fundo', t0);
      tl.fromTo('#raios-fundo', { rotation: 45 }, { rotation: 75, duration: FIM - t0, ease: 'none', immediateRender: false }, t0);
      flash(tl, t0, 0.4, 0.2);
      ver('#m-fatia', t0);
      tl.fromTo('#m-fatia', { scale: 0.9 }, { scale: 1, duration: 0.25, ease: 'back.out(2)', immediateRender: false }, t0);
      tl.to('#m-fatia', { scale: 1.04, duration: 2.55, ease: 'sine.inOut' }, t0 + 0.25);
      tl.to('#m-fatia', { opacity: 0, scale: 0.9, duration: 0.35, ease: 'power2.in' }, 28.9);
    }
    // ===== 28,8–32 · a carta ouro sai do pacote da fatia girando e vira no meio da tela (sem ninguém atrás) =====
    {
      const t0 = 28.8;
      const tv = T(15, 0);
      tl.set('#carta', { opacity: 1, left: 540 }, t0);
      tl.fromTo('#carta', { x: 39, y: -240, scale: 0.2 }, { x: 0, y: 80, scale: 1.2, duration: tv - t0, ease: 'power2.out', immediateRender: false }, t0);
      tl.fromTo('#gira', { rotationY: 0 }, { rotationY: 540, duration: tv - t0, ease: 'power2.inOut', immediateRender: false }, t0);
      flash(tl, tv, 0.6, 0.25);
      estouro(tl, $('fx-moedas'), 540, 1060, tv, { tam: 520, dur: 0.5 });
      tl.to('#carta', { keyframes: { y: [60, 80] }, duration: 0.9, ease: 'sine.inOut', repeat: 1, yoyo: true }, tv + 0.1);
      tl.set('#carta', { opacity: 0 }, 32);
    }

    // ===== 32–35 · TELA FINAL: o logo (SOC-CER-MON no 0, 3 e 6 do C16), Temos que chutar!, o site, os três na bancada =====
    {
      const t0 = T(16, 0);
      const fim = $('fim');
      const FC = $('fim-cena');
      telaFinal(fim);
      corta('#fim', t0);
      tl.fromTo('#raios-fim', { rotation: 0 }, { rotation: 20, duration: FIM - t0, ease: 'none', immediateRender: false }, t0);
      tl.set('#logo', { opacity: 1 }, t0);
      tl.fromTo('#logo', { scale: 0.7 }, { scale: 1, duration: 0.3, ease: 'back.out(3)', immediateRender: false }, t0);
      piscada(tl, [T(16, 0), T(16, 3), T(16, 6)]);
      tl.set('#tag', { opacity: 1 }, T(16, 8));
      tl.fromTo('#tag', { scale: 1.4 }, { scale: 1, duration: 0.2, ease: 'back.out(2)', immediateRender: false }, T(16, 8));
      tl.to('#site', { opacity: 1, duration: 0.2 }, t0 + 0.3);
      // os três na bancada pequena: pulam juntos no MON
      const a = ator(FC, 65, { escala: 10, z: 20, x: 330, y: 1330 });
      const m = ator(FC, 52, { escala: 10, z: 20, x: 540, y: 1300 });
      const p = ator(FC, 137, { escala: 10, z: 20, x: 750, y: 1270 });
      for (const x of [a, m, p]) {
        anim(tl, x, 'Idle', 0, t0, FIM);
        tl.to(x.corpo, { keyframes: [{ y: -50, scaleY: 1.08, duration: 0.14, ease: 'power2.out' }, { y: 0, scaleY: 1, duration: 0.14, ease: 'power2.in' }, { scaleY: 0.88, scaleX: 1.1, duration: 0.05 }, { scaleY: 1, scaleX: 1, duration: 0.12, ease: 'back.out(3)' }] }, T(16, 6));
      }
    }

    tl.set({}, {}, FIM);
    window.__timelines = window.__timelines || {};
    window.__timelines.root = tl;
  </script>
</div>
</body>
</html>
