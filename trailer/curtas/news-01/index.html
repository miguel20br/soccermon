  (técnico do Pallet FC, ainda tostado do EP 2) é o convidado; o Voltorb aparece no banco, de colete.
  Regra de leitura: a fala vai numa caixa de diálogo dos jogos de Pokémon (nome, texto letra por letra em 0,3 s, a
  setinha piscando quando completa) e fica inteira no mínimo 2,7 s; a manchete fica parada em cima a matéria inteira.
  Nunca dois textos novos juntos: quando a manchete troca, a caixa fecha e a fala nova só começa 0,3 s depois.
  A escalada é um sumário, não matéria: sem caixa nem manchete, o banner HOJE NO SOCCERMON NEWS e 4 cartelas de 2 s.
  Trechos do jogo: as telas do capturar.mjs (midia/news: recompensa.png, ultimate-fatia.png, menu-fatias.png), o gol
  (gol.mp4, gol-pulo.mp4, recortados pra ninguém ficar cortado na borda) e o KABOOM do Vestiário EP 2 "Bola fora"
  (bola-fora.mp4: 22 a 26 s do render v7 do ep14).
  Música: scripts/musica/pecas/news-plantao.mjs (120 BPM, 33 compassos), em midia/som/news-14.wav.
  v5 (mais animado): câmera de telejornal (plano fechado de quem fala, empurrão de 4% em 3 s), quem fala dá um pulinho,
  reações com as animações PMD (o Shoot do Alakazam no "ting", o Hop do Meowth no Pay Day, o Charge do Psyduck
  balançando), varrida entre matérias, a manchete desliza, o microfone do Meowth num pedestal e a despedida nova (o
  Alakazam agradece e os três gritam "Temos que chutar!" pulando na bancada).
  Render (de trailer/curtas): ../../scripts/pesado.sh npx hyperframes render news-01 -q high -w 1 --no-browser-gpu -o news-01/render/v5b.mp4
-->

  <script>
    const { T, div, ator, anim, quadro, flash, estouro, telaFinal, piscada, quadra } = C;
    const FIM = 67;
    const tl = gsap.timeline({ paused: true });
    const $ = (id) => document.getElementById(id);
    const ver = (els, t, on = true) => tl.set(els, { autoAlpha: on ? 1 : 0 }, t);
    const CENAS = ['#vin', '#banc', '#rota', '#esc', '#banco-c', '#fundo', '#fim'];
    const corta = (id, t) => {
      ver(CENAS, t, false);
      if (id) ver(id, t);
    };
    const PAINEIS = ['#m-rec', '#dest-patro', '#carta-patro', '#m-fatia', '#m-menu', '#dest-ut', '#m-vt'];
    /** Só estes painéis no ar a partir de t (o resto some). */
    const paineis = (t, ...on) => {
      tl.set(PAINEIS.filter((p) => !on.includes(p)), { opacity: 0 }, t);
      for (const p of on) tl.set(p, { opacity: 1 }, t);
    };
    const entra = (id, t, de = 0.9) => tl.fromTo(id, { scale: de }, { scale: 1, duration: 0.25, ease: 'back.out(2)', immediateRender: false }, t);
    const MICRO_V4 = '<svg viewBox="0 0 40 110"><rect x="15" y="34" width="10" height="70" rx="4" fill="#2b3045" stroke="#0e1430" stroke-width="4"/><rect x="11" y="30" width="18" height="10" rx="3" fill="#e8423f" stroke="#0e1430" stroke-width="3"/><circle cx="20" cy="17" r="15" fill="#c8d0f0" stroke="#0e1430" stroke-width="4"/><path d="M9 12h22M8 19h24M11 26h18" stroke="#8a94b8" stroke-width="2.5"/><ellipse cx="20" cy="66" rx="13" ry="11" fill="#f8f0d0" stroke="#0e1430" stroke-width="3.5"/><path d="M10 62h20M10 69h20" stroke="#c8b890" stroke-width="2"/></svg>';
    /** O microfone do Meowth num pedestal na frente dele, do lado, com a cabeça do microfone na altura da boca
     * (sem cobrir a cara): filho do pé (el), então fica no chão quando ele pula; e = escala do ator / 17. */
    const PEDESTAL = '<svg viewBox="0 -200 200 230"><g stroke="#0e1430" stroke-linecap="round">'
      + '<path d="M128 -6 L96 22 M128 -6 L160 22 M128 -6 L128 24" stroke-width="13"/><path d="M128 -6 L96 22 M128 -6 L160 22 M128 -6 L128 24" stroke="#2b3045" stroke-width="6"/>'
      + '<rect x="121" y="-122" width="14" height="120" rx="5" fill="#2b3045" stroke-width="5"/>'
      + '<rect x="117" y="-70" width="22" height="12" rx="4" fill="#e8423f" stroke-width="4"/>'
      + '<path d="M128 -122 L112 -138" stroke-width="13"/><path d="M128 -122 L112 -138" stroke="#2b3045" stroke-width="6"/>'
      + '<g transform="rotate(-38 104 -150)"><rect x="92" y="-160" width="24" height="34" rx="6" fill="#2b3045" stroke-width="5"/>'
      + '<rect x="90" y="-188" width="28" height="34" rx="14" fill="#c8d0f0" stroke-width="5"/><path d="M95 -177h18M94 -169h20M96 -161h16" stroke="#8a94b8" stroke-width="3"/></g>'
      + '</g></svg>';
    const microfone = (a, e = 1) => {
      const m = div(a.el, 'pedestal');
      m.innerHTML = PEDESTAL;
      gsap.set(m, { scale: e, transformOrigin: '0px 0px', zIndex: 3 });
      return m;
    };

    // ===================== a linha do tempo: manchete (M) e as falas =====================
    // Cada fala: [início do bloco, quem, texto, manchete nova ou null, fim do bloco (se não for o início da próxima)].
    // Com manchete nova, a manchete troca no início do bloco e o texto só começa 0,3 s depois; sem, o texto começa no
    // início. O texto aparece em 0,3 s e fica inteiro até o fim do bloco (no mínimo 2,7 s).
    const ALA = 'ALAKAZAM', MEO = 'MEOWTH', PSY = 'PSYDUCK', TODOS = 'TODOS';
    const ESC = 10.5; // a escalada (sumário): 4 cartelas de 2 s, sem caixa nem manchete
    const ROTEIRO = [
      [4.0, ALA, 'Boa noite! Eu sou o Alakazam, seu apresentador desta noite.', 'SOCCERMON NEWS #1'],
      [7.3, ALA, 'Hoje: as novidades da versão 0.9.51, e mais.', null, ESC],
      [18.5, ALA, 'Na Copa do Dia e na Relâmpago, a recompensa da vitória mudou.', 'RECOMPENSA NOVA'],
      [21.8, ALA, 'Em 4 de cada 10 vitórias, uma das opções é um Patrocínio…'],
      [24.8, ALA, '…um bônus forte que vale pro time inteiro.'],
      [28.0, ALA, 'Agora, ao vivo da Rota Índigo, nosso repórter Meowth.', 'AO VIVO · ROTA ÍNDIGO'],
      [31.3, MEO, 'Aqui na Rota, cada jogo vencido agora paga ₽3 pra gastar no Mercado.'],
      [34.3, MEO, 'Três vitórias, ₽9. Pay Day!'],
      [37.5, ALA, 'No Vestiário do Pallet FC, uma bola explodiu no treino.', 'VESTIÁRIO DO PALLET FC'],
      [41.5, ALA, 'Psyduck, o que vocês fizeram com o Voltorb?', 'PSYDUCK · TÉCNICO'],
      [44.8, PSY, 'Agora ele é reserva.'],
      [48.0, ALA, 'Um aviso: a partir de agora, sai atualização nova toda semana.', 'TODA SEMANA'],
      [51.5, ALA, 'E na sexta que vem, dia 27, abre o Time Ultimate…', 'TIME ULTIMATE · 27/11'],
      [55.0, ALA, '…o modo novo em que você abre pacotes e monta o time da temporada.'],
      [58.5, ALA, 'Muito obrigado pela companhia, e boa noite!'],
      [61.5, TODOS, 'Temos que chutar!'],
    ];
    const FIM_FALAS = 64.5;
    const DIGITA = 0.3;
    const RESPIRO = 0.3;
    const CAIXA = $('caixa');
    // os textos: cada palavra num <b> (não quebra no meio), cada letra num <s> que aparece na vez dela
    const blocos = ROTEIRO.map(([s, quem, texto, manchete, fim], i) => {
      const a = manchete ? s + RESPIRO : s;
      const z = fim ?? (i + 1 < ROTEIRO.length ? ROTEIRO[i + 1][0] : FIM_FALAS);
      const el = div(CAIXA, 'txt');
      el.innerHTML = texto.split(' ').map((p) => `<b>${Array.from(p).map((c) => `<s>${c}</s>`).join('')}</b>`).join(' ');
      return { s, a, z, quem, texto, manchete, el, letras: [...el.querySelectorAll('s')] };
    });
    window.__falas = blocos.map(({ s, a, z, quem, texto, manchete }) => ({ s, a, z, quem, texto, manchete, inteira: +(z - a - DIGITA).toFixed(2) }));
    const barra = $('barra');
    for (const b of blocos) {
      // manchete nova: a caixa fecha, a manchete troca (varre da esquerda em 0,3 s); a caixa volta em a
      if (b.manchete) {
        const sp = div(barra, '');
        sp.appendChild(document.createElement('span'));
        sp.firstChild.textContent = b.manchete;
        sp.style.cssText = 'position:absolute;inset:0;opacity:0';
        b.sp = sp;
        tl.set(barra.children, { opacity: 0 }, b.s);
        tl.set(sp, { opacity: 1 }, b.s);
        // a manchete nova entra deslizando da direita (atrás da varrida, quando tem)
        tl.fromTo('#manchete', { x: 1100 }, { x: 0, duration: 0.35, ease: 'power3.out', immediateRender: false }, b.s + 0.04);
        tl.set(CAIXA, { opacity: 0 }, b.s);
        tl.set(CAIXA, { opacity: 1 }, b.a);
        tl.fromTo(CAIXA, { y: 24 }, { y: 0, duration: 0.12, ease: 'power2.out', immediateRender: false }, b.a);
      }
      tl.set('#nome', { textContent: b.quem }, b.a);
      tl.set(CAIXA.querySelectorAll('.txt'), { opacity: 0 }, b.a);
      tl.set(b.el, { opacity: 1 }, b.a);
      const n = b.letras.length;
      b.letras.forEach((l, i) => tl.set(l, { visibility: 'visible' }, b.a + (DIGITA * i) / n));
      // a setinha pisca quando o texto completa
      tl.set('#seta', { opacity: 0 }, b.a);
      for (let t = b.a + DIGITA + 0.1, k = 0; t < b.z - 0.05; t += 0.3, k++) tl.set('#seta', { opacity: k % 2 ? 0 : 1 }, t);
      tl.set('#seta', { opacity: 0 }, b.z);
    }
    // a manchete com o selo: entra com a bancada, some na escalada, volta na Matéria 1, sai na tela final
    const mancheteEntra = (t) => tl.set('#manchete', { opacity: 1 }, t);
    mancheteEntra(4.0);
    tl.set(['#manchete', CAIXA], { opacity: 0 }, ESC);
    mancheteEntra(18.5);
    for (let t = 4.0, k = 0; t < FIM_FALAS; t += 0.5, k++) tl.set('#ponto', { opacity: k % 2 ? 0.25 : 1 }, t);
    tl.set(['#manchete', CAIXA], { opacity: 0 }, FIM_FALAS);
    const B = Object.fromEntries(blocos.map((b, i) => [i + 1, b]));

    // a varrida entre matérias: a faixa cobre a tela inteira no instante t (o corte de cena) e sai pela esquerda
    gsap.set('#varre', { skewX: -12, x: 1400 });
    const VARRIDAS = [10.5, 18.5, 28.0, 37.5, 48.0, 51.5, 58.5];
    for (const t of VARRIDAS) {
      tl.fromTo('#varre', { x: 1400 }, { x: -310, duration: 0.2, ease: 'power2.out', immediateRender: false }, t - 0.2);
      tl.to('#varre', { x: -2100, duration: 0.24, ease: 'power2.in' }, t);
    }
    window.__varridas = VARRIDAS;
    // a câmera dos painéis (as telas do jogo): um empurrão leve em cada fala (o topo da moldura fica parado)
    gsap.set('#pan', { transformOrigin: '540px 330px' });
    gsap.set('#v-bola', { transformOrigin: '264px 12px' });
    const empurra = (t, d = 3, k = 1.04, alvos = '#pan') => tl.fromTo(alvos, { scale: 1 }, { scale: k, duration: d, ease: 'sine.out', immediateRender: false }, t);

    // ===================== 0–2 · o gancho: o gol em câmera lenta e o artilheiro pulando =====================
    corta(null, 0);
    flash(tl, 1, 0.5, 0.2);

    // ===================== 2–4 · VINHETA DE PLANTÃO =====================
    {
      const t0 = 2;
      corta('#vin', t0);
      flash(tl, t0, 0.9, 0.3);
      tl.fromTo('#raios-vin', { rotation: 0 }, { rotation: 80, duration: 2, ease: 'none', immediateRender: false }, t0);
      tl.fromTo('#fx1', { x: -1400 }, { x: 0, duration: 0.3, ease: 'power3.out', immediateRender: false }, t0);
      tl.fromTo('#fx2', { x: 1400 }, { x: 0, duration: 0.3, ease: 'power3.out', immediateRender: false }, t0 + 0.08);
      tl.fromTo('#fx3', { x: -1400 }, { x: 0, duration: 0.3, ease: 'power3.out', immediateRender: false }, t0 + 0.16);
      tl.fromTo('#placa', { scale: 0.3, rotation: -6 }, { scale: 1, rotation: 0, duration: 0.35, ease: 'back.out(2.4)', immediateRender: false }, t0);
      $('globo').innerHTML = `<svg viewBox="0 0 18 18"><g id="globo-g" style="transform-origin:9px 9px"><circle cx="9" cy="9" r="8" fill="#fff"/><polygon points="${Array.from({ length: 5 }, (_, i) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5; return `${9 + Math.cos(a) * 3.2},${9 + Math.sin(a) * 3.2}`; }).join(' ')}" fill="#1d1d1d"/>${Array.from({ length: 5 }, (_, i) => { const a = -Math.PI / 2 + Math.PI / 5 + (i * 2 * Math.PI) / 5; return `<circle cx="${9 + Math.cos(a) * 7.2}" cy="${9 + Math.sin(a) * 7.2}" r="1.8" fill="#1d1d1d"/>`; }).join('')}<circle cx="9" cy="9" r="8" fill="none" stroke="#0e1430" stroke-width="1.6"/></g></svg>`;
      tl.fromTo('#globo', { y: -500 }, { y: 0, duration: 0.35, ease: 'bounce.out', immediateRender: false }, t0 + 0.05);
      tl.fromTo('#globo-g', { rotation: 0 }, { rotation: 600, duration: 2, ease: 'power1.out', immediateRender: false }, t0);
      tl.set('#n1', { opacity: 1 }, T(1, 8));
      tl.fromTo('#n1', { scale: 2.4 }, { scale: 1, duration: 0.2, ease: 'back.out(2.5)', immediateRender: false }, T(1, 8));
      estouro(tl, $('vin'), 855, 1115, T(1, 8), { tam: 260 });
    }

    // ===================== o estúdio =====================
    const CAM = $('cam');
    gsap.set(CAM, { transformOrigin: '0px 0px' });
    /**
     * Plano de telejornal: escala s com o ponto (fx, fy) do estúdio em (sx, sy) na tela, e o empurrão de 4% em d s.
     * Os planos (o estúdio vai de x −700 a 1780, então o fechado não mostra a borda do cenário):
     *   ABERTO: a bancada inteira; MEDIO: o Alakazam e o telão inteiro (quando o telão importa); DOIS: o Alakazam e o
     *   Psyduck; ALA: o Alakazam de perto (telão sem imagem, a cadeira fora); PSY: o Psyduck de perto.
     * O Alakazam ocupa x 10 a 490 do estúdio (a folha tem ±16 px, escala 15) e o telão 74 a 1006 com a moldura: nos planos
     * com o telão a escala para em ~1,076 e o ponto fixo fica à esquerda, senão a colher ou o telão passam da borda.
     */
    const PLANOS = {
      ABERTO: [1.0, 100, 900, 100, 900],
      MEDIO: [1.04, 507, 900, 540, 800, 1.035],
      DOIS: [1.04, 507, 1000, 540, 860, 1.035],
      ALA: [1.4, 250, 900, 470, 640],
      PSY: [1.45, 830, 1050, 540, 760],
    };
    const plano = (t, nome, d = 3) => {
      const [s0, fx, fy, sx, sy, k = 1.04] = PLANOS[nome];
      const xy = (z) => ({ scale: z, x: sx - z * fx, y: sy - z * fy });
      tl.fromTo(CAM, xy(s0), { ...xy(s0 * k), duration: d, ease: 'sine.out', immediateRender: false }, t);
    };
    const XA = 250; // o Alakazam na bancada
    const XC = 830; // a cadeira do convidado
    const AL = ator(CAM, 65, { escala: 15, z: 20, x: XA, y: 1150 });
    const ME = ator(CAM, 52, { escala: 14, z: 20, x: 500, y: 1120, opacity: 0 });
    const PS = ator(CAM, 54, { escala: 13, z: 12, x: XC, y: 1214, opacity: 0, sombra: false });
    const TOSTADO = 'brightness(0.66) sepia(0.65) saturate(1.3)';
    gsap.set(PS.spr, { filter: TOSTADO });
    const prancheta = div(PS.corpo, 'prancheta');
    gsap.set(prancheta, { x: 36, y: -250, rotation: 8, scale: 0.85, filter: 'brightness(0.85)' });
    anim(tl, AL, 'Idle', 0, 0, FIM);
    anim(tl, ME, 'Idle', 0, 0, FIM);
    anim(tl, PS, 'Idle', 0, 0, FIM, { vel: 0.6 });
    const telas = ['#t-marca', '#t-meo', '#t-cal'];
    const telao = (id, t) => {
      tl.set(telas, { opacity: 0 }, t);
      if (!id) return; // plano fechado: o telão fica só com os raios (ele passa da borda da tela)
      tl.set(id, { opacity: 1 }, t);
      tl.fromTo(id, { scale: 0.85 }, { scale: 1, duration: 0.22, ease: 'back.out(2)', immediateRender: false }, t);
    };

      tl.set('#carta', { opacity: 0 }, B[15].s);
    }

    // ===================== 58,5 · a despedida: o Alakazam agradece; 61,5 · os três: "Temos que chutar!" =====================
    corta('#banc', B[15].s);
    paineis(B[15].s);
    plano(B[15].s, 'ALA');
    telao(null, B[15].s);
    acena(B[15].a);
    tinge(B[15].s + 0.8); // o "ting" no "boa noite"
    // 61,5: corte pro plano aberto, os três na bancada; pulam juntos no grito (61,8) e no "TAR" (62,3)
    plano(B[16].s, 'ABERTO');
    telao('#t-marca', B[16].s);
    tl.set(ME.el, { opacity: 1 }, B[16].s);
    // (o Hop do PMD sobe ~40 px da folha: nessa escala eles voavam por cima do telão; aqui o pulo é à mão, de 70 px)
    for (const a of [AL, ME, PS])
      for (const t of [61.8, 62.3])
        tl.to(a.corpo, { keyframes: [{ y: -70, scaleY: 1.06, duration: 0.15, ease: 'power2.out' }, { y: 0, scaleY: 1, duration: 0.15, ease: 'power2.in' }, { scaleY: 0.9, scaleX: 1.08, duration: 0.05 }, { scaleY: 1, scaleX: 1, duration: 0.1, ease: 'back.out(3)' }] }, t);
    // e fecham numa pose: o Meowth e o Psyduck no Pose do PMD, o Alakazam com as colheres pra cima
    reage(ME, 'Pose', 62.8, 0.37);
    reage(PS, 'Pose', 62.8, 0.37);
    reage(AL, 'Shoot', 62.8, 0.55);

    // ===================== 64,5 · TELA FINAL: logo (SOC-CER-MON), Temos que chutar!, o site, os três pulando no MON =====================
    {
      const t0 = FIM_FALAS;
      const fim = $('fim');
      const FC = $('fim-cena');
      telaFinal(fim);
      corta('#fim', t0);
      tl.fromTo('#raios-fim', { rotation: 0 }, { rotation: 20, duration: FIM - t0, ease: 'none', immediateRender: false }, t0);
      tl.set('#logo', { opacity: 1 }, t0);
      tl.fromTo('#logo', { scale: 0.7 }, { scale: 1, duration: 0.3, ease: 'back.out(3)', immediateRender: false }, t0);
      piscada(tl, [t0, t0 + 0.375, t0 + 0.75]);
      tl.set('#tag', { opacity: 1 }, t0 + 0.9);
      tl.fromTo('#tag', { scale: 1.4 }, { scale: 1, duration: 0.2, ease: 'back.out(2)', immediateRender: false }, t0 + 0.9);
      tl.to('#site', { opacity: 1, duration: 0.2 }, t0 + 1.2);
      const a = ator(FC, 65, { escala: 10, z: 20, x: 330, y: 1330 });
      const m = ator(FC, 52, { escala: 10, z: 20, x: 540, y: 1300 });
      const p = ator(FC, 54, { escala: 10, z: 20, x: 750, y: 1300 });
      gsap.set(p.spr, { filter: TOSTADO });
      for (const x of [a, m, p]) {
        anim(tl, x, 'Idle', 0, t0, FIM);
        tl.to(x.corpo, { keyframes: [{ y: -50, scaleY: 1.08, duration: 0.14, ease: 'power2.out' }, { y: 0, scaleY: 1, duration: 0.14, ease: 'power2.in' }, { scaleY: 0.88, scaleX: 1.1, duration: 0.05 }, { scaleY: 1, scaleX: 1, duration: 0.12, ease: 'back.out(3)' }] }, t0 + 0.75);
      }
      // o "ting" da colher no fim (66 s, o Mi♭)
      const br = div(FC, 'brilho-n');
      gsap.set(br, { x: 420, y: 1060 });
      tl.fromTo(br, { opacity: 1, scale: 0.4, rotation: 0 }, { scale: 1.8, rotation: 90, opacity: 0, duration: 0.5, ease: 'power2.out', immediateRender: false }, t0 + 1.5);
    }

    tl.set({}, {}, FIM);
    window.__timelines = window.__timelines || {};
    window.__timelines.root = tl;
  </script>
</div>
