  Regra de leitura (teste do Golduck): a fala vai numa caixa de diálogo com o retrato PMD de quem fala ao lado (a
  expressão muda por fala), 1 letra a cada 50 ms, no máximo 2 linhas (a que não cabe vira 2 páginas) e inteira no mínimo
  2,7 s. A manchete fica parada em cima com o nome do bloco; o selo 19:00 · AO VIVO no canto vira 19:01 na metade.
  Só 2 transições com a cartinha (a varrida: escalada e VEM AÍ); as outras trocas são corte seco com um whoosh curto.
  Fica da v7: a recompensa com as outras opções borradas e o holofote na Charanga, os troféus 4/10, as barras +4 com a
  carta do Onix, o painel ₽3 → ₽6 → ₽9, as moedas do Pay Day caindo de cima, o calendário, o pacote com o Mewtwo 93 e a
  tela final. Novo: o Voltorb de colete no gancho, a dupla (sprites vestidos por news-01/teste-gravata/gravata.mjs e
  teste-machoke/terno.mjs, no preparar.mjs), o Psyduck na cadeira de convidado na ponta da bancada, a tarja ATRASO NO
  SINAL, a partida rolando atrás do Meowth e o 27/11 do calendário virando Time Ultimate.

-->

      tl.fromTo(pr, { y: -420 }, { y: 0, duration: 0.3, ease: 'back.out(1.5)', immediateRender: false }, M.cheia + 0.15);
      poe('#rs-n', '0', M.cheia, 1);
      M.vitorias.forEach((t, i) => {
        tl.set(vs[i].querySelector('.aceso'), { opacity: 1 }, t);
        tl.fromTo(vs[i], { y: 140, scale: 0.4 }, { y: 0, scale: 1, duration: 0.25, ease: 'back.out(2.2)', immediateRender: false }, t);
        poe('#rs-n', String(3 * (i + 1)), t + 0.05, 1.8);
        tl.fromTo('#p-rota .rs .moeda', { rotationY: 0 }, { rotationY: 360, duration: 0.3, ease: 'power2.out', immediateRender: false }, t);
        estouro(tl, pr, 740, 100, t + 0.05, { tam: 200, dur: 0.28 });
      });
    }
    // f11 · "Pay Day!": o Meowth pula, o amuleto brilha e 14 moedas caem do alto e quicam em volta dele
    {
      const tp = M.payday;
      tl.to(MR.corpo, { keyframes: [{ y: -170, scaleY: 1.08, scaleX: 0.95, duration: 0.2, ease: 'power2.out' }, { y: 0, scaleY: 1, scaleX: 1, duration: 0.2, ease: 'power2.in' }] }, tp);
      tl.to(MR.corpo, { keyframes: [{ scaleY: 0.9, scaleX: 1.08, duration: 0.05 }, { scaleY: 1, scaleX: 1, duration: 0.12, ease: 'back.out(3)' }] }, tp + 0.4);
      const br = div(RC, 'brilho-n');
      gsap.set(br, { x: 540, y: 1130 - 255 });
      tl.fromTo(br, { opacity: 1, scale: 0.5, rotation: 0 }, { scale: 2.2, rotation: 90, opacity: 0, duration: 0.4, ease: 'power2.out', immediateRender: false }, tp + 0.12);
      M.moedas.forEach((chao, k) => {
        const t = chao - 0.5;
        const lado = k % 2 ? 1 : -1;
        const xf = 540 + lado * (170 + ((k * 97) % 130));
        const yf = 1100 + ((k * 53) % 90);
        const x0 = xf - lado * (20 + ((k * 31) % 40));
        const m = div(RC, 'moeda', `z-index:${yf > 1130 ? 30 : 15}`);
        m.textContent = '₽';
        tl.set(m, { opacity: 1 }, t);
        tl.fromTo(m, { x: x0, y: 90 }, { x: xf, y: yf, duration: 0.5, ease: 'power2.in', immediateRender: false }, t);
        tl.fromTo(m, { rotation: 0 }, { rotation: lado * (300 + k * 20), duration: 0.5, ease: 'none', immediateRender: false }, t);
        tl.to(m, { keyframes: { y: [yf - 34, yf] }, duration: 0.18, ease: 'sine.inOut' }, chao);
        tl.set(m, { opacity: 0 }, M.vestiario);
      });
      anim(tl, MR, 'Pose', 0, tp + 1.9, tp + 2.45, { loop: false });
      anim(tl, MR, 'Idle', 0, tp + 2.45, FIM);
    }

    // ===================== VESTIÁRIO =====================
    // f12 · o Machoke sobre o clipe do EP 2 (o KABOOM no "explodiu")
    corta('#fundo', M.vestiario);
    tl.fromTo('#raios-fundo', { rotation: 40 }, { rotation: 60, duration: 6, ease: 'none', immediateRender: false }, M.vestiario);
    paineis(M.vestiario, '#m-vt');
    entra('#m-vt', M.vestiario, 0.95);
    empurra(M.vestiario, M.reacao - M.vestiario, 1.05, ['#pan', '#v-bola']);
    // a reação: o Raichu de perto, sem graça (olha pro outro lado, gota de suor), só o retrato
    estudio(M.reacao, 'REACAO', null, F.f13.s - M.reacao);
    {
      const t0 = M.reacao;
      const gota = div(RA.corpo, 'gota');
      tl.fromTo(gota, { x: 110, y: -330, opacity: 0 }, { y: -300, opacity: 1, duration: 0.18, ease: 'power2.out', immediateRender: false }, t0 + 0.15);
      tl.to(gota, { y: -250, opacity: 0, duration: 0.3, ease: 'power2.in' }, t0 + 0.85);
      tl.to(RA.corpo, { keyframes: { scaleY: [1, 0.94, 1] }, duration: 0.3, ease: 'sine.inOut' }, t0 + 0.1);
    }
    // f13 e f14 · o Raichu e o Psyduck (a cadeira do convidado na ponta da bancada)
    estudio(F.f13.s, 'CONVIDADO', '#t-marca', M.voltorb - F.f13.s);
    gc('PSYDUCK', 'TÉCNICO DO PALLET FC', F.f13.a + 0.3, F.f13.a + 2.6);
    tl.to(RA.corpo, { rotation: -5, duration: 0.3, ease: 'sine.inOut' }, F.f13.a + 0.6);
    tl.to(RA.corpo, { rotation: 0, duration: 0.3, ease: 'sine.inOut' }, F.f13.z - 0.4);
    for (let k = 0; k < 3; k++) {
      const f = div(PS.corpo, 'fumaca');
      const t = F.f13.s + 0.3 + 1.4 * k;
      const x = -14 + 26 * (k % 2);
      tl.fromTo(f, { x, y: -300, scale: 0.3, opacity: 0 }, { x: x + 8, y: -350, scale: 0.8, opacity: 0.85, duration: 0.8, ease: 'sine.out', immediateRender: false }, t);
      tl.to(f, { opacity: 0, y: -365, duration: 0.3 }, t + 0.8);
    }
    tl.to(prancheta, { rotation: -6, y: -270, duration: 0.3, ease: 'sine.inOut' }, F.f13.a + 1.4);
    tl.to(PS.corpo, { rotation: 6, scaleY: 0.95, duration: 0.3, ease: 'sine.inOut' }, F.f13.a + 1.4);
    tl.to(PS.corpo, { rotation: 0, scaleY: 1, duration: 0.3, ease: 'sine.inOut' }, F.f13.z - 0.3);
    tl.to(prancheta, { rotation: 8, y: -250, duration: 0.3, ease: 'sine.inOut' }, F.f13.z - 0.3);
    // "Agora ele é reserva.": o Psyduck balança, a mão na cabeça (o Charge do PMD)
    anim(tl, PS, 'Charge', 0, F.f14.a, M.voltorb, { vel: 0.45 });
    anim(tl, PS, 'Idle', 0, M.voltorb, FIM, { vel: 0.6 });
    tl.to(PS.corpo, { keyframes: { rotation: [0, 7, -6, 6, -4, 0] }, duration: 1.35, ease: 'sine.inOut' }, F.f14.a);
    // o corte pro banco: o Voltorb de colete (o mesmo plano do gancho), com a tarja VOLTORB · RESERVA
    banco(M.voltorb, M.vemai - M.voltorb);
    piscaVT(M.voltorb + 0.6);
    piscaVT(M.voltorb + 0.95);
    piscaVT(M.voltorb + 2.4);
    gc('VOLTORB', 'RESERVA', M.voltorb + 0.25, M.vemai - 0.3);

    // ===================== VEM AÍ: o calendário e o Time Ultimate =====================
    // f15 · as quatro sextas, uma bola em cada; f16 · o quadradinho do 27/11 vira Time Ultimate
    const DIAS = ['20/11', '27/11', '04/12', '11/12'];
    const bolinhaSVG = () => BOLA.replace('<svg ', '<svg class="bolinha" ');
    $('dias').innerHTML = DIAS.map((d) => `<div class="dia"><div class="gira"><div class="f"><span>${d}</span><small>SEXTA</small>${bolinhaSVG()}</div><div class="v"><img src="midia/news/cartas/pack.png" alt="" /><b>TIME<br>ULTIMATE</b></div></div></div>`).join('');
    corta('#fundo', M.vemai);
    tl.fromTo('#raios-fundo', { rotation: 60 }, { rotation: 110, duration: F.f16.z - M.vemai, ease: 'none', immediateRender: false }, M.vemai);
    paineis(M.vemai, '#p-cal');
    empurra(M.vemai, F.f16.z - M.vemai, 1.03);
    {
      const dias = [...document.querySelectorAll('#dias .dia')];
      dias.forEach((d, i) => tl.fromTo(d, { y: 600, rotation: 6 }, { y: 0, rotation: 0, duration: 0.3, ease: 'back.out(1.5)', immediateRender: false }, M.vemai + 0.1 + i * 0.08));
      tl.fromTo('#p-cal .topo', { y: -300 }, { y: 0, duration: 0.3, ease: 'back.out(1.5)', immediateRender: false }, M.vemai);
      const bs = dias.map((d) => d.querySelector('.bolinha'));
      M.sextas.forEach((t, i) => {
        tl.set(bs[i], { opacity: 1 }, t - 0.16);
        tl.fromTo(bs[i], { y: -300, scaleY: 1 }, { keyframes: [{ y: 0, duration: 0.16, ease: 'power2.in' }, { scaleY: 0.7, scaleX: 1.2, duration: 0.05 }, { scaleY: 1, scaleX: 1, duration: 0.12, ease: 'back.out(3)' }], immediateRender: false }, t - 0.16);
      });
      const ut = dias[1];
      gsap.set(ut, { zIndex: 2 });
      tl.fromTo(ut.querySelector('.gira'), { rotationY: 0 }, { rotationY: 180, duration: 0.35, ease: 'power2.inOut', immediateRender: false }, M.ultimate - 0.15);
      tl.fromTo(ut, { scale: 1 }, { keyframes: [{ scale: 1.22, duration: 0.2, ease: 'power2.out' }, { scale: 1.12, duration: 0.2, ease: 'power2.in' }], immediateRender: false }, M.ultimate);
      estouro(tl, $('p-cal'), 70 + 217 + 24 + 108, 470 + 126 + 200, M.ultimate + 0.15, { tam: 460, dur: 0.35 });
      tl.to([dias[0], dias[2], dias[3]], { opacity: 0.45, duration: 0.3 }, M.ultimate + 0.2);
      for (let t = M.ultimate + 0.75; t < F.f16.z - 0.3; t += 0.5) tl.fromTo(ut.querySelector('.v img'), { scale: 1.08 }, { scale: 1, duration: 0.22, ease: 'power2.out', immediateRender: false }, t);
    }
    // f17 · um pacote abre e as cartas caem numa escalação de 5; o Mewtwo 93 vira por último e vem pro meio, grande
    {
      const TP = M.pacote;
      const t0 = F.f17.s;
      paineis(t0, '#p-pacote');
      empurra(t0, F.f17.z - t0, 1.03);
      const P = $('p-pacote');
      tl.fromTo('#campo-ut', { opacity: 0 }, { opacity: 1, duration: 0.25, immediateRender: false }, t0);
      const PX0 = 540, PY0 = 790;
      const pac = div(P, 'pacote', `transform:translate(${PX0}px,${PY0}px)`);
      pac.innerHTML = '<div class="corpo-p" style="background-image:url(midia/news/cartas/pack-aberto.png)"></div><div class="tampa" style="background-image:url(midia/news/cartas/pack.png)"></div><div class="luz"></div>';
      const frente = div(pac, '', 'background-image:url(midia/news/cartas/pack.png)');
      tl.fromTo(pac, { y: PY0 - 1100 }, { y: PY0, duration: 0.25, ease: 'bounce.out', immediateRender: false }, TP.cai);
      tl.to(pac, { keyframes: { rotation: [0, -5, 5, -4, 4, -2, 0] }, duration: 0.25, ease: 'none' }, TP.treme);
      tl.set(frente, { opacity: 0 }, TP.rasga);
      tl.to(pac.querySelector('.tampa'), { x: 260, y: -360, rotation: 50, opacity: 0, duration: 0.4, ease: 'power2.out' }, TP.rasga);
      tl.fromTo(pac.querySelector('.luz'), { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1.3, duration: 0.2, ease: 'power2.out', immediateRender: false }, TP.rasga);
      tl.to(pac.querySelector('.luz'), { opacity: 0, duration: 0.4 }, TP.rasga + 0.5);
      tl.to(pac, { scale: 0.5, opacity: 0, duration: 0.25, ease: 'power2.in' }, TP.sai.at(-1) + 0.15);
      const VAGAS = [[540, 1125, 143], [540, 830, 95], [215, 700, 26], [540, 490, 130], [865, 700, 150]];
      const outras = [];
      VAGAS.forEach(([x, y, id], k) => {
        const v = div(P, 'vaga');
        v.innerHTML = `<div class="gira"><div class="verso"><img src="midia/logo-simbolo.svg" alt="" /></div><div class="face" style="background-image:url(midia/news/cartas/${id}.png)"></div></div>`;
        const g = v.querySelector('.gira');
        const ts = TP.sai[k];
        gsap.set(v, { x, y, opacity: 0 });
        tl.set(v, { opacity: 1 }, ts);
        tl.fromTo(v, { x: PX0, y: PY0 - 120, scale: 0.4 }, { x, y, scale: 1, duration: 0.25, ease: 'power2.out', immediateRender: false }, ts);
        tl.fromTo(g, { rotationZ: k % 2 ? 200 : -200 }, { rotationZ: 0, duration: 0.25, ease: 'power2.out', immediateRender: false }, ts);
        if (id !== 150) {
          const tv = TP.vira[outras.length];
          outras.push(v);
          tl.fromTo(g, { rotationY: 0 }, { rotationY: 180, duration: 0.24, ease: 'power2.inOut', immediateRender: false }, tv - 0.12);
          tl.fromTo(g, { scale: 1.12 }, { scale: 1, duration: 0.18, ease: 'back.out(2)', immediateRender: false }, tv + 0.1);
          return;
        }
        const tv = TP.mewtwo;
        tl.fromTo(g, { rotationY: 0 }, { rotationY: 540, duration: 0.45, ease: 'power2.inOut', immediateRender: false }, tv - 0.3);
        flash(tl, tv, 0.6, 0.25);
        estouro(tl, P, x, y, tv, { tam: 480, dur: 0.45 });
        gsap.set(v, { zIndex: 35 });
        tl.to(v, { scale: 1.45, x: x - 40, duration: 0.25, ease: 'back.out(2)' }, tv);
        tl.to(v, { scale: 2.3, x: 540, y: 800, duration: 0.4, ease: 'power3.inOut' }, TP.foco);
        tl.to(g, { keyframes: { y: [-8, 0] }, duration: 0.9, ease: 'sine.inOut', repeat: 2 }, TP.foco + 0.4);
      });
      tl.to(outras, { opacity: 0.25, duration: 0.3 }, TP.foco);
      tl.to('#campo-ut', { opacity: 0.45, duration: 0.3 }, TP.foco);
    }

    // ===================== NOTA PÉ e o fechamento =====================
    // f18 · o Machoke: o Voltorb tá bem (ele no telão, de colete, piscando)
    estudio(M.notape, 'MACHOKE', '#t-volt', F.f18.z - M.notape);
    {
      const TV = $('tv-volt');
      gsap.set(TV, { scale: 0.85, x: 438 - 540 * 0.85, y: 360 - 1158 * 0.85 });
      const V2 = ator(TV, 100, { escala: 15, z: 20, x: 540, y: 1158, sombra: false });
      const pisca2 = vestirVoltorb(V2);
      for (const t of [F.f18.a + 1.2, F.f18.a + 1.55, letra(F.f18, 'bem')]) pisca2(t);
      tl.fromTo(V2.corpo, { y: 0 }, { keyframes: { y: [0, -40, 0, -24, 0] }, duration: 0.7, ease: 'sine.inOut', immediateRender: false }, letra(F.f18, 'bem'));
    }
    // f19 · o Raichu agradece: as faíscas no "boa noite" e uma reverência
    estudio(F.f19.s, 'RAICHU', '#t-marca', F.f19.z - F.f19.s);
    faisca(CAM, RX - 80, 900, M.boaNoite);
    faisca(CAM, RX + 90, 900, M.boaNoite + 0.08);
    faisca(CAM, RX + 10, 760, M.boaNoite + 0.16, 0.7);
    tl.to(RA.corpo, { keyframes: [{ y: 22, scaleY: 0.9, rotation: 4, duration: 0.25, ease: 'power2.out' }, { y: 22, scaleY: 0.9, rotation: 4, duration: 0.35 }, { y: 0, scaleY: 1, rotation: 0, duration: 0.25, ease: 'back.out(2)' }] }, F.f19.paginas[0].fim + 0.3);
    // f20 · "Temos que chutar!": a dupla e, no telão, o Meowth e o Psyduck; pulam no grito e no "TAR"
    estudio(F.f20.s, 'ABERTO', '#t-turma', M.final - F.f20.s);
    {
      const TT = $('tv-turma');
      const TM = ator(TT, 52, { escala: 11, z: 2, x: 300, y: 330, sombra: false });
      const TPs = ator(TT, 54, { escala: 11, z: 2, x: 580, y: 335, sombra: false });
      gsap.set(TPs.spr, { filter: TOSTADO });
      anim(tl, TM, 'Idle', 0, 0, FIM);
      anim(tl, TPs, 'Idle', 0, 0, FIM, { vel: 0.6 });
      for (const a of [RA, MA, TM, TPs])
        for (const t of M.grito)
          tl.to(a.corpo, { keyframes: [{ y: -60, scaleY: 1.06, duration: 0.15, ease: 'power2.out' }, { y: 0, scaleY: 1, duration: 0.15, ease: 'power2.in' }, { scaleY: 0.9, scaleX: 1.08, duration: 0.05 }, { scaleY: 1, scaleX: 1, duration: 0.1, ease: 'back.out(3)' }] }, t + (a === TM || a === TPs ? 0.04 : 0));
      reage(TM, 'Pose', M.grito[1] + 0.5, 0.37);
      reage(TPs, 'Pose', M.grito[1] + 0.5, 0.37);
      function reage(a, nome, t, dur) {
        anim(tl, a, nome, 0, t, t + dur, { loop: false });
        anim(tl, a, 'Idle', 0, t + dur, FIM, a === TPs ? { vel: 0.6 } : {});
      }
    }

    // ===================== TELA FINAL: logo (SOC-CER-MON), Temos que chutar!, soccermon.com e a turma =====================
    {
      const t0 = M.final;
      const FC = $('fim-cena');
      telaFinal($('fim'));
      corta('#fim', t0);
      tl.fromTo('#raios-fim', { rotation: 0 }, { rotation: 20, duration: FIM - t0, ease: 'none', immediateRender: false }, t0);
      tl.set('#logo', { opacity: 1 }, t0);
      tl.fromTo('#logo', { scale: 0.7 }, { scale: 1, duration: 0.3, ease: 'back.out(3)', immediateRender: false }, t0);
      piscada(tl, [t0, t0 + 0.375, t0 + 0.75]);
      tl.set('#tag', { opacity: 1 }, t0 + 0.35);
      tl.fromTo('#tag', { scale: 1.4 }, { scale: 1, duration: 0.2, ease: 'back.out(2)', immediateRender: false }, t0 + 0.35);
      tl.to('#site', { opacity: 1, duration: 0.2 }, t0 + 0.5);
      const MESA_F = 1240;
      const turma = [
        ator(FC, 52, { escala: 9, z: 20, x: 230, y: 1225, sombra: false }),
        naMesa(FC, '26t', 420, 9, 28, MESA_F),
        naMesa(FC, '67t', 640, 10, 22, MESA_F),
        ator(FC, 54, { escala: 9, z: 20, x: 840, y: 1235, sombra: false }),
      ];
      gsap.set(turma[3].spr, { filter: TOSTADO });
      turma.forEach((x, k) => {
        anim(tl, x, 'Idle', 0, 0, FIM, k === 3 ? { vel: 0.6 } : {});
        tl.to(x.corpo, { keyframes: [{ y: -50, scaleY: 1.08, duration: 0.14, ease: 'power2.out' }, { y: 0, scaleY: 1, duration: 0.14, ease: 'power2.in' }, { scaleY: 0.88, scaleX: 1.1, duration: 0.05 }, { scaleY: 1, scaleX: 1, duration: 0.12, ease: 'back.out(3)' }] }, t0 + 0.75 + k * 0.05);
      });
      faisca(FC, 420, 1050, t0 + 1.5, 1.1);
    }

    tl.set({}, {}, FIM);
    window.__timelines = window.__timelines || {};
    window.__timelines.root = tl;
    function letra(f, trecho) {
      for (const p of f.paginas) if (p.texto.includes(trecho)) return p.chars[Array.from(p.texto.slice(0, p.texto.indexOf(trecho))).length];
      throw new Error(trecho);
    }
  </script>
  <script>
    // as durações fixas no HTML têm que bater com a linha do tempo (linha.mjs): o qa-quadros mostra o erro
    {
      const L = window.LINHA;
      const d = Number(document.getElementById('root').dataset.duration);
      const v = document.getElementById('v-bola').dataset;
      const erros = [];
      if (Math.abs(d - L.FIM) > 0.01) erros.push(`data-duration ${d} ≠ FIM ${L.FIM}`);
      if (Math.abs(Number(v.start) - L.M.vestiario) > 0.01) erros.push(`v-bola data-start ${v.start} ≠ ${L.M.vestiario}`);
      if (Math.abs(Number(v.duration) - (L.M.reacao - L.M.vestiario)) > 0.01) erros.push(`v-bola data-duration ${v.duration} ≠ ${(L.M.reacao - L.M.vestiario).toFixed(2)}`);
      if (Math.abs(Number(v.mediaStart) - (3.5 - (L.M.kaboom - L.M.vestiario))) > 0.01) erros.push(`v-bola data-media-start ${v.mediaStart} ≠ ${(3.5 - (L.M.kaboom - L.M.vestiario)).toFixed(2)}`);
      if (erros.length) setTimeout(() => { throw new Error(`linha do tempo desatualizada: ${erros.join('; ')}`); });
    }
  </script>
