  <audio id="a-vt" class="clip" src="som/100.ogg" data-start="23.0" data-duration="0.9" data-media-start="0" data-volume="0.8"></audio>
  <audio id="a-ps2" class="clip" src="som/54.ogg" data-start="36.2" data-duration="0.84" data-media-start="0" data-volume="0.6"></audio>
  <audio id="a-vt2" class="clip" src="som/100.ogg" data-start="39.0" data-duration="0.6" data-media-start="0" data-volume="0.5"></audio>

  <script>
    const { div, ator, anim, quadro, poeira, flash, estouro, telaFinal, piscada, bola } = C;
    // os talking heads entram antes dos compassos 3, 5 e 13 da música: T empurra o resto
    // v5: a peça já vem na ordem do curta (MAPAS.bolas em musica.mjs), com a cama dos talking heads e da tag nos
    // compassos dela (a trilha não para: bolas-curta.wav abaixa uns 10 dB por baixo das falas). As cenas seguem numeradas
    // como na v4 (2–15); CENA leva pro compasso do curta. O olhar do Psyduck (1 s de silêncio de verdade) entra antes do
    // compasso 15 do curta, e a trilha já vem com ele emendado.
    const CENA = { 2: 2, 3: 5, 4: 6, 5: 10, 6: 11, 7: 12, 8: 13, 9: 14, 10: 15, 11: 16, 12: 17, 13: 22, 14: 23, 15: 24 };
    const TC = (c, l = 0) => C.T(c, l) - 4 + (c >= 15 ? 1 : 0);
    const T = (b, l = 0) => {
      if (!(b in CENA)) throw new Error(`compasso de cena ${b}`);
      return TC(CENA[b], l);
    };
    const TH_INI = [TC(3), TC(7), TC(18)];
    const TH_DUR = [4, 6, 4];
    const TAG = TC(20);
    const OLHAR = TC(15) - 1;
    const FIM = TC(24, 16);
    const tl = gsap.timeline({ paused: true });
    const $ = (id) => document.getElementById(id);
    const ver = (els, t, on = true) => tl.set(els, { autoAlpha: on ? 1 : 0 }, t);
    const op = (els, t, on = true) => tl.set(els, { opacity: on ? 1 : 0 }, t);
    /** Pulo com antecipação (agacha), estica subindo, cai e amassa na aterrissagem, e volta passando um pouco (overshoot). */
    const salto = (a, t, h, d = 0.3) =>
      tl.to(a.corpo, { keyframes: [
        { scaleY: 0.84, scaleX: 1.14, y: 0, duration: d * 0.18, ease: 'power2.out' },
        { scaleY: 1.12, scaleX: 0.92, y: -h, duration: d * 0.36, ease: 'power2.out' },
        { scaleY: 1, scaleX: 1, y: 0, duration: d * 0.3, ease: 'power2.in' },
        { scaleY: 0.86, scaleX: 1.12, duration: d * 0.07, ease: 'power1.out' },
        { scaleY: 1, scaleX: 1, duration: d * 0.16, ease: 'back.out(3)' },
      ] }, t - d * 0.18);
    /** Respiração de quem está parado num quadro (2 tempos, sobe e desce de leve), de t0 a t1. */
    const respira = (a, t0, t1, k = 0.025, p = 0.55) => {
      const n = Math.max(1, Math.floor((t1 - t0) / p) - 1);
      tl.to(a.corpo, { scaleY: 1 + k, duration: p, ease: 'sine.inOut', repeat: n % 2 ? n : n - 1, yoyo: true }, t0);
    };
    const carimbo = (sel, t, s = 2.2) => {
      tl.set(sel, { opacity: 1 }, t);
      tl.fromTo(sel, { scale: s }, { scale: 1, duration: 0.22, ease: 'back.out(2.2)', immediateRender: false }, t);
    };
    const CENAS = ['#vest', '#mesa', '#sala', '#fim'];
    /** Corte seco: só a cena `id` no ar a partir de t. */
    const corta = (id, t) => {
      ver(CENAS, t, false);
      ver(id, t);
    };
    const PRETO = '#0e1430';

    // ====================================================================================================
    // pixel art por cima dos sprites, na escala deles
    // ====================================================================================================
    /** Retângulos [x, y, w, h, cor] num <svg> cuja origem (0, 0) fica no canto do div (px da folha × E). */
    function desenho(pai, rects, E, z = 3) {
      const x0 = Math.min(...rects.map((r) => r[0]));
      const y0 = Math.min(...rects.map((r) => r[1]));
      const x1 = Math.max(...rects.map((r) => r[0] + r[2]));
      const y1 = Math.max(...rects.map((r) => r[1] + r[3]));
      const d = div(pai, 'pix', `z-index:${z}`);
      d.innerHTML = `<svg style="position:absolute;left:${x0 * E}px;top:${y0 * E}px" width="${(x1 - x0) * E}" height="${(y1 - y0) * E}" viewBox="${x0} ${y0} ${x1 - x0} ${y1 - y0}" shape-rendering="crispEdges">`
        + `${rects.map((r) => `<rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" fill="${r[4]}"/>`).join('')}</svg>`;
      return d;
    }
    /** Desenho em texto (uma string por linha; ' ' e '.' = vazio), cores pelo caractere. */
    const arte = (linhas, cores) => linhas.flatMap((l, y) => [...l].map((c, x) => (cores[c] ? [x, y, 1, 1, cores[c]] : null)).filter(Boolean));
    /** Contorno escuro de 1 px em volta (a tinta do PMD) e o desenho por cima. */
    const contorno = (rects) => [...rects.map((r) => [r[0] - 1, r[1] - 1, r[2] + 2, r[3] + 2, PRETO]), ...rects];
    /**
     * Pixel art presa ao quadro do sprite: `rects` em px do quadro (w×h) da animação `nome` (o canto de cima à esquerda
     * do quadro), com contorno. Mora no corpo do ator.
     */
    function pix(a, nome, rects, { z = 3, id = a.id, borda = true } = {}) {
      const A = SPR[id].anims[nome];
      const E = a.escala;
      const d = desenho(a.corpo, borda ? contorno(rects) : rects, E, z);
      gsap.set(d, { x: (-A.w * E) / 2, y: -A.pe * A.h * E });
      return d;
    }
    /**
     * Faz `el` (filho do corpo) seguir o quadro do sprite: `pos(nome, dir, i)` devolve o ponto em px do quadro (ou null,
     * e ele some). Lê as trocas de quadro já agendadas: chamar depois de todas as animações do ator.
     */
    function segue(a, el, pos) {
      const S = SPR[a.id];
      const E = a.escala;
      const mapa = new Map();
      for (const [nome, A] of Object.entries(S.anims)) A.rects.forEach((r, d) => r.forEach(([rx, ry], i) => mapa.set(`${-rx * E}px ${-ry * E}px`, [nome, d, i, A])));
      for (const tw of tl.getTweensOf(a.spr)) {
        const k = mapa.get(tw.vars.backgroundPosition);
        if (!k) continue;
        const p = pos(k[0], k[1], k[2]);
        tl.set(el, p ? { opacity: 1, x: (p[0] - k[3].w / 2) * E, y: (p[1] - k[3].pe * k[3].h) * E } : { opacity: 0 }, tw.startTime());
      }
    }

    // ---------- os óculos escuros do Squirtle (seguem a cabeça: img/cabeca.js) ----------
    const ARM = '#07080f';
    const LENTE = '#1c2140';
    const LENTE2 = '#36437a';
    const lente = (x, y, w, h) => [
      [x, y, w, h - 1, ARM], [x + 1, y + h - 1, w - 2, 1, ARM],
      [x + 1, y + 1, w - 2, h - 2, LENTE], [x + 1, y + h - 2, w - 2, 1, LENTE2],
      [x + w - 3, y + 1, 1, 1, '#ffffff'], [x + w - 4, y + 2, 1, 1, '#ffffff'],
    ];
    const OC_FRENTE = [...lente(-3, 4, 6, 5), ...lente(4, 4, 6, 5), [3, 5, 1, 1, ARM], [-4, 5, 1, 1, ARM], [10, 5, 1, 1, ARM]];
    const OC_LADO = [[-2, 5, 6, 1, ARM], ...lente(4, 4, 5, 5)];
    // os mesmos óculos em miniatura na cara do Ditto (px do quadro do Idle de frente, 24×32; os olhos em (9, 12) e (14, 13))
    const OC_DITTO = [...lente(6, 10, 5, 4), ...lente(12, 10, 5, 4), [11, 11, 1, 1, ARM], [5, 11, 1, 1, ARM], [17, 11, 1, 1, ARM]];
    /** Os óculos no Squirtle `a`: seguem a cabeça (de frente ou olhando pra direita); `baixa` é o div que desce. */
    function oculos(a) {
      const E = a.escala;
      const baixa = div(a.corpo, 'pix', 'z-index:3');
      const fr = desenho(baixa, OC_FRENTE, E);
      const la = desenho(baixa, OC_LADO, E);
      const cab = (vista) => (nome, d, i) => (d === vista && CABECA[`${nome}/${d}`] ? CABECA[`${nome}/${d}`][i] : null);
      return { baixa, prende: () => (segue(a, fr, cab(0)), segue(a, la, cab(2))) };
    }

    // ---------- a medalha do Magikarp ----------
    /** A medalha no pescoço do Idle (o segueMedalha do EP 3); `k` aumenta. O `.d` de dentro é o que estufa. */
    const PESCOCO = { 0: [16, 24, 0], 2: [24.5, 20.5, 1], 6: [9.5, 19.5, 0] };
    function medalha(a, k = 1) {
      const e = a.escala * k;
      const m = div(a.corpo, 'medalha');
      const d = div(m, 'd');
      d.innerHTML = `<div class="fita" style="left:${-1.5 * e}px;top:0;width:${3 * e}px;height:${1.9 * e}px"></div>`
        + `<div class="disco" style="left:${-1.5 * e}px;top:${1.3 * e}px;width:${3 * e}px;height:${3 * e}px;border-width:${0.4 * a.escala}px"></div>`;
      gsap.set(d, { transformOrigin: '0px 0px' });
      const A = SPR['129'].anims.Idle;
      gsap.set(m, { x: (16 - A.w / 2) * a.escala, y: (24 - A.pe * A.h) * a.escala });
      return { m, d, prende: () => segue(a, m, (nome, dir, i) => (nome === 'Idle' && PESCOCO[dir] ? [PESCOCO[dir][0] + (i % 2) * PESCOCO[dir][2], PESCOCO[dir][1] + (i % 2)] : null)) };
    }
    // o chifrinho: a mão em V (dedos pra cima) com a ponta do braço em (x, y) do quadro do Pose
    const chifre = (a, x, y, cor, claro) => pix(a, 'Pose', [
      [x - 4, y - 9, 2, 3, cor], [x - 3, y - 6, 2, 3, cor], [x - 2, y - 3, 2, 2, cor],
      [x + 1, y - 9, 2, 3, cor], [x, y - 6, 2, 3, cor], [x - 1, y - 3, 2, 2, cor],
      [x - 3, y - 1, 5, 3, cor], [x - 2, y - 1, 1, 1, claro],
    ], { z: 1 });
    // a bola em pixel art (12×12), com os gomos na cor `p`
    const BOLA = ['....XXXX....', '..XXwwwwXX..', '.XwwwPPwwwX.', '.XwwPPPPwwX.', 'XwwwwPPwwwwX', 'XPwwwwwwwwPX', 'XPPwwwwwwPPX', 'XwPwwwwwwPwX', '.XwwwPPwwSX.', '.XwwPPPPSSX.', '..XXSPPSXX..', '....XXXX....'];
    // a nota musical da canção (contorno em volta) e a veia de raiva
    const NOTA = ['..w...', '..ww..', '..w.w.', '..w..w', '..w...', 'www...', 'www...'];
    const RAIVA = ['rr.rr', 'r...r', '.....', 'r...r', 'rr.rr'];
    const nota = (pai, E, cor = '#ff9ad5') => desenho(pai, contorno(arte(NOTA, { w: cor })), E, 30);
    const raiva = (pai, E) => desenho(pai, contorno(arte(RAIVA, { r: '#e8423f' })), E, 30);
    // o Jigglypuff bravo (rosa avermelhado: BRAVO1 emburrado, BRAVO no auge) e a bufada (nuvenzinha de vapor)
    const BRAVO1 = 'sepia(0.3) saturate(1.8) hue-rotate(-16deg)';
    const BRAVO = 'brightness(0.72) sepia(1) saturate(9) hue-rotate(-48deg) contrast(1.25)';
    const MOLHADO = 'brightness(0.78) saturate(0.8)';
    const BUFO = ['.ww..', 'wwwww', 'wwwgw', '.ggg.'];
    const bufo = (pai, E) => desenho(pai, contorno(arte(BUFO, { w: '#f8f8f0', g: '#c8d0e0' })), E, 30);
    // o raio do choquinho
    const RAIO = '<svg viewBox="0 0 14 22" width="70" height="110"><path d="M8 1 L2 12 L7 12 L5 21 L12 8 L7 8 L10 1 Z" fill="#ffe14d" stroke="#0e1430" stroke-width="1.4" stroke-linejoin="round"/></svg>';

    // ====================================================================================================
    // a fala (texto solto em cima de quem fala) e a tarja NOME · POSIÇÃO: ficam fora da câmera, na tela
    // ====================================================================================================
    const VEST = $('vest');
    /** Texto solto com a base em (sx, sy) da TELA, centrado em sx (sem sair da tela); entra com um pop curto. */
    function fala(pai, html, t0, t1, sx, sy, tam = 110) {
      const linhas = html.split('<br>');
      const w = Math.max(...linhas.map((l) => l.length)) * tam * 0.72 + 60;
      const h = linhas.length * tam * 1.1;
      const left = Math.max(20, Math.min(1060 - w, sx - w / 2));
      const b = div(pai, 'dito', `left:${left}px;top:${Math.max(110, sy - h)}px;width:${w}px;height:${h}px;font-size:${tam}px`);
      b.innerHTML = html;
      op(b, 0, false);
      op(b, t0);
      op(b, t1, false);
      tl.fromTo(b, { scale: 0.5 }, { scale: 1, duration: 0.18, ease: 'back.out(2.6)', immediateRender: false }, t0);
      return b;
    }
    /** A tarja de quem entra pela primeira vez (desliza da esquerda). */
    function tarja(nome, cargo, t0, t1, pai = VEST, top = 1468) {
      const n = div(pai, 'nome', `top:${top}px`);
      n.innerHTML = `<b>${nome}</b><span>${cargo}</span>`;
      op(n, 0, false);
      op(n, t0);
      tl.fromTo(n, { x: -900 }, { x: 0, duration: 0.32, ease: 'back.out(1.7)', immediateRender: false }, t0);
      tl.to(n, { x: -900, duration: 0.26, ease: 'back.in(1.5)' }, t1 - 0.26);
      op(n, t1, false);
    }

    // ====================================================================================================
    // O GANCHO (v3, 13/11): sem os 4 s de abertura; o vídeo já abre no Magikarp arrastando o saco, e a cartela da série
    // (VESTIÁRIO DO · PALLET FC, EP. 2, BOLA FORA) carimba por cima da lousa nos primeiros 2 s e sobe
    // ====================================================================================================
    {
      const cart = div(VEST, 'cartela');
      const serie = div(cart, 'serie');
      const placa = div(serie, 'placa');
      const letras = div(placa, 'letras');
      const fita = div(serie, 'fita');
      fita.innerHTML = '<span>VESTIÁRIO DO</span>';
      const ROT = [-8, 5, -3, 7, -6, 4, 0, -5, 8];
      const DY = [6, -12, 8, -6, 12, -8, 4, 10, -10];
      const els = [...'PALLET', null, ...'FC'].map((c) => {
        if (c) {
          const b = document.createElement('b');
          b.textContent = c;
          letras.appendChild(b);
          return b;
        }
        const bo = div(letras, 'bolinha');
        desenho(bo, arte(BOLA, { X: PRETO, w: '#f8f8f0', S: '#c8d0f0', P: '#e8423f' }), 7, 3);
        return bo;
      });
      els.forEach((el, i) => {
        tl.set(el, { y: DY[i], rotation: ROT[i] }, 0);
        tl.fromTo(el, { y: DY[i] - 200 }, { y: DY[i], duration: 0.22, ease: 'bounce.out', immediateRender: false }, 0.04 * i);
      });
      carimbo(placa, 0, 1.3);
      carimbo(fita, 0.05, 1.6);
      const epi = div(cart, 'epi', 'top:440px');
      epi.textContent = 'EP. 2';
      const ep = div(cart, 'ep', 'top:530px');
      ep.innerHTML = '<b>BOLA FORA</b>';
      op([epi, ep], 0, false);
      carimbo(epi, 0.35, 1.8);
      carimbo(ep, 0.41, 2.2);
      tl.to(cart, { y: -900, duration: 0.32, ease: 'back.in(1.4)' }, 1.6);
      op(cart, 1.95, false);
    }


    // ====================================================================================================
    // o vestiário: o Snorlax dorme no banco; o golzinho à esquerda; o punch-in é a câmera (#cam) em escala 2
    // ====================================================================================================
    const cam = $('cam');
    gsap.set(cam, { transformOrigin: '0px 0px' });
    [10, 170, 760, 920].forEach((x) => div(cam, 'armario', `left:${x}px`));
    const gz = div(cam, 'golzinho');
    gsap.set(gz, { transformOrigin: '50% 100%' });
    const BANCO = 1262;
    const CHAO = 1500;
    const GOL = [150, 1330]; // onde a bola entra
    /** Corte seco pro vestiário; com `foco`, punch-in de escala `k` com o ponto `foco` em (540, sy) da tela. */
    const plano = (t, foco = null, sy = 1000, k = 2) => {
      corta('#vest', t);
      const e = foco ? k : 1;
      const tx = foco ? Math.max(-1080 * (e - 1), Math.min(0, 540 - e * foco[0])) : 0;
      const ty = foco ? Math.max(-1920 * (e - 1), Math.min(0, sy - e * foco[1])) : 0;
      tl.set(cam, { x: tx, y: ty, scale: e }, t);
    };
    const TOSTADO = 'brightness(0.42) sepia(0.8) saturate(1.4)';
    const sn = ator(cam, 143, { escala: 11, z: 10, x: 540, y: BANCO + 6, sombra: false });
    const mk = ator(cam, 129, { escala: 10, z: 21, x: -200, y: CHAO });
    const pk = ator(cam, 25, { escala: 10, z: 25, x: 1250, y: CHAO });
    const ps = ator(cam, 54, { escala: 14, z: 35, x: -200, y: 1760 });
    const vt = ator(cam, 100, { escala: 6, z: 23, x: 640, y: CHAO + 20 });
    const medV = medalha(mk);
    op([mk.el, pk.el, ps.el, vt.el], 0, false);
    quadro(tl, sn, 'Idle', 0, 0, 0);
    tl.to(sn.corpo, { scaleY: 1.03, duration: 1, ease: 'sine.inOut', repeat: 33, yoyo: true }, T(2, 0));
    const zzz = (t, x = 650, y = 860, tam = 1) => {
      const z = div(cam, 'zz');
      z.textContent = 'Z';
      tl.set(z, { x, y, fontSize: 80 * tam }, 0);
      tl.fromTo(z, { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, t);
      tl.to(z, { x: x + 90 * tam, y: y - 180 * tam, duration: 1.2, ease: 'sine.out' }, t);
      tl.to(z, { opacity: 0, duration: 0.3 }, t + 0.9);
    };
    for (let b = 2; b < 13; b++) if (b !== 9) zzz(T(b, 4));

    // 2 · o Magikarp arrasta o saco de bolas (0–6) e despeja (6): as bolas quicam pro chão (6 a 14); no meio delas, de
    //     costas, uma "bola" vermelha e branca: o Voltorb
    plano(T(2, 0));
    const saco = div(cam, 'saco');
    const xS = (x) => x - 170;
    op(mk.el, T(2, 0));
    anim(tl, mk, 'Walk', 2, T(2, 0), T(2, 6));
    tl.fromTo(mk.el, { x: -200 }, { x: 330, duration: T(2, 6) - T(2, 0), ease: 'none', immediateRender: false }, T(2, 0));
    tl.fromTo(saco, { x: xS(-200), y: CHAO - 150 }, { x: xS(330), duration: T(2, 6) - T(2, 0), ease: 'none', immediateRender: false }, T(2, 0));
    anim(tl, mk, 'Idle', 0, T(2, 6), T(13, 0));
    tl.to(saco, { rotation: 14, duration: 0.12, ease: 'power2.out' }, T(2, 6) - 0.12);
    tl.to(saco, { rotation: -70, duration: 0.2, ease: 'back.out(2)' }, T(2, 6));
    tl.to(saco, { x: xS(80), y: CHAO - 60, rotation: -100, scale: 0.8, duration: 0.3, ease: 'power2.in' }, T(2, 12));
    tl.to(saco, { keyframes: { scaleY: [0.62, 0.86, 0.8], scaleX: [0.95, 0.78, 0.8] }, duration: 0.2, ease: 'power1.out' }, T(2, 12) + 0.3);
    tl.set(saco, { zIndex: 5 }, T(2, 12));
    const SPOTS = [[460, 0], [560, 1], [780, 2], [700, 3], [880, 4]];
    const bolas = SPOTS.map(([x, k]) => {
      const b = bola(cam, { d: 96, z: 22, x: 200, y: CHAO });
      op(b.el, 0, false);
      const t = T(2, 6 + 1.6 * k);
      op(b.el, t);
      tl.fromTo(b.el, { x: 200, y: CHAO - 120 }, { x, y: CHAO, duration: 0.45, ease: 'none', immediateRender: false }, t);
      tl.fromTo(b.corpo, { y: 0 }, { keyframes: { y: [-160, 0, -50, 0] }, duration: 0.45, ease: 'none', immediateRender: false }, t);
      tl.fromTo(b.gira, { rotation: 0 }, { rotation: 400, duration: 0.45, ease: 'power1.out', immediateRender: false }, t);
      return { b, x };
    });
    // o Voltorb rola junto (de costas: sem olhos, parece bola), z entre as bolas
    op(vt.el, T(2, 11));
    quadro(tl, vt, 'Idle', 4, 0, T(2, 11));
    tl.fromTo(vt.el, { x: 220, y: CHAO - 100 }, { x: 640, y: CHAO + 20, duration: 0.5, ease: 'none', immediateRender: false }, T(2, 11));
    tl.fromTo(vt.corpo, { y: 0 }, { keyframes: { y: [-140, 0, -40, 0] }, duration: 0.5, ease: 'none', immediateRender: false }, T(2, 11));
    tl.to(vt.corpo, { scaleY: 0.94, duration: 0.5, ease: 'sine.inOut', repeat: 23, yoyo: true }, T(3, 0));

    // (o talking head 1 vem antes; a volta pro vestiário)
    corta('#vest', T(3, 0));
    // 3 · o Pikachu entra (0–6) e já comemora ANTES de chutar qualquer coisa (8: a pose, o choquinho)
    op(pk.el, T(3, 0));
    anim(tl, pk, 'Walk', 6, T(3, 0), T(3, 6));
    tl.fromTo(pk.el, { x: 1250 }, { x: 900, duration: T(3, 6) - T(3, 0), ease: 'none', immediateRender: false }, T(3, 0));
    anim(tl, pk, 'Idle', 0, T(3, 6), T(3, 8));

      tl.fromTo(sn.el, { scaleY: 1 }, { keyframes: { scaleY: [0.9, 1.04, 1], easeEach: 'sine.out' }, duration: 0.35, ease: 'none', immediateRender: false }, T(10, 10));
      tl.to(b.el, { x: 505, y: 1185, duration: 0.3, ease: 'back.out(1.6)' }, T(10, 10));
      tl.to(b.gira, { rotation: 120, duration: 0.3, ease: 'power2.out' }, T(10, 10));
      op(b.el, T(13, 0), false);
      plano(T(10, 4), [540, 1150], 1000);
      zzz(T(10, 12), 700, 860);
    }
    // 11 · punch-in no golzinho (0): o Voltorb lá dentro, tostado e tonto, as estrelinhas girando; punch-in no Pikachu (6),
    //      tostado, de pelo arrepiado e ainda na pose de comemoração; respiro (0,45 s) e um "Gol." seco, cansado, em
    //      legenda, com um pulinho fraco
    plano(T(11, 0), [GOL[0] + 120, GOL[1] - 10], 1050);
    plano(T(11, 6), [800, 1300], 1100);
    {
      const d = div(VEST, 'sub');
      d.textContent = 'Gol.';
      op(d, 0, false);
      op(d, T(11, 9.5));
      op(d, T(12, 0) - 0.05, false);
      salto(pk, T(11, 10.5), 16, 0.32);
    }
    // 12 · punch-in no capitão: ele apita… e só sai fumaça (4)
    plano(T(12, 0), [330, CHAO - 150], 1100);
    {
      const f = div(cam, 'fumaca');
      tl.fromTo(f, { x: 360, y: CHAO - 230, scale: 0.3, opacity: 0 }, { x: 420, y: CHAO - 420, scale: 1.1, opacity: 1, duration: 0.6, ease: 'power1.out', immediateRender: false }, T(12, 4));
      tl.to(f, { opacity: 0, duration: 0.3 }, T(12, 12));
    }
    tl.to(mk.corpo, { keyframes: { scaleY: [0.9, 1.12, 0.94, 1], easeEach: 'sine.inOut' }, duration: 0.4, ease: 'none' }, T(12, 2.5));

    medV.prende();

    // ====================================================================================================
    // OS TALKING HEADS (2, 10 e 33 s; 4, 6 e 4 s) e A TAG (37 s): corte seco pra salinha do material, câmera parada, o
    // personagem um pouco à esquerda do centro olhando pra lente, a fala em legenda embaixo. A trilha segue por baixo,
    // mais baixa; sem plateia. Todo mundo em idle (respira), nunca congelado num quadro de gesto. Tarja só na primeira
    // aparição, no alto (longe do corpo e da legenda)
    // ====================================================================================================
    const SALA = $('sala');
    const TABUAS = [700, 960, 1220];
    const baixo = [];
    {
      // a estante de metal à direita: 2 pés, 3 tábuas, bolas e cones (na de cima, um vão em 805 pro Voltorb do TH 1)
      for (const x of [560, 1010]) div(SALA, 'est-pe', `left:${x}px;top:430px;height:900px`);
      for (const y of TABUAS) div(SALA, 'est-tabua', `left:540px;top:${y}px;width:510px`);
      const cone = (x, y) => {
        const c = div(SALA, 'cone', `left:${x}px;top:${y - 112}px`);
        c.innerHTML = '<i></i><b></b><u></u>';
        return c;
      };
      for (const x of [600, 700, 900]) bola(SALA, { d: 100, z: 5, x, y: TABUAS[0] + 4 });
      bola(SALA, { d: 100, z: 5, x: 700, y: TABUAS[1] + 4 });
      baixo.push(bola(SALA, { d: 100, z: 5, x: 950, y: TABUAS[2] + 4 }).el);
      cone(990, TABUAS[0]);
      for (const x of [860, 940]) cone(x, TABUAS[1]);
      for (const x of [610, 690, 770]) baixo.push(cone(x, TABUAS[2]));
      // a pilha de cones no chão, à esquerda
      for (const k of [0, 1, 2]) cone(110, 1250 - 22 * k + 112);
    }
    const XT = 400;
    const TARJA_Y = 600; // acima da cabeça (o mais alto dos três chega a ~830), longe do corpo e da legenda
    const YT = 1430;
    /** Um personagem na sala, visível só de t a t + d. */
    const naSala = (id, t, d = 4, { escala = 24, x = XT, y = YT, z = 20 } = {}) => {
      const a = ator(SALA, id, { escala, z, x, y });
      op(a.el, 0, false);
      op(a.el, t);
      op(a.el, t + d, false);
      return a;
    };
    /** A fala em legenda embaixo (aparece e some seco, como legenda de documentário). */
    const legenda = (txt, t0, t1) => {
      const d = div(SALA, 'sub');
      d.textContent = txt;
      op(d, 0, false);
      op(d, t0);
      op(d, t1, false);
    };
    /** O Voltorb fingindo de bola numa tábua da estante (de frente, parado, que nem bola), de t0 a t1. */
    const voltorbNaEstante = (x, tabua, t0, t1, escala = 5) => {
      const v = ator(SALA, 100, { escala, z: 6, x, y: TABUAS[tabua] + 2, sombra: false });
      op(v.el, 0, false);
      op(v.el, t0);
      op(v.el, t1, false);
      quadro(tl, v, 'Idle', 0, 0, t0);
      return v;
    };
    /** Uma piscada (as pálpebras do Voltorb fecham por `d` s) no quadro 0 do Idle de frente. */
    const piscada1 = (v, t, d = 0.16) => {
      const V = '#ff875f';
      const lado = (x0, cores) => [13, 14, 15, 16].flatMap((y) => cores.map((c, i) => [x0 + i, y, 1, 1, y === 15 ? PRETO : c]));
      const p = pix(v, 'Idle', [...lado(7, [V, V, V, V]), ...lado(13, [V, V, V, '#9f0000'])], { z: 5, borda: false });
      op(p, 0, false);
      op(p, t);
      op(p, t + d, false);
    };
    // 1 · MAGIKARP (2–6), limpinho, medalha no peito. Entre as falas ele vira a medalha pra câmera (ninguém pediu). Na
    //     2ª fala, o Voltorb aparece na estante atrás dele, no meio das bolas, e pisca uma vez; ele não percebe
    {
      const t = TH_INI[0];
      corta('#sala', t);
      const a = naSala(129, t);
      anim(tl, a, 'Idle', 0, t, t + 4, { vel: 0.6 });
      const m = medalha(a);
      tarja('MAGIKARP', 'CAPITÃO', t + 0.15, t + 2.3, SALA, TARJA_Y);
      legenda('Eu que organizo o material.', t + 0.3, t + 1.9);
      tl.to(m.d, { keyframes: { scaleX: [0, -1.3, 0, 1.4], scaleY: [1.1, 1.25, 1.35, 1.4], easeEach: 'sine.inOut' }, duration: 0.4, ease: 'none' }, t + 1.95);
      const b = div(SALA, 'brilho', 'z-index:45');
      tl.set(b, { x: XT + 20, y: YT - 40 }, 0);
      tl.fromTo(b, { opacity: 1, scale: 0.2, rotation: 0 }, { scale: 1.6, rotation: 90, duration: 0.35, ease: 'back.out(2)', immediateRender: false }, t + 2.3);
      tl.to(b, { opacity: 0, duration: 0.15 }, t + 2.6);
      legenda('Conferi bola por bola.', t + 2.55, t + 3.9);
      const v = voltorbNaEstante(805, 0, t + 2.55, t + 4, 6);
      piscada1(v, t + 3.3);
      m.prende();
    }
    // 2 · PIKACHU (10–16), em idle (respirando); respiro entre as falas e, na pausa, uma faísca curta na bochecha
    {
      const t = TH_INI[1];
      corta('#sala', t);
      const a = naSala(25, t, TH_DUR[1]);
      anim(tl, a, 'Idle', 0, t, t + TH_DUR[1], { vel: 0.7 });
      legenda('Sabe como é,', t + 0.4, t + 1.4);
      legenda('eu gosto de comemorar antes.', t + 1.4, t + 3.4);
      {
        const tf = t + 3.85;
        const [cx, cy] = [496, 1166];
        estouro(tl, SALA, cx, cy, tf, { tam: 90, cor: '#ffe14d', anel: false, dur: 0.22 });
        for (const [dx, dy, r] of [[70, -50, 20], [80, 30, -30]]) {
          const z = div(SALA, 'raio', 'z-index:45');
          z.innerHTML = RAIO;
          tl.set(z, { x: cx + dx, y: cy + dy, rotation: r, scale: 0.6 }, 0);
          tl.set(z, { opacity: 1 }, tf);
          tl.set(z, { opacity: 0 }, tf + 0.25);
        }
      }
      legenda('Economiza tempo.', t + 4.35, t + 5.85);
    }
    // 3 · PSYDUCK (33–37), tostado, a prancheta queimada na mão (tarja PSYDUCK · TÉCNICO): olha a prancheta, olha a lente;
    //     no fim segura a cabeça com as duas mãos e a prancheta cai
    {
      const t = TH_INI[2];
      corta('#sala', t);
      const a = naSala(54, t);
      // tostado mais claro que no vestiário (ele já se limpou um pouco; precisa dar pra reconhecer)
      tl.set(a.spr, { filter: 'brightness(0.62) sepia(0.7) saturate(1.3)' }, 0);
      const pr = div(a.corpo, 'prancheta');
      tl.set(pr, { x: 110, y: -330, rotation: 8, filter: 'brightness(0.85)' }, 0);
      anim(tl, a, 'Idle', 0, t, t + 1.85, { vel: 0.6 });
      tarja('PSYDUCK', 'TÉCNICO', t + 0.15, t + 2.3, SALA, TARJA_Y);
      legenda('Eu contei treze bolas.', t + 0.3, t + 1.8);
      anim(tl, a, 'Idle', 1, t + 1.85, t + 2.35, { vel: 0.6 });
      anim(tl, a, 'Idle', 0, t + 2.35, t + 3.25, { vel: 0.6 });
      legenda('A gente tem doze.', t + 2.5, t + 3.95);
      anim(tl, a, 'Charge', 0, t + 3.25, t + 4, { vel: 0.8 });
      tl.to(pr, { y: -170, rotation: 80, duration: 0.3, ease: 'power2.in' }, t + 3.25);
      tl.to(pr, { keyframes: { rotation: [92, 76, 80], easeEach: 'sine.out' }, duration: 0.25, ease: 'none' }, t + 3.55);
      // a fumacinha que ainda sai da cabeça
      for (const k of [0, 1]) {
        const f = div(SALA, 'fumaca', 'z-index:30');
        tl.fromTo(f, { x: XT - 30 + 70 * k, y: YT - 420, scale: 0.25, opacity: 0 }, { y: YT - 600, scale: 0.55, opacity: 0.8, duration: 1.4, ease: 'sine.out', immediateRender: false }, t + 0.2 + 1.5 * k);
        tl.to(f, { opacity: 0, duration: 0.4 }, t + 1.6 + 1.5 * k);
      }
    }
    // A TAG (37–41), cold open ao contrário: o Magikarp, de lado, conta as bolas da tábua de baixo ("…onze, doze, tre—");
    // o Voltorb, no meio delas, pisca bem na cara dele; o susto, o silêncio, e corte seco pro logo
    {
      const t = TAG;
      corta('#sala', t);
      op(baixo, t, false);
      const a = naSala(129, t, 4, { escala: 14, x: 470, y: 1450 });
      anim(tl, a, 'Idle', 2, t, t + 4, { vel: 0.6 });
      const m = medalha(a);
      for (const x of [790, 890, 990]) {
        const b = bola(SALA, { d: 100, z: 5, x, y: TABUAS[2] + 4 });
        op(b.el, 0, false);
        op(b.el, t);
        op(b.el, t + 4, false);
      }
      const v = voltorbNaEstante(690, 2, t, t + 4, 6);
      const conta = (txt, tc, x) => {
        legenda(txt, tc, txt.endsWith('—') ? t + 3.2 : tc + 0.6);
        tl.to(a.corpo, { keyframes: { y: [-14, 0], rotation: [4, 0], easeEach: 'sine.inOut' }, duration: 0.24, ease: 'none' }, tc);
      };
      conta('…onze,', t + 0.4);
      conta('…onze, doze,', t + 1.0);
      conta('…onze, doze, tre—', t + 1.6);
      piscada1(v, t + 2.0, 0.18);
      // o susto: dá um pulinho pra trás e fica parado olhando (respira), até o corte
      tl.to(a.el, { keyframes: [{ x: 440, duration: 0.12, ease: 'power2.out' }, { x: 450, duration: 0.2, ease: 'back.out(3)' }] }, t + 2.25);
      tl.to(a.corpo, { keyframes: [{ scaleY: 1.15, scaleX: 0.9, duration: 0.1, ease: 'power2.out' }, { scaleY: 1, scaleX: 1, duration: 0.25, ease: 'back.out(3)' }] }, t + 2.25);
      m.prende();
    }

    // 13–15 · TELA FINAL: o logo (SOC-CER-MON no 13: 8, 11, 14), o site e o selo; embaixo, o saco com as bolas; o
    //         Voltorb volta rolando de costas (11, 0–8), entra no meio delas e para; (12, 2) vira de frente e pisca pra câmera
    {
      const t0 = T(13, 0);
      const fim = $('fim');
      const FC = $('fim-cena');
      telaFinal(fim);
      corta('#fim', t0);
      tl.fromTo('#raios-fim', { rotation: 0 }, { rotation: 30, duration: FIM - t0, ease: 'none', immediateRender: false }, t0);
      tl.set('#logo', { opacity: 1 }, t0);
      tl.fromTo('#logo', { scale: 0.7 }, { scale: 1, duration: 0.45, ease: 'back.out(3)', immediateRender: false }, t0);
      piscada(tl, [T(13, 8), T(13, 11), T(13, 14)]);
      tl.set('#tag', { opacity: 1 }, T(13, 14));
      tl.fromTo('#tag', { scale: 1.6 }, { scale: 1, duration: 0.25, ease: 'back.out(2)', immediateRender: false }, T(13, 14));
      tl.to(['#site', '#selo', '#credito'], { opacity: 1, duration: 0.2 }, t0 + 0.3);
      const Y = 800;
      for (const x of [300, 440, 580]) bola(FC, { d: 130, z: 20, x, y: Y });
      const v2 = ator(FC, 100, { escala: 9, z: 21, x: 1250, y: Y + 6 });
      quadro(tl, v2, 'Idle', 4, 0, t0);
      tl.fromTo(v2.el, { x: 1200 }, { x: 740, duration: T(14, 8) - T(14, 0), ease: 'power1.out', immediateRender: false }, T(14, 0));
      tl.fromTo(v2.spr, { rotation: 0 }, { rotation: -720, duration: T(14, 8) - T(14, 0), ease: 'power1.out', immediateRender: false }, T(14, 0));
      anim(tl, v2, 'Idle', 0, T(15, 2), FIM);
      tl.fromTo(v2.corpo, { scaleY: 1 }, { keyframes: { scaleY: [0.85, 1.08, 1] }, duration: 0.3, ease: 'none', immediateRender: false }, T(15, 2));
    }

    tl.set({}, {}, FIM);
    window.__timelines = window.__timelines || {};
    window.__timelines.root = tl;
  </script>
</div>
</body>
