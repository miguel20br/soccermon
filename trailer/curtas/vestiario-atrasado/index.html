    // ====================================================================================================
    // 18 · a luz apaga (clique no 1): todo mundo já foi; o foco nele, de costas. A ficha cai (linha 8): vira, pula, "!"
    // 19 · congela no pulo (no 1): cor lavada, moldura de sitcom, a câmera 1,5x nele
    // ====================================================================================================
    op('#escuro', T(18, 0));
    tl.set([mk.el, pk.el, D.a.el, F.a.el, sn.el], { opacity: 0 }, T(18, 0));
    anim(tl, sp, 'Idle', 0, T(18, 8), CONGELA, { loop: false });
    tl.fromTo(sp.corpo, { y: 0, scaleY: 1, scaleX: 1 }, { y: -56, scaleY: 1.08, scaleX: 0.94, duration: 0.18, ease: 'power2.out', immediateRender: false }, T(18, 8));
    balao('!', 720, 1290, T(18, 8), T(20, 0));
    estouro(tl, vest, 720, 1200, T(18, 8), { tam: 240, cor: '#ffcb05' });
    flash(tl, CONGELA, 0.7, 0.25);
    tl.set('#vest', { filter: 'saturate(0.5) contrast(1.05) brightness(1.08) sepia(0.25)', scale: 1.5, x: -540, y: -1330, transformOrigin: '0px 0px' }, CONGELA);
    op('#moldura', CONGELA);

    // ====================================================================================================
    // 20 · UMA SEMANA DEPOIS (o letreiro de sitcom, com a vinheta)
    // ====================================================================================================
    {
      const t0 = T(20, 0);
      const v = $('letreiro');
      memphis(v, t0);
      ver('#letreiro', t0);
      op('#moldura', t0, false);
      flash(tl, t0, 0.5, 0.2);
      carimbo('#lt-texto', T(20, 1), 2.4);
      tl.to('#lt-texto', { scale: 1.05, duration: TAG - T(20, 2), ease: 'sine.inOut' }, T(20, 2));
      ver('#letreiro', TAG, false);
      flash(tl, TAG, 0.5, 0.25);
    }

    // ====================================================================================================
    // 21–23 · a tag: o vestiário vazio, de manhã; a lousa diz LIGA EM 63 DIAS. Ele chega correndo, lê, sobe no banco e
    //         espera: CHEGUEI CEDO. Grilo
    // ====================================================================================================
    tl.set('#vest', { filter: 'none', scale: 1, x: 0, y: 0 }, TAG);
    op(['#escuro', sp.el], TAG, false);
    tl.set('#calendario', { visibility: 'hidden' }, TAG);
    tl.set('#placar-lousa', { visibility: 'hidden' }, TAG);
    tl.set('#liga-lousa', { visibility: 'visible' }, TAG);
    op('#manha', TAG);
    const PISO = 1340;
    const s3 = ator(vest, 79, { escala: 12, z: 20, x: 1250, y: PISO, opacity: 0 });
    op(s3.el, T(21, 0));
    corre(s3, T(21, 0), T(21, 10), 1250, 600, PISO);
    anim(tl, s3, 'Idle', 4, T(21, 10), T(22, 8), { vel: 0.7 });
    poeira(tl, vest, 640, PISO, T(21, 10), { n: 6, r: 130, tam: 44 });
    tl.to(s3.corpo, { keyframes: { rotation: [5, 5, 0] }, duration: 0.9, ease: 'sine.inOut' }, T(21, 14));
    anim(tl, s3, 'Idle', 0, T(22, 8), FIM, { vel: 0.6 });
    tl.to(s3.el, { y: 1268, duration: 0.3, ease: 'none' }, T(22, 8));
    tl.to(s3.corpo, { keyframes: { y: [-90, 0] }, duration: 0.3, ease: 'power1.inOut' }, T(22, 8));
    tl.to(s3.corpo, { scaleY: 0.92, scaleX: 1.04, duration: 0.15, ease: 'power2.out' }, T(22, 8) + 0.3);
    falaSp('CHEGUEI<br>CEDO', T(22, 12), FIM, 680);
    tl.to(s3.corpo, { keyframes: { rotation: [-4, 4, 0] }, duration: 1.6, ease: 'sine.inOut' }, T(23, 4));

    // ====================================================================================================
    // 24 · tela final; na linha 11 (a tuba atrasada) o Slowpoke ainda chega correndo, pela direita
    // ====================================================================================================
    telaFinal($('final'));
    const fc = $('final-cena');
    flash(tl, FIM, 0.6, 0.3);
    tl.fromTo('#raios-final', { rotation: 0 }, { rotation: 30, duration: 3, ease: 'none', immediateRender: false }, FIM);
    tl.set('#logo', { opacity: 1 }, FIM);
    tl.fromTo('#logo', { scale: 0.7 }, { scale: 1, duration: 0.45, ease: 'back.out(3)', immediateRender: false }, FIM);
    piscada(tl, [T(24, 0), T(24, 3), T(24, 6)], '#final-cena');
    tl.set('#tag', { opacity: 1 }, T(24, 6));
    tl.from('#tag', { scale: 1.6, duration: 0.25, ease: 'back.out(2)' }, T(24, 6));
    tl.to(['#site', '#selo', '#credito'], { opacity: 1, duration: 0.2 }, T(24, 8));
    const sp2 = ator(fc, 79, { escala: 10, z: 5, x: 1220, y: 1440, opacity: 0 });
    op(sp2.el, T(24, 11));
    anim(tl, sp2, 'Walk', 6, T(24, 11), FIM + 3, { vel: 3 });
    tl.fromTo(sp2.el, { x: 1220 }, { x: 900, duration: FIM + 3 - T(24, 11), ease: 'power2.out', immediateRender: false }, T(24, 11));
    tl.set({}, {}, 60.6);

    // a medalha segue o quadro do Idle do Magikarp (o segueMedalha do EP 3)
    {
      const PESCOCO = { 0: [16, 24, 0], 2: [24.5, 20.5, 1], 6: [9.5, 19.5, 0] };
      const A = SPR['129'].anims.Idle;
      const E = mk.escala;
      const mapa = new Map();
      for (const [d, [cx, cy, dx]] of Object.entries(PESCOCO))
        A.rects[d].forEach(([rx, ry], i) => mapa.set(`${-rx * E}px ${-ry * E}px`, [(cx + (i % 2) * dx - A.w / 2) * E, (cy + (i % 2) - A.pe * A.h) * E]));
      gsap.set(mk.pend, { x: (PESCOCO[0][0] - A.w / 2) * E, y: (PESCOCO[0][1] - A.pe * A.h) * E });
      for (const tw of tl.getTweensOf(mk.spr)) {
        const q = mapa.get(tw.vars.backgroundPosition);
        if (q) tl.set(mk.pend, { x: q[0], y: q[1] }, tw.startTime());
      }
    }
    /**
     * A faixa segue o quadro do Slowpoke (e do disfarce): a testa em px da folha (coluna e linha do canto de cima à
     * esquerda, largura) em cada animação e direção; nos quadros 1 e 3 o corpo desce 1 px. De lado o nó fica atrás
     * (olhando pra direita a faixa espelha); de costas, no meio da nuca; de frente, escondido. Quadro sem testa mapeada:
     * a faixa some. Chamar depois de todas as animações do ator.
     */
    const TESTA = {
      'Walk/6': { c: 3, l: 11, w: 9, no: 'atras' },
      'Idle/6': { c: 3, l: 11, w: 9, no: 'atras' },
      'Walk/2': { c: 12, l: 11, w: 9, no: 'atras', esp: true },
      'Idle/2': { c: 12, l: 11, w: 9, no: 'atras', esp: true },
      'Idle/0': { c: 5, l: 12, w: 14, no: null },
      'Idle/4': { c: 6, l: 9, w: 12, no: 'nuca' },
    };
    function faixaSegue(a, cls = 'faixa') {
      const faixa = div(a.corpo, cls);
      faixa.style.zIndex = 2;
      const nos = [div(faixa, ''), div(faixa, '')];
      nos.forEach((n) => n.appendChild(document.createElement('i')));
      const S = SPR[a.id];
      const E = a.escala;
      const mapa = new Map();
      for (const [k, v] of Object.entries(TESTA)) {
        const [nome, d] = k.split('/');
        const A = S.anims[nome];
        A.rects[d].forEach(([rx, ry], i) => mapa.set(`${-rx * E}px ${-ry * E}px`, { ...v, A, dy: i % 2 }));
      }
      const poe = (t, v) => {
        if (!v) return tl.set(faixa, { opacity: 0 }, t);
        const x = (v.c - v.A.w / 2) * E;
        const y = (v.l + v.dy - v.A.pe * v.A.h) * E;
        tl.set(faixa, { opacity: 1, x, y, width: v.w * E, height: 2 * E, scaleX: v.esp ? -1 : 1 }, t);
        tl.set(nos, { display: v.no ? 'block' : 'none' }, t);
        if (v.no === 'atras') {
          tl.set(nos[0], { position: 'absolute', x: v.w * E - 16, y: -10, rotation: -25 }, t);
          tl.set(nos[1], { position: 'absolute', x: v.w * E - 12, y: 14, rotation: 20 }, t);
        } else if (v.no === 'nuca') {
          tl.set(nos[0], { position: 'absolute', x: (v.w * E) / 2 - 36, y: 18, rotation: 70 }, t);
          tl.set(nos[1], { position: 'absolute', x: (v.w * E) / 2 - 4, y: 18, rotation: 110 }, t);
        }
      };
      gsap.set(faixa, { opacity: 0, transformOrigin: '50% 50%' });
      for (const tw of tl.getTweensOf(a.spr)) if (tw.vars.backgroundPosition) poe(tw.startTime(), mapa.get(tw.vars.backgroundPosition));
      return faixa;
    }
    const fSp = faixaSegue(sp);
    const fDt = faixaSegue(F.a, 'faixa roxa');
    faixaSegue(s3);
    ajeita(sp, fSp, T(14, 8), 1);
    ajeita(F.a, fDt, T(14, 8), -1);

    window.__timelines = window.__timelines || {};
    window.__timelines.root = tl;
  </script>
</div>
