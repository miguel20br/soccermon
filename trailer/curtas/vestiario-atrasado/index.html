<!doctype html>
<!--
  Vestiário do Pallet FC, EP 1 "O atrasado" (07/11/2026): RASCUNHO ANIMADO (animatic) de 15 s, sem música. Roteiro
  completo em ROTEIRO.md (100 BPM, 15 compassos). Mapa do rascunho (segundos):
  0–2 gancho: o Slowpoke corre parado | 2–3,6 vinheta anos 90 | 3,6–6,4 ele chega, CHEGUEI PRA ESTREIA!, "?" no time |
  6,4–9,4 apito, a lousa gira: ESTREIA 4 × 1 | 9,4–10,6 "..." | 10,6–11,3 a luz apaga | 11,3 "!" e congela, O ATRASADO |
  13–15 tela final.
  Câmera parada de frente; sprites em escala inteira; nada de animação depois do congelamento (o vestiário para).
  Render: (de trailer/curtas) ../../scripts/pesado.sh npx hyperframes render vestiario-atrasado -q draft -w 1 --no-browser-gpu
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Soccermon · O atrasado</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="midia/sprites.js"></script>
<script src="comum.js"></script>
<style>
.cena { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; visibility: hidden; }
/* vestiário (o do EP 3, com a lousa mais baixa: fora da faixa de cima do app) */
#vest { background: #24304e; }
#vest .parede { position: absolute; left: 0; top: 0; width: 1080px; height: 1180px;
  background-image: linear-gradient(90deg, rgb(0 0 0 / 18%) 2px, transparent 2px), linear-gradient(rgb(0 0 0 / 18%) 2px, transparent 2px), linear-gradient(#1c2640, #34446c);
  background-size: 90px 90px, 90px 90px, 100% 100%; }
.armario { position: absolute; top: 540px; width: 140px; height: 610px; box-sizing: border-box; background: #4a6fa5; border: 8px solid #0e1430; border-radius: 6px;
  background-image: repeating-linear-gradient(#0e1430 0 6px, transparent 6px 22px); background-size: 70px 120px; background-position: 27px 50px; background-repeat: no-repeat; }
.armario::after { content: ""; position: absolute; right: 18px; top: 280px; width: 14px; height: 60px; background: #c8d0f0; border: 5px solid #0e1430; border-radius: 4px; }
#vest .piso { position: absolute; left: 0; top: 1180px; width: 1080px; height: 740px;
  background: repeating-conic-gradient(#3a4560 0 25%, #333d56 0 50%) 0 0 / 120px 120px; box-shadow: inset 0 18px 0 rgb(0 0 0 / 30%); }
.banco-v { position: absolute; left: 40px; top: 1130px; width: 1000px; height: 56px; z-index: 9; box-sizing: border-box; background: #c98a4f; border: 8px solid #0e1430; border-radius: 10px; box-shadow: 0 14px 0 #7a4a2a; }
.banco-v::before, .banco-v::after { content: ""; position: absolute; top: 56px; width: 30px; height: 120px; background: #7a4a2a; border: 8px solid #0e1430; border-top: none; }
.banco-v::before { left: 90px; } .banco-v::after { right: 90px; }
/* a lousa giratória: o eixo é horizontal (gira em scaleY); o verso tem os rabiscos de tática, a frente o placar */
#lousa-pe { position: absolute; left: 520px; top: 500px; width: 40px; height: 40px; background: #7a4a2a; border: 8px solid #0e1430; z-index: 2; }
#lousa { position: absolute; left: 150px; top: 170px; width: 780px; height: 340px; z-index: 3; box-sizing: border-box;
  background: #1f3a2c; border: 16px solid #a8743f; border-radius: 10px; box-shadow: 0 0 0 8px #0e1430, 0 16px 0 rgb(0 0 0 / 40%); }
#lousa .face { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #f0f0e4; }
#placar-lousa { visibility: hidden; letter-spacing: 5px; }
#placar-lousa .l1 { font-size: 76px; }
#placar-lousa b { font-size: 132px; line-height: 1.05; color: #ffcb05; }
#placar-lousa small { font-size: 44px; letter-spacing: 3px; color: #c9e2cf; }
.medalha, .medalha .med { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.medalha .fita { position: absolute; background: linear-gradient(90deg, #e8423f 0 50%, #3a7bd5 50%); clip-path: polygon(0 0, 22% 0, 50% 70%, 78% 0, 100% 0, 62% 100%, 38% 100%); }
.medalha .disco { position: absolute; box-sizing: border-box; border-radius: 50%; border-style: solid; border-color: #0e1430;
  background: radial-gradient(circle at 38% 35%, #fff3a0, #ffcb05 45%, #d99a00); }
.apito { position: absolute; left: 0; top: 0; width: 72px; height: 40px; margin: -20px 0 0 -36px; box-sizing: border-box; border-radius: 10px 20px 20px 10px;
  background: #c8d0f0; border: 7px solid #0e1430; }
.faixa { position: absolute; left: 0; top: 0; height: 30px; box-sizing: border-box; background: #e8423f; border: 6px solid #0e1430; border-radius: 6px; }
.faixa i { position: absolute; top: 2px; width: 34px; height: 16px; background: #e8423f; border: 6px solid #0e1430; border-radius: 4px; }
.zz { position: absolute; left: 0; top: 0; z-index: 31; font-size: 72px; color: #fff; -webkit-text-stroke: 11px #0e1430; paint-order: stroke fill; opacity: 0; }
.ha { position: absolute; left: 0; top: 0; z-index: 52; font-size: 64px; color: #ffcb05; -webkit-text-stroke: 12px #0e1430; paint-order: stroke fill; opacity: 0; }
.balao { position: absolute; left: 0; top: 0; z-index: 46; width: 130px; height: 150px; margin: -150px 0 0 -65px; box-sizing: border-box; border-radius: 24px;
  background: #f8f8f0; border: 8px solid #0e1430; display: flex; align-items: center; justify-content: center; font-size: 96px; color: #e8423f; opacity: 0; }
.balao.largo { width: 200px; margin-left: -100px; font-size: 64px; color: #0e1430; letter-spacing: 4px; }
.gota { position: absolute; left: 0; top: 0; width: 26px; height: 34px; margin: -17px 0 0 -13px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: #7cc8ff;
  border: 5px solid #0e1430; z-index: 30; opacity: 0; }
.risco { position: absolute; left: 0; top: 0; height: 12px; border-radius: 6px; background: #f8f8f0; border: 4px solid #0e1430; z-index: 19; opacity: 0; }
#vest .fala { top: 220px; font-size: 76px; line-height: 1.2; letter-spacing: 3px; }
/* a luz apaga: escuro por cima de tudo, com um foco redondo no Slowpoke */
#escuro { position: absolute; inset: 0; z-index: 40; pointer-events: none; opacity: 0;
  background: radial-gradient(circle 300px at 830px 1460px, transparent 0 62%, rgb(5 8 20 / 92%) 100%); }
/* vinheta anos 90 */
#vinheta { z-index: 60; background: #1fb5a8; }
.memphis { position: absolute; }
.vt-ret { position: absolute; top: 470px; width: 200px; height: 200px; box-sizing: border-box; border: 10px solid #0e1430; border-radius: 22px; background: #f8f8f0;
  box-shadow: 0 12px 0 rgb(0 0 0 / 35%); overflow: hidden; opacity: 0; }
.vt-ret img { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
#vt-titulo { position: absolute; left: 0; width: 1080px; top: 830px; text-align: center; color: #fff; opacity: 0; transform: rotate(-4deg);
  -webkit-text-stroke: 18px #0e1430; paint-order: stroke fill; text-shadow: 0 12px 0 #0e1430; letter-spacing: 6px; }
#vt-titulo span { display: block; font-size: 104px; }
#vt-titulo b { display: block; font-size: 150px; color: #ffcb05; line-height: 1.15; }
/* congelamento */
#congela { position: absolute; left: 0; width: 1080px; top: 1340px; z-index: 70; text-align: center; opacity: 0; }
#congela small { display: block; font-size: 60px; color: #fff; letter-spacing: 6px; -webkit-text-stroke: 12px #0e1430; paint-order: stroke fill; }
#congela b { display: inline-block; margin-top: 18px; padding: 22px 54px; border-radius: 24px; background: #ffcb05; color: #0e1430; font-size: 112px; letter-spacing: 6px;
  box-shadow: 0 0 0 12px #0e1430, 0 22px 0 #8a6a00; transform: rotate(-3deg); }
#moldura { position: absolute; inset: 0; z-index: 69; box-sizing: border-box; border: 22px solid #f8f8f0; box-shadow: inset 0 0 0 10px #0e1430; opacity: 0; pointer-events: none; }
#credito { display: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-start="0" data-duration="15">
  <div id="cena" class="clip" data-start="0" data-duration="15">
    <div id="vest" class="cena"><div class="parede"></div><div class="piso"></div><div class="banco-v"></div><div id="lousa-pe"></div>
      <div id="lousa">
        <svg class="face" id="tatica" viewBox="0 0 748 308" fill="none" stroke="#f0f0e4" stroke-width="8" stroke-linecap="round" opacity="0.85">
          <circle cx="150" cy="90" r="26" /><circle cx="300" cy="200" r="26" /><circle cx="470" cy="110" r="26" />
          <path d="M120 230 l40 40 m0 -40 l-40 40 M560 220 l40 40 m0 -40 l-40 40 M640 70 l36 36 m0 -36 l-36 36" />
          <path d="M175 105 C 230 160, 250 190, 270 195 M325 190 C 380 150, 410 120, 440 112 M495 120 C 560 150, 600 160, 630 120" />
          <path d="M262 182 l10 14 l-16 4 M430 100 l12 12 l-16 6 M618 112 l14 6 l-6 14" />
        </svg>
        <div class="face" id="placar-lousa"><span class="l1">ESTREIA</span><b>4 × 1</b><small>SÁBADO PASSADO</small></div>
      </div>
      <div id="escuro"></div>
    </div>
    <div id="vinheta" class="cena"><div id="vt-titulo"><span>VESTIÁRIO DO</span><b>PALLET FC</b></div></div>
    <div id="moldura"></div>
    <div id="congela"><small>EP 1</small><b>O ATRASADO</b></div>
  </div>
  <div id="final" class="clip palco" data-start="13" data-duration="2">
    <div class="raios" id="raios-final"></div>
    <div id="final-cena" class="camada"></div>
  </div>
  <div class="flash" id="flash"></div>
  <audio id="a-sp-chega" class="clip" src="som/79.ogg" data-start="4.6" data-duration="0.47" data-media-start="0"></audio>
  <audio id="a-apito" class="clip" src="som/apito-curto.mp3" data-start="6.4" data-duration="0.6" data-media-start="0"></audio>
  <audio id="a-pk-ri" class="clip" src="som/25.ogg" data-start="8.3" data-duration="0.92" data-media-start="0"></audio>
  <audio id="a-mk" class="clip" src="som/129.ogg" data-start="5.1" data-duration="1.2" data-media-start="0"></audio>
  <audio id="a-sp-susto" class="clip" src="som/79.ogg" data-start="11.3" data-duration="0.47" data-media-start="0"></audio>

  <script>
    const { div, ator, anim, quadro, estouro, poeira, flash, fala, telaFinal, piscada } = C;
    const tl = gsap.timeline({ paused: true });
    const $ = (id) => document.getElementById(id);
    const vest = $('vest');
    const ver = (els, t, on = true) => tl.set(els, { autoAlpha: on ? 1 : 0 }, t);
    const op = (els, t, on = true) => tl.set(els, { opacity: on ? 1 : 0 }, t);
    const salto = (a, t, h, d = 0.3) => tl.to(a.corpo, { keyframes: { y: [-h, 0] }, duration: d, ease: 'power1.inOut' }, t);
    const carimbo = (sel, t, s = 2.2) => {
      tl.set(sel, { opacity: 1 }, t);
      tl.fromTo(sel, { scale: s }, { scale: 1, duration: 0.22, ease: 'back.out(2.2)', immediateRender: false }, t);
    };
    const balao = (txt, x, y, t0, t1, cls = 'balao') => {
      const b = div(vest, cls);
      b.textContent = txt;
      tl.set(b, { x, y }, 0);
      op(b, t0);
      tl.fromTo(b, { scale: 0.3 }, { scale: 1, duration: 0.2, ease: 'back.out(3)', immediateRender: false }, t0);
      op(b, t1, false);
      return b;
    };
    const ronco = (t, x, y, n = 2, gap = 0.5) => {
      for (let k = 0; k < n; k++) {
        const z = div(vest, 'zz');
        z.textContent = 'Z';
        tl.set(z, { x, y }, 0);
        tl.fromTo(z, { opacity: 0, scale: 0.6 + 0.3 * (k % 2) }, { opacity: 1, duration: 0.2, immediateRender: false }, t + gap * k);
        tl.to(z, { x: x + 70 + 30 * (k % 2), y: y - 190 - 40 * (k % 2), duration: 1.2, ease: 'sine.out' }, t + gap * k);
        tl.to(z, { opacity: 0, duration: 0.3 }, t + 0.9 + gap * k);
      }
    };
    const gota = (t, x, y, lado) => {
      const g = div(vest, 'gota');
      tl.set(g, { x, y, opacity: 0 }, 0);
      tl.fromTo(g, { x, opacity: 1 }, { x: x + lado * 110, duration: 0.5, ease: 'none', immediateRender: false }, t);
      tl.fromTo(g, { y }, { keyframes: { y: [y - 60, y + 130] }, duration: 0.5, ease: 'power1.in', immediateRender: false }, t);
      op(g, t + 0.5, false);
    };

    // ---------- tempos do rascunho ----------
    const VIN = 2.0; // vinheta entra
    const VOLTA = 3.6; // volta pro vestiário
    const PARA = 4.4; // ele chega
    const APITO = 6.4;
    const GIRA = 6.5; // a lousa gira
    const NADA = 9.4; // "..."
    const APAGA = 10.6;
    const SUSTO = 11.3; // "!"
    const CONGELA = 11.45;
    const FIM = 13.0;

    // ====================================================================================================
    // o vestiário: armários, banco com o elenco, o Slowpoke em primeiro plano à direita
    // ====================================================================================================
    ver(['#vest', '#vinheta'], 0, false);
    ver('#vest', 0);
    [30, 190, 750, 910].forEach((x) => div(vest, 'armario', `left:${x}px`));
    const sn = ator(vest, '143x', { escala: 10, z: 10, x: 200, y: 1150, sombra: false });
    const mk = ator(vest, 129, { escala: 10, z: 11, x: 470, y: 1140, sombra: false });
    const pk = ator(vest, 25, { escala: 10, z: 10, x: 690, y: 1150, sombra: false });
    const dt = ator(vest, 132, { escala: 11, z: 10, x: 880, y: 1150, sombra: false });
    const sp = ator(vest, 79, { escala: 12, z: 20, x: 930, y: 1640 });
    // medalha do Magikarp pendurada abaixo da boca (a do EP 3, Idle de frente e de lado)
    {
      const E = mk.escala;
      const pend = div(mk.corpo, 'medalha');
      pend.style.zIndex = 2;
      pend.innerHTML = `<div class="med"><div class="fita" style="left:${-1.5 * E}px;top:0;width:${3 * E}px;height:${1.9 * E}px"></div>`
        + `<div class="disco" style="left:${-1.5 * E}px;top:${1.3 * E}px;width:${3 * E}px;height:${3 * E}px;border-width:${0.4 * E}px"></div></div>`;
      mk.pend = pend;
    }
    const apito = div(mk.corpo, 'apito');
    gsap.set(apito, { x: 5, y: -72, opacity: 0 });
    apito.style.zIndex = 3;
    // a faixa na testa do Slowpoke (px da folha: de lado olhando pra esquerda, de frente e de costas)
    const faixa = div(sp.corpo, 'faixa');
    faixa.innerHTML = '<i></i>';
    faixa.style.zIndex = 2;
    const FAIXA = { 6: { x: -122, y: -170, w: 86, cauda: 'right:-30px' }, 0: { x: -62, y: -124, w: 128, cauda: 'display:none' }, 4: { x: -62, y: -190, w: 128, cauda: 'left:40px;top:14px' } };
    const poeFaixa = (dir, t) => {
      const f = FAIXA[dir];
      tl.set(faixa, { x: f.x, y: f.y, width: f.w }, t);
      tl.set(faixa.firstChild, { attr: { style: f.cauda } }, t);
    };

    // o Snorlax dorme o rascunho inteiro (até congelar); Zs só até antes da luz apagar
    anim(tl, sn, 'Sleep', 0, 0, CONGELA, { id: '143x', vel: 0.5 });
    ronco(0.4, 250, 980, 2);
    ronco(3.9, 250, 980, 2);
    ronco(7.4, 250, 980, 2);

    // ====================================================================================================
    // 0–2 · gancho: o Slowpoke corre parado (Walk a 3x, anda 30 px), suor, poeira e riscos de velocidade
    // ====================================================================================================
    const corre = (t0, t1, x0, x1) => {
      anim(tl, sp, 'Walk', 6, t0, t1, { vel: 3 });
      poeFaixa(6, t0);
      tl.fromTo(sp.el, { x: x0 }, { x: x1, duration: t1 - t0, ease: 'none', immediateRender: false }, t0);
      for (let t = t0 + 0.05; t < t1 - 0.2; t += 0.45) gota(t, x0 + 60, 1330, 1);
      for (let t = t0 + 0.1; t < t1 - 0.1; t += 0.3) poeira(tl, vest, x0 + 90, 1640, t, { n: 4, r: 70, tam: 30 });
      [1380, 1450, 1520].forEach((y, i) => {
        const r = div(vest, 'risco', `width:${90 + 30 * (i % 2)}px`);
        tl.set(r, { x: x0 + 150, y }, 0);
        for (let t = t0 + i * 0.07; t < t1; t += 0.24) tl.fromTo(r, { opacity: 1, x: x0 + 150 }, { opacity: 0, x: x0 + 230, duration: 0.22, ease: 'none', immediateRender: false }, t);
      });
    };
    corre(0, VIN, 930, 905);
    // o time olha pra ele
    anim(tl, mk, 'Idle', 2, 0, VIN, { vel: 1.2 });
    anim(tl, pk, 'Idle', 2, 0, VIN);
    anim(tl, dt, 'Idle', 0, 0, CONGELA);

    // ====================================================================================================
    // 2–3,6 · vinheta anos 90: VESTIÁRIO DO PALLET FC com os 4 retratos do elenco
    // ====================================================================================================
    {
      const v = $('vinheta');
      const formas = [
        ['background:#ff4fa3;width:150px;height:150px;clip-path:polygon(50% 0,100% 100%,0 100%)', 80, 160],
        ['background:#ffcb05;width:120px;height:120px;border-radius:50%', 860, 230],
        ['border:16px solid #6b3fd4;width:180px;height:180px;border-radius:50%;box-sizing:border-box', 760, 1380],
        ['background:#ff4fa3;width:240px;height:36px;border-radius:18px', 110, 1440],
        ['background:#0e1430;width:90px;height:90px', 900, 1600],
        ['background:#ffcb05;width:130px;height:130px;clip-path:polygon(50% 0,100% 100%,0 100%)', 160, 1640],
      ];
      formas.forEach(([css, x, y], i) => {
        const f = div(v, 'memphis', `${css};left:${x}px;top:${y}px`);
        tl.fromTo(f, { rotation: 0, scale: 0 }, { rotation: (i % 2 ? -1 : 1) * 40, scale: 1, duration: 1.4, ease: 'back.out(2)', immediateRender: false }, VIN + 0.05 * i);
      });
      ['129', '143', '25', '132'].forEach((r, i) => {
        const c = div(v, 'vt-ret', `left:${80 + i * 240}px`);
        c.innerHTML = `<img src="midia/${r}.png" alt="" />`;
        tl.set(c, { opacity: 1 }, VIN + 0.1 + i * 0.12);
        tl.fromTo(c, { scale: 0, rotation: -20 }, { scale: 1, rotation: i % 2 ? 4 : -4, duration: 0.3, ease: 'back.out(3)', immediateRender: false }, VIN + 0.1 + i * 0.12);
      });
      ver('#vinheta', VIN);
      flash(tl, VIN, 0.5, 0.2);
      carimbo('#vt-titulo', VIN + 0.6, 2.4);
      tl.to('#vt-titulo', { scale: 1.06, duration: VOLTA - VIN - 0.85, ease: 'sine.inOut' }, VIN + 0.85);
      ver('#vinheta', VOLTA, false);
      flash(tl, VOLTA, 0.4, 0.2);
    }

    // ====================================================================================================
    // 3,6–6,4 · ele ainda está correndo; chega, estufa o peito; CHEGUEI PRA ESTREIA!; "?" no time
    // ====================================================================================================
    corre(VOLTA, PARA, 893, 870);
    anim(tl, mk, 'Idle', 2, VOLTA, APITO, { vel: 1.2 });
    anim(tl, pk, 'Idle', 2, VOLTA, NADA);
    poeira(tl, vest, 900, 1640, PARA, { n: 7, r: 160, tam: 50 });
    anim(tl, sp, 'Idle', 0, PARA, GIRA + 0.3);
    poeFaixa(0, PARA);
    tl.fromTo(sp.corpo, { scaleX: 1, scaleY: 1 }, { keyframes: { scaleY: [1.12, 1.06], scaleX: [0.94, 1] }, duration: 0.4, ease: 'back.out(2)', immediateRender: false }, PARA + 0.05);
    estouro(tl, vest, 870, 1300, PARA + 0.05, { tam: 160, cor: '#fff' });
    const f = fala(vest, 'midia/79.png', 'CHEGUEI PRA<br>ESTREIA!', 'fala-sp');
    op(f, PARA + 0.2);
    tl.fromTo(f, { scale: 0.6 }, { scale: 1, duration: 0.2, ease: 'back.out(2)', immediateRender: false }, PARA + 0.2);
    op(f, APITO - 0.1, false);
    balao('?', 470, 840, 5.1, APITO - 0.1);
    balao('?', 690, 840, 5.25, APITO - 0.1);

    // ====================================================================================================
    // 6,4–9,4 · o Magikarp apita, a lousa gira: o placar da estreia; o Slowpoke vira de costas pra ler; o Pikachu ri
    // ====================================================================================================
    anim(tl, mk, 'Idle', 0, APITO, NADA, { vel: 1.2 });
    op(apito, APITO);
    op(apito, APITO + 0.6, false);
    salto(mk, APITO, 60);
    estouro(tl, vest, 490, 990, APITO, { tam: 120, cor: '#fff' });
    tl.to('#lousa', { scaleY: 0, duration: 0.14, ease: 'power2.in' }, GIRA);
    tl.set('#tatica', { visibility: 'hidden' }, GIRA + 0.14);
    tl.set('#placar-lousa', { visibility: 'visible' }, GIRA + 0.14);
    tl.to('#lousa', { scaleY: 1, duration: 0.3, ease: 'back.out(2.5)' }, GIRA + 0.14);
    flash(tl, GIRA + 0.14, 0.35, 0.2);
    anim(tl, sp, 'Idle', 4, GIRA + 0.3, APAGA + 0.6, { vel: 0.8 });
    poeFaixa(4, GIRA + 0.3);
    const ha = [[640, 790], [760, 740]].map(([x, y], i) => {
      const h = div(vest, 'ha');
      h.textContent = i ? 'HA' : 'HAHA';
      tl.set(h, { x, y }, 0);
      tl.fromTo(h, { opacity: 0, y: y + 20 }, { opacity: 1, y: y - 40, duration: 0.25, ease: 'back.out(2)', immediateRender: false }, 8.3 + i * 0.12);
      op(h, NADA - 0.1, false);
      return h;
    });
    tl.to(pk.corpo, { keyframes: { y: [-20, 0, -20, 0] }, duration: 0.6, ease: 'none' }, 8.3);

    // ====================================================================================================
    // 9,4–10,6 · nada: "..." no Slowpoke, o time olha pra ele
    // ====================================================================================================
    anim(tl, mk, 'Idle', 2, NADA, APAGA, { vel: 1.2 });
    anim(tl, pk, 'Idle', 2, NADA, APAGA);
    balao('...', 870, 1290, NADA + 0.1, APAGA, 'balao largo');

    // ====================================================================================================
    // 10,6–11,3 · a luz apaga: todo mundo já foi embora; o foco fica nele, de costas, olhando a lousa
    // ====================================================================================================
    op('#escuro', APAGA);
    tl.set([mk.el, pk.el, dt.el, sn.el], { opacity: 0 }, APAGA);

    // ====================================================================================================
    // 11,3 · a ficha cai: vira pra câmera com o "!"; 11,45 congela; O ATRASADO
    // ====================================================================================================
    anim(tl, sp, 'Idle', 0, SUSTO, CONGELA, { loop: false });
    poeFaixa(0, SUSTO);
    tl.fromTo(sp.corpo, { y: 0 }, { y: -40, duration: 0.12, ease: 'power2.out', immediateRender: false }, SUSTO);
    balao('!', 870, 1310, SUSTO, FIM);
    // congelou: a cena para, a cor lava, moldura branca e o nome do episódio carimbado
    flash(tl, CONGELA, 0.7, 0.25);
    // e a câmera pula pra perto dele (2x: o pixel continua inteiro), o Slowpoke no centro
    tl.set('#vest', { filter: 'saturate(0.45) contrast(1.05) brightness(1.05) sepia(0.25)', scale: 2, x: -1200, y: -1980, transformOrigin: '0px 0px' }, CONGELA);
    op('#moldura', CONGELA);
    carimbo('#congela small', CONGELA + 0.2, 1.8);
    carimbo('#congela b', CONGELA + 0.35, 2.4);
    op('#congela', CONGELA + 0.2);
    tl.set('#congela small, #congela b', { opacity: 0 }, 0);
    ver(['#vest', '#moldura', '#congela'], FIM, false);

    // ====================================================================================================
    // 13–15 · tela final (o logo pisca SOC-CER-MON)
    // ====================================================================================================
    telaFinal($('final'));
    flash(tl, FIM, 0.6, 0.3);
    tl.fromTo('#raios-final', { rotation: 0 }, { rotation: 20, duration: 2, ease: 'none', immediateRender: false }, FIM);
    tl.set('#logo', { opacity: 1 }, FIM);
    tl.fromTo('#logo', { scale: 0.7 }, { scale: 1, duration: 0.45, ease: 'back.out(3)', immediateRender: false }, FIM);
    piscada(tl, [FIM + 0.25, FIM + 0.4, FIM + 0.55], '#final-cena');
    tl.set('#tag', { opacity: 1 }, FIM + 0.6);
    tl.from('#tag', { scale: 1.6, duration: 0.25, ease: 'back.out(2)' }, FIM + 0.6);
    tl.to(['#site', '#selo'], { opacity: 1, duration: 0.2 }, FIM + 0.75);
    tl.set({}, {}, 15);

    // a medalha segue o quadro do Idle do Magikarp (segueMedalha do EP 3): onde a fita nasce, em px da folha, de frente
    // e de lado; nos quadros 1 e 3 a cabeça desce 1 px
    {
      const PESCOCO = { 0: [16, 24, 0], 2: [24.5, 20.5, 1], 6: [9.5, 19.5, 0] };
      const A = SPR['129'].anims.Idle;
      const E = mk.escala;
      const mapa = new Map();
      for (const [d, [cx, cy, dx]] of Object.entries(PESCOCO))
        A.rects[d].forEach(([rx, ry], i) => mapa.set(`${-rx * E}px ${-ry * E}px`, [(cx + (i % 2) * dx - A.w / 2) * E, (cy + (i % 2) - A.pe * A.h) * E]));
      gsap.set(mk.pend, { x: (PESCOCO[0][0] - A.w / 2) * E, y: (PESCOCO[0][1] - A.pe * A.h) * E });
      for (const tw of tl.getTweensOf(mk.spr)) {
        const q = mapa.get(tw.vars.backgroundPosition);
        if (q) tl.set(mk.pend, { x: q[0], y: q[1] }, tw.startTime());
      }
    }

    window.__timelines = window.__timelines || {};
    window.__timelines.root = tl;
  </script>
</div>
</body>
