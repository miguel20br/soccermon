<!doctype html>
<!--
  Curta "POV: você segurou o golpe até o nível 3" (9:16). Uma página que desenha UM quadro por chamada (montar.mjs
  chama window.quadro(estado) e lê o canvas): a quadra gravada do jogo recortada em volta do lance (3x, pixel nítido),
  a barra de 3 gomos, o botão do golpe máximo de verdade (print do jogo, 3x) e o polegar de quem joga. Tudo centrado
  em x 540; título entre y 120 e 330.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<style>
  html, body { margin: 0; background: #070a18; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const c = document.getElementById('c');
const g = c.getContext('2d');
g.imageSmoothingEnabled = false;
const INK = '#0e1430';
const OURO = '#ffcb05';
const imgs = new Map();
const carrega = (src) => {
  if (!imgs.has(src))
    imgs.set(src, new Promise((ok, erro) => {
      const im = new Image();
      im.onload = () => ok(im);
      im.onerror = () => erro(new Error(src));
      im.src = src;
    }));
  return imgs.get(src);
};

// polegar em pixel art (16 colunas; a ponta pra cima); escala 9
const DEDO = [
  '.....OOOOOO.....',
  '....ONNNNNNO....',
  '...ONLLNNNNNO...',
  '...ONLNNNNNNO...',
  '...ONNNNNNNNO...',
  '...OSNNNNNNSO...',
  '...OSSNNNNSSO...',
  '...OSSSSSSSDO...',
  '...OSSSSSSSDO...',
  '...OSSSSSSSDO...',
  '...OSSSSSSSDO...',
  '..OSSSSSSSSDO...',
  '..OSSSSSSSSSDO..',
  '.OSSSSSSSSSSDO..',
  '.OSSSSSSSSSSDO..',
  'OSSSSSSSSSSSSDO.',
  'OSSSSSSSSSSSSDO.',
  'OSSSSSSSSSSSSSDO',
];
const COR = { O: INK, S: '#f2b48a', D: '#d98a62', N: '#fde3d0', L: '#ffffff' };
function dedo(x, y, px = 12) {
  // x,y = a ponta (meio da unha, em cima); o resto desce até o fim da tela
  const x0 = Math.round(x - 8 * px);
  DEDO.forEach((linha, r) => {
    [...linha].forEach((ch, k) => {
      if (ch === '.') return;
      g.fillStyle = COR[ch];
      g.fillRect(x0 + k * px, Math.round(y + r * px), px, px);
    });
  });
  const ult = DEDO.at(-1);
  const y1 = Math.round(y + DEDO.length * px);
  [...ult].forEach((ch, k) => {
    if (ch === '.') return;
    g.fillStyle = COR[ch];
    g.fillRect(x0 + k * px, y1, px, 1920 - y1);
  });
}

function texto(t, x, y, tam, cor = '#fff', borda = 14) {
  g.font = `700 ${tam}px Galmuri11`;
  g.textAlign = 'center';
  g.textBaseline = 'alphabetic';
  g.lineJoin = 'round';
  g.lineWidth = borda;
  g.strokeStyle = INK;
  g.strokeText(t, x, y);
  g.fillStyle = cor;
  g.fillText(t, x, y);
}
/** Linha com pedaços de cores diferentes, centrada. */
function textoCores(partes, x, y, tam) {
  g.font = `700 ${tam}px Galmuri11`;
  const w = partes.reduce((s, [t]) => s + g.measureText(t).width, 0);
  let cx = x - w / 2;
  for (const [t, cor] of partes) {
    const tw = g.measureText(t).width;
    texto(t, cx + tw / 2, y, tam, cor);
    cx += tw;
  }
}

function caixa(x, y, w, h, r) {
  g.beginPath();
  g.roundRect(x, y, w, h, r);
}

const CAP = new URLSearchParams(location.search).get('cap') ?? '6';
async function telaFinal(f) {
  // raios cônicos do fundo de marca
  g.save();
  g.globalAlpha = 0.07 * f.entra;
  g.translate(540, 760);
  g.rotate(f.giro);
  for (let k = 0; k < 20; k++) {
    g.rotate((Math.PI * 2) / 20);
    g.beginPath();
    g.moveTo(0, 0);
    g.lineTo(-90, -1400);
    g.lineTo(90, -1400);
    g.fillStyle = '#fff';
    g.fill();
  }
  g.restore();
  const logo = await carrega('../../public/assets/ui/logo.svg');
  const lw = 920 * f.logo * f.elastico;
  const lh = (lw * 300) / 1441.4;
  g.save();
  g.globalAlpha = f.entra;
  g.imageSmoothingEnabled = true;
  g.drawImage(logo, 540 - lw / 2, 470 - lh / 2 + (1 - f.entra) * 40, lw, lh);
  g.imageSmoothingEnabled = false;
  // o capitão em pé em cima da barra cheia, pulando no gancho
  const sp = await carrega(`../../public/assets/field/${CAP}.png`);
  const [sx, sy, sw, sh] = f.sprite.rect;
  const k = 9;
  g.beginPath();
  g.ellipse(540, 1240, 150, 34, 0, 0, Math.PI * 2);
  g.fillStyle = 'rgba(0,0,0,0.35)';
  g.fill();
  g.drawImage(sp, sx, sy, sw, sh, 540 - (sw * k) / 2, 1250 - sh * f.sprite.pe * k - f.sprite.pulo, sw * k, sh * k);
  g.restore();
  if (f.site > 0) {
    g.globalAlpha = f.site;
    texto('soccermon.com', 540, 1620 + (1 - f.site) * 30, 92, '#fff', 16);
    g.globalAlpha = 1;
  }
}

// o retrato PMD do capitão sem o fundo rosa (a mesma regra do jogo: src/game/portrait-cut.ts, empacotado em PC)
let retratoCut = null;
async function retrato(src) {
  if (retratoCut) return retratoCut;
  const im = await carrega(src);
  const cv = document.createElement('canvas');
  cv.width = im.width;
  cv.height = im.height;
  const cx = cv.getContext('2d');
  cx.drawImage(im, 0, 0);
  const d = cx.getImageData(0, 0, im.width, im.height);
  window.PC?.cutPortraitBg(d.data, im.width, im.height);
  cx.putImageData(d, 0, 0);
  retratoCut = cv;
  return cv;
}

/** A faixa da assinatura, grande: entra da esquerda, fica com brilho passando e sai pela direita. */
async function faixa(f) {
  const cor = f.cor ?? '#EE8130';
  const corTipo = f.corTipo ?? cor;
  g.save();
  g.translate(540 + f.dx, 870);
  g.rotate(-0.12);
  g.globalAlpha = f.alfa;
  const W = 1500;
  const H = 250;
  // sombra, faixa, listra clara em cima e a tira escura de baixo
  g.fillStyle = 'rgba(7,10,24,0.55)';
  g.fillRect(-W / 2 + 14, -H / 2 + 18, W, H);
  g.fillStyle = INK;
  g.fillRect(-W / 2, -H / 2 - 10, W, H + 20);
  g.fillStyle = cor;
  g.fillRect(-W / 2, -H / 2, W, H - 64);
  g.fillStyle = '#ffb27a';
  g.fillRect(-W / 2, -H / 2, W, 14);
  g.fillStyle = INK;
  g.fillRect(-W / 2, H / 2 - 64, W, 64);
  // brilho passando
  g.save();
  g.beginPath();
  g.rect(-W / 2, -H / 2, W, H - 64);
  g.clip();
  const bx = -W / 2 + f.brilho * (W + 400) - 200;
  const gr = g.createLinearGradient(bx - 120, 0, bx + 120, 0);
  gr.addColorStop(0, 'rgba(255,255,255,0)');
  gr.addColorStop(0.5, 'rgba(255,255,255,0.45)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr;
  g.fillRect(bx - 120, -H / 2, 240, H);
  g.restore();
  // retrato
  const r = await retrato(f.retrato);
  const R = 236 * f.pop;
  const rx = -372;
  const ry = -12;
  g.fillStyle = INK;
  g.fillRect(rx - R / 2 - 12, ry - R / 2 - 12, R + 24, R + 24);
  g.fillStyle = '#fff';
  g.fillRect(rx - R / 2 - 6, ry - R / 2 - 6, R + 12, R + 12);
  g.fillStyle = f.fundoRetrato ?? '#c85a1e';
  g.fillRect(rx - R / 2, ry - R / 2, R, R);
  g.imageSmoothingEnabled = false;
  g.drawImage(r, rx - R / 2, ry - R / 2, R, R);
  // textos
  g.textAlign = 'left';
  const tx = -222 + f.dxTexto;
  g.font = `700 ${f.tam ?? 80}px Galmuri11`;
  g.lineJoin = 'round';
  g.lineWidth = 16;
  g.strokeStyle = INK;
  g.strokeText(f.nome, tx, -18);
  g.fillStyle = '#fff';
  g.fillText(f.nome, tx, -18);
  g.font = '700 36px Galmuri11';
  g.fillStyle = corTipo;
  g.fillText(f.tipo, tx, H / 2 - 18);
  const tw = g.measureText(f.tipo).width;
  g.fillStyle = '#7dffb0';
  g.fillText(f.nota, tx + tw + 28, H / 2 - 18);
  g.restore();
}

/** GOOOOL! por cima da quadra, no alto do painel, pulando. */
async function golTexto(t, Q) {
  g.save();
  g.translate(540, Q.y + 190);
  g.rotate(Math.sin(t.u * 9) * 0.04);
  g.scale(t.escala, t.escala);
  g.textAlign = 'center';
  g.font = '700 150px Galmuri11';
  g.lineJoin = 'round';
  g.lineWidth = 30;
  g.strokeStyle = INK;
  g.strokeText('GOOOOL!', 0, 50);
  g.lineWidth = 14;
  g.strokeStyle = '#e8423f';
  g.strokeText('GOOOOL!', 0, 50);
  g.fillStyle = '#fff';
  g.fillText('GOOOOL!', 0, 50);
  g.restore();
}

// estado: { fundo, quadra: {src, sx, sy, sw, sh}, flash, gomos, gomoBrilho[], botao: {...}, dedo: {...}, titulo }
window.quadro = async (e) => {
  // fundo de marca: azul-noite radial
  const gr = g.createRadialGradient(540, 760, 60, 540, 900, 1300);
  gr.addColorStop(0, '#2a3a7a');
  gr.addColorStop(1, '#070a18');
  g.fillStyle = gr;
  g.fillRect(0, 0, 1080, 1920);

  if (e.fim) await telaFinal(e.fim);

  // título
  if (e.titulo > 0) {
    g.globalAlpha = e.titulo;
    texto('POV: você segurou o', 540, 196, 68);
    textoCores([['golpe até o ', '#fff'], ['NÍVEL 3', OURO]], 540, 280, 68);
    g.globalAlpha = 1;
  }

  // a quadra
  const Q = { x: 30, y: 316, w: 1020, h: 1120 };
  if (e.quadra) {
    const im = await carrega(e.quadra.src);
    g.save();
    g.translate(e.treme?.[0] ?? 0, e.treme?.[1] ?? 0);
    caixa(Q.x, Q.y, Q.w, Q.h, 34);
    g.save();
    g.clip();
    // o recorte pode passar da borda da quadra (a faixa do especial pede mais largura): faixa escura em cima e embaixo
    g.fillStyle = INK;
    g.fillRect(Q.x, Q.y, Q.w, Q.h);
    const { sx, sy, sw, sh } = e.quadra;
    const k = Q.w / sw;
    const x0 = Math.max(0, sx);
    const y0 = Math.max(0, sy);
    const x1 = Math.min(im.width, sx + sw);
    const y1 = Math.min(im.height, sy + sh);
    g.imageSmoothingEnabled = sw > 400;
    g.drawImage(im, x0, y0, x1 - x0, y1 - y0, Q.x + (x0 - sx) * k, Q.y + (y0 - sy) * k, (x1 - x0) * k, (y1 - y0) * k);
    g.imageSmoothingEnabled = false;
    if (e.escurece) {
      g.fillStyle = `rgba(7,10,24,${e.escurece})`;
      g.fillRect(Q.x, Q.y, Q.w, Q.h);
    }
    if (e.golTexto) await golTexto(e.golTexto, Q);
    if (e.flash) {
      g.fillStyle = `rgba(255,255,255,${e.flash})`;
      g.fillRect(Q.x, Q.y, Q.w, Q.h);
    }
    g.restore();
    caixa(Q.x, Q.y, Q.w, Q.h, 34);
    g.lineWidth = 12;
    g.strokeStyle = INK;
    g.stroke();
    caixa(Q.x + 9, Q.y + 9, Q.w - 18, Q.h - 18, 26);
    g.lineWidth = 5;
    g.strokeStyle = 'rgba(120,140,220,0.55)';
    g.stroke();
    g.restore();
  }

  if (e.faixa) await faixa(e.faixa);

  // a barra de 3 gomos (o que o jogador está segurando)
  {
    const W = 280, H = 52, gap = 20, y = 1462;
    const x0 = 540 - (3 * W + 2 * gap) / 2;
    for (let i = 0; i < 3; i++) {
      const x = x0 + i * (W + gap);
      const on = e.gomos > i;
      const br = e.gomoBrilho?.[i] ?? 0;
      caixa(x - 6, y - 6, W + 12, H + 12, 16);
      g.fillStyle = INK;
      g.fill();
      caixa(x, y, W, H, 11);
      g.fillStyle = on ? OURO : '#232c5c';
      g.fill();
      if (!on && i === e.gomos && e.enche > 0) {
        caixa(x, y, W * e.enche, H, 11);
        g.fillStyle = '#b8901a';
        g.fill();
      }
      if (on) {
        caixa(x + 8, y + 7, W - 16, 10, 5);
        g.fillStyle = 'rgba(255,255,255,0.55)';
        g.fill();
      }
      if (br > 0) {
        g.save();
        g.globalAlpha = br;
        g.shadowColor = '#fff6b0';
        g.shadowBlur = 40;
        caixa(x, y, W, H, 11);
        g.fillStyle = '#fff6c8';
        g.fill();
        g.restore();
      }
      g.font = '700 32px Galmuri11';
      g.textAlign = 'center';
      g.fillStyle = on ? INK : '#6f7bb8';
      g.fillText(`N${i + 1}`, x + W / 2, y + H / 2 + 12);
    }
  }

  // o botão do jogo (print 3x da linha .sl-cue-row) e o polegar
  if (e.botao) {
    const im = await carrega(e.botao.src);
    const b = e.botao;
    const k = b.escala; // px na tela por px do print
    const w = im.width * k;
    const h = im.height * k;
    const x = 540 - w / 2;
    const y = b.y;
    g.save();
    g.globalAlpha = b.alfa;
    // cada botão desenhado à parte, com o "apertado" (encolhe) e o clarão
    for (const [nome, r] of Object.entries(b.rects)) {
      if (!r) continue;
      const [rx, ry, rw, rh] = r.map((v) => v * 3);
      const ap = b.aperta?.[nome] ?? 0;
      const s = 1 - 0.07 * ap;
      const cx = x + (rx + rw / 2) * k;
      const cy = y + (ry + rh / 2) * k;
      const dw = rw * k * s;
      const dh = rh * k * s;
      g.save();
      // 2 px css pra dentro: a borda do print traz um fio do fundo da página
      const m = 2 * 3 * k;
      caixa(cx - dw / 2 + m, cy - dh / 2 + m, dw - 2 * m, dh - 2 * m, 11 * 3 * k);
      g.clip();
      g.drawImage(im, rx, ry, rw, rh, cx - dw / 2, cy - dh / 2, dw, dh);
      g.restore();
      const cl = b.clarao?.[nome] ?? 0;
      if (cl > 0) {
        g.save();
        g.globalAlpha = cl * b.alfa;
        caixa(cx - dw / 2, cy - dh / 2, dw, dh, 18 * k);
        g.fillStyle = '#fff';
        g.fill();
        g.restore();
      }
    }
    g.restore();
  }
  if (e.dedo) dedo(e.dedo.x, e.dedo.y);
  if (e.flashTela) {
    g.fillStyle = `rgba(255,255,255,${e.flashTela})`;
    g.fillRect(0, 0, 1080, 1920);
  }
  return c.toDataURL('image/png');
};
window.pronto = (async () => {
  const f = new FontFace('Galmuri11', 'url(../../public/fonts/Galmuri11-Bold.woff2)', { weight: '700' });
  document.fonts.add(await f.load());
})();
</script>
</body>
</html>
