  Render no Termux: ../.logs/render.sh (HYPERFRAMES_BROWSER_PATH=chromium-browser, HYPERFRAMES_RENDER_DETACHED=1,
  -w 1 -q draft). Inglês: --variables '{"lang":"en"}'.
  Tempos: silêncio da abertura até 2,8 s; a música começa no zoom out (2,8 s) e o 1º ataque forte dela cai em
  H = 5,116 s (apito + corte). Daí em diante tudo anda em compassos B = 1,348 s (178 BPM), batida b = B/4.
-->

<style>
@font-face { font-family: "Galmuri11"; src: url("midia/Galmuri11-Bold.woff2") format("woff2"); font-weight: 700; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
#root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: "Galmuri11", monospace; }
.clip { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
video.clip, img.cheia { object-fit: cover; }
img { image-rendering: pixelated; }

/* abertura faroeste: rosto inteiro em faixa de cinema */
.rosto { position: absolute; left: 50%; top: 50%; width: 1000px; height: 1000px; margin: -500px 0 0 -500px; }
.barra { position: absolute; left: 0; right: 0; height: 140px; background: #000; z-index: 50; }

/* textos */
.legenda { position: absolute; left: 0; right: 0; bottom: 84px; text-align: center; z-index: 40; font-weight: 700;
  font-size: 56px; letter-spacing: 2px; padding: 0 120px; color: #fff; -webkit-text-stroke: 14px #0e1430; paint-order: stroke fill;
  text-shadow: 0 8px 0 #0e1430, 0 0 40px rgb(0 0 0 / 50%); }
.legenda b { color: #ffcb05; font-weight: 700; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 60; pointer-events: none; }
/* vinheta escura nas cenas de jogo (mais drama, o olho vai pro meio) */
.vinheta { position: absolute; inset: 0; z-index: 20; pointer-events: none;
  background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgb(0 0 0 / 55%) 100%); }

/* caixa de batalha do jogo (BattleBox), pra "O quê? Charmander está evoluindo!" */
.caixa { position: absolute; left: 50%; bottom: 70px; width: 1400px; transform: translateX(-50%); z-index: 35; padding: 30px 44px;
  background: #f8f8f0; border-radius: 22px; box-shadow: 0 0 0 8px #2a3050, 0 14px 0 8px rgb(0 0 0 / 35%);
  color: #303030; font-size: 54px; letter-spacing: 1px; }
.caixa::before { content: ""; position: absolute; inset: 10px; border: 4px solid #d06040; border-radius: 14px; }
.caixa b { color: #d06040; }

/* fundo dos menus e do final (o mesmo do logo) */
.palco { background: radial-gradient(circle at 50% 45%, #2a3a7a, #070a18 72%); }
.raios { position: absolute; left: 50%; top: 45%; width: 3000px; height: 3000px; margin: -1500px 0 0 -1500px;
  background: repeating-conic-gradient(rgb(255 255 255 / 7%) 0 6deg, transparent 6deg 13deg); }
/* recortes do jogo: um por corte seco, centrado acima da legenda */
.recorte { position: absolute; left: 50%; top: 455px; transform: translate(-50%, -50%); opacity: 0;
  filter: drop-shadow(0 18px 40px rgb(0 0 0 / 55%)); }
.recorte.modal { mask-image: linear-gradient(#000 78%, transparent); -webkit-mask-image: linear-gradient(#000 78%, transparent); }
.leque { position: absolute; left: 50%; top: 455px; display: flex; gap: 26px; transform: translate(-50%, -50%); opacity: 0; }
.leque img { height: 600px; filter: drop-shadow(0 18px 40px rgb(0 0 0 / 55%)); }

/* letreiro de golpe: a faixa do jogo (MatchHighlight) com o retrato, colada em quem usa o golpe */
.golpe { position: absolute; z-index: 30; display: flex; align-items: center; gap: 22px; white-space: nowrap;
  padding: 16px 80px 16px 22px; color: #fff; clip-path: polygon(0 0, 100% 0, calc(100% - 50px) 100%, 0 100%);
  background: linear-gradient(90deg, #c63a3a, #4a1830); box-shadow: 0 8px 0 rgb(0 0 0 / 35%); }
.golpe.dir { padding: 16px 22px 16px 80px; flex-direction: row-reverse; text-align: right; clip-path: polygon(0 0, 100% 0, 100% 100%, 50px 100%);
  background: linear-gradient(270deg, #c63a3a, #4a1830); }
.golpe .face { width: 140px; height: 140px; border: 6px solid #fff; border-radius: 12px; background: #10162e; overflow: hidden; flex: none; }
.golpe .face img { width: 100%; height: 100%; display: block; }
.golpe .quem { font-size: 34px; letter-spacing: 2px; text-shadow: 0 4px 0 rgb(0 0 0 / 55%); }
.golpe .nome { font-size: 80px; line-height: 1; letter-spacing: 3px; -webkit-text-stroke: 11px #0e1430; paint-order: stroke fill; text-shadow: 0 7px 0 #0e1430; }
/* anel em volta de quem usa o golpe */
.mira { position: absolute; z-index: 25; width: 230px; height: 230px; margin: -115px 0 0 -115px; border-radius: 50%;
  border: 8px solid #fff; box-shadow: 0 0 40px #fff, inset 0 0 30px rgb(255 255 255 / 60%); }

/* versus */
.lado { position: absolute; top: 0; bottom: 0; width: 62%; }
.vs-poke { position: absolute; height: 175px; }

/* final */
.halo { position: absolute; left: 50%; top: 45%; width: 1300px; height: 620px; transform: translate(-50%, -50%);
  background: radial-gradient(rgb(255 255 255 / 45%), transparent 65%); }
.voo { position: absolute; left: 50%; top: 45%; }
#zard { position: absolute; left: 0; top: 0; width: 320px; display: block; }
.brasa { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
  background: radial-gradient(#fff6c0, #ffb347 35%, rgb(255 90 31 / 0%) 70%); mix-blend-mode: screen; }
.logo { position: absolute; left: 210px; top: 279px; width: 1500px; height: 306px; image-rendering: auto; }
#logo-branco { filter: brightness(0) invert(1) drop-shadow(0 0 30px #fff); }
.tag { position: absolute; left: 0; right: 0; top: 60%; text-align: center; font-size: 64px; letter-spacing: 8px; color: #ffcb05; text-shadow: 6px 7px 0 #0e1430; }
.selo { position: absolute; left: 0; right: 0; width: fit-content; margin: 0 auto; top: 73%; padding: 16px 34px; border-radius: 14px; white-space: nowrap;

.site { position: absolute; left: 0; right: 0; top: 84%; text-align: center; font-size: 38px; color: #fff; letter-spacing: 2px; }
.credito { position: absolute; left: 0; right: 0; bottom: 22px; text-align: center; font-size: 20px; color: rgb(255 255 255 / 60%); letter-spacing: 1px; }
</style>

    const TEXTOS = {

        evo: "O quê? <b>Charmander</b> está evoluindo!",

        el.classList.add("dir");
        el.style.right = `${Math.max(30, 1920 - g.x - 140)}px`;
      } else {
        el.style.left = `${Math.max(30, g.x - 140)}px`;
      }
      el.style.top = `${top}px`;
    });

    const B = 1.348, b = B / 4, H = 5.116;
    const tl = gsap.timeline({ paused: true });
    const flash = (t, o = 0.9, d = 0.3) => tl.fromTo("#flash", { opacity: o }, { opacity: 0, duration: d, ease: "power2.out", immediateRender: false }, t);
    // impacto: um quadro invertido (como nos animes), flash e tremida
    const impacto = (sel, t) => {
      tl.set(sel, { filter: "invert(1) contrast(1.6)" }, t);
      tl.set(sel, { filter: "none" }, t + 0.067);
      flash(t + 0.067, 0.85, 0.3);
      tl.to(sel, { keyframes: { x: [22, -18, 13, -8, 4, 0], y: [-10, 9, -6, 4, -2, 0] }, duration: 0.3, ease: "none" }, t);
    };
    // corte seco: o recorte aparece já no lugar, com um "soco" de escala pequeno, e some no corte seguinte
    const corte = (sel, t, dur) => {
      tl.set(sel, { opacity: 1 }, t);
      tl.fromTo(sel, { scale: 1.06 }, { scale: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, t);
      tl.set(sel, { opacity: 0 }, t + dur);
    };

    // abertura: rostos com empurrão lento (tensão), corte seco pra bola sozinha; no zoom out os times aparecem
    tl.fromTo("#rosto-pika img", { scale: 1 }, { scale: 1.06, duration: 1.1, ease: "none" }, 0);
    tl.fromTo("#rosto-mew img", { scale: 1 }, { scale: 1.06, duration: 1.1, ease: "none" }, 1.1);
    tl.set("#quadra", { scale: 7 }, 2.2);
    tl.to("#quadra", { scale: 1, duration: H - 2.8 - 0.1, ease: "power3.inOut" }, 2.8);
    tl.to("#com-times", { opacity: 1, duration: 0.7, ease: "power1.in" }, 3.6);
    tl.to("#barra-cima", { yPercent: -100, duration: 0.6, ease: "power2.in" }, H - 0.7);
    tl.to("#barra-baixo", { yPercent: 100, duration: 0.6, ease: "power2.in" }, H - 0.7);

    // gancho: a caixa do jogo durante a evolução; o gol do evoluído vem com impacto
    tl.from("#caixa-evo", { y: 40, opacity: 0, duration: 0.2, ease: "power2.out" }, 5.3);
    flash(H);
    impacto("#v-gancho", H + 3.37);
    flash(22.64, 0.8, 0.3);

    // draft, técnico e campeão: cortes secos de 2 batidas
    ["#r1", "#r2", "#r3", "#r4"].forEach((s, i) => corte(s, 9.16 + i * 2 * b, i === 3 ? 2 * b + 0.01 : 2 * b));
    ["#t1", "#t2", "#t3", "#t4"].forEach((s, i) => corte(s, 25.336 + i * 2 * b, i === 3 ? 2 * b + 0.01 : 2 * b));
    ["#k1", "#k2", "#k3", "#k4"].forEach((s, i) => corte(s, 34.772 + i * 2 * b, i === 3 ? 2 * b + 0.01 : 2 * b));
    // cartas: metal (2 batidas), cada edição numa batida, e as 4 juntas no fim (2 batidas)
    const C0 = 28.032;
    corte("#c1", C0, 2 * b);
    ["#c2", "#c3", "#c4", "#c5"].forEach((s, i) => { corte(s, C0 + (2 + i) * b, b); flash(C0 + (2 + i) * b, 0.35, 0.15); });
    corte("#c6", C0 + 6 * b, 2 * b + 0.01);

    // versus: lados entram em diagonal, times sobem, VS bate
    tl.from("#vs-esq", { xPercent: -60, duration: 0.3, ease: "power3.out" }, 11.856);
    tl.from("#vs-dir", { xPercent: 60, duration: 0.3, ease: "power3.out" }, 11.856);
    tl.from("#time-esq img", { y: -260, opacity: 0, duration: 0.25, stagger: b / 3, ease: "back.out(2)" }, 11.856 + b);
    tl.from("#time-dir img", { y: 260, opacity: 0, duration: 0.25, stagger: b / 3, ease: "back.out(2)" }, 11.856 + b);
    tl.from("#vs", { scale: 3, opacity: 0, duration: 0.2, ease: "power4.in" }, 11.856 + 4 * b);
    flash(11.856 + 4 * b + 0.2, 0.6, 0.25);

    // golpes: anel em quem usa, a faixa nasce do lado dele, o nome do golpe bate; impacto no gol
    GOLPES.forEach((g, i) => {
      const t = 17.248 + i * B, n = i + 1, dir = g.x > 960 ? 1 : -1;
      flash(t, 0.6, 0.18);
      tl.fromTo(`#v-golpe${n}`, { scale: 1.1 }, { scale: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, t);
      tl.from(`#mira${n}`, { scale: 2.4, opacity: 0, duration: 0.2, ease: "power2.out" }, t);
      tl.to(`#mira${n}`, { scale: 0.9, duration: 0.15, yoyo: true, repeat: 3, ease: "sine.inOut" }, t + 0.2);
      tl.from(`#golpe${n}`, { x: 160 * -dir, scale: 0.3, opacity: 0, duration: 0.18, ease: "back.out(2)", transformOrigin: dir > 0 ? "100% 100%" : "0% 100%" }, t + 0.04);
      tl.from(`#golpe${n} .nome`, { scale: 1.8, opacity: 0, duration: 0.16, ease: "back.out(2.5)", transformOrigin: dir > 0 ? "100% 50%" : "0% 50%" }, t + 0.2);
      tl.to(`#golpe${n}`, { opacity: 0, duration: 0.1 }, t + 0.9);
      impacto(`#v-golpe${n}`, t + g.impacto);
    });

    // pênaltis: a câmera aperta devagar na cobrança (tensão) e o gol vem com impacto
    tl.fromTo("#v-penaltis", { scale: 1 }, { scale: 1.14, duration: 3.0, ease: "power1.in", immediateRender: false }, 30.728);
    impacto("#v-penaltis", 30.728 + 3.033);

    // legendas: pulam na primeira batida da cena
    for (const [id, t] of [["draft", 9.16], ["versus", 11.856], ["futsal", 14.552], ["golpes", 17.248], ["tecnico", 25.336], ["cartas", 28.032], ["estrelato", 30.728]])
      tl.from(`#leg-${id}`, { y: 60, scale: 0.8, opacity: 0, duration: 0.22, ease: "back.out(2.5)" }, t + 0.05);

    // final: Charizard vem de longe numa curva (sobe, mergulha) com rastro de fogo e passa pela câmera; clarão;
    // o logo pisca branco/cor como a evolução e assenta
    const F = 37.468, V = 1.6;
    tl.to("#raios", { rotation: 40, duration: 6.532, ease: "none" }, F);
    const caminho = [
      { x: 760, y: -360, scale: 0.18, rotation: -18 },
      { x: 420, y: -260, scale: 0.35, rotation: -10 },
      { x: 60, y: -40, scale: 0.7, rotation: 6 },
      { x: -220, y: 80, scale: 1.2, rotation: 14 },
      { x: -60, y: 30, scale: 2.4, rotation: 4 },
      { x: 0, y: 40, scale: 9, rotation: 0 },
    ];
    tl.set("#voo", caminho[0], F);
    tl.to("#voo", { keyframes: caminho.slice(1), duration: V, ease: "none" }, F);
    // balanço do bater de asas no sprite (dentro do #voo, pra não brigar com a curva)
    // o centro do sprite fica no ponto da curva (o GIF não é quadrado: margem fixa tirava ele do eixo ao crescer)
    tl.set("#zard", { xPercent: -50, yPercent: -50 }, 0);
    tl.to("#zard", { keyframes: { y: [0, -16, 0] }, duration: 0.4, repeat: 3, ease: "sine.inOut" }, F);
    // bater de asas: os 4 quadros do PMD em loop rápido; na curva ele vem de lado (linha 7) e no mergulho vira de
    // frente pra câmera (linha 0)
    for (let k = 0, t = F; t < F + V; k++, t += 0.075) {
      const linha = t < F + V * 0.62 ? 7 : 0;
      tl.set("#zard", { attr: { src: `midia/voo/r${linha}-${k % 4}.png` } }, t);
    }
    // rastro: brasas que seguem o mesmo caminho com atraso e vão sumindo
    const rastro = document.getElementById("rastro");
    for (let k = 0; k < 14; k++) {
      const d = document.createElement("div");
      d.className = "brasa";
      d.id = `brasa${k}`;
      rastro.appendChild(d);
      const atraso = 0.05 + k * 0.035;
      tl.set(`#brasa${k}`, { ...caminho[0], opacity: 0 }, F);
      tl.to(`#brasa${k}`, { keyframes: caminho.slice(1, 5), duration: V * 0.8, ease: "none" }, F + atraso);
      tl.fromTo(`#brasa${k}`, { opacity: 0.9 - k * 0.05 }, { opacity: 0, duration: V * 0.8, ease: "power1.in", immediateRender: false }, F + atraso);
    }
    tl.set("#voo", { opacity: 0 }, F + V);
    const L = F + V, p = b * 0.6;
    flash(L);
    for (let i = 0; i < 4; i++) {
      tl.set("#logo-branco", { opacity: 1 }, L + i * 2 * p);
      tl.set("#logo-cor", { opacity: i ? 1 : 0 }, L + i * 2 * p);
      tl.set("#logo-branco", { opacity: 0 }, L + (i * 2 + 1) * p);
    }
    tl.fromTo(".logo", { scale: 0.85 }, { scale: 1, duration: 0.5, ease: "back.out(3)" }, L);
    tl.set("#logo-cor", { opacity: 1 }, L + 8 * p);
    flash(L + 8 * p, 0.8, 0.4);
    tl.to("#tag", { opacity: 1, duration: 0.01 }, L + 8 * p + b);
    tl.from("#tag", { scale: 1.6, duration: 0.25, ease: "back.out(2)" }, L + 8 * p + b);
    tl.to("#selo", { opacity: 1, duration: 0.2 }, L + 8 * p + 3 * b);
    tl.from("#selo", { y: 40, duration: 0.25, ease: "back.out(2)" }, L + 8 * p + 3 * b);
    tl.to(["#site", "#credito"], { opacity: 1, duration: 0.3 }, L + 8 * p + 4 * b);

    window.__timelines = window.__timelines || {};
    window.__timelines.root = tl;
  </script>
</div>
</body>
</html>
