  <script>
    const TEXTOS = {
      pt: {
        abertura: "ATUALIZAÇÃO<br>0.8.4",
        treinador: "Agora você tem <b>treinador</b>. O Brock? Só ganhando dele",

      en: {

        treinador: "Now you get a <b>trainer</b>. Brock? Beat him first",

        goleiro: "Keepers save with <b>moves</b> now",
        habil: "Paralyze Pikachu? He <b>is</b> the lightning rod",
        b1: "Mr. Mime went in goal. <b>Invisible wall</b>",
        b2: "Onix is a <b>wall</b> now",

        b4: "And a whole lot more <b>buffs</b>",
        evo: "Green arrow: <b>evolves into an 84</b>. Red arrow: becomes Metapod",
        intervalo: "Halftime sub: back from the locker room <b>playing</b>",
        usou: "used",
        entrou: "IN!",
        notas: [["ALA", 78, 80, "GK 75"], ["FIXO", 63, 70], ["PIVÔ", 70, 75], ["", 66, 71], ["", 76, 79]],
        fim: "OUT NOW",
        credito: "Music (placeholder): Trainer Battle Remix by Bliitzit · Non-profit fan game · Pokémon © Nintendo, Game Freak, Creatures, TPC",
      },
    };
    const vars = window.__hyperframes?.getVariables?.() ?? {};
    const lang = vars.lang === "en" ? "en" : "pt";
    const T = TEXTOS[lang];
    for (const k of ["treinador", "escolha", "titulo", "pacote", "mt", "goleiro", "habil", "b1", "b2", "b3", "b4", "evo", "intervalo"])
      document.getElementById(`leg-${k}`).innerHTML = `<span>${T[k]}</span>`;
    document.getElementById("ab-tit").innerHTML = T.abertura;
    document.getElementById("fim-tit").textContent = T.fim;
    document.getElementById("credito").textContent = T.credito;
    document.getElementById("entrou").textContent = T.entrou;
    document.getElementById("habil").textContent = "Lightning Rod!";
    for (const id of ["logo0", "logo9"]) document.getElementById(id).src = `midia/logo-${lang}.svg`;
    T.notas.forEach(([pos, a, d, extra], i) => {
      document.getElementById(`n${i + 1}`).innerHTML = `${pos ? `<i>${pos}</i>` : ""}<s>${a}</s> ⇒ <b>${d}</b>${extra ? ` <i style="margin:0 0 0 16px">${extra}</i>` : ""}`;
    });

    // quem usa o golpe, já em coordenadas da tela (faixa do jogo em top 470; lance 1080x1056)
    const GOLPES = [
      { quem: "Mr. Mime", golpe: "Thunder", cor: "#F7D02C", x: 820, y: 1010 },
      { quem: "Snorlax", golpe: "Body Slam", cor: "#C6C6A7", x: 80, y: 1010 },
    ];
    GOLPES.forEach((g, i) => {
      const el = document.getElementById(`golpe${i + 1}`);
      el.querySelector(".quem").textContent = `${g.quem} ${T.usou}`;
      el.querySelector(".nome").textContent = `${g.golpe}!`;
      el.querySelector(".nome").style.color = g.cor;
      const mira = document.getElementById(`mira${i + 1}`);
      mira.style.left = `${g.x}px`;
      mira.style.top = `${g.y}px`;
      if (g.x > 540) { el.classList.add("dir"); el.style.right = `${Math.max(20, 1080 - g.x - 110)}px`; }
      else el.style.left = `${Math.max(20, g.x - 110)}px`;
      el.style.top = `${g.y - 290}px`;
    });
    // Pikachu no instante da habilidade
    const PIKA = { x: 560, y: 970 };
    Object.assign(document.getElementById("mira3").style, { left: `${PIKA.x}px`, top: `${PIKA.y}px` });

    const B = 1.348, b = B / 4, G = (k) => 0.968 + k * B;
    const tl = gsap.timeline({ paused: true });
    const flash = (t, o = 0.9, d = 0.3) => tl.fromTo("#flash", { opacity: o }, { opacity: 0, duration: d, ease: "power2.out", immediateRender: false }, t);
    const corte = (sel, t, dur) => {
      tl.set(sel, { opacity: 1 }, t);
      tl.fromTo(sel, { scale: 1.06 }, { scale: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, t);
      tl.set(sel, { opacity: 0 }, t + dur);
    };
    const legenda = (id, t) => tl.from(`#leg-${id}`, { y: 60, scale: 0.8, opacity: 0, duration: 0.22, ease: "back.out(2.5)" }, t + 0.05);
    const impacto = (sel, t) => {
      tl.set(sel, { filter: "invert(1) contrast(1.6)" }, t);
      tl.set(sel, { filter: "none" }, t + 0.067);
      flash(t + 0.067, 0.85, 0.3);
      tl.to(sel, { keyframes: { x: [22, -18, 13, -8, 4, 0], y: [-10, 9, -6, 4, -2, 0] }, duration: 0.3, ease: "none" }, t);
    };
    const golpe = (n, t, dir) => {
      tl.from(`#mira${n}`, { scale: 2.4, opacity: 0, duration: 0.2, ease: "power2.out" }, t);
      tl.to(`#mira${n}`, { scale: 0.9, duration: 0.15, yoyo: true, repeat: 3, ease: "sine.inOut" }, t + 0.2);
      tl.from(`#golpe${n}`, { x: 120 * -dir, scale: 0.3, opacity: 0, duration: 0.18, ease: "back.out(2)", transformOrigin: dir > 0 ? "100% 100%" : "0% 100%" }, t + 0.04);
      tl.from(`#golpe${n} .nome`, { scale: 1.8, opacity: 0, duration: 0.16, ease: "back.out(2.5)", transformOrigin: dir > 0 ? "100% 50%" : "0% 50%" }, t + 0.2);
    };

    // abertura: raios girando, logo e o número da versão batendo
    tl.to("#raios0", { rotation: 20, duration: 0.968, ease: "none" }, 0);
    tl.from("#logo0", { scale: 0.85, opacity: 0, duration: 0.3, ease: "back.out(3)" }, 0);
    tl.from("#ab-tit", { scale: 2.2, opacity: 0, duration: 0.2, ease: "power4.in" }, 0.35);
    flash(0.55, 0.6, 0.25);

    // treinador
    flash(G(0), 0.7, 0.25);
    corte("#tr1", G(0), B);
    corte("#tr2", G(1), 2 * b);
    corte("#tr3", G(1) + 2 * b, 2 * b);
    flash(G(1) + 2 * b, 0.35, 0.15);
    tl.fromTo("#v-holo", { scale: 1.08 }, { scale: 1, duration: 0.2, ease: "power2.out", immediateRender: false }, G(2));
    flash(G(3), 0.6, 0.2);
    ["treinador", "escolha", "titulo"].forEach((id, i) => legenda(id, G(i)));

    // pacote e MT
    flash(G(4), 0.5, 0.2);
    flash(G(6), 0.5, 0.2);
    legenda("pacote", G(4));
    legenda("mt", G(6));

    // goleiro: Mr. Mime (o trovão cai ~1,4 s depois do corte), Snorlax
    flash(G(7), 0.6, 0.18);
    tl.fromTo("#v-mime", { scale: 1.08 }, { scale: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, G(7));
    golpe(1, 11.6, 1);
    tl.to("#golpe1", { opacity: 0, duration: 0.1 }, 12.7);
    golpe(2, 13.5, -1);
    tl.to("#golpe2", { opacity: 0, duration: 0.1 }, 14.3);
    flash(G(9), 0.6, 0.18);
    legenda("goleiro", G(7));

    // habilidade: o nome sobe em amarelo em cima do Pikachu
    flash(G(10), 0.6, 0.18);
    tl.from("#mira3", { scale: 2.4, opacity: 0, duration: 0.2, ease: "power2.out" }, 15.3);
    tl.fromTo("#habil", { y: 60, opacity: 0, scale: 0.6 }, { y: 0, opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2.5)", immediateRender: false }, 15.3);
    tl.to("#habil", { y: -80, opacity: 0, duration: 0.5, ease: "power1.in" }, 16.3);
    legenda("habil", G(10));

    // buffs: carta + selo "antes ⇒ depois"
    const buffs = [[1, G(12), B], [2, G(13), 2 * b], [3, G(13) + 2 * b, 2 * b], [4, G(14), 2 * b], [5, G(14) + 2 * b, 2 * b + 0.01]];
    for (const [n, t, d] of buffs) {
      corte(`#b${n}`, t, d);
      tl.set(`#n${n}`, { opacity: 1 }, t + 0.12);
      tl.from(`#n${n}`, { scale: 1.8, duration: 0.18, ease: "back.out(2)" }, t + 0.12);
      tl.set(`#n${n}`, { opacity: 0 }, t + d);
      flash(t, 0.35, 0.15);
    }
    ["b1", "b2", "b3", "b4"].forEach((id, i) => legenda(id, [G(12), G(13), G(13) + 2 * b, G(14)][i]));

    // evolução: zoom no Pikachu e na seta
    tl.fromTo("#evo-img", { scale: 1 }, { scale: 1.35, duration: B, ease: "power1.inOut", immediateRender: false }, G(15));
    flash(G(15), 0.5, 0.2);
    legenda("evo", G(15));

    // intervalo: placar, quem entra, e o Pikachu entrando na quadra do 2º tempo
    corte("#i1", G(16), 2 * b);
    corte("#i2", G(16) + 2 * b, 2 * b + 0.01);
    legenda("intervalo", G(16));
    flash(G(17), 0.5, 0.2);
    // Pikachu entra pela lateral de cima (posições medidas no lance)
    tl.to("#mira4", { opacity: 1, duration: 0.15 }, G(17) + 0.2);
    tl.to("#mira4", { x: -80, y: 454, duration: 0.7, ease: "none" }, G(17) + 0.25);
    tl.to("#entrou", { opacity: 1, duration: 0.15 }, G(17) + 0.4);
    tl.to("#entrou", { x: -80, y: 540, duration: 0.55, ease: "none" }, G(17) + 0.4);

    // final
    tl.to("#raios9", { rotation: 20, duration: 1.92, ease: "none" }, G(19));
    flash(G(19), 0.8, 0.35);
    tl.from("#logo9", { scale: 0.85, duration: 0.4, ease: "back.out(3)" }, G(19));
    tl.from("#fim-tit", { scale: 1.6, opacity: 0, duration: 0.25, ease: "back.out(2)" }, G(19) + b);
    tl.from(["#site", "#credito"], { opacity: 0, duration: 0.3 }, G(19) + 2 * b);

    window.__timelines = window.__timelines || {};
    window.__timelines.root = tl;
  </script>
</div>
</body>
</html>
