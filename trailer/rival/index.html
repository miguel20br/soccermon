<!doctype html>
<!--
  Curta "O rival evoluiu" (pauta item 7, 24/10/2026), 9:16, ~18 s. Um herói (o Dragonair do Vermilion Voltagem), uma
  situação (seu time ganhando), começo-meio-fim: TAVA GANHANDO → ele brilha e evolui → o Dragonite faz o gol, o vídeo
  congela no seu goleiro e o placar vira na batida → "...TAVA." → tela final com o Dragonite embaixo do logo.
  Música: scripts/musica/pecas/curta-rival.mjs (128 BPM, compasso 1,875 s), composta em cima deste corte.
  Imagens: a partida de verdade (cena rival, seed trailer1820), gravada por scripts/trailer-capture.mjs e recortada
  por preparar.sh (midia/ é link, fora do git). O áudio entra no montar.sh (música + gritos + torcida).
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Soccermon · O rival evoluiu</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>window.MUSICA = { inicios: Array.from({ length: 12 }, (_, b) => b * 1.875), swing: 0 };</script>
<script src="midia/sprites.js"></script>
<script src="comum.js"></script>
<style>
.cheio { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
.cheio video, .cheio img.q { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; image-rendering: pixelated; }
#topo { position: absolute; left: 0; top: 0; width: 1080px; height: 900px; z-index: 15; pointer-events: none;
  background: linear-gradient(rgb(7 10 24 / 88%) 0, rgb(7 10 24 / 60%) 520px, transparent 900px); }
.placar { position: absolute; left: 40px; width: 1000px; height: 88px; top: 480px; z-index: 20;
  filter: drop-shadow(0 10px 0 rgb(0 0 0 / 35%)); }
.placar img { position: absolute; left: 0; top: 0; width: 1000px; opacity: 0; }
.placar img#p43 { opacity: 1; }
#faixa-evo { position: absolute; left: 60px; top: 1290px; width: 960px; height: 220px; overflow: hidden; z-index: 25; opacity: 0;
  border-radius: 20px; box-shadow: 0 16px 0 rgb(0 0 0 / 35%); }
#faixa-evo video { position: absolute; left: -26px; top: -6px; width: 1012px; height: 232px; image-rendering: pixelated; }
#zap { position: absolute; inset: 0; z-index: 30; opacity: 0; pointer-events: none;
  background: radial-gradient(circle at 42% 50%, rgb(255 236 120 / 0%) 18%, rgb(255 214 40 / 55%) 70%); }
#vinheta { position: absolute; inset: 0; z-index: 29; opacity: 0; pointer-events: none;
  background: radial-gradient(circle at 42% 50%, transparent 30%, rgb(7 10 24 / 85%) 85%); }
#escuro { position: absolute; inset: 0; z-index: 8; opacity: 0; background: #070a18; pointer-events: none; }
.legenda.grande { font-size: 96px; }
#tava2 { top: 1330px; }
.tag { font-size: 60px; }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-start="0" data-duration="18.3">
  <div id="fundo" class="cheio palco"><div class="raios" id="raios"></div></div>

  <!-- compassos 0–1: perto do Dragonair desde o 1º quadro, o placar e o TAVA GANHANDO -->
  <div class="cheio" id="w-abre" style="z-index:5"><video id="v-abre" class="clip" src="midia/abre.mp4" muted playsinline data-start="0" data-duration="3.75"></video></div>
  <div id="topo"></div>
  <div class="legenda grande" id="tava" style="top:140px"><span>TAVA <b id="ganhando">GANHANDO...</b></span></div>

  <!-- compasso 2: a evolução (recorte no Dragonair) -->
  <div class="cheio" id="w-evo" style="z-index:10;opacity:0"><video id="v-evo" class="clip" src="midia/evo.mp4" muted playsinline data-start="3.75" data-duration="1.875"></video></div>
  <!-- compasso 3: o Dragonite em câmera lenta e a faixa do jogo -->
  <div class="cheio" id="w-rev" style="z-index:11;opacity:0"><video id="v-rev" class="clip" src="midia/rev.mp4" muted playsinline data-start="5.625" data-duration="1.875"></video></div>
  <div id="faixa-evo"><video id="v-faixa-evo" class="clip" src="midia/faixa-evo.mp4" muted playsinline data-start="5.625" data-duration="1.875"></video></div>
  <!-- compassos 4–5: o lance do gol -->
  <div class="cheio" id="w-jogo" style="z-index:12;opacity:0"><video id="v-jogo" class="clip" src="midia/jogo.mp4" muted playsinline data-start="7.5" data-duration="3.767"></video></div>
  <!-- compassos 6–7: congela no goleiro -->
  <div class="cheio" id="w-congela" style="z-index:13;opacity:0"><img class="q" id="congela" src="midia/congela.png" alt="" /></div>
  <div id="escuro"></div>
  <div class="legenda grande" id="tava2" style="opacity:0"><span>...TAVA.</span></div>

  <div id="vinheta"></div>
  <div id="zap"></div>
  <div class="placar" id="placar">
    <img id="p43" src="midia/p43.png" alt="" /><img id="p44" src="midia/p44.png" alt="" /><img id="p45" src="midia/p45.png" alt="" />
    <img id="p46" src="midia/p46.png" alt="" /><img id="p56" src="midia/p56.png" alt="" /><img id="p57" src="midia/p57.png" alt="" />
    <img id="p58" src="midia/p58.png" alt="" />
  </div>

  <!-- compassos 8–9: tela final -->
  <div id="final" class="cheio palco" style="z-index:60;opacity:0">
    <div class="raios" id="raios-final"></div>
    <div id="final-cena" class="camada"></div>
  </div>
  <div class="flash" id="flash"></div>

  <script>
    const { T, div, ator, anim, quadro, estouro, treme, flash, telaFinal, piscada } = C;
    const tl = gsap.timeline({ paused: true });
    const BAT = 1.875 / 4;
    const PISCADAS = [4.1667, 4.5, 4.7333, 4.9, 5.0333, 5.1333, 5.2333, 5.3333, 5.4333, 5.5333];
    const mostra = (sel, t, on = true) => tl.set(sel, { opacity: on ? 1 : 0 }, t);
    const pop = (sel, t, de = 1.25, d = 0.22) =>
      tl.fromTo(sel, { scale: de }, { scale: 1, duration: d, ease: 'back.out(2.5)', immediateRender: false }, t);
    const placar = (id, t) => {
      tl.set('#placar img', { opacity: 0 }, t);
      tl.set(`#${id}`, { opacity: 1 }, t);
      pop('#placar', t, t > 11 ? 1.3 : 1.12, 0.2);
    };
    tl.to('#raios', { rotation: 40, duration: 18.3, ease: 'none' }, 0);

    // ===== 0–1: TAVA GANHANDO =====
    // (o placar já nasce visível com o 4x3 no CSS: set no tempo 0 não pegava no render)
    pop('#placar', 0.001, 1.12, 0.18);
    tl.fromTo('#w-abre', { scale: 1.08 }, { scale: 1, duration: 0.35, ease: 'power3.out', immediateRender: false }, 0.001);
    mostra('#tava', 0);
    tl.fromTo('#tava', { scale: 0.6 }, { scale: 1, duration: 0.25, ease: 'back.out(3)', immediateRender: false }, 0);
    tl.set('#ganhando', { opacity: 0 }, 0);
    tl.set('#ganhando', { opacity: 1 }, BAT);
    // o shuffle: o letreiro balança de leve no 2 e no 4, convencido
    // no compasso 1 a câmera vai chegando no Dragonair (o recorte já anda com ele)
    tl.set('#w-abre', { transformOrigin: '400px 1100px' }, 0.001);
    tl.to('#w-abre', { scale: 1.25, duration: 1.875, ease: 'power2.in' }, T(1, 0));
    for (let b = 1; b < 8; b += 2) tl.fromTo('#tava', { rotation: -2 }, { rotation: 0, duration: 0.3, ease: 'power2.out', immediateRender: false }, b * BAT);

    // ===== 2: a evolução. Corte seco pra perto; a borda escurece; cada piscada dá um choque amarelo =====
    const tEvo = T(2, 0);
    mostra(['#tava', '#placar', '#topo'], tEvo, false);
    mostra('#w-evo', tEvo);
    tl.fromTo('#w-evo', { scale: 1.35 }, { scale: 1, duration: 0.3, ease: 'power3.out', immediateRender: false }, tEvo);
    tl.to('#vinheta', { opacity: 1, duration: 1.2, ease: 'power1.in' }, tEvo);
    PISCADAS.forEach((t, i) => {
      tl.fromTo('#zap', { opacity: 0.25 + i * 0.05 }, { opacity: 0, duration: 0.11, ease: 'power2.out', immediateRender: false }, t);
      if (i >= 5) treme(tl, '#w-evo', t, 0.4 + (i - 5) * 0.15, 0.1);
    });

    // ===== 3: DRAGONITE =====
    const tRev = T(3, 0);
    mostra('#w-rev', tRev);
    tl.set('#vinheta', { opacity: 0 }, tRev);
    flash(tl, tRev, 1, 0.4);
    tl.fromTo('#w-rev', { scale: 1.18 }, { scale: 1, duration: 0.5, ease: 'power3.out', immediateRender: false }, tRev);
    treme(tl, '#w-rev', tRev + 0.05, 1.4, 0.35);
    estouro(tl, document.getElementById('w-rev'), 470, 560, tRev, { tam: 520 });
    mostra('#faixa-evo', T(3, 2));
    tl.fromTo('#faixa-evo', { x: -1100 }, { x: 0, duration: 0.25, ease: 'power3.out', immediateRender: false }, T(3, 2));
    // o choque virou a caixa: na linha 8 tudo pulsa
    tl.fromTo('#zap', { opacity: 0.45 }, { opacity: 0, duration: 0.15, immediateRender: false }, T(3, 8));
    treme(tl, '#w-rev', T(3, 8), 0.7, 0.18);

    // ===== 4–5: ele joga, chuta, gol =====
    const tJogo = T(4, 0);
    mostra('#faixa-evo', tJogo, false);
    mostra('#w-jogo', tJogo);
    tl.fromTo('#w-jogo', { scale: 1.12 }, { scale: 1, duration: 0.3, ease: 'power3.out', immediateRender: false }, tJogo);
    tl.set('#placar', { top: 150, opacity: 1 }, tJogo);
    placar('p43', tJogo);
    tl.fromTo('#zap', { opacity: 0.35 }, { opacity: 0, duration: 0.15, immediateRender: false }, T(4, 12));
    tl.fromTo('#zap', { opacity: 0.6 }, { opacity: 0, duration: 0.2, immediateRender: false }, 10.033); // o chute

    // ===== 6–7: GOL, congela no goleiro, o placar vira na batida =====
    const tGol = T(6, 0);
    mostra('#w-congela', tGol);
    flash(tl, tGol, 1, 0.45);
    treme(tl, '#w-congela', tGol + 0.03, 1.6, 0.4);
    // recorte fechado: o goleiro (465, 805) e a bola na rede; chega um pouco mais perto dele
    tl.fromTo('#congela', { scale: 1, transformOrigin: '465px 805px' }, { scale: 1.15, duration: 3.75, ease: 'sine.out', immediateRender: false }, tGol);
    tl.to('#escuro', { opacity: 0, duration: 0 }, 0);
    tl.set('#escuro', { zIndex: 14 }, tGol);
    tl.to('#escuro', { opacity: 0.35, duration: 1.2 }, tGol + 0.3);
    // congelou: a cor some devagar (o quadro vira foto)
    tl.fromTo('#congela', { filter: 'saturate(1)' }, { filter: 'saturate(0.25)', duration: 0.8, ease: 'power1.out', immediateRender: false }, tGol + 0.15);
    tl.to('#placar', { top: 300, scale: 1, duration: 0.2, ease: 'power2.out' }, tGol);
    ['p44', 'p45', 'p46', 'p56', 'p57', 'p58'].forEach((id, i) => {
      const t = tGol + i * BAT;
      placar(id, t);
      if (id !== 'p56') tl.fromTo('#zap', { opacity: 0.5 }, { opacity: 0, duration: 0.14, immediateRender: false }, t);
      if (i > 0 && id !== 'p56') treme(tl, '#w-congela', t, 0.6, 0.15);
    });
    mostra('#tava2', T(7, 8));
    tl.fromTo('#tava2', { scale: 1.6 }, { scale: 1, duration: 0.2, ease: 'power3.out', immediateRender: false }, T(7, 8));

    // ===== 8–9: tela final com o Dragonite embaixo do logo =====
    const tFim = T(8, 0);
    telaFinal(document.getElementById('final'));
    document.getElementById('tag').textContent = 'O rival também evolui';
    const dn = ator(document.getElementById('final-cena'), 149, { escala: 9, z: 5, x: 540, y: 1480 });
    anim(tl, dn, 'Idle', 0, tFim, 18.3);
    mostra('#final', tFim);
    mostra(['#placar', '#tava2'], tFim, false);
    flash(tl, tFim, 1, 0.35);
    tl.to('#raios-final', { rotation: 30, duration: 18.3 - tFim, ease: 'none' }, tFim);
    tl.set('#logo', { opacity: 1 }, tFim);
    tl.fromTo('#logo', { scale: 0.7 }, { scale: 1, duration: 0.45, ease: 'back.out(3)', immediateRender: false }, tFim);
    piscada(tl, [T(8, 0), T(8, 3), T(8, 6)], '#final');
    tl.set('#tag', { opacity: 1 }, T(8, 8));
    tl.from('#tag', { scale: 1.6, duration: 0.25, ease: 'back.out(2)' }, T(8, 8));
    tl.to(['#site', '#selo', '#credito'], { opacity: 1, duration: 0.2 }, T(9, 0));
    tl.from('#selo', { y: 40, duration: 0.25, ease: 'back.out(2)' }, T(9, 0));
    piscada(tl, [T(9, 0), T(9, 3), T(9, 6)]);
    estouro(tl, document.getElementById('final-cena'), 540, 1330, T(9, 6), { tam: 360 });

    window.__timelines = window.__timelines || {};
    window.__timelines.root = tl;
  </script>
</div>
</body>
</html>
