name: CI

# Toda branch (regra 2 do CLAUDE.md): o pesado roda aqui, não na fila do PC. Fluxo em docs/planos/esteira.md.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read
  actions: read

# push novo na mesma branch cancela a rodada velha
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      trilha: ${{ steps.trilha.outputs.trilha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # histórico (sem blobs) pra comparar com a main: trilha e prints da fumaça
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Trilha (scripts/trilha.mjs)
        id: trilha
        run: |
          base=origin/main
          [ "$GITHUB_REF" = refs/heads/main ] && base=HEAD^
          t=$(node scripts/trilha.mjs "$base" 2> why.txt)
          echo "trilha=$t" >> "$GITHUB_OUTPUT"
          echo "**Trilha $t** ($(cat why.txt))" >> "$GITHUB_STEP_SUMMARY"
      - run: npm run lint
      - run: npx tsc --noEmit -p .
      - run: npx vitest run
      # o tsc já rodou acima: aqui só o Vite
      - run: npm run build:vite

  # Fumaça headless: não segura o resto (continue-on-error) e deixa os prints como artefato. Build com o modo fumaça
  # (os ?demo= e ?vel=N, como nas prévias da Vercel), servido pelo vite preview.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # sem baixar navegador: o Chrome que já vem na máquina do GitHub
      - run: npm install --no-save playwright@1.64.1
      - run: SOCCERMON_SMOKE=1 npm run build:vite
      - name: Fumaça (copa curta + páginas, 390 e 1440)
        env:
          PW_CHANNEL: chrome
        run: |
          npx vite preview --config vite/config.prod.mjs --port 4173 --strictPort &
          for i in $(seq 30); do curl -fs http://localhost:4173/ > /dev/null && break; sleep 1; done
          # páginas: Home, Movedex e as da linha "Fumaça: /?demo=... /?cards=1" nos commits da branch (só o que começa
          # com "/": uma frase depois de "Fumaça:" virava 14 páginas inválidas)
          pages=$(git log --format=%B origin/main..HEAD | sed -n 's/^Fumaça: *//p' | tr ' ' '\n' | grep '^/' | tr '\n' ' ')
          rc=0
          for sz in 390x844 1440x900; do
            node scripts/smoke/fumaca.mjs copa http://localhost:4173 fumaca "$sz" || rc=1
            node scripts/smoke/fumaca.mjs paginas http://localhost:4173 fumaca "$sz" / '/?lab=golpes' $pages || rc=1
          done
          # resumo na página da rodada (o job não derruba o CI: continue-on-error)
          node -e "const fs=require('fs');for(const f of fs.readdirSync('fumaca').filter(f=>f.startsWith('res-'))){const r=JSON.parse(fs.readFileSync('fumaca/'+f));console.log('- '+f+': '+(r.fails.length?'FALHOU: '+r.fails.join('; '):'ok ('+r.oks.length+' passos)'))}" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fumaca-prints
          path: fumaca/
          retention-days: 14

  tempo:
    needs: [check, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Tempo total da rodada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          start=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          s=$(( $(date +%s) - $(date -d "$start" +%s) ))
          {
            echo "### Rodada: $((s / 60)) min $((s % 60)) s"
            echo "- check: ${{ needs.check.result }} (trilha ${{ needs.check.outputs.trilha }})"
            echo "- fumaça: resumo no job smoke, prints no artefato fumaca-prints"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "rodada: ${s}s"
